<!doctype html>
<html lang="zh-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>词语练习生成器｜华文通</title>
<style>body{margin:0;background:#f4f8fc;color:#18324d;font-family:Arial,"Noto Sans SC",sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px 16px}.box{background:#fff;border:1px solid #d9e3ef;border-radius:16px;padding:22px;margin-bottom:16px}h1,h2{color:#173b66}label{display:block;font-weight:700;margin:14px 0 6px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #b8c9da;border-radius:8px;font:inherit}textarea{min-height:130px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:9px;padding:11px 16px;background:#173b66;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#e8f0f8;color:#173b66}.status{margin-top:14px;padding:11px;border-radius:8px;background:#eef5fb;white-space:pre-wrap}.error{background:#fff0ef;color:#b42318}.ok{background:#eaf8f2;color:#087f5b}iframe{width:100%;height:620px;border:1px solid #d9e3ef;border-radius:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body><main class="wrap"><section class="box"><h1>华文通｜词语练习生成器</h1><p>参考 cilang-platform 的词语题型，生成学生互动学习单和教师参考页。</p><div class="grid"><div><label>年级</label><select id="grade"><option>中一</option><option>中二</option></select></div><div><label>单元</label><input id="unit" placeholder="例如：单元六"></div><div class="full"><label>课文／主题</label><input id="title" placeholder="例如：多元而开放的新加坡"></div><div class="full"><label>词语清单</label><textarea id="terms" placeholder="可用顿号、逗号、Tab 或换行分开"></textarea></div><div class="full"><label>已学词语范围／教学重点</label><textarea id="goal" placeholder="用于帮助 AI 设计有挑战性的干扰项"></textarea></div><div class="full"><label>DeepSeek API Key</label><input id="key" type="password"></div></div><div class="actions"><button id="generate" type="button">生成学习单</button><button id="clear" class="secondary" type="button">清空</button></div><div id="status" class="status">请填写资料。</div></section><section id="preview" class="box" hidden><h2>预览</h2><div class="actions"><button id="studentTab" type="button">学生版</button><button id="teacherTab" class="secondary" type="button">教师版</button><button id="downloadStudent" class="secondary" type="button">下载学生版</button><button id="downloadTeacher" class="secondary" type="button">下载教师版</button></div><iframe id="frame" title="学习单预览"></iframe></section></main>
<script>
function splitTerms(value){return String(value||'').split(/[\r\n\t,，、]+/).map(x=>x.trim()).filter(Boolean)}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function downloadText(filename,content,type='text/html'){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function validateQuestions(questions){const errors=[];if(!Array.isArray(questions)||!questions.length)errors.push('没有生成任何题目。');(questions||[]).forEach((q,i)=>{if(!q.question)errors.push('第 '+(i+1)+' 题缺少题目。');if(!Array.isArray(q.options)||q.options.length<3)errors.push('第 '+(i+1)+' 题选项不足。');if(!Number.isInteger(q.answer)||q.answer<0||q.answer>=(q.options||[]).length)errors.push('第 '+(i+1)+' 题答案位置错误。')});return errors}
const $=id=>document.getElementById(id); const PROXY='https://hwt-ai-proxy.lyqlym2015.workers.dev/'; let student='',teacher='',current='student',studentUrl='',teacherUrl='';
function status(msg,kind=''){ $('status').textContent=msg; $('status').className='status '+kind; }
function prompt(){return `你是新加坡中学高级华文教师。根据年级、课文、词语和教学重点生成词语练习。每个词语至少一道题，优先使用语境选词、辨析用法、挑错句、搭配判断。同一题选项长度接近，选项互斥，干扰项对应真实误区，不使用绝对词，不照抄原文。输出只能是JSON：{"questions":[{"word":"词语","question":"题目","options":["选项1","选项2","选项3","选项4"],"answer":0,"explanation":"中文解析","english":"Short English explanation"}]}`}
function parse(raw){const a=raw.indexOf('{'),b=raw.lastIndexOf('}');if(a<0||b<a)throw Error('AI 没有返回合法 JSON。');return JSON.parse(raw.slice(a,b+1));}
function studentHtml(d){const qs=d.questions.map((q,i)=>`<section><b>${i+1}. ${escapeHtml(q.word||'')}</b><p>${escapeHtml(q.question)}</p>${q.options.map((o,j)=>`<button class="o" data-i="${j}" data-c="${j===q.answer}">${escapeHtml(o)}</button>`).join('')}<p class="fb"></p></section>`).join('');return `<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${escapeHtml(d.title)}</title><style>body{font-family:Arial,"Noto Sans SC",sans-serif;background:#f4f8fc;color:#18324d;padding:20px}main{max-width:800px;margin:auto;background:#fff;padding:22px;border-radius:14px}section{border:1px solid #d9e3ef;border-radius:10px;padding:14px;margin:14px 0}.o{display:block;width:100%;text-align:left;background:#fff;color:#18324d;border:1px solid #b8c9da;margin:7px 0}.good{background:#eaf8f2!important;border-color:#087f5b!important}.bad{background:#fff0ef!important;border-color:#b42318!important}.fb{font-weight:bold}</style><main><h1>${escapeHtml(d.title)}</h1><p>${escapeHtml(d.grade)} · ${escapeHtml(d.unit)}</p>${qs}<h2 id="score"></h2></main><script>let score=0;document.querySelectorAll('.o').forEach(b=>b.onclick=()=>{let s=b.parentElement,fb=s.querySelector('.fb');s.querySelectorAll('.o').forEach(x=>x.disabled=true);if(b.dataset.c==='true'){b.classList.add('good');fb.textContent='正确。';score++}else{b.classList.add('bad');fb.textContent='再想一想。正确答案已标出。';s.querySelector('[data-c="true"]').classList.add('good')}document.querySelector('#score').textContent='目前得分：'+score+'/'+document.querySelectorAll('section').length})<\/script>`}
function teacherHtml(d){return `<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><title>${escapeHtml(d.title)}｜教师版</title><style>body{font-family:Arial,"Noto Sans SC",sans-serif;max-width:1100px;margin:30px auto;color:#18324d}table{border-collapse:collapse;width:100%}td,th{border:1px solid #b8c9da;padding:9px;vertical-align:top}th{background:#eef5fb}</style><h1>${escapeHtml(d.title)}｜教师参考</h1><table><tr><th>题号</th><th>词语</th><th>题目</th><th>答案与解析</th></tr>${d.questions.map((q,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(q.word)}</td><td>${escapeHtml(q.question)}</td><td>${escapeHtml(q.options[q.answer])}<br>${escapeHtml(q.explanation)}<br><small>${escapeHtml(q.english||'')}</small></td></tr>`).join('')}</table>`}
function show(which){current=which;const blob=new Blob([which==='student'?student:teacher],{type:'text/html'});const url=URL.createObjectURL(blob);$('frame').src=url;if(which==='student')studentUrl=url;else teacherUrl=url;}
async function generate(){try{$('generate').disabled=true;const terms=splitTerms($('terms').value);if(!terms.length)throw Error('请先输入词语。');if(!$('title').value.trim())throw Error('请填写课文／主题。');if(!$('key').value.trim())throw Error('请填写 DeepSeek API Key。');status('正在生成，请稍候……');const payload={model:'deepseek-chat',temperature:.25,messages:[{role:'system',content:prompt()},{role:'user',content:JSON.stringify({grade:$('grade').value,unit:$('unit').value,title:$('title').value,terms,goal:$('goal').value})}]};const res=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json','x-deepseek-key':$('key').value.trim()},body:JSON.stringify(payload)});const raw=await res.text();if(!res.ok)throw Error('AI 服务返回 '+res.status+'：'+raw.slice(0,300));const d=parse(JSON.parse(raw).choices?.[0]?.message?.content||'');const errors=validateQuestions(d.questions);if(errors.length)throw Error('题库检查未通过：\n'+errors.join('\n'));d.grade=$('grade').value;d.unit=$('unit').value;d.title=$('title').value;student=studentHtml(d);teacher=teacherHtml(d);$('preview').hidden=false;show('student');status('生成完成，请检查学生版和教师版。','ok')}catch(e){status(e.message||String(e),'error')}finally{$('generate').disabled=false}}
$('generate').onclick=generate;$('studentTab').onclick=()=>show('student');$('teacherTab').onclick=()=>show('teacher');$('downloadStudent').onclick=()=>downloadText('index.html',student);$('downloadTeacher').onclick=()=>downloadText('teacher.html',teacher);$('clear').onclick=()=>{['unit','title','terms','goal','key'].forEach(id=>$(id).value='');$('preview').hidden=true;status('已清空。')};
</script></body></html>
