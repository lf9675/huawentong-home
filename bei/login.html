<!doctype html>
<html lang="zh-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教师登录｜华文通</title>
<style>body{margin:0;background:#f4f8fc;color:#18324d;font-family:Arial,"Noto Sans SC",sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(420px,calc(100% - 40px));background:#fff;border:1px solid #d9e3ef;border-radius:18px;padding:30px;box-shadow:0 12px 35px #173b6612}h1{color:#173b66;margin:0 0 8px}p{color:#58708a}label{display:block;font-weight:bold;margin:20px 0 7px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #b8c9da;border-radius:9px;font-size:16px}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:9px;background:#173b66;color:#fff;font-size:16px;cursor:pointer}.err{color:#b42318;min-height:24px;margin-top:12px}</style></head>
<body><main class="box"><h1>教师工具登录</h1><p>Teacher tools · 华文通</p><label for="pw">教师密码</label><input id="pw" type="password" autocomplete="current-password"><button id="go">登录</button><div id="err" class="err"></div></main>
<script>
async function login(){const button=document.querySelector('#go'),error=document.querySelector('#err'),pw=document.querySelector('#pw');if(button.disabled||!pw.value)return;button.disabled=true;error.textContent='正在验证教师密码……';const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),30000);try{const r=await fetch('https://rodtizxezbtlhnuljzsc.supabase.co/functions/v1/hwt-classroom',{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',password:pw.value})});const data=await r.json();if(!r.ok)throw Error(data.error||'登录未完成。');sessionStorage.setItem('hwt_teacher_session',data.token);sessionStorage.setItem('hwt_teacher_auth','1');pw.value='';location.href='index.html';}catch(e){error.textContent=e.name==='AbortError'?'登录服务响应超时，请重试。':e.message;}finally{clearTimeout(timer);button.disabled=false;}}
document.querySelector("#go").onclick=login;document.querySelector("#pw").onkeydown=e=>{if(e.key==="Enter")login()};
</script></body></html>
