<!DOCTYPE html>
<html lang="zh-Hans-SG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>议论文阅读练习一 · 教师控制台</title>
  <link rel="stylesheet" href="/jiaxinxi/reading.css">
</head>
<body class="teacher-page">
  <main class="teacher-wrap">
    <section class="panel" id="setupPanel">
      <h1>议论文阅读练习一 · 教师控制台</h1>
      <p class="lede">阅读材料：习惯。语文程度只用于本机自动分组；服务器只保存编号、组别和本次作答。</p>

      <div class="field-row">
        <label>
          教师口令
          <input id="teacherPin" type="password" autocomplete="current-password" placeholder="输入教师口令">
        </label>
        <label>
          小组数量
          <input id="groupCount" type="number" min="2" max="12" value="7">
        </label>
      </div>

      <label>
        学生编号与程度（每行一人，例如：1 中）
        <textarea id="rosterInput" class="roster-input" placeholder="1 中&#10;2 差&#10;4 好"></textarea>
      </label>
      <p id="setupError" class="error-text" role="alert"></p>

      <div class="control-row">
        <button id="previewGroups" class="secondary-button" type="button">预览异质分组</button>
        <button id="connectClass" class="secondary-button" type="button">连接现有课堂</button>
        <button id="createClass" class="primary-button" type="button">建立新的课堂</button>
      </div>
      <div id="groupPreview" class="group-preview"></div>
    </section>

    <section id="dashboard" class="hidden">
      <div class="panel">
        <div class="stage-row">
          <div>
            <span class="stage-chip" id="currentSkill">课堂状态</span>
            <h1 id="currentTitle">等待建立课堂</h1>
          </div>
          <div id="classClock" class="progress-text"></div>
        </div>
        <div id="classStatus" class="status-banner"></div>
        <div class="control-row">
          <button id="togglePause" class="secondary-button" type="button">开始／继续作答</button>
          <button id="nextStage" class="primary-button" type="button">开放并进入下一环节</button>
          <button id="undoStage" class="secondary-button" type="button">撤回上一步</button>
          <button id="endClass" class="danger-button" type="button">结束课堂</button>
        </div>
        <p class="note">“下一环节”会统一切换全班页面；如果误按，立即点“撤回上一步”。所有学生答案仍会保留。</p>
      </div>

      <div class="teacher-grid">
        <section class="panel">
          <h2>理解改善证据</h2>
          <p class="note">重点比较第一次正确率和提示订正后的掌握率；速度不计分，也不显示排名。</p>
          <div style="overflow:auto">
            <table class="metric-table">
              <thead>
                <tr>
                  <th>能力</th>
                  <th>作答</th>
                  <th>第一次</th>
                  <th>订正后</th>
                  <th>提升</th>
                </tr>
              </thead>
              <tbody id="metricBody"></tbody>
            </table>
          </div>
        </section>

        <section class="panel">
          <h2>当前环节进度</h2>
          <div id="studentGrid" class="student-grid"></div>
          <p id="studentSummary" class="note"></p>
        </section>
      </div>

      <section class="panel">
        <h2>小组名单</h2>
        <div id="dashboardGroups" class="group-preview"></div>
      </section>
    </section>
  </main>

  <script>
    window.READING_CONFIG = {
      lessonId: "ARG1R",
      dataModule: "/practice-1/reading-data.js",
      storageKey: "arg1-reading",
    };
  </script>
  <script type="module" src="/jiaxinxi/reading-teacher.js"></script>
</body>
</html>
