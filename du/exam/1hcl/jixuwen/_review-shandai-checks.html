<!doctype html><html lang="zh-SG"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>善待生命临时验收工具</title><style>body{font:16px sans-serif;margin:12px;background:#edf3f6}button{padding:10px;margin:4px}iframe{height:900px;border:1px solid #9ab;display:block;background:white}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>临时验收工具</h1><p>只检查本次学习单，测试记录隔离保存。</p><button data-width="1024">1024 横屏</button><button data-width="390">390 小屏</button><button id="printView">检查打印布局</button><button id="normal">恢复屏幕布局</button><button id="hash">核对文件 SHA-256</button><pre id="result"></pre><iframe title="学习单验收" id="sheet" width="1024" src="_review-shandai-20260914.html"></iframe><script>const f=document.getElementById('sheet');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>f.style.width=b.dataset.width+'px');document.getElementById('printView').onclick=()=>{const d=f.contentDocument;f.contentWindow.dispatchEvent(new Event('beforeprint'));let css='';for(const s of d.styleSheets)for(const r of s.cssRules)if(r.conditionText==='print')for(const inner of r.cssRules)css+=inner.cssText;let st=d.getElementById('testPrint');if(!st){st=d.createElement('style');st.id='testPrint';d.head.append(st);}st.textContent=css;};document.getElementById('normal').onclick=()=>f.contentDocument.getElementById('testPrint')?.remove();document.getElementById('hash').onclick=async()=>{let rows=[];for(const name of ['_review-shandai-20260914.html','2024-1hcl-narrative-shandaishengming.html']){const r=await fetch(name+'?verify='+Date.now(),{cache:'no-store'});const a=await r.arrayBuffer();const h=await crypto.subtle.digest('SHA-256',a);rows.push(name+'\nHTTP '+r.status+' · '+a.byteLength+' bytes\n'+Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join(''));}document.getElementById('result').textContent=rows.join('\n\n');};</script></html>
