<script id="data" type="application/json">{"paras": ["“快来啊！”池塘里的金鱼如同听懂人话一样，落荒而逃。我在酷热的太阳下拉着渔网，绕着池塘不停地跑、不停地追，折腾了半天，那些鱼还是逍遥快活着，只有我在气喘如牛。", "同行的小伙伴看不下去了：“让我来！让你看看什么叫做真正的捕鱼！”就在我们要交换位置的时候，那些狡猾的小金鱼好像都看到了转机，嗖嗖嗖的，一窝蜂全部溜走了，气得我直跺脚。“等等，这里好像还有一条鱼！”果真，一个黑不溜秋的小脑袋扭动着它的尾巴，奋力却缓慢地游着。我猛地拍一下脑门说道：“哦！我想起来了，老师说过，这条鱼叫做蝌蚪！”", "接着我发现了更多的蝌蚪，它们全身黑溜溜的，不停地扭动着细长的尾巴，成群结队地游着。不一会儿，池塘里都布满了黑点。我们好奇地围观这些小黑点，这些小黑点只要一靠近我们，就马上害羞地掉头逃走，一溜烟消失了。", "“今天的鱼没抓成，要不我们抓它们吧！”还没等伙伴说什么，我就已经开始把这些有趣的小蝌蚪抓进鱼笼里，透明的水更加凸显出它们的稚嫩，把它们抓起来的时候我就起了一个歪念头：鱼在岸上呆久了会死，那它们呢？", "微微一倾斜，黑色的小脑袋们全部顺着水掉了一地，看着它们在被太阳烤热的石头地板上痛苦地挣扎时，我居然没有一丝恻隐之心。“你在干什么！每个人都有同情心，你怎么没有？你根本就是想故意害死它们，真是太残忍了！”伙伴气鼓鼓地瞪着我，连忙把它们放回水里。“为什么你要帮助它们？”“因为它们也是生命啊！”它们也是生命……这句话点醒了我。", "于是，我不再袖手旁观，而是将这些差点被我烤熟的小脑袋送回了它们的家。只不过从那时我才意识到，即使再小的生命，也有存在的意义。试图夺走它们生命的我，才是最无情、最残忍的。", "恻隐之心人人皆有，同情心是人人都应有的情感，生命再弱小也必须尊重。我们应该用关爱代替伤害，同情弱小、善待生命——这才是人类应有的责任。"], "words": [["落荒而逃", "慌忙地逃走。", "flee in panic"], ["逍遥快活", "自由自在，很快乐。", "free and happy"], ["气喘如牛", "喘气很急、很厉害。", "panting heavily"], ["转机", "情况出现有利的变化。", "a turn for the better"], ["一窝蜂", "许多一起涌来或离开。", "all rushing together"], ["黑不溜秋", "形容颜色很黑。", "very dark in colour"], ["成群结队", "许多聚在一起。", "in groups"], ["一溜烟", "很快地离开。", "off in a flash"], ["稚嫩", "幼小而柔弱。", "young and delicate"], ["歪念头", "不正当、不好的想法。", "a harmful idea"], ["恻隐之心", "看到别人受苦而不忍心的感情。", "compassion for those who suffer"], ["气鼓鼓", "很生气的样子。", "visibly angry"], ["瞪", "睁大眼睛看。", "stare with wide-open eyes"], ["袖手旁观", "在旁边看，不出手帮助。", "stand by without helping"], ["蝌蚪", "蛙或蟾蜍的幼体，不是鱼。", "a young frog or toad, not a fish"], ["拟人", "把事物当作人来写。", "give human actions or feelings to things"], ["推断", "根据原文线索，想出未直接说出的意思。", "infer an unstated meaning from evidence"], ["狡猾", "此处可解释为聪明、机智；需联系语境。", "clever or quick-witted in this context"], ["橱柜", "存放物品的柜子。", "a cupboard"], ["水痕", "水留下的痕迹。", "water marks"], ["展板", "用来展示作品的板。", "a display board"]], "tasks": [{"id": "r1", "stage": 0, "title": "读第1—2段：捕鱼计划为什么换了对象？用简短的事件链说明。", "keys": ["为什么", "事件链"], "mode": "读段落 · 简短记录 / Read & note", "guide": ["事件链：用短语和箭头连接事情。", "Event chain: link events with short phrases and arrows."], "evidence": true, "answer": "追金鱼却抓不到 → 金鱼趁交换位置时溜走 → 发现蝌蚪，注意力转向蝌蚪。", "analysis": ["第1段的捕鱼结果与第2段的新发现构成事件联系。这里只梳理计划变化，不要求再写全文大意。", "Link the failed fishing in P1 with the discovery in P2. This is an event link, not a whole-text summary."], "compare": ["有没有连接前因与后事，而不是只抄一个结尾？", "Did I connect the earlier event with what follows?"], "hints": [["找先前没有完成的事，再找接下来的新发现。", "Find what did not work, then what was discovered."]]}, {"id": "r2", "stage": 0, "title": "读第3—5段：“你根本就是想故意害死它们”能直接当作作者亲口说明的动机吗？选原文，简短说明信息来源。", "keys": ["亲口说明", "信息来源"], "mode": "辨别来源 · 说明理由 / Check the source", "guide": ["信息来源：谁说的？谁想的？", "Source: who said it? Who thought it?"], "evidence": true, "answer": "不能。这是伙伴的指责。作者在第4段问自己“鱼在岸上呆久了会死，那它们呢？”，明确写出的念头是想试蝌蚪离水后的结果。", "analysis": ["第3段交代观察对象，第4段写作者自己的念头，第5段是伙伴的判断。两者来源不同；辨别来源不等于为伤害行为辩护。", "P3 establishes the animals, P4 gives the narrator’s thought, and P5 gives the friend’s judgement. Distinguishing sources does not excuse the harm."], "compare": ["我的依据能说明“是谁的想法”吗？", "Does my evidence identify whose thought it is?"], "hints": [["引号中的“你”对谁说？再找叙述者直接写自己念头的地方。", "Who is being addressed as “you”? Find the narrator’s own stated thought."]]}, {"id": "r3", "stage": 0, "title": "读第6—7段：选第6段的一处行动，连接第7段与它相关的观点，并用短语说明联系。", "keys": ["行动", "观点", "联系"], "mode": "由事到理 · 短语即可 / Connect action and idea", "guide": ["用“行动 → 观点”说明联系。", "Link the action to the idea."], "evidence": true, "answer": "把蝌蚪送回水里 → 用关爱代替伤害、善待生命：作者开始用救助行动实践这个观点。", "analysis": ["第6段继续叙事，第7段提出由经历得到的道理。行动是观点的具体体现，不是只把两段各抄一句放在一起。", "P6 continues the story; P7 states its lesson. Explain how the action puts the idea into practice."], "compare": ["我有没有说清行动怎样体现观点？", "Did I explain how the action illustrates the idea?"], "hints": []}, {"id": "whole", "stage": 1, "title": "作者怎样改变？哪句话促成改变？整理证据，用一两句话说明。", "keys": ["怎样改变", "哪句话", "整理证据"], "mode": "连全文 · 归类、去重 / Group & connect", "guide": ["归类：把同类证据放一起，删去重复，再解释改变。", "Group related evidence, remove repetition, then explain the change."], "evidence": true, "answer": "作者起初只顾试验蝌蚪离水的结果，看到它们挣扎也不怜悯；伙伴说“因为它们也是生命啊”，点醒了他。他于是把蝌蚪送回水里，并认识到弱小生命也有存在的意义，应受到尊重。", "analysis": ["可按前后的态度和行动归类，把伙伴的话与改变连起来。第5—7段有多处相近的反省，不必重复堆积。分类是整理工具，不按证据数量计分。", "Group attitudes and actions, linking the friend’s words to the change. P5–7 repeat related reflections; combine them. Grouping is a thinking tool, not a quote-count score."], "compare": ["哪些证据意思重复？我有没有解释转变的原因？", "Which excerpts repeat an idea? Did I explain what caused the change?"], "hints": [["比较同一个人前后的态度和做法，再找转变之间的新信息。", "Compare the same person’s earlier and later responses; identify the new information between them."]]}, {"id": "56", "stage": 2, "title": "文章第一段，作者为什么累得气喘如牛？", "keys": ["第一段", "为什么", "气喘如牛"], "marks": 3, "answer": "作者在酷热的太阳下绕着池塘不停地跑、不停地追，折腾了半天，因此累得气喘如牛。", "points": [["Direct info · 1分", "在酷热的太阳下", "第1段，天气炎热。", "Paragraph 1: hot weather."], ["Direct info · 1分", "绕着池塘不停地跑、不停地追", "第1段，持续活动。", "Paragraph 1: repeated physical activity."], ["Direct info · 1分", "折腾了半天／花了很长时间", "第1段，活动时间长。", "Paragraph 1: a long duration."]], "compare": ["检查三个意义点是否齐全。完整引用第1段相关句子也可得分。", "Check all three points. A complete relevant quotation is also accepted."], "guide": ["筛选：只留下能解释原因的信息。", "Select only information that explains the causes."], "hints": [["分清原因与结果；同一句话里可能有不同作用的信息。", "Distinguish causes from results; a sentence may contain both."]], "evidence": true, "mode": "先尝试，再看示范 / Try, then model", "analysis": ["Direct info＋信息处理：从同一句筛出炎热、持续跑追和耗时长，各1分。“没抓成”与“气喘如牛”是结果。完整引用相关句也可获原参考的3分，不强制改写。", "Select heat, repeated running/chasing and long duration, 1 mark each. Failure and panting are results. The supplied scheme also accepts a full relevant quotation for 3 marks."]}, {"id": "57", "stage": 2, "title": "文章第三段的哪一句话运用了拟人的修辞手法？从这句话中可以看出蝌蚪什么特点？", "keys": ["第三段", "哪一句话", "拟人", "蝌蚪", "什么特点"], "marks": 4, "answer": "句子是：“这些小黑点只要一靠近我们，就马上害羞地掉头逃走，一溜烟消失了。”这表现出蝌蚪害怕人类、感到不安全。", "points": [["Direct info · 2分", "这些小黑点只要一靠近我们，就马上害羞地掉头逃走，一溜烟消失了。", "“害羞”把蝌蚪当人写，引用须保留拟人和遇人的语境。", "“害羞” gives a human feeling; keep the personification and context."], ["Inference · 2分", "害怕人类／胆怯／感到不安全／想与人保持距离", "由靠近人就逃走推断。按所给标准，答生存本能／习性也可。", "Infer from fleeing when near people; survival instinct is also accepted by the supplied scheme."]], "compare": ["特点答一个即可。“害羞、不好意思、游得很快、不喜欢人靠近”不获所给标准接受。保持距离着重自我保护；“不喜欢”只是好恶判断。", "One trait is enough. The supplied scheme rejects shyness, speed and dislike; distance can express self-protection, while dislike only expresses preference."], "guide": ["拟人：把事物当作人来写。再解释它的特点。", "Personification gives human qualities to things. Then explain the trait."], "hints": [["拟人把事物当作人来写。找到写法后，还要解释语境中的特点。", "Personification gives human qualities to things. Identify the device, then interpret the trait in context."]], "evidence": true, "mode": "师生共练 / Work together", "analysis": ["Direct info：拟人句2分；Inference：从遇人就逃的反应判断特点2分。不要把修辞用语直接当作生物真实情绪；联系说明不另加分。", "Quote the personification sentence (2), then infer a trait from the response to people (2). Do not treat figurative wording as a literal emotion."], "bridge": true}, {"id": "58A", "stage": 2, "title": "58 试结合上下文解释下列两句短语的意思。（共4分）\n(A) 那些狡猾的小金鱼好像都看到了转机", "keys": ["狡猾", "看到了转机"], "marks": 2, "answer": "聪明的小金鱼好像发现，作者与伙伴交换位置时正是逃跑的好机会，于是趁机一窝蜂地溜走了。", "points": [["语境解释 · 0.5分", "聪明／机智的小金鱼", "按所给答案解释此处“狡猾”。", "The supplied answer accepts clever or quick-witted."], ["语境解释 · 1分", "作者与伙伴交换位置的时候", "第2段明确了这个有利时机。", "Paragraph 2 identifies the opportunity."], ["语境解释 · 0.5分", "趁机逃跑／一窝蜂溜走", "说明有利于什么，不能只写“机会”。", "State what the opportunity allows, not only “a chance”."]], "compare": ["保留“好像”的语气；这仍是作者的拟人化叙述，不是证实金鱼能理解人话。", "Keep the sense of “seems”; this is personification, not proof that fish understand speech."], "guide": ["语境解释：联系前后文，用自己的话说明画线短语。", "Contextual meaning: use surrounding text and explain the underlined phrase in your own words."], "hints": [["把不直白的词换成日常说法，并联系前后文说明具体意思。", "Replace indirect expressions with plain wording and make the meaning specific to the context."]], "evidence": false, "mode": "句意方法示范 / Context method", "analysis": ["语境解释：将“狡猾”换为聪明或机智，说明交换位置是逃走的时机。保留“好像”的叙述语气，不说已证实金鱼能理解人话。", "Explain cleverness and the chance to escape while positions are exchanged. Keep “seems”; this is not proof of fish understanding human speech."]}, {"id": "58B", "stage": 2, "title": "58 试结合上下文解释下列两句短语的意思。（共4分）\n(B) 伙伴气鼓鼓地瞪着我", "keys": ["气鼓鼓", "瞪"], "marks": 2, "answer": "伙伴非常生气地睁大眼睛看着作者。", "points": [["语境解释 · 1分", "非常生气／气愤／不满", "“气鼓鼓”说明强烈的不满情绪。", "The phrase conveys anger or strong displeasure."], ["语境解释 · 1分", "睁大眼睛看着作者", "“瞪”说明眼睛的动作，“我”指作者。", "“瞪” describes wide-open eyes; “我” refers to the narrator."]], "compare": ["有没有同时解释情绪和动作？无需另写长篇生气原因。", "Have you explained both emotion and action? A long account of the cause is unnecessary."], "guide": ["用自己的话解释画线短语。", "Explain the underlined phrase in your own words."], "hints": [], "evidence": false, "mode": "撤去提示 / Faded support", "analysis": ["语境解释：说明强烈不满的情绪和睁大眼睛看的动作。把“我”指清为作者；不必另写长篇原因或修辞作用。", "Explain strong anger and the wide-eyed look at the narrator. No long account of causes or literary effect is required."]}, {"id": "59", "stage": 2, "title": "对于如何处理作者抓到的蝌蚪，作者和伙伴各有什么反应？为什么？", "keys": ["作者和伙伴", "各", "反应", "为什么"], "marks": 4, "answer": "作者把蝌蚪倒在石板上，因为他想看看蝌蚪离开水后会不会像鱼一样死去。伙伴却连忙把蝌蚪放回水里，因为他认为蝌蚪也是生命，应该救活它们。", "points": [["Direct info · 1分", "作者把蝌蚪倒在石板上", "第5段；用原文意义概括，不添“袋子”。", "Paragraph 5; summarize without inventing a bag."], ["Direct info · 1分", "想看看蝌蚪离水后会不会也死去", "第4段写明动机；“作者没有恻隐之心”按所给答案也接受。", "Paragraph 4 states the motive; the supplied scheme also accepts lack of compassion."], ["Direct info · 1分", "伙伴连忙把蝌蚪放回水里", "第5段写救助行动。", "Paragraph 5 states the rescue action."], ["Direct info · 1分", "认为蝌蚪也是生命／想救活它们", "第5段伙伴的回答说明原因。", "The friend’s reply explains his reason."]], "compare": ["四点各自检查。“伙伴生气”不能替代救蝌蚪的处理；“故意害死”是伙伴的指责，不能替代作者明说的试验念头。", "Check the four points separately. Anger does not replace the rescue action; the accusation does not replace the stated motive."], "guide": ["整合：整理相关信息，完整回答。", "Organise relevant information into a complete answer."], "hints": [["圈清题干涉及谁、问几个方面，再核对答案有没有回应。", "Identify whom and which aspects the question asks about; check that your answer addresses them."]], "evidence": true, "mode": "自主整合 / Organise independently", "analysis": ["Direct info＋信息处理：分别整理两人的做法和原因，各1分。第4段是作者明说的念头，第5段是行动和伙伴的回答；不要用伙伴的指责替代作者的明示动机。", "Organise each person’s action and reason (1 mark each). P4 states the narrator’s thought; P5 gives actions and the friend’s reply. Do not replace the stated motive with an accusation."]}, {"id": "60", "stage": 2, "title": "作者认为，恻隐之心人人皆有。你同意他的看法吗？为什么？请结合生活例子加以说明。", "keys": ["人人皆有", "同意", "为什么", "生活例子", "说明"], "marks": 5, "answer": "我同意作者的看法。看到别人受伤害或处境可怜时，人会自然而然地产生同情心，并愿意尽力给予帮助；这体现了对生命的尊重。例如，在一项收集罐头食品捐赠给独居老人的义工活动中，组织者播放了介绍老人困境的视频。很多民众了解老人的处境后，踊跃捐赠食品；有些人说自己看了视频觉得老人很可怜，想尽一份力。这说明了解别人的困境能唤起同情，并促成关爱行动。", "points": [["总分5分 · 细分待教师核对", "立场＋理由＋生活例子与说明", "原参考的理由部分出现2分／3分两种表述；这里不擅定官方细分，也不自动给分。", "The supplied reason allocation is ambiguous (2/3). The teacher must confirm it; this page assigns no automatic marks."]], "compare": ["我的例子怎样支持“人人皆有”的看法？原参考只提供同意路线；其他立场可讨论，评分须由教师依据原标准复核。", "How does my example support the claim about everyone? The supplied scheme models agreement only; other positions need teacher review, not automatic scoring."], "guide": ["写看法、理由和生活例子，说明它们的联系。", "Give your view, reason and a life example. Explain the link."], "hints": [], "evidence": false, "mode": "独立回应 / Respond independently", "analysis": ["开放回应：解释自己的立场，以具体生活处境、感受或行动，以及它们与理由的联系来论证。原参考采用同意路线。单个例子可支持理由，不能严格证明所有人每次一定帮助。", "Explain a position and connect a specific situation, feelings or actions to the reason. The supplied model agrees. One example supports an argument but cannot prove everyone always helps."]}, {"id": "transfer", "stage": 3, "title": "从俊豪收海报这件事，可以看出他什么特点？选取相关言行，并说明它怎样支持你的判断。", "keys": ["什么特点", "相关言行", "怎样支持"], "mode": "新编练习 · 不计入原卷20分 / Original transfer task", "guide": ["推断：从言行判断特点，并解释依据。", "Inference: identify a trait from words and actions, then explain your evidence."], "evidence": true, "answer": "俊豪做事细心。他发现窗框的水痕，想到雨水可能淋坏海报，便提前把海报收好；这说明他能注意细节，预先考虑怎样保护别人的作品。", "analysis": ["发现水痕并提前保护作品是言行证据；能注意细节、预先考虑风险是它与“细心”的联系。也可提出体贴等合理特点，但必须解释相配的依据。“嫌画得难看”只是叙述者的猜测。", "Noticing water marks and protecting the poster support attentiveness through noticing detail and anticipating harm. Other traits need matching reasoning. The dislike claim is only the narrator’s guess."], "compare": ["我有没有用自己的话说明言行与特点的联系，而非只贴标签或搬原句？", "Did I explain the link between action and trait, instead of only labelling or quoting?"], "hints": []}], "transfer": "美术学会准备布置展板，我把刚画好的海报放在窗边。俊豪看了一眼窗框，便把海报收进橱柜。我心想：“他一定嫌我画得难看！”午后突然下起大雨，窗边的地板湿了一片。俊豪拿出干干净净的海报，说：“早上看见窗框有水痕，我怕雨水把你的画淋坏，就先收起来了。”我接过海报，低声向他道谢。", "version": "2026-09-15-focus", "targets": ["那些狡猾的小金鱼好像都看到了转机", "伙伴气鼓鼓地瞪着我"], "inventory": [{"id": "heat", "p": 1, "text": "在酷热的太阳下"}, {"id": "run", "p": 1, "text": "绕着池塘不停地跑、不停地追"}, {"id": "time", "p": 1, "text": "折腾了半天"}, {"id": "fishresult", "p": 1, "text": "那些鱼还是逍遥快活着"}, {"id": "tired", "p": 1, "text": "只有我在气喘如牛"}, {"id": "swap", "p": 2, "text": "就在我们要交换位置的时候"}, {"id": "chance", "p": 2, "text": "那些狡猾的小金鱼好像都看到了转机"}, {"id": "escape", "p": 2, "text": "嗖嗖嗖的，一窝蜂全部溜走了"}, {"id": "person", "p": 3, "text": "这些小黑点只要一靠近我们，就马上害羞地掉头逃走，一溜烟消失了。"}, {"id": "catch", "p": 4, "text": "我就已经开始把这些有趣的小蝌蚪抓进鱼笼里"}, {"id": "curious", "p": 4, "text": "鱼在岸上呆久了会死，那它们呢？"}, {"id": "pour", "p": 5, "text": "微微一倾斜，黑色的小脑袋们全部顺着水掉了一地"}, {"id": "suffer", "p": 5, "text": "看着它们在被太阳烤热的石头地板上痛苦地挣扎时"}, {"id": "nocare", "p": 5, "text": "我居然没有一丝恻隐之心"}, {"id": "accuse", "p": 5, "text": "你根本就是想故意害死它们，真是太残忍了！"}, {"id": "angry", "p": 5, "text": "伙伴气鼓鼓地瞪着我"}, {"id": "rescue", "p": 5, "text": "连忙把它们放回水里"}, {"id": "life", "p": 5, "text": "因为它们也是生命啊！"}, {"id": "change", "p": 6, "text": "我不再袖手旁观，而是将这些差点被我烤熟的小脑袋送回了它们的家"}, {"id": "realize", "p": 6, "text": "即使再小的生命，也有存在的意义"}, {"id": "self", "p": 6, "text": "试图夺走它们生命的我，才是最无情、最残忍的。"}, {"id": "theme", "p": 7, "text": "我们应该用关爱代替伤害，同情弱小、善待生命——这才是人类应有的责任。"}]}</script>
<script>
'use strict';
const D=JSON.parse(document.querySelector('#data').textContent),KEY='hwt-compassion-2026-r3',OLDKEY='hcl-compassion-v1',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),clone=x=>JSON.parse(JSON.stringify(x)),now=()=>new Date().toISOString();
let S={stage:0,current:'56',work:{},help:[],exposures:[],selected:null},legacy=null,activeWord=null,badStorage=false;
try{const raw=localStorage.getItem(KEY);if(raw){const v=JSON.parse(raw);if(!v||!v.work||!Array.isArray(v.help)||!Array.isArray(v.exposures))throw Error('invalid');S={...S,...v};}const prev=localStorage.getItem(OLDKEY);if(prev)legacy=JSON.parse(prev);}catch(e){badStorage=true;}
function w(id){return S.work[id]||(S.work[id]={draft:'',bridge:'',evidence:[],hint:0,first:null,revealed:false,revision:'',reason:'',revisions:[]});}
function pair(z,e){return `<p>${esc(z)}<span class="en">${esc(e)}</span></p>`;}
function save(){if(badStorage){$('#saveStatus').textContent='旧保存数据无法读取；为保留它，本页未覆盖。请下载当前记录后联系老师。 / Stored data could not be read; it has not been overwritten. Export current work.';$('#saveStatus').classList.add('warn');return;}try{localStorage.setItem(KEY,JSON.stringify(S));$('#saveStatus').textContent='已自动保存 / Autosaved on this device';$('#saveStatus').classList.remove('warn');}catch(e){$('#saveStatus').textContent='本机保存失败，请立即下载记录 / Saving failed; download your work now';$('#saveStatus').classList.add('warn');}}
function log(type,detail={}){S.help.push({type,stage:S.stage,task:S.stage===2?S.current:S.stage===3?'transfer':'reading',time:now(),...detail});save();}
function title(t){let s=esc(t.title);[...t.keys].sort((a,b)=>b.length-a.length).forEach(k=>s=s.split(esc(k)).join(`<span class="qkey">${esc(k)}</span>`));return (t.marks&&!t.id.startsWith('58')?t.id+'　':'')+s+(t.marks?` <span class="mode">（${t.id.startsWith('58')?'本小题':''}${t.marks}分）</span>`:'');}
function decorate(p){let s=esc(p);D.targets.forEach((t,i)=>s=s.replace(esc(t),`<span class="target" data-target="58${i?'B':'A'}">${esc(t)}</span>`));return s;}
function passage(texts,where){$(where).innerHTML=texts.map((p,i)=>`<p class="para" data-p="${i+1}"><span class="num" aria-hidden="true">${texts.length>1?i+1:''}</span>${(p.match(/[^。！？；]+[。！？；]?[”」]?/g)||[p]).map(s=>`<span class="sentence" data-source="${where==='#original'?'original':'transfer'}" data-para="${i+1}">${decorate(s)}</span>`).join('')}</p>`).join('');}
passage(D.paras,'#original');passage([D.transfer],'#transferText');
function status(t){const v=w(t.id);return v.revealed?'已看参考 / Reference viewed':chars(v.draft)?'已填写 / Answer entered':'尚未作答 / Not answered';}
function english(text){return `<p class="en">${esc(text)}</p>`;}
function hintHTML(t){const v=w(t.id);return t.hints.length?`<details class="hintDetails" ${v.hint?'open':''}><summary>提示 / Hint</summary>${english(t.hints[0][1])}</details>`:'';}

function card(t){const v=w(t.id);return `<article class="card" id="task-${t.id}"><h3 class="question">${title(t)}</h3>${english(t.guide[1])}${hintHTML(t)}<label for="draft-${t.id}">我的答案 / Your answer</label><textarea id="draft-${t.id}" class="draft ${t.stage<2?'short':''}" placeholder="Write your answer here.">${esc(v.draft)}</textarea><div class="actions" style="margin-top:12px"><button class="primary reveal">${v.revealed?'收起参考 / Hide reference':'查看参考答案 / Reference answer'}</button></div><div class="feedback" role="status"></div><div class="modelHost">${v.revealed?modelHTML(t):''}</div></article>`;}

function modelHTML(t){return `<section class="model"><h4>参考答案 / Reference answer</h4><div class="answer">${esc(t.answer)}</div><h4>Explanation</h4>${english(t.analysis[1])}${t.id==='57'?english('Accepted: fear of people, feeling unsafe, keeping a safe distance, or a survival instinct. Not accepted: literal shyness, embarrassment, swimming fast, or simply disliking people nearby.'):''}</section>`;}

function render(){if(![0,1,2,3,4].includes(S.stage))S.stage=0;const items=D.tasks.filter(t=>t.stage===S.stage);if(S.stage===2&&!items.some(t=>t.id===S.current))S.current='56';$$('nav [data-stage]').forEach(b=>b.setAttribute('aria-current',Number(b.dataset.stage)===S.stage));$('#original').hidden=S.stage===3;$('#transferText').hidden=S.stage!==3;$('#passageTitle').textContent=S.stage===3?'新编迁移材料 · 非原考题':'篇章原文 · 七段';$('#work').innerHTML=S.stage===4?reviewHTML():`${S.stage===2?`<div class="card qnav" aria-label="原题导航">${items.map(t=>`<button data-q="${t.id}" aria-current="${t.id===S.current}">${t.id}</button>`).join('')}<span class="status">原题总分20 · 教师评分 / 20 marks, teacher assessed</span></div>`:''}${(S.stage===2?items.filter(t=>t.id===S.current):items).map(card).join('')}<div class="actions"><button id="nextStage">${S.stage===3?'查看我的答案 / My answers':'进入下一阶段 / Next stage'} →</button></div>`;$$('[data-q]').forEach(b=>b.onclick=()=>{S.current=b.dataset.q;render();save();});items.filter(t=>S.stage!==2||t.id===S.current).forEach(bind);if($('#nextStage'))$('#nextStage').onclick=()=>go(S.stage+1);$$('[data-return]').forEach(b=>b.onclick=()=>{const t=D.tasks.find(t=>t.id===b.dataset.return);S.current=t.id;go(t.stage);$('#task-'+t.id).scrollIntoView({block:'start'});});if($('#recordDownload'))$('#recordDownload').onclick=download;if($('#legacyDownload'))$('#legacyDownload').onclick=()=>download(true);save();}
function go(n){S.stage=n;render();}
function chars(s){return /[\p{L}\p{N}]/u.test(s.trim());}
function bind(t){const el=$('#task-'+t.id);if(!el)return;const v=w(t.id);
el.querySelector('.draft').oninput=e=>{v.draft=e.target.value;save();};
const hint=el.querySelector('.hintDetails');if(hint)hint.ontoggle=()=>{if(hint.open&&!v.hint){v.hint=1;log('hint',{task:t.id,level:1,beforeFirst:!v.first});}};
el.querySelector('.reveal').onclick=()=>{
 if(v.revealed){v.revealed=false;save();render();return;}
 if(!chars(v.draft)){el.querySelector('.feedback').innerHTML=english('Write your own answer first.');return;}
 if(!v.first)v.first={answer:v.draft,help:clone(S.help),exposures:clone(S.exposures),time:now()};
 v.revealed=true;S.exposures.push({task:t.id,type:'reference',time:now()});save();render();
};}

function helpRecord(a){return a.length?'<ul>'+a.map(h=>`<li>${esc(h.time)} · ${esc(h.task||'全文')} · ${esc(({hint:'提示 / Hint',vocabulary:'词义 / Meaning',pronunciation:'读音 / Pronunciation',meaningAudio:'释义语音 / Spoken meaning','locked-word':'考查词释义未开放 / Tested meaning withheld','teacher-guide':'教师答案 / Teacher answers'})[h.type]||h.type)}${h.word?' · '+esc(h.word):''}${h.level?' · '+h.level:''}</li>`).join('')+'</ul>':'<p>无已记录帮助 / No recorded help</p>';}
function recordBody(){return D.tasks.map(t=>{const v=w(t.id);return `<section><h3>${title(t)}</h3><div class="recordlabel">我的答案 / Your answer</div><div class="answer">${esc(v.draft||'尚未作答 / Not answered')}</div>${v.revealed?modelHTML(t):''}</section>`;}).join('');}

function reviewHTML(){return `<div class="card"><h2>我的答案 / My answers</h2>${D.tasks.map(t=>`<section><h3>${title(t)}</h3><div class="answer">${esc(w(t.id).draft||'尚未作答 / Not answered')}</div><button data-return="${t.id}">继续作答 / Edit answer</button></section>`).join('')}</div>`;}

function documentHTML(old=false){const body=old?`<h1>善待生命 · 旧版记录</h1>${Object.entries(legacy?.answers||{}).map(([id,a])=>`<section><h2>${esc(id)}</h2><p>旧版首次答案 / Previous first attempt</p><div class="answer">${esc(legacy?.firstAnswers?.[id]||'无记录')}</div><p>旧版当前答案 / Previous current answer</p><div class="answer">${esc(a)}</div></section>`).join('')}`:`<h1>善待生命 · 学习记录</h1>${english('Original questions: 20 marks, teacher assessed. The new practice is separate.')}<p>${esc(now())} · ${D.version}</p><h2>完整原文</h2>${D.paras.map((p,i)=>`<p class="print-content">${i+1}　${decorate(p)}</p>`).join('')}<h2>新编迁移材料 · 非原考题</h2><p class="print-content">${esc(D.transfer)}</p>${recordBody()}`;return {body,html:'<!doctype html><html lang="zh-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>善待生命 · 学习记录</title><style>'+document.querySelector('style').textContent+'body{max-width:960px;margin:auto;padding:24px}section{border-bottom:1px solid #ccd8de;padding:15px 0}details{display:block}'+ '@media print{body{padding:0}details{display:block}}</style></head><body>'+body+'</body></html>'};}
function download(old=false){const blob=new Blob([documentHTML(old===true).html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=old===true?'shandai-legacy-record.html':'shandai-reading-record.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function buildPrint(){$('#printArea').innerHTML=documentHTML().body;$('#printArea').querySelectorAll('details').forEach(d=>d.open=true);}
window.addEventListener('beforeprint',buildPrint);$('#print').onclick=()=>{buildPrint();window.print();};$('#export').onclick=()=>download();
const restricted={'狡猾':'58A','转机':'58A','气鼓鼓':'58B','瞪':'58B'};
function wordList(){activeWord=null;$('#wordTitle').textContent='词语与读音 / Words & pronunciation';$('#wordBody').innerHTML=english('Tested meanings open after you try the question and view its reference. You can listen to the word first.')+'<div class="actions">'+D.words.map(x=>`<button data-word="${esc(x[0])}">${esc(x[0])}</button>`).join('')+'</div>';$('#speak').hidden=$('#speakMeaning').hidden=$('#wordBack').hidden=true;$('#speechStatus').textContent='';$$('[data-word]').forEach(b=>b.onclick=()=>openWord(b.dataset.word));if(!$('#wordDialog').open)$('#wordDialog').showModal();}
function openWord(word){activeWord=D.words.find(x=>x[0]===word);const locked=restricted[word]&&!w(restricted[word]).first;$('#wordTitle').textContent=word;$('#wordBody').innerHTML=locked?english('Try this word’s meaning in context first.'):pair(activeWord[1],activeWord[2]);$('#speak').hidden=false;$('#speakMeaning').hidden=!!locked;$('#wordBack').hidden=false;$('#speechStatus').textContent='';log(locked?'locked-word':'vocabulary',{word,beforeFirst:restricted[word]?!w(restricted[word]).first:undefined});}
function speak(meaning=false){if(!activeWord)return;const locked=restricted[activeWord[0]]&&!w(restricted[activeWord[0]]).first;if(meaning&&locked)return;log(meaning?'meaningAudio':'pronunciation',{word:activeWord[0]});if(!('speechSynthesis'in window)){$('#speechStatus').textContent='此浏览器没有语音功能，请使用文字帮助。 / Audio unavailable; text support remains.';return;}speechSynthesis.cancel();const a=new SpeechSynthesisUtterance(activeWord[0]+(meaning?'。'+activeWord[1]:''));a.lang='zh-CN';const voices=speechSynthesis.getVoices(),zh=voices.find(v=>/^zh[-_]?(CN|SG|Hans)/i.test(v.lang))||voices.find(v=>v.lang.startsWith('zh'));if(zh)a.voice=zh;$('#speechStatus').textContent='正在尝试播放；若无声请检查设备音量和中文语音。 / Playing; if silent, check volume and Chinese voices.';a.onerror=()=>$('#speechStatus').textContent='语音未能播放，请检查设备语音。 / Playback failed; check device voices.';a.onend=()=>{if(meaning){const b=new SpeechSynthesisUtterance(activeWord[2]);b.lang='en-US';b.onerror=a.onerror;speechSynthesis.speak(b);}$('#speechStatus').textContent='播放已结束 / Playback ended';};speechSynthesis.speak(a);}
$('#vocab').onclick=wordList;$('#wordBack').onclick=wordList;$('#speak').onclick=()=>speak();$('#speakMeaning').onclick=()=>speak(true);$('#wordClose').onclick=()=>$('#wordDialog').close();$('#wordDialog').addEventListener('close',()=>{if('speechSynthesis'in window)speechSynthesis.cancel();});
function teacherContent(){return `<h2>教师说明</h2><p>学生页每题只有一个答案框，可直接复制粘贴，也可输入自己的话。简短英文引导在作答前显示；写下尝试后才可查看参考答案及英文解析。学生直接在原答案框修改，不另填证据、订正或修改理由。旧版已保存的数据及首次答案保留在本机，不再占用学生界面。</p><p>原题共20分，未自动评分。56题允许完整相关引用；57题保留原参考接受及不接受的特点。60题原参考理由分值出现2分／3分两种表述，由教师复核细分，不擅改总分5分。59题伙伴的指责不能替代作者明说的动机。</p><p>第58题两处完整短语在原文画线。词义帮助不会在学生尝试前解释本题考查的关键词。课堂观察重点是学生答案的相关性、完整性和解释能力。</p><h3>原文证据库（教师备查）</h3><ol>${D.inventory.map(e=>`<li>第${e.p}段<div class="quote">${esc(e.text)}</div></li>`).join('')}</ol><h3>逐题参考与评分</h3>${D.tasks.map(t=>`<section><h3>${title(t)}</h3><div class="answer">${esc(t.answer)}</div>${pair(...t.analysis)}${(t.points||[]).map(p=>`<div class="point">${esc(p[0])}<div class="answer">${esc(p[1])}</div>${pair(p[2],p[3])}</div>`).join('')}</section>`).join('')}`;}
$('#teacher').onclick=()=>{$('#teacherBody').innerHTML='<h2>教师说明含完整答案</h2>'+pair('学生请关闭。继续打开会在学习记录标记“看过教师答案”，不再算未见参考。','Students should close this. Continuing logs teacher-answer exposure; subsequent attempts are not reference-unseen.')+'<button id="confirmTeacher">继续查看教师答案 / Open teacher answers</button>';$('#teacherDialog').showModal();$('#confirmTeacher').onclick=()=>{log('teacher-guide');S.exposures.push({task:'all-original-and-transfer',type:'teacher-guide',time:now()});save();$('#teacherBody').innerHTML=teacherContent();};};$('#teacherClose').onclick=()=>$('#teacherDialog').close();
$('#reset').onclick=()=>{if(!confirm('只清除本版在本浏览器的答案、首次记录与订正？下载的记录和旧版记录不会被删除。请先下载备份。\nReset this version’s local work only? Export a backup first.'))return;S={stage:0,current:'56',work:{},help:[],exposures:[],selected:null};badStorage=false;$('#printArea').innerHTML='';save();render();};$$('nav [data-stage]').forEach(b=>b.onclick=()=>go(Number(b.dataset.stage)));render();
</script></body></html>
