<script>
const D={"paragraphs": ["每次谈到环境污染，人们首先会想到空气污染、海洋污染、噪音污染等等，却很少有人察觉身边潜在的威胁——光污染。", "在大城市中，耀眼的路灯、建筑照明、灯箱广告等造成的光污染已经成为直接影响人类身体健康和自然生态的又一个环境杀手，所以有人称它为“光明中的温柔杀手”。", "在光污染中，最先受害的是直接接触光源的眼睛。卫生专家认为，其中主要原因并非单纯用眼习惯所致，而是视觉环境受到光污染。", "据科学测定，一般白粉墙的光反射率为69%-80%，特别光滑的粉墙和洁白的纸张的光反射系数高达90%，比草地、森林或毛面装饰物高10倍左右。这个数值大大超过了人体所能承受的光辐射适应范围。如果长期在这种反光条件下工作或生活，视网膜会受到不同程度的损害，其感光细胞功能受到损伤，造成视力急剧下降，白内障发病率有时高达45%。", "数百年来，地球上的一切生物都是在自然光的照射下成长繁殖的。然而现在的照明严重干扰到自然界的生态平衡。科学家发现，一个小型广告灯箱一年大约杀死35万只昆虫。长此下去，这很可能会严重危及昆虫界的多样性。", "昆虫是大自然生物链上的一个重要环节，如果没有了昆虫，必将导致严重的生态灾难。鸟类在迁徙期最容易受人工光源的干扰。它们原本是以星星定向的，城市的照明光却常常使它们迷失方向。有时候鸟类还误把高楼的灯光当做星星，最后撞死在大楼上。据美国鸟类学家统计，每年都有400万只鸟因撞上高楼上的广告灯而死去。", "科学家警告，千万别小看这“光明中的温柔杀手”。"], "vocab": [["潜在", "藏着的，还未明显表现出来。", "Hidden; not yet obvious."], ["耀眼", "光很强，使眼睛不舒服。", "Dazzling; too bright for comfort."], ["光源", "发出光的物体。", "A source of light."], ["光反射率", "照来的光有多少被反射回去。", "The proportion of incoming light reflected."], ["光反射系数", "这里指反射光的比例。", "Here, the proportion of light reflected."], ["光辐射", "光传来的能量。", "Energy carried by light."], ["视网膜", "眼睛里接收光线的一层组织。", "The light-sensitive layer inside the eye."], ["感光细胞", "眼睛里感受光线的细胞。", "Cells that detect light."], ["白内障", "眼睛的晶状体变混浊，影响视力。", "Clouding of the eye’s lens."], ["生态平衡", "生物与环境互相影响，保持相对稳定。", "A relatively stable balance among living things and their environment."], ["多样性", "有许多不同的种类。", "A variety of different kinds."], ["生物链", "生物之间吃与被吃等相互联系。", "Links among living things, such as who eats whom."], ["迁徙", "动物随季节等有规律地迁移。", "Regular movement of animals, often with the seasons."], ["定向", "辨别方向。", "Finding the right direction."], ["列数字", "用具体数字说明特点。", "Use numbers to explain a feature."], ["作比较", "把事物放在一起比较，突出差别。", "Compare things to highlight a difference."], ["说明对象", "文章主要介绍的事物或道理。", "What the text explains."], ["说明重点", "文章着重说明对象的哪一方面。", "The main aspect being explained."], ["Direct info", "原文直接写明的信息。", "Information stated in the text."], ["信息处理", "选出有关内容，整理成回答。", "Select and organise relevant information."], ["语境解释", "联系前后文解释意思。", "Explain the meaning in context."]], "questions": [{"id": 51, "title": "光污染会被称为“光明中的温柔杀手”是因为______________。", "keywords": ["光明中的温柔杀手", "因为"], "where": [1, 2], "kind": "语境解释＋信息处理", "what": ["解释称呼的原因。", "Explain the reason for the name."], "need": ["联系前后文，不只看“温柔”的字面意思。", "Use the context, not just the literal meaning of “gentle”."], "options": ["它对人体不会造成永久性的危害。", "它对人体不会造成致命性的危害。", "它对人体的危害是不轻易被人们察觉的。", "它对人体的危害较其他环境问题来得轻。"], "correct": 2, "answer": "光污染对人体的危害不容易被人们察觉，因此被称为“光明中的温柔杀手”。", "points": [["语境解释", "“温柔”在这里强调危害不容易被察觉。", "“Gentle” points to harm that is hard to notice."], ["Direct info", "第1段“很少有人察觉”与第2段“环境杀手”相互补充。", "Paragraphs 1 and 2 connect hidden harm with danger."]], "hint": ["先想一想：“温柔”是在说危害轻，还是不容易发现？", "Does “gentle” mean harmless, or hard to notice?"], "hint2": ["回看第1段“却”后面的内容。", "Read the words after “却” in paragraph 1."], "errors": [["证据不足：文中没有说危害不会永久存在。", "Unsupported: the text does not rule out lasting harm."], ["证据不足：文中没有说危害不会致命。", "Unsupported: the text does not rule out fatal harm."], ["", ""], ["字面误读：不易察觉不等于危害较轻。", "Literal misreading: hidden harm is not necessarily mild."]], "compare": ["有没有把“不易察觉”误写成“危害不大”？", "Did you confuse hidden harm with mild harm?"]}, {"id": 52, "title": "文中第四段运用了“列数字”的说明方法来证明______________。", "keywords": ["第四段", "列数字", "证明"], "where": [4], "kind": "Direct info＋信息处理", "what": ["判断数字说明了什么。", "Identify what the numbers show."], "need": ["从数字回到段落说明重点。", "Link the numbers to the paragraph’s main point."], "options": ["粉墙和纸张的光鲜亮丽。", "人体无法承受太大的光辐射。", "人们的工作和生活条件相当简陋。", "草地、森林或毛面装饰物很受欢迎。"], "correct": 1, "answer": "第4段用具体数字证明人体无法承受太大的光辐射。", "points": [["Direct info", "第4段写“这个数值大大超过了人体所能承受的光辐射适应范围”。", "Paragraph 4 states that the value exceeds the body’s tolerance."], ["信息处理", "反射率和损害数据共同说明过强反光带来的危害；不是只介绍物品外观。", "The figures explain harm from excessive reflected light, not appearance."]], "hint": ["数字后面哪一句解释了它们为什么重要？", "Which sentence explains why the numbers matter?"], "hint2": ["找第4段以“这个数值”开头的句子。", "Find the sentence beginning “这个数值” in par const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const segments=D.paragraphs.map(p=>p.match(/[^。！？]+[。！？]?/g)||[p]);

function bindEvidence(state,rerender){const add=id=>{if(!sourceText(id)){toast(['先在左边选一句原文。','Select a sentence from the passage first.']);return}if(!state.evidence.includes(id))state.evidence.push(id);state.done=false;save();rerender()};$('#add-e').onclick=()=>add(selected);$('#add-e').ondragover=e=>{e.preventDefault();e.currentTarget.classList.add('dragover')};$('#add-e').ondragleave=e=>e.currentTarget.classList.remove('dragover');$('#add-e').ondrop=e=>{e.preventDefault();add(e.dataTransfer.getData('text/plain'))};$$('.remove-e').forEach(b=>b.onclick=()=>{state.evidence.splice(+b.dataset.i,1);save();rerender()});$$('.up-e').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;[state.evidence[i-1],state.evidence[i]]=[state.evidence[i],state.evidence[i-1]];save();rerender()})}
function renderTask(t){const a=tstate(t),idx=D.tasks.indexOf(t);let content='';if(t.type==='choice'||t.type==='multi')content=`<div class="options">${t.options.map((s,i)=>`<button class="option ${t.type==='choice'?(a.choice===i?'chosen':''):(a.multi.includes(i)?'chosen':'')} ${a.feedback&&((a.choice===i)||(a.multi.includes(i)))?(a.done?'good':'bad'):''}" data-opt="${i}" aria-pressed="${t.type==='choice'?a.choice===i:a.multi.includes(i)}">${t.type==='multi'?'□':`<span class="num">${i+1}</span>`}${esc(s)}</button>`).join('')}</div>`;
if(t.type==='order'){if(a.order.every((x,i)=>x===i)&&!a.attempts){a.order=[...a.order.slice(1),a.order[0]];save()}content=bi(['用上下按钮排列；最先发生的放最上面。','Use the arrows to put the first event at the top.'])+a.order.map((x,i)=>`<div class="order-row"><span>${i+1}</span><span class="answer">${esc(t.items[x])}</span><button data-move="${i},-1" ${i===0?'disabled':''} aria-label="上移第${i+1}项">↑</button><button data-move="${i},1" ${i===a.order.length-1?'disabled':''} aria-label="下移第${i+1}项">↓</button></div>`).join('')}
if(t.type==='match')content=t.items.map((s,i)=>`<div class="match-row"><span class="answer">${esc(s)}</span><select data-match="${i}" aria-label="${s}说明内容"><option value="">请选择 / Choose</option>${a.order.map(x=>`<option value="${x}" ${String(a.matches[i])===String(x)?'selected':''}>${esc(t.labels[x])}</option>`).join('')}</select></div>`).join('');
if(t.type==='evidence')content=evidenceZone()+evidenceHTML(a.evidence);
$('#work').innerHTML=`<div class="section-meta">${idx===7?'全文结构 · 我们做':'逐段理解 · '+(idx<2?'我做 → 我们做':'我们做 → 你做')}</div>${idx<7?`<div class="chips">${D.tasks.slice(0,7).map((_,i)=>`<button data-read="${i}" class="${i===S.read?'active':''}">${i+1}${S.tasks['r'+(i+1)]?.done?' ✓':''}</button>`).join('')}</div>`:''}<h2>${hi(t.title,t.keywords)}</h2>${idx===0?conceptButtons(['说明对象','说明重点']):idx===3?`<details open><summary>先看示范 / See an example</summary>${bi(['“光反射系数高达90%”用数字说明反光强；“比草地……高”把两类表面放在一起比较。','A percentage gives a measured value; “higher than grass” compares two surfaces.'])}${conceptButtons(['列数字','作比较'])}</details>`:''}${content}<div class="controls"><button class="primary" id="check-task">检查这一步 / Check</button><button id="hint-task">给我提示 / Hint</button></div>${a.feedback?`<div class="${a.done?'bluebox':'hintbox'}">${bi(a.done?['这一步正确。请读原因，再继续。','Correct. Read why, then continue.']:['再看一看，可以改正。','Take another look. You can revise.'])}${bi(a.done?t.explain:t.hint)}</div>`:''}${a.hint?`<div class="hintbox">${bi(t.hint)}</div>`:''}<div class="footnav"><button id="prev-task">← 上一步 / Back</button><button class="primary" id="next-task">${idx===6?'进入连全文 / Whole text':idx===7?'进入作答 / Answer':'下一步 / Next'} →</button></div>`;
$$('[data-read]').forEach(b=>b.onclick=()=>{S.read=+b.dataset.read;save();render()});$$('[data-opt]').forEach(b=>b.onclick=()=>{let i=+b.dataset.opt;if(t.type==='multi')a.multi=a.multi.includes(i)?a.multi.filter(x=>x!==i):[...a.multi,i];else a.choice=i;a.feedback=false;a.done=false;save();renderTask(t)});$$('[data-move]').forEach(b=>b.onclick=()=>{let [i,d]=b.dataset.move.split(',').map(Number);[a.order[i],a.order[i+d]]=[a.order[i+d],a.order[i]];a.feedback=false;a.done=false;save();renderTask(t)});$$('[data-match]').forEach(s=>s.onchange=()=>{a.matches[s.dataset.match]=s.value;a.done=false;a.feedback=false;save()});
if(t.type==='evidence')bindEvidence(a,()=>renderTask(t));$('#hint-task').onclick=()=>{a.hint=true;save();renderTask(t)};$('#check-task').onclick=()=>{a.attempts++;a.done=t.type==='choice'?a.choice===t.correct:t.type==='multi'?JSON.stringify(a.multi.slice().sort())===JSON.stringify(t.correct):t.type==='order'?a.order.every((v,i)=>v===i):t.type==='match'?t.items.every((_,i)=>String(a.matches[i])===String(i)):a.evidence.length===t.accept.length&&a.evidence.every(x=>t.accept.includes(x));a.feedback=true;save();renderTask(t)};$('#prev-task').onclick=()=>{if(idx===7)go(0);else if(S.read>0){S.read--;save();render()}};$('#next-task').onclick=()=>{if(idx>=6)go(idx===6?1:2);else{S.read++;save();render()}};bindConcepts()}
function reveal(q){return `<section class="reveal"><h3>答案从哪里来 / Answer sources</h3>${q.points.map(p=>`<p class="bi"><b>${esc(p[0])}</b><br>${quote(p[1])}<span class="en">${esc(p[2])}</span></p>`).join('')}<h3>${q.id===55?'原评分参考答案 / Supplied answer':'参考答案 / Reference answer'}</h3><div class="ref answer">${esc(q.answer)}</div>${q.supplement?`<h3>教学补充 · 教师核分 / Additional supported answer</h3><div class="ref answer">${esc(q.supplement)}</div>${bi(['鸟类影响有原文依据。写到这一点不判错，请教师核分；这不是新增官方评分点。','Bird effects are supported by the text. Ask your teacher to mark them; no official mark is added.'])}`:''}<div class="bluebox">${bi(q.compare)}</div></section>`}
function evidenceAdvice(q,a){if(!a.evidence.length)return "";let out=[];if(a.evidence.some(id=>!q.where.includes(+id.split('-')[0])))out.push(['有证据不在本题范围内，检查是否选错对象。','Some evidence is outside the question’s scope. Check the subject.']);if(q.id===54&&a.evidence.some(id=>id.startsWith('3-')))out.push(['第3段点出眼睛受害，但还没有列出具体损害。','Paragraph 3 names the eyes but does not list the specific damage.']);if(q.id===52&&a.evidence.includes('4-0'))out.push(['你选到了数字；再看后一句怎样解释这些数字。','You found the figures. Check the next sentence for their meaning.']);return out.map(bi).join('')}
function renderQ(){const q=D.questions[S.q],a=astate(q),mc=!!q.options;$('#work').innerHTML=`<div class="section-meta">审题与作答 · ${q.id===51?'教师示范':q.id===52?'师生共构':'独立作答'}</div><div class="chips">${D.questions.map((x,i)=>`<button data-q="${i}" class="${i===S.q?'active':''}">${x.id}${S.answers[x.id]?.checked?' ✓':''}</button>`).join('')}</div><h2>${q.id}　${hi(q.title,q.keywords)}${!mc?' <small>（2分）</small>':''}</h2><div class="bluebox">${bi(q.what)}${bi(['范围：第'+q.where.join('、')+'段。','Look in paragraph(s) '+q.where.join(', ')+'.'])}${bi(q.need)}</div>${conceptButtons(mc&&q.id===51?['语境解释','信息处理']:['Direct info','信息处理'])}${mc?`<div class="options">${q.options.map((s,i)=>`<button class="option ${a.choice===i?'chosen':''} ${a.feedback&&a.choice===i?(i===q.correct?'good':'bad'):''}" data-answer="${i}" aria-pressed="${a.choice===i}"><span class="num">（${i+1}）</span>${esc(s)}</button>`).join('')}</div>`:''}<details ${!mc?'open':''}><summary>原文证据 / Text evidence</summary>${evidenceZone()}${evidenceHTML(a.evidence)}${evidenceAdvice(q,a)}</details>${mc?'<details><summary>用完整句练习回答（可选） / Optional full sentence</summary>':''}<label for="written" class="bi">${mc?'完整句练习 / Full-sentence practice':'完整答案 / Your full answer'}</label><textarea id="written" placeholder="${mc?'用完整句表达你的选择。 / Express your choice in a sentence.':'用完整句写答案，不要只列词语。 / Write complete sentences.'}">${esc(a.text)}</textarea>${mc?'</details>':`<label class="checkline"><input id="attest" type="checkbox" ${a.attest?'checked':''}><span>我已认真写出自己的答案。<span class="en">I have made a meaningful attempt in my own answer.</span></span></label>`}<div class="controls"><button class="primary" id="check-answer">检查作答 / Check answer</button><button id="hint-answer">提示 / Hint</button></div>${a.hints?`<div class="hintbox">${bi(a.hints===1?q.hint:q.hint2)}</div>`:''}${a.feedback&&!a.checked?`<div class="hintbox">${bi(a.checks===1?q.hint:q.hint2)}${a.checks>=2?bi(q.errors[a.choice]):''}</div>`:''}${a.checked?`${mc?bi(['正确选项：（'+(q.correct+1)+'）。可以修改你的选择与句子。','Correct option: '+(q.correct+1)+'. You may revise your work.']):bi(['现在对照意义点修改。系统没有给书面答案自动评分。','Compare the meaning units and revise. Written answers are not automatically marked.'])}${reveal(q)}<label class="checkline"><input id="reviewed" type="checkbox" ${a.reviewed?'checked':''}><span>我已比较并完成必要订正。<span class="en">I have compared and revised my answer where needed.</span></span></label>`:''}<div class="footnav"><button id="prev-q">← ${S.q?'上一题 / Back':'返回连全文 / Whole text'}</button><button class="primary" id="next-q">${S.q===4?'进入检查 / Review':'下一题 / Next'} →</button></div>`;
$$('[data-q]').forEach(b=>b.onclick=()=>{S.q=+b.dataset.q;selected=null;save();render()});$$('[data-answer]').forEach(b=>b.onclick=()=>{a.choice=+b.dataset.answer;a.feedback=false;save();renderQ()});$('#written').oninput=e=>{a.text=e.target.value;a.edited=a.first!==null;save()};if(!mc)$('#attest').onchange=e=>{a.attest=e.target.checked;save()};bindEvidence(a,()=>renderQ());$('#hint-answer').onclick=()=>{a.hints=Math.min(2,a.hints+1);save();renderQ()};$('#check-answer').onclick=()=>{if(mc&&a.choice===null){toast(['先选择一个答案。','Choose an answer first.']);return}if(!mc&&(!a.text.trim()||!a.attest)){toast(['请先认真作答，再勾选确认。','Write your answer, then confirm your attempt.']);return}if(a.first===null)a.first={text:a.text,choice:a.choice,evidence:[...a.evidence]};a.checks++;a.feedback=true;if(mc){if(a.choice===q.correct)a.checked=true;else if(a.checks>=3)a.checked=true}else a.checked=true;save();renderQ()};if($('#reviewed'))$('#reviewed').onchange=e=>{a.reviewed=e.target.checked;save()};$('#prev-q').onclick=()=>{if(S.q){S.q--;save();render()}else go(1)};$('#next-q').onclick=()=>{if(S.q<4){S.q++;save();render()}else go(3)};bindConcepts()}
function renderReview(){const mc=D.questions.slice(0,3),done=Object.values(S.answers).filter(x=>x.checked).length,attempted=mc.filter(q=>astate(q).first!==null).length,correct=mc.filter(q=>astate(q).first?.choice===q.correct).length;$('#work').innerHTML=`<div class="section-meta">检查 · 比较 · 订正</div><h2>把答案写完整，把依据找准确</h2><div class="stats"><div class="stat">选择题首次正确<strong>${correct} / ${attempted}</strong><span class="en">First attempt; ${3-attempted} not attempted</span></div><div class="stat">原题已检查<strong>${done} / 5</strong><span class="en">Questions checked</span></div></div>${bi(['书面题共4分，须教师核分。阅读支架不计入考试分。','Written questions carry 4 marks, awarded by your teacher. Guided tasks are not exam marks.'])}${D.questions.map((q,i)=>{const a=astate(q);return `<article class="review-card"><h2>${q.id}　${hi(q.title,q.keywords)}</h2><p class="muted">${a.checked?'已检查 / Checked':'尚未检查 / Not checked'} · ${a.reviewed?'已订正 / Reviewed':'待比较 / Compare next'}</p>${q.options&&a.choice!==null?`<p class="answer">当前选择：（${a.choice+1}）${esc(q.options[a.choice])}</p>`:''}<p class="answer">${esc(a.text)||'尚未填写 / No written answer'}</p>${a.first&&a.first.text!==a.text?`<details><summary>首次答案 / First draft</summary><p class="answer">${esc(a.first.text)}</p></details>`:''}<button data-return="${i}">返回此题修改 / Revise</button>${a.checked?`<details><summary>参考答案与来源 / Answer and sources</summary>${reveal(q)}</details>`:bi(['先完成此题，才能查看参考答案。','Complete this question before viewing its answer.'])}</article>`}).join('')}<div class="footnav"><button id="back-answer">← 返回作答 / Back</button><button id="download-review" class="primary">导出作答 / Export</button></div>`;$$('[data-return]').forEach(b=>b.onclick=()=>{S.q=+b.dataset.return;go(2)});$('#back-answer').onclick=()=>go(2);$('#download-review').onclick=exportWork}
function exportWork(){const payload={title:'光污染互动阅读作答',exportedAt:new Date().toISOString(),note:'书面题由教师核分；选择题原卷未提供分值。',...S};let text='光污染 · 学生作答记录\n导出时间：'+payload.exportedAt+'\n书面题由教师最终核分。\n\n';D.questions.forEach(q=>{const a=astate(q);text+=q.id+' '+q.title+'\n首次选择：'+(a.first?.choice!=null?a.first.choice+1:'未作答')+'\n当前选择：'+(a.choice!=null?a.choice+1:'不适用／未作答')+'\n首次书面答案：'+(a.first?.text||'未填写')+'\n当前书面答案：'+a.text+'\n证据：'+a.evidence.map(sourceText).join('；')+'\n已检查：'+!!a.checked+'；已订正：'+!!a.reviewed+'\n\n'});download('光污染-学生作答记录.txt','text/plain;charset=utf-8','\ufeff'+text)}
function download(name,type,data){const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
let printDetails=[];window.addEventListener('beforeprint',()=>{printDetails=$$('.work details').filter(d=>!d.open);printDetails.forEach(d=>d.open=true)});window.addEventListener('afterprint',()=>printDetails.forEach(d=>d.open=false));
$('#full').onclick=()=>{S.full=!S.full;save();renderPassage()};$('#export').onclick=exportWork;$('#reset').onclick=()=>$('#reset-dialog').showModal();$('#confirm-reset').onclick=()=>{S={stage:0,read:0,q:0,tasks:{},answers:{},full:false};selected=null;$('#reset-dialog').close();save();render()};$('#print').onclick=()=>{S.stage=3;save();render();window.print()};render();
</script></body></html>
