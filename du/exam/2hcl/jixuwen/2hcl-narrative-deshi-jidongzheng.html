:root{--kai:'STKaiti','KaiTi','Kaiti SC','DFKai-SB','HWTKai',serif;--song:'SimSun','Songti SC','STSong','HWTSong',serif;--ink:#193b59;--blue:#215eac;--line:#d5e1ee}*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:var(--ink);font:18px/1.65 var(--song)}button,select,input{font:inherit}button,summary,select{cursor:pointer}button,select{min-height:44px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--blue);padding:8px 12px}button:focus-visible,summary:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #cc890d;outline-offset:3px}button:hover{background:#eaf2fc}button.primary:hover,button[aria-current=true]:hover{background:#174b89}button[aria-current=true],.primary{background:var(--blue);color:white}a{color:var(--blue)}h1,h2,h3,p{margin:0 0 14px}h1{font:30px/1.4 var(--kai)}h2{font-size:22px}h3{font:24px/1.7 var(--kai)}.kai,.passage,.answer,textarea,.word{font-family:var(--kai)}header{max-width:1500px;margin:auto;padding:18px 24px 10px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.top{justify-content:space-between;margin-bottom:12px}.small{font-size:14px;color:#52687e}.top a{text-decoration:none}.nav{margin-top:14px}.nav button{min-width:145px}.nav small{display:block;font-size:14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;max-width:1500px;padding:10px 24px 32px;margin:auto}aside{position:sticky;top:12px;align-self:start;max-height:calc(100dvh - 24px);overflow:auto;padding:22px;background:white;border:1px solid var(--line);border-radius:14px;scroll-padding-top:16px}.card{background:white;padding:24px;border:1px solid var(--line);border-radius:14px}main{min-width:0}.passage{font-size:24px;line-height:1.95;user-select:text;-webkit-user-select:text}.para{margin:22px 0 30px}.para.focus{border-left:3px solid #2867b3;padding-left:13px}.para p{white-space:pre-wrap}.parahead{font:15px/1.4 var(--song);color:#52687e;margin-bottom:9px}.parahead button{font-size:14px}.target{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:6px}.qkey{color:#a52735;font-weight:bold;background:#fff2f2}summary{color:var(--blue);padding:9px 0;min-height:44px}details{margin:12px 0}.wordlist{font-family:var(--song);font-size:18px}.words{display:flex;gap:8px;flex-wrap:wrap}.word{font-size:20px}.explain{font-family:var(--song);background:#f0f5fc;padding:14px;border-radius:10px;margin:14px 0}.explain p{margin-bottom:8px}.audio{font:14px/1.4 var(--song);min-height:44px}.muted{color:#52687e}.steps{margin-bottom:18px}.step{min-width:44px}.section-label{font-size:14px;color:#52687e;letter-spacing:.03em;margin:12px 0}textarea{width:100%;min-height:230px;padding:14px;font-size:23px;line-height:1.7;color:var(--ink);border:1px solid #9db4ca;border-radius:9px;resize:vertical;background:white}textarea::placeholder{font:17px/1.6 var(--song);color:#657789}label{display:block;margin:12px 0 8px}.answer{font-size:23px;line-height:1.85;white-space:pre-wrap;border-left:3px solid var(--blue);padding:14px;background:#f5f9ff}.model{margin-top:22px;border-top:1px solid var(--line);padding-top:20px}.status{font-size:14px;margin:10px 0;color:#52687e}.error{color:#a12c20}.feedback:empty{display:none}.footer{margin-top:20px}.frame{font:22px/1.8 var(--kai)}dialog{width:min(520px,calc(100% - 30px));max-height:85dvh;overflow:auto;border:1px solid var(--line);border-radius:14px;color:var(--ink);font-family:var(--song);padding:24px}dialog::backdrop{background:#193b5970}[hidden]{display:none!important}#audioStatus:empty{display:none}#audioStatus{max-width:1452px;margin:0 auto;padding:0 24px;font-size:14px}#saveStatus{margin:0}#wordBody p{margin:10px 0}.gloss-title{font-family:var(--kai)}
@media(max-width:760px){header{padding:15px}.layout{grid-template-columns:1fr;padding:8px 12px;gap:14px}aside{position:relative;top:0;max-height:52dvh;padding:17px}.card{padding:18px}.nav button{min-width:0;flex:1;padding:8px;font-size:17px}.nav small{font-size:12px}h1{font-size:26px}.passage{font-size:23px}h3{font-size:23px}textarea{min-height:210px}}
.method{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 12px;font:16px/1.5 var(--song);color:#52687e}.reading-heading{font-family:var(--kai)}

.read-response textarea{min-height:100px;font-size:22px}.read-response label{font:22px/1.7 var(--kai);margin-top:14px}.teacher-mode .layout{display:block;max-width:1250px}.teacher-mode aside{display:none}.grammar-heading{font-family:var(--kai)}.grammar-legend{gap:14px;margin:16px 0}.legend-s{color:#b52235;background:#ffedf0}.legend-p{color:#795000;background:#ffe778}.legend-o{color:#1257b0;background:#e7f1ff}.grammar-legend span{padding:5px 10px;border-radius:6px}.grammar-sentence{border-top:1px solid var(--line);padding:16px 0}.grammar-text{font:27px/2 var(--kai);overflow-wrap:anywhere}.grammar-token{display:inline;padding:2px 4px;margin:0 .10em;cursor:pointer;border-radius:5px;box-decoration-break:clone;-webkit-box-decoration-break:clone;color:inherit;background:transparent}.grammar-token:focus-visible{outline:2px solid #637c93;outline-offset:3px}.grammar-token:hover{box-shadow:0 1px 0 #879eb5}.grammar-token[data-active="s"]{color:#b52235;background:#ffedf0}.grammar-token[data-active="p"]{color:#795000;background:#ffe778}.grammar-token[data-active="o"]{color:#1257b0;background:#e7f1ff}.dual-hint{font:12px var(--song);color:#637c93;margin-left:3px;vertical-align:super}.grammar-inner{padding:12px;background:#f5f8fc;border-radius:8px;margin-top:10px}.grammar-note{font:16px/1.6 var(--song)}.grammar-toolbar{position:sticky;top:0;background:white;padding:8px 0;z-index:2}.grammar-sentence .section-label{margin:0 0 6px}.grammar-text .grammar-plain{white-space:pre-wrap}.teacher-mode .card{padding:24px}.grammar-instruction{font:16px/1.6 var(--song);color:#52687e}
@media(max-width:760px){.grammar-text{font-size:24px}.teacher-mode .card{padding:16px}.nav{flex-wrap:wrap}.nav button{flex:1 1 40%}.read-response textarea{min-height:95px}}

<script id="data" type="application/json">{"paras": ["经过一番折腾，妈妈好不容易才将我弄上车的。我瞥了一下等候的司机，只见他的眉毛微微动了一下。我想，他一定是在纳闷，好手好脚的人为什么不自己用走的？一个将近1.7米的年轻人，竟然要一个年老而且身高只有1.5米的老妇人连拉带拖地塞进德士里。", "“麻烦您送他到台大医院，这是我的电话，麻烦一有什么问题，请务必打电话给我，谢谢！他身体……”没想到母亲在离开家门前还特别地向德士司机拜托。“真是的，干嘛这么啰嗦，我又不是小孩子了！”我不耐烦地转过头去，不想去看妈妈。", "在路途上，那司机大概以为我是个二十几岁长不大的小孩子，他一定打从心底看不起我。一路上，他以一种近乎诡异的眼光从后视镜中注视着我，那应该就是鄙视吧！他一直盯着我瞧，我只好努力地转动不甚灵活的脖子来回避这种尴尬。可想而知，此时我的脸一定是乌云密布。", "经过每次必经的百货公司，我发现他竟然绕道而行，真是太过分了！我怎么会遇到这么没有道德的德士司机，竟然想要欺负患上“渐冻症”的我，想要坑我的钱！他到底有没有良心啊！如果他也尝尝这种痛苦，他就不会这么对待我！我的内心充满愤怒，双手紧握着拳头，真希望自己的手能够有力量挥舞出去，但是我不能。", "总算到了目的地。我拿出了钱，颤巍巍地丢在他的身上。只见他默默地捡起钱，却折好放回我的上衣口袋，把助行器打开架好，小心地把我抱出车外。", "当我用力地拖着助行器时，他竟哭了：“我太太也是这种病，也是和你一样，慢慢地全身都不能动，上星期在台大医院火化了。以后别走忠孝西路来这里，那路在整修不好走，一路颠簸你的身体会更痛。小老弟，我不收你的钱，你要加油。”说完边用力地向我挥手，似乎想借此给我一些支持的力量。一股暖流流进我的内心，我的眼眶开始模糊。", "看着计程车渐渐远去，我终于明白我真正病得严重的不是身体，其实是我的心。"], "vocab": {"折腾": ["反复处理，很费力", "much trouble; takes effort"], "瞥": ["很快看一眼", "glance"], "纳闷": ["觉得奇怪", "wonder; feel puzzled"], "连拉带拖": ["又拉又拖", "pull and drag"], "啰嗦": ["说太多、重复", "long-winded; repetitive"], "不耐烦": ["觉得烦，不愿继续", "impatient"], "打从心底": ["从内心深处", "from the bottom of one's heart"], "诡异": ["奇怪得不自然", "strange and unsettling"], "鄙视": ["看不起", "look down on"], "尴尬": ["不自然、不自在", "awkward"], "乌云密布": ["这里形容“我”的脸色不好看", "here: his face looks gloomy"], "绕道而行": ["绕开原来的路线，改走另一条路", "take a different route around something"], "坑我的钱": ["骗取或多收我的钱", "cheat me out of money"], "颤巍巍": ["颤抖、不稳", "trembling and unsteady"], "暖流": ["这里指受到关心后心里温暖、感动", "here: feeling warmed and touched by care"], "眼眶开始模糊": ["这里指感动得眼里含泪", "here: eyes filling with tears of emotion"], "可想而知": ["可以想象得到", "one can imagine"], "助行器": ["帮助站立和走路的工具", "walking frame"], "颠簸": ["上下摇动，不平稳", "bumpy movement"], "渐冻症": ["文中指使身体逐渐难以活动的疾病", "the illness that gradually limits movement in this story"], "等候": ["等待", "wait"], "将近": ["接近，但还不到", "nearly; almost"], "竟然": ["表示出乎意料", "unexpectedly"], "务必": ["一定要", "must; be sure to"], "拜托": ["请求别人帮忙", "ask someone for help"], "近乎": ["几乎；很接近", "almost"], "不甚": ["不太；不是很", "not very"], "回避": ["避开", "avoid"], "必经": ["一定会经过", "must pass through"], "良心": ["分辨是非、顾及别人的心", "conscience; sense of right and wrong"], "挥舞": ["举起并来回摆动", "wave or swing"], "默默": ["不说话地", "silently"], "整修": ["修理，使它恢复良好状态", "repair; renovate"], "支持": ["给予帮助或鼓励", "support; encourage"], "好不容易": ["费了很大力气才做到", "only after much effort"], "塞进": ["用力放进去", "push or squeeze into"], "老妇人": ["年老的女人", "elderly woman"], "麻烦": ["这里用来客气地请求帮忙", "please; used to make a polite request"], "干嘛": ["为什么；做什么", "why; what for"], "大概": ["表示推测，不完全确定", "probably"], "后视镜": ["用来观察车后情况的镜子", "rear-view mirror"], "注视": ["集中目光看", "look at closely"], "盯": ["一直看着", "stare at"], "瞧": ["看", "look"], "灵活": ["活动方便，不僵硬", "flexible; able to move easily"], "欺负": ["用不公平的方式对待别人", "bully; mistreat"], "患上": ["得了某种病", "develop an illness"], "愤怒": ["非常生气", "very angry"], "紧握": ["用力握住", "clench; hold tightly"], "拳头": ["五指弯曲握成的手", "fist"], "目的地": ["要到达的地方", "destination"], "捡起": ["从地上等地方拿起来", "pick up"], "架好": ["支撑并放稳", "set up securely"], "火化": ["人去世后将遗体焚化", "cremate after death"], "似乎": ["好像", "seem"], "借此": ["利用这个行动或机会", "through this action"], "计程车": ["德士；出租车", "taxi"], "渐渐": ["慢慢地", "gradually"], "严重": ["程度很深", "serious; severe"], "结合": ["联系起来一起考虑", "connect and consider together"], "上下文": ["前面和后面的内容", "surrounding text"], "举例说明": ["用具体例子解释", "explain with a specific example"], "批注": ["写在文章旁边的意见", "written comments"], "责问": ["带着责备去问", "question accusingly"], "批改": ["检查作业并改正错误", "mark schoolwork"], "订正": ["改正错误", "correct mistakes"], "漏": ["遗漏；没有处理到", "miss out"], "原先": ["原来；之前", "previously"], "提议": ["提出建议", "suggest"], "敏感": ["容易受到别人言行影响", "easily affected by what others say or do"], "多疑": ["容易怀疑别人", "often suspicious of others"], "猜疑": ["怀疑别人的用意", "suspect another person’s motives"], "敌意": ["想与别人对抗的态度", "hostile attitude"], "体贴": ["关心并照顾别人的需要", "considerate of another person’s needs"], "善良": ["心地好，愿意关心和帮助别人", "kind; willing to care for and help others"], "反省": ["回想并检查自己的想法或行为", "reflect on one’s own thoughts and actions"], "鼓励": ["给人信心和勇气", "encourage"], "误会": ["理解错了别人的意思或用意", "misunderstand someone’s meaning or intention"], "宽容": ["能包容别人的过失，不轻易计较", "tolerant; forgiving of another person’s faults"], "有同情心": ["能感受别人的痛苦，并给予关心", "sympathetic; feeling concern for someone who suffers"], "角度": ["看同一个人的不同方面", "an aspect; a different side of the same person"], "推断": ["根据篇章信息作出有依据的判断", "a conclusion supported by the text, but not directly stated"], "语境": ["词句前后相关的内容", "the surrounding words and events"], "计较": ["这里指因受冒犯而不肯宽容", "here: hold someone’s rude behaviour against them"], "无礼": ["不礼貌", "rude; impolite"], "恶意": ["想伤害或为难别人的用意", "an intention to hurt or trouble someone"]}, "tasks": [{"id": "q46", "title": "Q46 <span class=\"qkey\">为什么<\/span>作者<span class=\"qkey\">一开始<\/span>会<span class=\"qkey\">觉得<\/span>德士司机会打从心底<span class=\"qkey\">看不起他<\/span>？（4分）", "stage": 1, "eng": "Explain why he thinks this at the beginning. Find details that explain the thought, not just the action he notices.", "answer": "作者是一个二十几岁、将近一米七、看起来好手好脚的年轻人，却要年老、身高只有一米五的母亲连拉带拖地把他塞进德士里，母亲还特别拜托司机照顾他。因此，作者觉得司机会把他看成一个已经成年，却仍像小孩子一样需要母亲照顾、长不大的人，从而打从心底看不起他。", "ae": "The text states both the situation and his belief. Combine them to explain why he thinks this. His belief is direct information about him, not proof of what the driver thinks. “看起来” describes appearance, not his actual health.", "mode": "Try, then study the model", "hint": "Revisit P1–2: his appearance, his mother’s situation and her care.", "check": "Did I connect the care he needs with how he thinks the driver sees him?", "method": "Direct info + Information processing", "answerParts": [{"kind": "direct", "source": "¶1–2 · selected and combined", "text": "作者是一个二十几岁、将近一米七、看起来好手好脚的年轻人，却要年老、身高只有一米五的母亲连拉带拖地把他塞进德士里，母亲还特别拜托司机照顾他。", "group": 0}, {"kind": "direct", "source": "¶3 · narrator’s belief", "text": "因此，作者觉得司机会把他看成一个已经成年，却仍像小孩子一样需要母亲照顾、长不大的人，从而打从心底看不起他。", "group": 0}]}, {"id": "q47a", "title": "Q47（a）请结合上下文解释：“<span class=\"qkey\">可想而知<\/span>，此时我的脸一定是<span class=\"qkey\">乌云密布<\/span>。”（2分）", "stage": 1, "eng": "What does each expression describe here? Replace both with clear, everyday wording.", "answer": "可以想象得到，作者当时因为觉得司机看不起自己而很不高兴，脸色一定不好看。", "ae": "Explain both expressions in context. The words about his face describe unhappiness, not clouds. The reason makes the context clear; it is not an extra marking point. Do not use the later detour as the reason here.", "mode": "Try, then study the model", "hint": "Are these clouds in the sky, or describing his face?", "check": "Did I explain both expressions using what he knows at this point?", "method": "Meaning in context", "answerParts": [{"kind": "context", "source": "¶3 · 可想而知", "text": "可以想象得到，", "group": 0}, {"kind": "context", "source": "¶3 · 乌云密布", "text": "作者当时因为觉得司机看不起自己而很不高兴，脸色一定不好看。", "group": 0}]}, {"id": "q47b", "title": "Q47（b）请结合上下文解释：“一股<span class=\"qkey\">暖流<\/span>流进我的内心，我的<span class=\"qkey\">眼眶开始模糊<\/span>。”（2分）", "stage": 1, "eng": "Use the same method. Read what happens just before this sentence, then explain both expressions.", "answer": "德士司机的关心和鼓励使作者内心感到温暖，十分感动，眼里涌起了泪水。", "ae": "The care and encouragement come from the driver’s actions and words. Warmth, emotion and tears explain the two expressions. Do not add an unasked discussion of literary effects.", "mode": "Apply the method", "hint": "Consider his feelings, then what could blur his vision.", "check": "Did I explain the feeling and the tears, and identify what caused them?", "method": "Meaning in context", "answerParts": [{"kind": "direct", "source": "¶5–6 · actions and words", "text": "德士司机的关心和鼓励", "group": 0}, {"kind": "context", "source": "¶6 · 暖流／眼眶模糊", "text": "使作者内心感到温暖，十分感动，眼里涌起了泪水。", "group": 0}]}, {"id": "q48", "title": "Q48 你认为文中的德士司机是个<span class=\"qkey\">怎么样的人<\/span>？试写出<span class=\"qkey\">两点<\/span>并<span class=\"qkey\">举例说明<\/span>。（4分）", "stage": 1, "eng": "Find actions or words, then infer a trait. Explain two different aspects of the driver, with matching evidence.", "answer": "司机是一个体贴的人。他选择了绕路，并说明原来的路正在整修，颠簸会使作者的身体更痛。可见他考虑作者的身体需要，避免加重作者的痛苦。他也是一个宽容的人。作者把钱丢在他身上，他仍默默捡起钱，折好放回作者口袋，打开助行器，并小心地把作者抱下车。可见他没有因作者的无礼而计较，仍耐心帮助作者。", "ae": "Two angles: how he cares for someone’s needs, and how he responds to rude behaviour. Actions and words are Direct info. The traits and what the actions show are Inference. Different adjectives alone do not create different points.", "mode": "Apply the method", "hint": "Ask: what new aspect does my second point add? A new adjective or a new example does not automatically create a new angle.", "check": "Does my second point add a different aspect, with evidence that supports it?", "method": "Direct info → Inference · Two different angles", "answerParts": [{"kind": "inference", "source": "Angle 1 · care for another person’s needs", "text": "司机是一个体贴的人。", "group": 1}, {"kind": "direct", "source": "¶4, ¶6 · action and explanation", "text": "他选择了绕路，并说明原来的路正在整修，颠簸会使作者的身体更痛。", "group": 1}, {"kind": "inference", "source": "Connect the action to the trait", "text": "可见他考虑作者的身体需要，避免加重作者的痛苦。", "group": 1}, {"kind": "inference", "source": "Angle 2 · response to rude behaviour", "text": "他也是一个宽容的人。", "group": 2}, {"kind": "direct", "source": "¶5 · actions", "text": "作者把钱丢在他身上，他仍默默捡起钱，折好放回作者口袋，打开助行器，并小心地把作者抱下车。", "group": 2}, {"kind": "inference", "source": "Connect the action to the trait", "text": "可见他没有因作者的无礼而计较，仍耐心帮助作者。", "group": 2}]}, {"id": "q49", "title": "Q49 <span class=\"qkey\">为什么<\/span>作者认为“我真正病得严重的<span class=\"qkey\">不是身体，其实是我的心<\/span>”？请<span class=\"qkey\">结合文章内容<\/span>加以说明。（4分）", "stage": 1, "eng": "Explain what the sentence means here. Choose relevant details across the text, combine repeated ideas, and show the connection.", "answer": "司机注视作者，他便认定司机看不起自己；母亲叮嘱司机照顾他，他却嫌母亲啰嗦；司机绕路，他便怀疑司机欺负自己、想坑他的钱，还愤怒地把车费丢在司机身上，无礼地对待司机。后来，作者听到司机解释原来的路正在整修，颠簸会加重他的痛苦，又得到司机免费帮助和鼓励。这使作者意识到，自己因患病而变得敏感多疑，不但忽略母亲的关心，还把司机的善意误解为恶意，并以不友善的态度回应别人。他需要改变这种猜疑、敌视他人的心态，因此认为真正病得严重的是自己的“心”。", "ae": "Keep the four original areas: suspected contempt, impatience with Mother, suspicion about the fare, and rude behaviour. Later kindness helps explain his reflection. The earlier suspicions are stated thoughts, not facts about the driver. “心” refers to his attitude, not a physical heart illness.", "mode": "Apply the method", "hint": "Find examples of how he thinks about and treats people. Which examples show the same idea? Explain how the ending connects to them.", "check": "Did I connect his earlier thoughts and behaviour, the driver’s kindness, and his final reflection?", "method": "Direct info + Information processing + Inference", "answerParts": [{"kind": "direct", "source": "¶2–5 · narrator’s thoughts and behaviour", "text": "司机注视作者，他便认定司机看不起自己；母亲叮嘱司机照顾他，他却嫌母亲啰嗦；司机绕路，他便怀疑司机欺负自己、想坑他的钱，还愤怒地把车费丢在司机身上，无礼地对待司机。", "group": 0}, {"kind": "direct", "source": "¶5–6 · later actions and explanation", "text": "后来，作者听到司机解释原来的路正在整修，颠簸会加重他的痛苦，又得到司机免费帮助和鼓励。", "group": 0}, {"kind": "inference", "source": "Compare the earlier belief with the later evidence", "text": "这使作者意识到，自己因患病而变得敏感多疑，不但忽略母亲的关心，还把司机的善意误解为恶意，并以不友善的态度回应别人。他需要改变这种猜疑、敌视他人的心态，因此认为真正病得严重的是自己的“心”。", "group": 0}]}, {"id": "transfer", "title": "新材料：<span class=\"qkey\">为什么<\/span>“我”<span class=\"qkey\">原先准备责问他的话<\/span>，后来<span class=\"qkey\">说不出口了<\/span>？请结合<span class=\"qkey\">前后内容<\/span>说明。", "stage": 2, "eng": "New practice text, not an original exam question. Try independently. Word meanings and audio are available.", "answer": "“我”原以为阿杰拿走练习本是为了抄答案，准备责问他。后来，“我”听到阿杰请老师补批练习本，又看到他提醒自己看批注，并提议一起请教老师。这些言行使“我”明白阿杰是在帮助自己订正。“我”意识到误会了他，因此不好意思再责问。", "ae": "The earlier suspicion and later actions are stated in the text. The realisation and embarrassment explain the changed response; they are inferred from the contrast.", "mode": "Independent practice", "hint": "", "check": "Did I use the new evidence to explain why the earlier accusation no longer fits?", "method": "Direct info + Inference", "answerParts": [{"kind": "direct", "source": "New text · earlier thought", "text": "“我”原以为阿杰拿走练习本是为了抄答案，准备责问他。", "group": 0}, {"kind": "direct", "source": "New text · later words and actions", "text": "后来，“我”听到阿杰请老师补批练习本，又看到他提醒自己看批注，并提议一起请教老师。", "group": 0}, {"kind": "inference", "source": "Explain the changed response", "text": "这些言行使“我”明白阿杰是在帮助自己订正。“我”意识到误会了他，因此不好意思再责问。", "group": 0}]}], "transfer": "午休时，我看见阿杰从我的桌上拿走练习本，快步走出教室。我心想：“他一定又要抄我的答案！”我追到办公室门口，却听见他对老师说：“这本还没批改，刚才收作业时漏了。她下午要订正，麻烦您看看。”回教室后，他把练习本放回我的桌上，指着老师的批注说：“这里我也不懂，等会儿一起问老师吧。”我原先准备责问他的话，忽然说不出口了。", "version": "2026-09-reading-v10", "reading": [["<span class=\"qkey\">谁帮助谁<\/span>上车？“我”<span class=\"qkey\">看到了什么<\/span>，又<span class=\"qkey\">猜想了什么<\/span>？", "Find the two people in the long final sentence. First identify who needs help and who gives it. Then consider why “竟然” is used."], ["母亲<span class=\"qkey\">拜托司机做什么<\/span>？“我”有<span class=\"qkey\">什么反应<\/span>？", "Follow who is speaking. “麻烦” here introduces a polite request; it does not describe a troublesome person."], ["司机<span class=\"qkey\">做了什么<\/span>？“我”<span class=\"qkey\">怎样理解<\/span>司机的举动？这是<span class=\"qkey\">谁的判断<\/span>？", "Separate what is observed from what is believed. Look at words such as “大概”, “一定” and “应该……吧”. Sounding certain does not prove a belief is true."], ["发现司机<span class=\"qkey\">绕路后<\/span>，“我”有什么<span class=\"qkey\">想法和感受<\/span>？接着<span class=\"qkey\">想做什么<\/span>？", "Follow event → thought → feeling → intended action. Read the last “但是” carefully: wanting to do something is not the same as doing it."], ["“我”和司机<span class=\"qkey\">分别<\/span><span class=\"qkey\">怎样处理车费<\/span>？司机<span class=\"qkey\">还做了什么<\/span>？", "Follow the action verbs in order. Who is doing each action? Notice “却”: what happens differently from what you might expect?"], ["司机的话提供了<span class=\"qkey\">哪些新信息<\/span>？这些信息<span class=\"qkey\">解释了<\/span>前文的<span class=\"qkey\">哪件事<\/span>？", "Separate the driver’s words from the narrator’s response. Go back to the earlier event and check whether the new informat d a different aspect, such as his response to rude behaviour."}, {"title": "看证据与解释 / Check the explanation", "sample": "他有同情心：太太也患同一种病，他看到作者拖着助行器时哭了，还鼓励作者，表现出对作者痛苦的理解。他也很善良：他不收车费，还帮作者下车，主动给予实际帮助。", "feedback": "This tries to separate understanding another person’s suffering from giving practical help. The meanings are close, so the teacher must judge whether the distinction is clear enough. These adjectives are not automatically banned. “体贴＋宽容” gives a clearer contrast in this text."}]}</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('data').textContent),KEY='hwt-taxi-workshop-v6';
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s)),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={stage:0,paragraph:0,question:0,work:{},help:[],uiVersion:7},readableStorage=true,showOriginal=false;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.work&&Array.isArray(saved.help)){S={...S,...saved};if(saved.uiVersion!==7){S.stage=[0,1,2].includes(saved.stage)?saved.stage:1;for(const w of Object.values(S.work)){if(typeof w.revision==='string'&&w.revision.trim()){w.legacyDraft=w.draft;w.draft=w.revision;}}S.uiVersion=7;}}}catch(e){readableStorage=false;}
S.stage=[0,1,2,3].includes(S.stage)?S.stage:0;S.paragraph=Number.isInteger(S.paragraph)&&S.paragraph>=0&&S.paragraph<=7?S.paragraph:0;S.question=Number.isInteger(S.question)&&S.question>=0&&S.question<5?S.question:0;
function work(id){return S.work[id]||(S.work[id]={draft:'',first:null,revealed:false,hints:0});}
function save(){if(!readableStorage){$('#saveStatus').textContent='Saved data could not be read. Copy your answers before closing.';$('#saveStatus').className='small error';return;}try{localStorage.setItem(KEY,JSON.stringify(S));$('#saveStatus').textContent='Saved on this device · Not sent to teacher';$('#saveStatus').className='small';}catch(e){$('#saveStatus').textContent='Not saved. Keep this page open and copy your answers.';$('#saveStatus').className='small error';}}
function log(type,extra={}){S.help.push({type,...extra,stage:S.stage,time:new Date().toISOString()});save();}
let speechToken=0,activeUtterance=null;
function stop(){speechToken++;if('speechSynthesis'in window)speechSynthesis.cancel();activeUtterance=null;}
function speak(text,lang='en-SG'){stop();const token=speechToken;if(!('speechSynthesis'in window)){$('#audioStatus').textContent='Audio unavailable. Please use the text explanation.';return;}$('#audioStatus').textContent='';const chunks=text.match(/[^。！？.!?]+[。！？.!?]?/g)||[text];let n=0;function next(){if(token!==speechToken||n>=chunks.length)return;const u=new SpeechSynthesisUtterance(chunks[n++]);u.lang=lang;u.rate=lang.startsWith('zh')?.82:.92;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase()===lang.toLowerCase())||voices.find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2)))||null;activeUtterance=u;u.onend=next;u.onerror=e=>{if(token===speechToken&&e.error!=='canceled'&&e.error!=='interrupted')$('#audioStatus').textContent='Audio could not play. Please use the text explanation.';};speechSynthesis.speak(u);}next();}
function audio(text,lang='en-SG',label='Listen'){return `<button class="audio" data-say="${esc(text)}" data-lang="${lang}">▶ ${label}</button>`;}
function explain(text){return `<div class="explain"><p lang="en">${esc(text).replace(/[\u3400-\u9fff]+/g,x=>`<span class="kai">${x}</span>`)}</p>${audio(text)}</div>`;}
function words(text){const found=Object.keys(D.vocab).filter(w=>text.includes(w));return found.length?`<details class="wordlist"><summary>Words</summary><div class="words">${found.map(w=>`<button class="word" data-word="${esc(w)}">${esc(w)}</button>`).join('')}</div></details>`:'';}
const targets=['可想而知，此时我的脸一定是乌云密布。','一股暖流流进我的内心，我的眼眶开始模糊。'];
function passage(){const isNew=S.stage===2&&!showOriginal;$('#passageTitle').textContent=isNew?'新编短文':'完整篇章';$('#switchText').hidden=S.stage!==2;$('#switchText').textContent=showOriginal?'New practice text':'Original text';$('#passage').innerHTML=(isNew?[D.transfer]:D.paras).map((p,i)=>{let text=esc(p);targets.forEach(t=>text=text.replace(esc(t),`<span class="target">${esc(t)}</span>`));return `<section class="para ${!isNew&&S.stage===0&&S.paragraph===i?'focus':''}" id="p${i+1}"><div class="row parahead"><span>${isNew?'New practice':'¶ '+(i+1)}</span>${audio(p,'zh-CN','Read aloud')}</div><p>${text}</p>${words(p)}</section>`;}).join('');}
function method(text){return `<div class="method"><span lang="en">${esc(text)}</span>${audio(text)}</div>`;}
function readingRecord(i){if(!S.readingWork)S.readingWork={};return S.readingWork[i]||(S.readingWork[i]={answers:[],first:[]});}
function readingInputs(i){const r=readingRecord(i);return `<div class="read-response"><p class="small">Paste relevant text. Add a short explanation when needed.</p>${D.readingFields[i].map((label,j)=>`<label for="read-${i}-${j}">${esc(label)}</label><textarea id="read-${i}-${j}" data-read-answer="${j}" placeholder="Copy → Paste → Edit">${esc(r.answers[j]||'')}</textarea>`).join('')}</div>`;}
function saveReadingFirst(i,j){const r=readingRecord(i);if(!r.first[j]&&/[\p{L}\p{N}]/u.test(r.answers[j]||'')){r.first[j]={answer:r.answers[j],time:new Date().toISOString()};save();}}
function renderRead(){const i=S.paragraph,[prompt,help]=D.reading[i];return `<section class="card"><div class="row steps" aria-label="Paragraphs">${D.reading.map((_,j)=>`<button class="step" data-para="${j}" aria-current="${i===j}">${j<7?j+1:'连全文'}</button>`).join('')}</div><h2 class="reading-heading">${i<7?'读第'+(i+1)+'段':'连接全文'}</h2><h3 class="reading-question" lang="zh-SG">${prompt}</h3>${method(D.readingMethods[i])}${audio(plain(prompt),'zh-CN','读题')}<details id="readHelp"><summary>Hint</summary>${explain(help)}${i===0?'<p class="frame">一个……的年轻人，竟然要一个……的老妇人……</p>':''}${i===7?'<p class="frame">原来以为……后来得知……</p>':''}</details>${readingInputs(i)}<div class="row footer"><button id="prevPara" ${i===0?'disabled':''}>← 上一段</button><button id="nextPara" class="primary">${i===7?'开始作答 →':'下一步 →'}</button></div></section>`;}
function plain(s){const el=document.createElement('div');el.innerHTML=s;return el.textContent;}
function currentTask(){return S.stage===2?D.tasks.find(t=>t.id==='transfer'):D.tasks.filter(t=>t.stage===1)[S.question];}
const sourceTypes={direct:'Direct info（篇章）',inference:'Inference（推断）',context:'Meaning in context（语境义）'};
function labelledAnswer(t){const groups=[];for(const part of t.answerParts){let g=groups[groups.length-1];if(!g||g.id!==part.group){g={id:part.group,parts:[]};groups.push(g);}g.parts.push(part);}return `<div class="answer answer-labelled">${groups.map(g=>`<div class="answer-group">${g.parts.map(p=>`<p class="answer-part"><span class="source-label"><span class="source-tag ${p.kind}">${esc(sourceTypes[p.kind])}</span>${esc(p.source)}</span><span class="kai">${esc(p.text)}</span></p>`).join('')}</div>`).join('')}</div>`;}
function q48Comparison(){return `<details class="angle-comparison"><summary>Compare two angles（两个角度）</summary><p class="source-key">Check meanings, evidence and explanations — not just the number of adjectives.</p>${audio('Check meanings, evidence and explanations, not just the number of adjectives.')}${D.q48Compare.map(c=>`<section class="compare-case"><h3>${esc(c.title)}</h3><p class="sample-answer">${esc(c.sample)}</p>${audio(c.sample,'zh-CN','Read example')}${explain(c.feedback)}${words(c.sample)}</section>`).join('')}<p class="small">Original scheme: trait (1) + matching example (1), twice. Classroom guidance: do not count the same supported meaning twice. The original scheme gives no separate rule for these two adjectives. Your teacher decides the marks; this page does not score your answer.</p></details>`;}
function model(t){return `<h2 class="kai">参考答案</h2><p class="source-key">Read the Chinese sentences as one answer. The labels show where each part comes from.</p>${labelledAnswer(t)}${audio(t.answer,'zh-CN','Read answer')}<details class="source-help"><summary>About the labels（来源）</summary>${explain('Direct info comes from the text, sometimes selected or combined. It can be a stated action, someone’s words, or the narrator’s belief. A stated belief is not automatically a fact. Inference is a conclusion supported by the text. Meaning in context explains a figurative or indirect expression; it is not a copied sentence.')}</details><h2 class="section-label">How to form the answer</h2>${explain(t.ae)}${t.id==='q48'?q48Comparison():''}${explain(t.check+' Compare meanings, then edit your answer in the same box. Your teacher checks correctness.')}${words(t.answer)}`;}

function renderAnswer(){const t=currentTask(),w=work(t.id);const nav=S.stage===1?`<div class="row steps" aria-label="Questions">${D.tasks.filter(x=>x.stage===1).map((x,i)=>`<button data-question="${i}" aria-current="${i===S.question}">${x.id.toUpperCase().replace('Q47A','Q47(a)').replace('Q47B','Q47(b)')}</button>`).join('')}</div>`:'';return `<article class="card" id="${t.id}">${nav}<h3 lang="zh-SG">${t.title}</h3>${method(t.method)}${audio(plain(t.title),'zh-CN','读题')}${words(plain(t.title))}${t.hint?`<details id="hint"><summary>Hint</summary>${explain(t.eng+' '+t.hint)}${t.id==='q48'?'<p class="frame">他是一个……的人。当……，他……，这说明……。</p>':''}</details>`:''}<label for="answer">答案 / Your answer</label><textarea id="answer" placeholder="Write your understanding. You can copy relevant text and edit it here.">${esc(w.draft||'')}</textarea><p id="answerStatus" class="status"></p><button id="reference" class="primary">查看参考答案 / Reference</button><div id="feedback" class="feedback" role="status"></div><section id="model" class="model" hidden></section><div class="row footer">${S.stage===1?`<button id="prevQ" ${S.question===0?'disabled':''}>← Back</button><button id="nextQ">${S.question===4?'老师讲解 →':'Next →'}</button>`:''}</div></article>`;}
function grammarState(){return S.grammarMarks||(S.grammarMarks={});}
function teacherParagraph(){return Number.isInteger(S.teacherParagraph)&&S.teacherParagraph>=0&&S.teacherParagraph<7?S.teacherParagraph:0;}
function grammarTokens(tokens,prefix){const marks=grammarState();return tokens.map((t,i)=>{if(!t.role)return `<span class="grammar-plain">${esc(t.text)}</span>`;const id=prefix+':'+i,role=marks[id]||'',name=t.role==='s'?'主语':t.role==='p'?'谓语中心':t.role==='o'?'宾语':'宾语／主语，重复点击切换';return `<span role="button" tabindex="0" aria-pressed="${!!role}" aria-label="${esc(name+'：'+t.text)}" class="grammar-token" data-grammar-id="${id}" data-role="${t.role}" data-active="${role}">${esc(t.text)}</span>${t.role==='x'?'<span class="dual-hint" aria-hidden="true">宾／主</span>':''}`;}).join('');}
function renderTeacher(){const p=teacherParagraph();return `<section class="card"><h2 class="grammar-heading">老师讲解 · 读第${p+1}段</h2><div class="row grammar-toolbar">${D.grammar.map((_,i)=>`<button data-teach-para="${i}" aria-current="${i===p}">${i+1}</button>`).join('')}<button id="clearGrammar">清除本段颜色</button></div><div class="row grammar-legend"><span class="legend-s">主语 Subject</span><span class="legend-p">谓语中心 Predicate head</span><span class="legend-o">宾语 Object</span></div><p class="grammar-instruction">Click a phrase to colour it; click again to clear. Only these three parts are marked. Other words and missing parts are not labelled.</p><details><summary>How to use</summary>${explain('The yellow part is the main action or state, not the entire predicate including its object. Subject and object noun phrases stay together. For a phrase with two roles, repeated clicks switch object → subject → clear. Open an inner clause to examine its own structure. This is teacher-supported reading, not an independent test.')}</details>${D.grammar[p].map((row,i)=>`<section class="grammar-sentence" data-sentence="${p}:${i}"><p class="section-label">${p+1}.${i+1}</p><div class="grammar-text" lang="zh-SG">${grammarTokens(row.tokens,`${p}:${i}:main`)}</div>${row.inner.length?`<details class="inner-clauses"><summary>看句内主干</summary>${row.inner.map((ts,j)=>`<div class="grammar-inner grammar-text" lang="zh-SG">${grammarTokens(ts,`${p}:${i}:inner${j}`)}</div>`).join('')}</details>`:''}<details><summary>Teacher note</summary><div class="grammar-note">${explain(row.note)}</div></details></section>`).join('')}<div class="row footer"><button id="teacherBack" ${p===0?'disabled':''}>← 上一段</button><button id="teacherNext">${p===6?'新材料练习 →':'下一段 →'}</button></div></section>`;}
function toggleGrammar(el){const id=el.dataset.grammarId,type=el.dataset.role,marks=grammarState();const active=type==='x'?(marks[id]==='o'?'s':marks[id]==='s'?'':'o'):(marks[id]?'':type);if(active)marks[id]=active;else delete marks[id];el.dataset.active=active;el.setAttribute('aria-pressed',String(!!active));save();}
function bindTeacher(){const p=teacherParagraph();$$('[data-grammar-id]').forEach(el=>{el.onclick=()=>toggleGrammar(el);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleGrammar(el);}};});$$('[data-teach-para]').forEach(b=>b.onclick=()=>{S.teacherParagraph=+b.dataset.teachPara;render();$('#main').scrollIntoView({block:'start'});});$('#clearGrammar').onclick=()=>{for(const k of Object.keys(grammarState()))if(k.startsWith(p+':'))delete S.grammarMarks[k];render();};$('#teacherBack').onclick=()=>{S.teacherParagraph=p-1;render();};$('#teacherNext').onclick=()=>{if(p===6)stage(2);else{S.teacherParagraph=p+1;render();}};$$('.inner-clauses').forEach(el=>el.ontoggle=()=>{if(el.open)log('teacher-inner-clause',{paragraph:p+1});});}

function updateStatus(){if(S.stage===0||S.stage===3)return;const w=work(currentTask().id),attempt=/[\p{L}\p{N}]/u.test(w.draft||'');$('#answerStatus').textContent=w.revealed?(w.first&&w.draft!==w.first.answer?'Edited after reference · Not graded':'Reference viewed · Not graded'):attempt?'Attempt written · Not graded':'Not answered';}
function render(){stop();document.body.classList.toggle('teacher-mode',S.stage===3);if(S.stage!==3)passage();$('#main').innerHTML=S.stage===3?renderTeacher():S.stage===0?renderRead():renderAnswer();$$('[data-stage]').forEach(b=>b.setAttribute('aria-current',+b.dataset.stage===S.stage));if(S.stage===3){bindTeacher();save();return;}if(S.stage===0){$$('[data-read-answer]').forEach(el=>{const i=S.paragraph,j=+el.dataset.readAnswer;el.oninput=()=>{readingRecord(i).answers[j]=el.value;save();};el.onblur=()=>saveReadingFirst(i,j);});$('#prevPara').onclick=()=>moveParagraph(S.paragraph-1);$('#nextPara').onclick=()=>S.paragraph===7?stage(1):moveParagraph(S.paragraph+1);$('#readHelp').ontoggle=e=>{if(e.target.open)log('reading-hint',{paragraph:S.paragraph+1});};}else{const t=currentTask(),w=work(t.id);$('#answer').oninput=e=>{w.draft=e.target.value;w.updatedAt=new Date().toISOString();save();updateStatus();};$('#reference').onclick=()=>{if(!$('#model').hidden){$('#model').hidden=true;$('#reference').textContent='查看参考答案 / Reference';stop();return;}if(!/[\p{L}\p{N}]/u.test(w.draft||'')){$('#feedback').innerHTML=explain('Write your own attempt first. It need not be correct.');return;}if(!w.first)w.first={answer:w.draft,time:new Date().toISOString(),help:JSON.parse(JSON.stringify(S.help))};w.revealed=true;w.lastReferenceAt=new Date().toISOString();$('#model').innerHTML=model(t);$('#model').hidden=false;$('#reference').textContent='收起参考答案 / Hide';$('#feedback').innerHTML='';save();updateStatus();};if($('#hint'))$('#hint').ontoggle=e=>{if(e.target.open){w.hints=(w.hints||0)+1;log('question-hint',{task:t.id,beforeFirst:!w.first});}};if(S.stage===1){$('#prevQ').onclick=()=>question(S.question-1);$('#nextQ').onclick=()=>S.question===4?stage(3):question(S.question+1);}updateStatus();}save();}
function focusParagraph(){const el=$('#p'+(S.paragraph+1)),pane=$('#passagePane');if(el)pane.scrollTop=Math.max(0,el.offsetTop-pane.offsetTop-12);}
function keepReading(){if(S.stage===0)D.readingFields[S.paragraph].forEach((_,j)=>saveReadingFirst(S.paragraph,j));}
function moveParagraph(n){keepReading();S.paragraph=Math.max(0,Math.min(7,n));render();focusParagraph();}
function question(n){S.question=Math.max(0,Math.min(4,n));render();}
function stage(n){keepReading();S.stage=n;showOriginal=false;render();$('#passagePane').scrollTop=0;}
document.addEventListener('click',e=>{const a=e.target.closest('[data-say]');if(a){speak(a.dataset.say,a.dataset.lang);log('audio',{task:S.stage===3?'teacher':S.stage===0?'reading':currentTask().id});return;}const p=e.target.closest('[data-para]');if(p){moveParagraph(+p.dataset.para);return;}const q=e.target.closest('[data-question]');if(q){question(+q.dataset.question);return;}const w=e.target.closest('[data-word]');if(w)openWord(w.dataset.word);});
function openWord(word){stop();$('#wordTitle').textContent=word;const id=D.tested[word],locked=id&&!work(id).revealed;let zh,en;if(locked){zh='这是本题要解释的词句。先联系上下文尝试作答，查看参考答案后可读完整释义。';en='This expression is tested in '+id.toUpperCase()+'. Listen to its pronunciation and use the surrounding sentence. Try the question, then open its reference for the meaning.';}else [zh,en]=D.vocab[word];$('#wordBody').innerHTML=`<p>${esc(zh)}</p><p lang="en">${esc(en)}</p>`;$('#wordAudio').innerHTML=audio(word,'zh-CN','Word')+audio(zh,'zh-CN','中文解释')+audio(en,'en-SG','English');log('vocabulary',{word,locked,task:S.stage===3?'teacher':S.stage===0?'reading':currentTask().id});$('#wordDialog').showModal();}
$('#wordClose').onclick=()=>$('#wordDialog').close();$('#wordDialog').addEventListener('close',stop);$('#wordDialog').addEventListener('cancel',stop);$('#stopAudio').onclick=stop;$('#switchText').onclick=()=>{stop();showOriginal=!showOriginal;passage();$('#passagePane').scrollTop=0;};$$('[data-stage]').forEach(b=>b.onclick=()=>stage(+b.dataset.stage));$('#reset').onclick=()=>{if(confirm('只清除本学习单的答案和进度？\nClear answers and progress for this worksheet only?')){try{localStorage.removeItem(KEY);readableStorage=true;}catch(e){readableStorage=false;}S={stage:0,paragraph:0,question:0,work:{},help:[],uiVersion:7};showOriginal=false;render();}};window.addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});render();
</script></body></html>
