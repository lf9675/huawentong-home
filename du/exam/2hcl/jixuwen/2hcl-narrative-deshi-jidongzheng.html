<script id="data" type="application/json">{"paras": ["经过一番折腾，妈妈好不容易才将我弄上车的。我瞥了一下等候的司机，只见他的眉毛微微动了一下。我想，他一定是在纳闷，好手好脚的人为什么不自己用走的？一个将近1.7米的年轻人，竟然要一个年老而且身高只有1.5米的老妇人连拉带拖地塞进德士里。", "“麻烦您送他到台大医院，这是我的电话，麻烦一有什么问题，请务必打电话给我，谢谢！他身体……”没想到母亲在离开家门前还特别地向德士司机拜托。“真是的，干嘛这么啰嗦，我又不是小孩子了！”我不耐烦地转过头去，不想去看妈妈。", "在路途上，那司机大概以为我是个二十几岁长不大的小孩子，他一定打从心底看不起我。一路上，他以一种近乎诡异的眼光从后视镜中注视着我，那应该就是鄙视吧！他一直盯着我瞧，我只好努力地转动不甚灵活的脖子来回避这种尴尬。可想而知，此时我的脸一定是乌云密布。", "经过每次必经的百货公司，我发现他竟然绕道而行，真是太过分了！我怎么会遇到这么没有道德的德士司机，竟然想要欺负患上“渐冻症”的我，想要坑我的钱！他到底有没有良心啊！如果他也尝尝这种痛苦，他就不会这么对待我！我的内心充满愤怒，双手紧握着拳头，真希望自己的手能够有力量挥舞出去，但是我不能。", "总算到了目的地。我拿出了钱，颤巍巍地丢在他的身上。只见他默默地捡起钱，却折好放回我的上衣口袋，把助行器打开架好，小心地把我抱出车外。", "当我用力地拖着助行器时，他竟哭了：“我太太也是这种病，也是和你一样，慢慢地全身都不能动，上星期在台大医院火化了。以后别走忠孝西路来这里，那路在整修不好走，一路颠簸你的身体会更痛。小老弟，我不收你的钱，你要加油。”说完边用力地向我挥手，似乎想借此给我一些支持的力量。一股暖流流进我的内心，我的眼眶开始模糊。", "看着计程车渐渐远去，我终于明白我真正病得严重的不是身体，其实是我的心。"], "vocab": {"折腾": ["反复处理，很费力", "much trouble; takes effort"], "瞥": ["很快看一眼", "glance"], "纳闷": ["觉得奇怪", "wonder; feel puzzled"], "连拉带拖": ["又拉又拖", "pull and drag"], "啰嗦": ["说太多、重复", "long-winded; repetitive"], "不耐烦": ["觉得烦，不愿继续", "impatient"], "打从心底": ["从内心深处", "from the bottom of one's heart"], "诡异": ["奇怪得不自然", "strange and unsettling"], "鄙视": ["看不起", "look down on"], "尴尬": ["不自然、不自在", "awkward"], "乌云密布": ["这里形容“我”的脸色不好看", "here: his face looks gloomy"], "绕道而行": ["绕开原来的路线，改走另一条路", "take a different route around something"], "坑我的钱": ["骗取或多收我的钱", "cheat me out of money"], "颤巍巍": ["颤抖、不稳", "trembling and unsteady"], "暖流": ["这里指受到关心后心里温暖、感动", "here: feeling warmed and touched by care"], "眼眶开始模糊": ["这里指感动得眼里含泪", "here: eyes filling with tears of emotion"], "可想而知": ["可以想象得到", "one can imagine"], "助行器": ["帮助站立和走路的工具", "walking frame"], "颠簸": ["上下摇动，不平稳", "bumpy movement"], "渐冻症": ["文中指使身体逐渐难以活动的疾病", "the illness that gradually limits movement in this story"], "等候": ["等待", "wait"], "将近": ["接近，但还不到", "nearly; almost"], "竟然": ["表示出乎意料", "unexpectedly"], "务必": ["一定要", "must; be sure to"], "拜托": ["请求别人帮忙", "ask someone for help"], "近乎": ["几乎；很接近", "almost"], "不甚": ["不太；不是很", "not very"], "回避": ["避开", "avoid"], "必经": ["一定会经过", "must pass through"], "良心": ["分辨是非、顾及别人的心", "conscience; sense of right and wrong"], "挥舞": ["举起并来回摆动", "wave or swing"], "默默": ["不说话地", "silently"], "整修": ["修理，使它恢复良好状态", "repair; renovate"], "支持": ["给予帮助或鼓励", "support; encourage"], "好不容易": ["费了很大力气才做到", "only after much effort"], "塞进": ["用力放进去", "push or squeeze into"], "老妇人": ["年老的女人", "elderly woman"], "麻烦": ["这里用来客气地请求帮忙", "please; used to make a polite request"], "干嘛": ["为什么；做什么", "why; what for"], "大概": ["表示推测，不完全确定", "probably"], "后视镜": ["用来观察车后情况的镜子", "rear-view mirror"], "注视": ["集中目光看", "look at closely"], "盯": ["一直看着", "stare at"], "瞧": ["看", "look"], "灵活": ["活动方便，不僵硬", "flexible; able to move easily"], "欺负": ["用不公平的方式对待别人", "bully; mistreat"], "患上": ["得了某种病", "develop an illness"], "愤怒": ["非常生气", "very angry"], "紧握": ["用力握住", "clench; hold tightly"], "拳头": ["五指弯曲握成的手", "fist"], "目的地": ["要到达的地方", "destination"], "捡起": ["从地上等地方拿起来", "pick up"], "架好": ["支撑并放稳", "set up securely"], "火化": ["人去世后将遗体焚化", "cremate after death"], "似乎": ["好像", "seem"], "借此": ["利用这个行动或机会", "through this action"], "计程车": ["德士；出租车", "taxi"], "渐渐": ["慢慢地", "gradually"], "严重": ["程度很深", "serious; severe"], "结合": ["联系起来一起考虑", "connect and consider together"], "上下文": ["前面和后面的内容", "surrounding text"], "举例说明": ["用具体例子解释", "explain with a specific example"], "批注": ["写在文章旁边的意见", "written comments"], "责问": ["带着责备去问", "question accusingly"], "批改": ["检查作业并改正错误", "mark schoolwork"], "订正": ["改正错误", "correct mistakes"], "漏": ["遗漏；没有处理到", "miss out"], "原先": ["原来；之前", "previously"], "提议": ["提出建议", "suggest"], "敏感": ["容易受到别人言行影响", "easily affected by what others say or do"], "多疑": ["容易怀疑别人", "often suspicious of others"], "猜疑": ["怀疑别人的用意", "suspect another person’s motives"], "敌意": ["想与别人对抗的态度", "hostile attitude"], "体贴": ["关心并照顾别人的需要", "considerate of another person’s needs"], "善良": ["心地好，愿意帮助别人", "kind; willing to help"], "反省": ["回想并检查自己的想法或行为", "reflect on one’s own thoughts and actions"], "鼓励": ["给人信心和勇气", "encourage"], "误会": ["理解错了别人的意思或用意", "misunderstand someone’s meaning or intention"]}, "tasks": [{"id": "q46", "title": "Q46 <span class=\"qkey\">为什么<\/span>作者<span class=\"qkey\">一开始<\/span>会<span class=\"qkey\">觉得<\/span>德士司机会打从心底<span class=\"qkey\">看不起他<\/span>？（4分）", "stage": 1, "eng": "Explain why he thinks this at the beginning. Find details that explain the thought, not just the action he notices.", "answer": "作者是一个二十几岁、将近1.7米、看起来好手好脚的年轻人（1），却要一个年老而且身高只有1.5米的老妇人（1）连拉带拖地把他塞进德士里（1）；上车后，母亲还特别拜托司机照顾他（1）。因此，作者觉得司机会把自己看成一个长不大、不能照顾自己的年轻人，从而看不起他。", "ae": "Use P1–2: his appearance, his mother’s age and size, her help getting him in, and her request for care. The eyebrow movement alone does not explain the thought.", "mode": "Try, then study the model", "hint": "Revisit P1–2: his appearance, his mother’s situation and her care.", "check": "Did I include the relevant reasons and remove unrelated details?"}, {"id": "q47a", "title": "Q47（a）请结合上下文解释：“<span class=\"qkey\">可想而知<\/span>，此时我的脸一定是<span class=\"qkey\">乌云密布<\/span>。”（2分）", "stage": 1, "eng": "What does each expression describe here? Replace both with clear, everyday wording.", "answer": "“可想而知”在这里指可以想象得到（1）；“乌云密布”在这里指此时“我”的脸色一定不太好看（1）。", "ae": "“可想而知” means “one can imagine”. “乌云密布” describes his face, not the weather. Explain both meanings; no discussion of literary effects is needed.", "mode": "Try, then study the model", "hint": "Are these clouds in the sky, or describing his face?", "check": "Did I explain both expressions in this sentence?"}, {"id": "q47b", "title": "Q47（b）请结合上下文解释：“一股<span class=\"qkey\">暖流<\/span>流进我的内心，我的<span class=\"qkey\">眼眶开始模糊<\/span>。”（2分）", "stage": 1, "eng": "Use the same method. Read what happens just before this sentence, then explain both expressions.", "answer": "德士司机的关心和鼓励让“我”感到温暖、深受感动（1），感动得眼眶含泪（1）。", "ae": "The driver’s care makes him feel warm and touched. His eyes fill with tears. Explain these meanings instead of repeating the expressions.", "mode": "Apply the method", "hint": "Consider his feelings, then what could blur his vision.", "check": "Did I connect both expressions to what has just happened?"}, {"id": "q48", "title": "Q48 你认为文中的德士司机是个<span class=\"qkey\">怎么样的人<\/span>？试写出<span class=\"qkey\">两点<\/span>并<span class=\"qkey\">举例说明<\/span>。（4分）", "stage": 1, "eng": "Find actions or words first. Explain what they show. Give two different traits with matching examples.", "answer": "司机是一个体贴的人（1）。他知道道路整修会使作者因颠簸而更加痛苦，所以特意绕路（1）。他也是一个善良的人（1）。他把车费放回作者口袋，不收作者的钱，并鼓励作者加油（1）。", "ae": "The detour considers the passenger’s pain: this supports “体贴”. Free help and encouragement support “善良”. Each trait needs a matching example. An early accusation is not reliable evidence.", "mode": "Apply the method", "hint": "Compare the purpose of the detour, the help getting out and his words. Find distinct aspects.", "check": "Are my two traits different, and does each example support its trait?"}, {"id": "q49", "title": "Q49 <span class=\"qkey\">为什么<\/span>作者认为“我真正病得严重的<span class=\"qkey\">不是身体，其实是我的心<\/span>”？请<span class=\"qkey\">结合文章内容<\/span>加以说明。（4分）", "stage": 1, "eng": "Explain what the sentence means here. Choose relevant details across the text, combine repeated ideas, and show the connection.", "answer": "作者因患病而敏感多疑，认定司机看不起他；母亲关心他，他却嫌母亲啰嗦；司机绕路，他误以为司机要欺负他、坑钱；他还产生攻击冲动，并把钱丢在司机身上。后来，他明白司机绕路是为了减轻他的痛苦，还免费帮助、鼓励他，才反省自己以猜疑和敌意误解别人的善意。这就是他所说的“心病”。", "ae": "Connect his suspicions, impatience with Mother, mistaken view of the detour and hostile behaviour. The driver’s kindness makes him question his own attitudes. Combine repeated details.", "mode": "Apply the method", "hint": "Find examples of how he thinks about and treats people. Which examples show the same idea? Explain how the ending connects to them.", "check": "Did I explain his self-reflection using relevant events?"}, {"id": "transfer", "title": "新材料：<span class=\"qkey\">为什么<\/span>“我”<span class=\"qkey\">原先准备责问他的话<\/span>，后来<span class=\"qkey\">说不出口了<\/span>？请结合<span class=\"qkey\">前后内容<\/span>说明。", "stage": 2, "eng": "New practice text, not an original exam question. Try independently. Word meanings and audio are available.", "answer": "“我”原以为阿杰拿走练习本是为了抄答案，想责问他。后来听到他请老师补批练习本，并看到他提醒自己看批注、提议一起请教，才明白他是在帮助自己订正。“我”意识到误会了他，因此不好意思再责问。", "ae": "He first suspects copying. Later evidence shows that Ajie is helping him. Recognising his misunderstanding explains why he feels unable to accuse Ajie.", "mode": "Independent practice", "hint": "", "check": "Did I explain the earlier belief, new evidence and changed response?"}], "transfer": "午休时，我看见阿杰从我的桌上拿走练习本，快步走出教室。我心想：“他一定又要抄我的答案！”我追到办公室门口，却听见他对老师说：“这本还没批改，刚才收作业时漏了。她下午要订正，麻烦您看看。”回教室后，他把练习本放回我的桌上，指着老师的批注说：“这里我也不懂，等会儿一起问老师吧。”我原先准备责问他的话，忽然说不出口了。", "version": "2026-09-reading-v7", "reading": [["Who helps whom into the taxi? What does “I” see, and what does he imagine?", "Find the two people in the long final sentence. First identify who needs help and who gives it. Then consider why “竟然” is used."], ["What does Mother ask the driver to do? How does “I” respond?", "Follow who is speaking. “麻烦” here introduces a polite request; it does not describe a troublesome person."], ["What does the driver do? What meaning does “I” give it? Whose judgement is this?", "Separate what is observed from what is believed. Look at words such as “大概”, “一定” and “应该……吧”. Sounding certain does not prove a belief is true."], ["What happens first? What does “I” think, feel and want to do next?", "Follow event → thought → feeling → intended action. Read the last “但是” carefully: wanting to do something is not the same as doing it."], ["Follow the money: what does each person do with it? What else does the driver do?", "Follow the action verbs in order. Who is doing each action? Notice “却”: what happens differently from what you might expect?"], ["What new information do we learn? Which earlier event does it help explain?", "Separate the driver’s words from the narrator’s response. Go back to the earlier event and check whether the new information changes its meaning."], ["Why does the ending move from the body to the heart? Which earlier details help explain this?", "Who is reflecting on himself? Read “不是……其实是……” as a contrast. Explain it using this character’s experience, not a general judgement about illness."], ["Choose one event. How does later information change your understanding of it?", "Say it to a partner: At first, “I” thinks ____. Later, he learns ____. This changes how he understands ____."]], "tested": {"可想而知": "q47a", "乌云密布": "q47a", "暖流": "q47b", "眼眶开始模糊": "q47b"}}</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('data').textContent),KEY='hwt-taxi-workshop-v6';
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s)),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={stage:0,paragraph:0,question:0,work:{},help:[],uiVersion:7},readableStorage=true,showOriginal=false;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.work&&Array.isArray(saved.help)){S={...S,...saved};if(saved.uiVersion!==7){S.stage=[0,1,2].includes(saved.stage)?saved.stage:1;for(const w of Object.values(S.work)){if(typeof w.revision==='string'&&w.revision.trim()){w.legacyDraft=w.draft;w.draft=w.revision;}}S.uiVersion=7;}}}catch(e){readableStorage=false;}
S.stage=[0,1,2].includes(S.stage)?S.stage:0;S.paragraph=Number.isInteger(S.paragraph)&&S.paragraph>=0&&S.paragraph<=7?S.paragraph:0;S.question=Number.isInteger(S.question)&&S.question>=0&&S.question<5?S.question:0;
function work(id){return S.work[id]||(S.work[id]={draft:'',first:null,revealed:false,hints:0});}
function save(){if(!readableStorage){$('#saveStatus').textContent='Saved data could not be read. Copy your answers before closing.';$('#saveStatus').className='small error';return;}try{localStorage.setItem(KEY,JSON.stringify(S));$('#saveStatus').textContent='Saved on this device · Not sent to teacher';$('#saveStatus').className='small';}catch(e){$('#saveStatus').textContent='Not saved. Keep this page open and copy your answers.';$('#saveStatus').className='small error';}}
function log(type,extra={}){S.help.push({type,...extra,stage:S.stage,time:new Date().toISOString()});save();}
let speechToken=0,activeUtterance=null;
function stop(){speechToken++;if('speechSynthesis'in window)speechSynthesis.cancel();activeUtterance=null;}
function speak(text,lang='en-SG'){stop();const token=speechToken;if(!('speechSynthesis'in window)){$('#audioStatus').textContent='Audio unavailable. Please use the text explanation.';return;}$('#audioStatus').textContent='';const chunks=text.match(/[^。！？.!?]+[。！？.!?]?/g)||[text];let n=0;function next(){if(token!==speechToken||n>=chunks.length)return;const u=new SpeechSynthesisUtterance(chunks[n++]);u.lang=lang;u.rate=lang.startsWith('zh')?.82:.92;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase()===lang.toLowerCase())||voices.find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2)))||null;activeUtterance=u;u.onend=next;u.onerror=e=>{if(token===speechToken&&e.error!=='canceled'&&e.error!=='interrupted')$('#audioStatus').textContent='Audio could not play. Please use the text explanation.';};speechSynthesis.speak(u);}next();}
function audio(text,lang='en-SG',label='Listen'){return `<button class="audio" data-say="${esc(text)}" data-lang="${lang}">▶ ${label}</button>`;}
function explain(text){return `<div class="explain"><p lang="en">${esc(text).replace(/[\u3400-\u9fff]+/g,x=>`<span class="kai">${x}</span>`)}</p>${audio(text)}</div>`;}
function words(text){const found=Object.keys(D.vocab).filter(w=>text.includes(w));return found.length?`<details class="wordlist"><summary>Words</summary><div class="words">${found.map(w=>`<button class="word" data-word="${esc(w)}">${esc(w)}</button>`).join('')}</div></details>`:'';}
const targets=['可想而知，此时我的脸一定是乌云密布。','一股暖流流进我的内心，我的眼眶开始模糊。'];
function passage(){const isNew=S.stage===2&&!showOriginal;$('#passageTitle').textContent=isNew?'新编短文':'完整篇章';$('#switchText').hidden=S.stage!==2;$('#switchText').textContent=showOriginal?'New practice text':'Original text';$('#passage').innerHTML=(isNew?[D.transfer]:D.paras).map((p,i)=>{let text=esc(p);targets.forEach(t=>text=text.replace(esc(t),`<span class="target">${esc(t)}</span>`));return `<section class="para ${!isNew&&S.stage===0&&S.paragraph===i?'focus':''}" id="p${i+1}"><div class="row parahead"><span>${isNew?'New practice':'¶ '+(i+1)}</span>${audio(p,'zh-CN','Read aloud')}</div><p>${text}</p>${words(p)}</section>`;}).join('');}
function renderRead(){const i=S.paragraph,[prompt,help]=D.reading[i];return `<section class="card"><div class="row steps" aria-label="Paragraphs">${D.reading.map((_,j)=>`<button class="step" data-para="${j}" aria-current="${i===j}">${j<7?j+1:'Connect'}</button>`).join('')}</div><h2>${i<7?'Paragraph '+(i+1):'Connect the text'}</h2>${explain(prompt)}<p class="small">Think, point to the text, or tell a partner. No typing needed here.</p>${audio('Think, point to the text, or tell a partner. No typing needed here.')}<details id="readHelp"><summary>Hint</summary>${explain(help)}${i===0?'<p class="frame">一个……的年轻人，竟然要一个……的老妇人……</p>':''}</details>${i===7?'<p class="frame">原来以为……后来得知……</p>':''}<div class="row footer"><button id="prevPara" ${i===0?'disabled':''}>← Back</button><button id="nextPara" class="primary">${i===7?'Start questions →':'Next →'}</button></div></section>`;}
function plain(s){const el=document.createElement('div');el.innerHTML=s;return el.textContent;}
function currentTask(){return S.stage===2?D.tasks.find(t=>t.id==='transfer'):D.tasks.filter(t=>t.stage===1)[S.question];}
function model(t){return `<h2 class="kai">参考答案</h2><div class="answer">${esc(t.answer)}</div>${audio(t.answer,'zh-CN','Read answer')}<h2 class="section-label">How to form the answer</h2>${explain(t.ae)}${explain(t.check+' Compare meanings, then edit your answer in the same box. Your teacher checks correctness.')}${words(t.answer)}`;}
function renderAnswer(){const t=currentTask(),w=work(t.id);const nav=S.stage===1?`<div class="row steps" aria-label="Questions">${D.tasks.filter(x=>x.stage===1).map((x,i)=>`<button data-question="${i}" aria-current="${i===S.question}">${x.id.toUpperCase().replace('Q47A','Q47(a)').replace('Q47B','Q47(b)')}</button>`).join('')}</div>`:'';return `<article class="card" id="${t.id}">${nav}<p class="section-label">${t.mode}</p><h3>${t.title}</h3>${audio(plain(t.title),'zh-CN','Read question')}${words(plain(t.title))}${explain(t.eng)}${t.hint?`<details id="hint"><summary>Hint</summary>${explain(t.hint)}${t.id==='q48'?'<p class="frame">他是一个……的人。当……，他……，这说明……。</p>':''}</details>`:''}<label for="answer">答案 / Your answer</label><textarea id="answer" placeholder="Write your understanding. You can copy relevant text and edit it here.">${esc(w.draft||'')}</textarea><p id="answerStatus" class="status"></p><button id="reference" class="primary">查看参考答案 / Reference</button><div id="feedback" class="feedback" role="status"></div><section id="model" class="model" hidden></section><div class="row footer">${S.stage===1?`<button id="prevQ" ${S.question===0?'disabled':''}>← Back</button><button id="nextQ">${S.question===4?'New practice →':'Next →'}</button>`:''}</div></article>`;}
function updateStatus(){if(S.stage===0)return;const w=work(currentTask().id),attempt=/[\p{L}\p{N}]/u.test(w.draft||'');$('#answerStatus').textContent=w.revealed?(w.first&&w.draft!==w.first.answer?'Edited after reference · Not graded':'Reference viewed · Not graded'):attempt?'Attempt written · Not graded':'Not answered';}
function render(){stop();passage();$('#main').innerHTML=S.stage===0?renderRead():renderAnswer();$$('[data-stage]').forEach(b=>b.setAttribute('aria-current',+b.dataset.stage===S.stage));if(S.stage===0){$('#prevPara').onclick=()=>moveParagraph(S.paragraph-1);$('#nextPara').onclick=()=>S.paragraph===7?stage(1):moveParagraph(S.paragraph+1);$('#readHelp').ontoggle=e=>{if(e.target.open)log('reading-hint',{paragraph:S.paragraph+1});};}else{const t=currentTask(),w=work(t.id);$('#answer').oninput=e=>{w.draft=e.target.value;w.updatedAt=new Date().toISOString();save();updateStatus();};$('#reference').onclick=()=>{if(!$('#model').hidden){$('#model').hidden=true;$('#reference').textContent='查看参考答案 / Reference';stop();return;}if(!/[\p{L}\p{N}]/u.test(w.draft||'')){$('#feedback').innerHTML=explain('Write your own attempt first. It need not be correct.');return;}if(!w.first)w.first={answer:w.draft,time:new Date().toISOString(),help:JSON.parse(JSON.stringify(S.help))};w.revealed=true;w.lastReferenceAt=new Date().toISOString();$('#model').innerHTML=model(t);$('#model').hidden=false;$('#reference').textContent='收起参考答案 / Hide';$('#feedback').innerHTML='';save();updateStatus();};if($('#hint'))$('#hint').ontoggle=e=>{if(e.target.open){w.hints=(w.hints||0)+1;log('question-hint',{task:t.id,beforeFirst:!w.first});}};if(S.stage===1){$('#prevQ').onclick=()=>question(S.question-1);$('#nextQ').onclick=()=>S.question===4?stage(2):question(S.question+1);}updateStatus();}save();}
function focusParagraph(){const el=$('#p'+(S.paragraph+1)),pane=$('#passagePane');if(el)pane.scrollTop=Math.max(0,el.offsetTop-pane.offsetTop-12);}
function moveParagraph(n){S.paragraph=Math.max(0,Math.min(7,n));render();focusParagraph();}
function question(n){S.question=Math.max(0,Math.min(4,n));render();}
function stage(n){S.stage=n;showOriginal=false;render();$('#passagePane').scrollTop=0;}
document.addEventListener('click',e=>{const a=e.target.closest('[data-say]');if(a){speak(a.dataset.say,a.dataset.lang);log('audio',{task:S.stage===0?'reading':currentTask().id});return;}const p=e.target.closest('[data-para]');if(p){moveParagraph(+p.dataset.para);return;}const q=e.target.closest('[data-question]');if(q){question(+q.dataset.question);return;}const w=e.target.closest('[data-word]');if(w)openWord(w.dataset.word);});
function openWord(word){stop();$('#wordTitle').textContent=word;const id=D.tested[word],locked=id&&!work(id).revealed;let zh,en;if(locked){zh='这是本题要解释的词句。先联系上下文尝试作答，查看参考答案后可读完整释义。';en='This expression is tested in '+id.toUpperCase()+'. Listen to its pronunciation and use the surrounding sentence. Try the question, then open its reference for the meaning.';}else [zh,en]=D.vocab[word];$('#wordBody').innerHTML=`<p>${esc(zh)}</p><p lang="en">${esc(en)}</p>`;$('#wordAudio').innerHTML=audio(word,'zh-CN','Word')+audio(zh,'zh-CN','中文解释')+audio(en,'en-SG','English');log('vocabulary',{word,locked,task:S.stage===0?'reading':currentTask().id});$('#wordDialog').showModal();}
$('#wordClose').onclick=()=>$('#wordDialog').close();$('#wordDialog').addEventListener('close',stop);$('#wordDialog').addEventListener('cancel',stop);$('#stopAudio').onclick=stop;$('#switchText').onclick=()=>{stop();showOriginal=!showOriginal;passage();$('#passagePane').scrollTop=0;};$$('[data-stage]').forEach(b=>b.onclick=()=>stage(+b.dataset.stage));$('#reset').onclick=()=>{if(confirm('只清除本学习单的答案和进度？\nClear answers and progress for this worksheet only?')){try{localStorage.removeItem(KEY);readableStorage=true;}catch(e){readableStorage=false;}S={stage:0,paragraph:0,question:0,work:{},help:[],uiVersion:7};showOriginal=false;render();}};window.addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});render();
</script></body></html>
