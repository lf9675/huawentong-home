<!doctype html><html lang="zh-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我为狮城做贡献 · 课堂投影</title><style>
@font-face{font-family:Kai;src:url(../../../shared/lesson-v1/wenkai.woff2)}@font-face{font-family:Song;src:url(../../../shared/lesson-v1/songti.woff2)}*{box-sizing:border-box}body{background:#102438;color:white;margin:0;font:19px/1.5 Song,serif}main{max-width:1400px;margin:auto;padding:16px}a,button,select{font:inherit;padding:10px;min-height:44px;margin:4px;border-radius:6px}a{color:white}#slide{position:relative;background:#f7f8f4;color:#173754;aspect-ratio:16/9;width:100%;container-type:inline-size;overflow:hidden}h2{position:absolute;left:6.1%;top:9.1%;width:87.8%;margin:0;font:700 3.44cqw/1.3 Song}#body{position:absolute;left:6.64%;top:26.4%;width:86.7%;margin:0;white-space:pre-line;font:3.125cqw/1.35 Kai}#picture{position:absolute;left:52%;top:27.8%;width:41.4%;height:54.2%;object-fit:contain}#body.with-image{width:40.6%}#notes{white-space:pre-line}#slide:fullscreen{width:100vw;height:100vh;max-height:100vh}select{max-width:95%}.toolbar{display:flex;flex-wrap:wrap;align-items:center}
</style></head><body><main><div class="toolbar"><a href="teacher.html">教师资料</a><button id="prev">上一页</button><button id="next">下一页</button><select id="jump" aria-label="选择投影片"></select><button id="full">全屏</button><span id="status" role="status"></span></div><section id="slide"><h2 id="title"></h2><p id="body"></p><img id="picture" alt="原有课文漫画" hidden></section><details><summary>教师提示</summary><p id="notes"></p></details><script src="slides-data.js?v=20261028"></script><script>
(()=>{const a=window.SLIDES_DATA,$=s=>document.querySelector(s);let i=Math.max(0,Math.min(a.length-1,(parseInt(location.hash.slice(1))||1)-1));a.forEach((x,n)=>{const o=document.createElement('option');o.value=n;o.textContent=(n+1)+' · '+x.title;$('#jump').append(o)});function draw(){const x=a[i];$('#title').textContent=x.title;$('#body').textContent=x.body;$('#body').classList.toggle('with-image',!!x.image);$('#picture').hidden=!x.image;if(x.image)$('#picture').src=x.image;$('#notes').textContent=x.notes;$('#status').textContent=(i+1)+' / '+a.length;$('#jump').value=i;$('#prev').disabled=i===0;$('#next').disabled=i===a.length-1;history.replaceState(null,'','#'+(i+1));}$('#prev').onclick=()=>{i=Math.max(0,i-1);draw()};$('#next').onclick=()=>{i=Math.min(a.length-1,i+1);draw()};$('#jump').onchange=e=>{i=+e.target.value;draw()};$('#full').onclick=()=>$('#slide').requestFullscreen?.();document.addEventListener('keydown',e=>{if(e.target.matches('select,button'))return;if(e.key==='ArrowRight')$('#next').click();if(e.key==='ArrowLeft')$('#prev').click()});draw()})();
</script></main></body></html>
