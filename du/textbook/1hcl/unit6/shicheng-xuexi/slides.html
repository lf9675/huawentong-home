<!doctype html><html lang="zh-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我为狮城做贡献 · 华文通</title><style>body{margin:0;background:#f1f7f6;color:#21353a;font:19px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif} main{max-width:960px;margin:auto;padding:25px}a,button{display:inline-block;color:#075c5a;padding:11px 17px;background:#e4f0ee;border:1px solid #9fc3bd;border-radius:9px;text-decoration:none;margin:5px}h1,h2{color:#184d52}section{background:white;padding:20px;margin:18px 0;border-radius:12px}p{margin:10px 0}img{max-width:100%}</style></head><body><main><p><a href="teacher.html">教师资料</a></p><h1>课堂投影</h1><section><div id="slide"></div><p id="status"></p><button id="prev">上一页</button><button id="next">下一页</button></section><script>fetch('slides.json').then(r=>r.json()).then(a=>{let i=0;const draw=()=>{let x=a[i];document.querySelector('#slide').innerHTML='';let h=document.createElement('h2'),p=document.createElement('p');h.textContent=x.title;p.textContent=x.body;p.style.whiteSpace='pre-line';document.querySelector('#slide').append(h,p);document.querySelector('#status').textContent=(i+1)+' / '+a.length;document.querySelector('#prev').disabled=i===0;document.querySelector('#next').disabled=i===a.length-1};document.querySelector('#prev').onclick=()=>{i=Math.max(0,i-1);draw()};document.querySelector('#next').onclick=()=>{i=Math.min(a.length-1,i+1);draw()};draw()});</script></main></body></html>
