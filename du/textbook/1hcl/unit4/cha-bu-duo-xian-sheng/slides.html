<!doctype html><html lang="zh-SG"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在线投影 · 华文通</title><link rel="stylesheet" href="../../../shared/lesson-v1/style.css"><link rel="stylesheet" href="lesson.css"><header class="site-header"><a href="../../../../../index.html#1/texts">华文通</a><span>中一高级华文 · 单元四 · 巩固</span></header><nav class="nav"><a class="btn" href="index.html">主页</a><a class="btn" href="reading.html">Read（读文）</a><a class="btn" href="comics.html">Comic（回读）</a><a class="btn" href="teacher.html">Teacher（教师）</a></nav><main><section class="paper" id="screen"><h1 id="slideTitle"></h1><div id="slideBody"></div><p id="page"></p><button id="prev">上一页</button><button id="next">下一页</button><details><summary>Teacher notes（教师提示）</summary><p id="notes"></p></details></section></main><style>#screen{min-height:78vh}#slideTitle{font-size:44px}#slideBody{font:38px/1.8 KaiTi,serif;white-space:pre-line}#page{font-size:28px}</style><script>const S=[{"title": "差不多先生", "body": "中一高级华文 · 单元四 · 巩固课文\n两课时：言行与后果、讽刺与主题"}, {"title": "只差一点，后果差多少？", "body": "十与千，只差一撇。\n8:30与8:32，只差两分钟。\n先说一说：哪些差别不能忽略？"}, {"title": "第一课 · 第1—5段", "body": "先读完整段落，再想问题。\n看他说什么、做什么、造成什么后果。"}, {"title": "1 · 人人皆晓", "body": "“人人皆晓，处处闻名”说明了什么？作者真的在介绍一个有名的人吗？", "notes": "教师示范。教参随段问题改编。先答再揭示。提示：注意“你一定见过他”。"}, {"title": "人人皆晓 · 核对", "body": "“人人皆晓”是人人都知道。作者借虚构的差不多先生，写生活中常见的一类人。", "notes": "接受符合原文的等义表达。“你一定见过他”把人物与读者生活联系起来。不能据此认定人物是真实名人。 常见误区：只给结论，没有结合原文。"}, {"title": "2 · 相貌与态度", "body": "差不多先生的相貌有什么特点？“差不多”是他的好习惯吗？", "notes": "学生独立。教参随段问题改编。先答再揭示。提示：找“有……但……”的转折。"}, {"title": "相貌与态度 · 核对", "body": "外貌与常人相近，但看、听、记都不用心。常说凡事差不多就好，反映敷衍、不认真的态度。", "notes": "接受符合原文的等义表达。区分生理能力与做事态度：课文不是说他没有眼睛耳朵或脑子小。 常见误区：只给结论，没有结合原文。"}, {"title": "3 · 买错糖", "body": "小时候妈妈叫差不多先生买红糖，他买了白糖回来。妈妈骂了他，他有什么反应？", "notes": "学生独立。教参随段问题改编。先答再揭示。提示：找妈妈骂他后的动作和话。"}, {"title": "买错糖 · 核对", "body": "他摇着头，认为红糖和白糖差不多。错后没有认真反省。", "notes": "接受符合原文的等义表达。Direct Info：买错、摇头、反问。Inference：不重视实际差别。 常见误区：只给结论，没有结合原文。"}, {"title": "4 · 十与千", "body": "差不多先生在当铺工作时做错了什么？“急得骂他”与“笑嘻嘻”反映了怎样的态度差别？", "notes": "师生共构。教参随段问题改编。先答再揭示。提示：先找写错什么，再比较两人的反应。"}, {"title": "十与千 · 核对", "body": "他把“十”和“千”写错，害店里亏钱。掌柜重视损失，很着急；他却轻松地笑着辩解，仍不认真对待错误。", "notes": "接受符合原文的等义表达。字形只差一撇，数值却差一百倍。本文以态度的对比突出人物的不认真。 常见误区：只给结论，没有结合原文。"}, {"title": "5 · 两分钟", "body": "差不多先生为什么误船？“慢条斯理”“摇摇头”反映他怎样的态度？", "notes": "学生独立。教参随段问题改编。先答再揭示。提示：留意“重要”“迟了两分钟”“公司”。"}, {"title": "两分钟 · 核对", "body": "他慢条斯理地走到码头，迟到两分钟。他没有反省不守时，反而怪公司太认真，把误事看得很轻。", "notes": "接受符合原文的等义表达。“重要的事”与“慢条斯理”形成反差。摇头是在埋怨，并非承认错误。 常见误区：只给结论，没有结合原文。"}, {"title": "第二课 · 第6—8段", "body": "回顾前三件事，再读医病与结尾。\n注意：谁在称赞？作者怎样想？"}, {"title": "6 · 找错医生", "body": "家人找不着汪大夫，却把兽医王大夫请来了。差不多先生有没有发现请错人？为什么仍让他医治？结果怎样？", "notes": "学生独立。教参随段问题改编。先答再揭示。提示：找“知道”“但”“他想”。"}, {"title": "找错医生 · 核对", "body": "他知道找错了人。但病急、痛苦、焦急，等不得，又认为王大夫同汪大夫差不多，便让兽医试医。兽医用医牛的方法治他，不到一小时他就死了。", "notes": "接受符合原文的等义表达。请错人是家人的失误；明知不合适仍接受，才是他自己的判断。不能只归因于姓氏相近。 常见误区：只给结论，没有结合原文。"}, {"title": "7 · 到死没有醒悟", "body": "差不多先生临死前说的话说明了什么？“一个小时”是否必须刚好六十分钟？", "notes": "学生独立。教参随段问题改编。先答再揭示。提示：看临终是否仍说“何必太认真”。"}, {"title": "到死没有醒悟 · 核对", "body": "临死仍认为活人与死人差不多，说明至死不悟。“不到一个小时”指少于一小时，突出后果迅速，不能理解为恰好六十分钟。", "notes": "接受符合原文的等义表达。断断续续表现临死说话艰难。危害已经发生，他仍没有改变。 常见误区：只给结论，没有结合原文。"}, {"title": "8 · 称赞还是讽刺？", "body": "差不多先生死后，人们怎样评价他？你认为作者是否赞同？请找出依据。", "notes": "学生独立。教参随段问题改编。先答再揭示。提示：“很多人”与“亲爱的读者”是谁在说话？"}, {"title": "称赞还是讽刺？ · 核对", "body": "人们称赞他看得开、想得通、不计较。作者并不赞同：前文写他因不认真而丧命，末句反问读者，促使我们否定这种态度。", "notes": "接受符合原文的等义表达。先看结局，再辨别谁说“了不起”。别人评价不等于作者观点。作者用荒谬言行及严重后果进行讽刺。 常见误区：只给结论，没有结合原文。"}, {"title": "9 · 人物、详略与主题", "body": "差不多先生是一个怎样的人？请结合课文说明。再口头解释：为什么买糖略写，找错医生详写？", "notes": "学生独立。教参人物讨论＋课本“巩固练习”第二题。先答再揭示。提示：选择一件具体事情解释人物特点。"}, {"title": "人物、详略与主题 · 核对", "body": "他做事敷衍、至死不悟。例如明知来的是兽医，仍认为与医生差不多，结果丧命。买糖略写，从生活小事点出习惯；医病详写，突出不认真造成无法挽回的后果，深化主题。", "notes": "接受符合原文的等义表达。“急病”说明紧迫，但不能证明兽医与医生相同。人物题写特点、行为及解释。详略服务主题，不是所有事件平均写。 常见误区：只给结论，没有结合原文。"}, {"title": "10 · 仿写句子", "body": "仿写：好在王大夫同汪大夫也差不多，让他试试看吧。\n好在________，________。", "notes": "师生共构。课本“巩固练习”第一题。先答再揭示。提示：前半句写有利条件。"}, {"title": "仿写句子 · 核对", "body": "示例：好在我提前检查了书包，才没有把作业忘在家里。", "notes": "接受符合原文的等义表达。“好在”引出有利的条件，后半句说明因此能够怎样。只仿句式，不必赞同人物的错误判断。 常见误区：只给结论，没有结合原文。"}, {"title": "11 · 哪些事不能差不多？", "body": "你觉得生活中哪些事“差不多”就行，哪些事不可以“差不多”？说说你的理由。", "notes": "学生独立。课本“巩固练习”第三题。先答再揭示。提示：各选一件可以近似、必须准确的事。"}, {"title": "哪些事不能差不多？ · 核对", "body": "示例：不影响用途的包装颜色可以相近，因为不会造成明显损失。但药物剂量不能含糊，因为剂量错误可能危害健康。课文中人物把医生与兽医混同而丧命，说明越关乎安全与责任，越要核对准确。", "notes": "接受符合原文的等义表达。判断条件：是否涉及安全、规则、责任及明显后果。“可以差不多”也要说明限度，不能说所有小事都可敷衍。 常见误区：只给结论，没有结合原文。"}, {"title": "四件事，危害逐渐加重", "body": "买错糖：生活要求没有做到。\n记错账：造成钱财损失。\n误了船：耽误重要事情。\n找错医生：失去生命。"}, {"title": "详略为什么不同？", "body": "略写买糖：以小事点出习惯。\n详写医病：展开判断和严重后果。\n共同突出：敷衍会带来危害。"}, {"title": "独立答题框架", "body": "特点：他是怎样的人？\n依据：原文中他怎样做？\n解释：为什么这件事体现这个特点？"}, {"title": "开放题自检", "body": "两类事情都回答了吗？\n为什么可以近似或必须准确？\n例子怎样证明我的看法？"}, {"title": "课堂收束", "body": "今天我能区分人物、旁人与作者观点。\n我能用具体行为证明人物特点。\n完成订正，整理自己的词语本。"}];let i=Math.max(0,Math.min(S.length-1,Number(location.hash.slice(1)||1)-1));function show(){document.getElementById("slideTitle").textContent=S[i].title;document.getElementById("slideBody").textContent=S[i].body;document.getElementById("notes").textContent=S[i].notes||"";document.getElementById("page").textContent=(i+1)+" / "+S.length;location.hash=i+1}document.getElementById("prev").onclick=()=>{i=Math.max(0,i-1);show()};document.getElementById("next").onclick=()=>{i=Math.min(S.length-1,i+1);show()};document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")document.getElementById("next").click();if(e.key==="ArrowLeft")document.getElementById("prev").click()});show()</script></html>
