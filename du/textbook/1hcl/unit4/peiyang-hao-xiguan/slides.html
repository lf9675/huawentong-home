<!doctype html><html lang="zh-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在线投影 · 华文通</title><link rel="stylesheet" href="../../../shared/lesson-v1/style.css?v=20261023-habits-1"><link rel="stylesheet" href="lesson.css?v=20261023-habits-1"></head><body class=""><header class="site-header"><a href="../../../../../index.html#1/texts"><img src="../../../../../assets/huawentong-logo.png" alt="华文通"></a><span>中一高级华文 · 单元四 · 生活空间</span></header><nav class="nav"><a class="btn" href="index.html">课文主页</a><a class="btn" href="reading.html">互动学习</a><a class="btn" href="comics.html">漫画回读</a><a class="btn" href="teacher.html">教师资料</a></nav><main><h1>培养好习惯</h1><div class="actions"><button id="prev">上一页</button><select id="slideSelect" aria-label="选择投影片"></select><button id="next">下一页</button><button id="fullscreen">全屏</button></div><p id="counter"></p><div id="projector"><img id="slideImage" alt="当前投影片"></div><details><summary>教师备注</summary><p id="notes"></p></details></main><script src="slides-data.js"></script><script>(()=>{const D=window.SLIDES,$=id=>document.getElementById(id);let i=Math.max(0,Math.min(D.length-1,Number(location.hash.slice(1)||1)-1));$('slideSelect').innerHTML=D.map((s,n)=>'<option value="'+n+'">'+(n+1)+' · '+s.title+'</option>').join('');function draw(){const s=D[i];$('slideImage').src='slides/slide-'+String(i+1).padStart(2,'0')+'.png';$('slideImage').alt=s.title;$('slideSelect').value=i;$('counter').textContent=(i+1)+' / '+D.length;$('notes').textContent=s.notes;$('prev').disabled=i===0;$('next').disabled=i===D.length-1;history.replaceState(null,'','#'+(i+1))}$('prev').onclick=()=>{if(i)i--;draw()};$('next').onclick=()=>{if(i<D.length-1)i++;draw()};$('slideSelect').onchange=e=>{i=+e.target.value;draw()};$('fullscreen').onclick=()=>$('projector').requestFullscreen?.();document.addEventListener('keydown',e=>{if(e.target.matches('select,input,textarea'))return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});draw()})()</script></body></html>
