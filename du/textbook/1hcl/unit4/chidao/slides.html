<!doctype html><html lang="zh-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>迟到 · 在线投影 · 华文通</title><link rel="stylesheet" href="../../../shared/lesson-v1/style.css?v=20261026-cn2"><link rel="stylesheet" href="lesson.css?v=20261026-cn2"></head><body><header class="site-header"><a href="../../../../../index.html#1/texts"><img src="../../../../../assets/huawentong-logo.png" alt="华文通"></a><span>中一高级华文 · 单元四 · 核心课文</span></header><nav class="nav"><a class="btn" href="index.html">课文主页</a><a class="btn" href="reading.html">图文阅读</a><a class="btn" href="comics.html">漫画回读</a><a class="btn" href="teacher.html">教师资料</a></nav><main><div class="toolbar"><select id="slidePick" aria-label="选择课件页"></select><button id="fullscreen">全屏</button></div><section id="projector" class="slide-screen"><h1 id="slideTitle"></h1><div id="slideLayout"></div><p class="slide-footer" id="page"></p><div class="actions"><button id="prev">上一页</button><button id="next">下一页</button></div></section><details><summary>教师提示</summary><p id="notes"></p></details></main><script>const S=[{"title":"迟到","body":"中一高级华文 · 单元四\n核心课文\n\n爸爸为什么既严厉，\n又关心“我”？","image":"assets/panel-37.webp","notes":"用原有漫画导入。先让学生说看到的行动，不急于给人物定性。"},{"title":"今天的阅读目标","body":"按顺序说清发生了什么。\n用言行解释人物与心理。\n说明详略怎样突出父爱。","notes":"最终在人物题和开放题独立书面表达。"},{"title":"第一课 · 第1—14段","body":"读懂一段，再回答问题。\n图画帮助理解。\n答案回到原文找。","image":"assets/panel-05.webp","notes":"图文阅读15分钟，可按班级情况分段读。"},{"title":"1.1 · 迟到的恐惧","body":"为什么“我”每天都要带着恐惧的心情上学？","notes":"教参随段问题改编。教师示范。先答再翻页。提示：题目问的是“我”出门时担心什么。；第1段有处罚和同学反应两个线索。"},{"title":"迟到的恐惧 · 核对","body":"“我”有赖床的毛病，怕迟到后被罚站，还怕同学一个个望过来，觉得难堪。","notes":"依据：先找“很可能”和“同学们的眼光”，提取两个原因。这里不用猜测爸爸会怎样。\n核对要点：迟到会被罚站（1）；同学会注视自己，感到难堪（1）\n易错：只抄原句，没有回答题目。"},{"title":"1.2 · 雨天不肯起床","body":"为什么“我”赖在床上不起床？","notes":"教参随段问题改编。学生独立。先答再翻页。提示：除了下雨，还要找“我”预想的后果。；看“不但要被罚站，而且……”这一句。"},{"title":"雨天不肯起床 · 核对","body":"“我”怕迟到被罚站，又觉得雨天穿肥大的夹袄、不合脚的雨鞋，撑伞步行上学很不舒服，于是想逃避上学。","notes":"依据：把“不但……而且……”两面的原因连起来。不能只答下大雨，也不能只给“懒惰”一个标签。\n核对要点：怕迟到罚站（1）；雨天衣物鞋子不适、步行辛苦，想逃避（1）\n易错：只抄原句，没有回答题目。"},{"title":"2 · 向妈妈哀求","body":"妈妈叫“我”起床，“我”的反应是什么？\n\n从“哀求”和“吧”可以看出，“我”希望妈妈做什么？","notes":"教参随段问题改编。师生共构。先答再翻页。提示：先找动作，再读“我”说的话。；“今天晚了”是她提出请求的理由。"},{"title":"向妈妈哀求 · 核对","body":"“我”皱紧眉头，低声哀求，希望妈妈同意自己今天不上学。","notes":"依据：“哀求”是苦苦请求。“吧”让请求的语气较缓和。言语与动作都要结合当时目的来读。\n核对要点：答到题目所问的意思；依据与判断相符\n易错：只抄原句，没有回答题目。"},{"title":"一个字的命令 · 方法","body":"语言描写：人物说出口的话。短句和语气可以表现态度。","notes":"先解释概念，再回原句判断。"},{"title":"3.1 · 一个字的命令","body":"“硬着头皮”在文中是什么意思？\n\n为什么说“一个字的命令最可怕”？爸爸的哪些话能说明？","notes":"教参随段问题改编。师生共构。先答再翻页。提示：找爸爸说过的完整句子。；第6、8段一再催促，最后缩成一个字。"},{"title":"一个字的命令 · 核对","body":"“硬着头皮”指虽然害怕，仍勉强说话。爸爸反复催促，最后只说“起！”，语气短促、坚决，不容商量，因此让“我”害怕。","notes":"依据：先读语言，再判断语气。“起！”要联系前面“快起！快起！”及“晚了也得去！”来解释。\n核对要点：“硬着头皮”：害怕仍勉强去做（1）；命令短促坚决，不容商量（1）\n易错：只抄原句，没有回答题目。"},{"title":"爸爸气极了 · 方法","body":"动作描写：写人物怎样做。动作要联系当时情境来理解。","notes":"先解释概念，再回原句判断。"},{"title":"3.2 · 爸爸气极了","body":"第10段运用了哪一种人物描写？哪些字写出爸爸气极了？","notes":"教参随段问题改编。师生共构。先答再翻页。提示：找连续出现的动作。；比较“拿起”与“抄起”，再联系“爸爸气极了”。"},{"title":"爸爸气极了 · 核对","body":"这是动作描写。“拖”“抄”“抡”等动词，写出爸爸因“我”坚持不起床而非常生气，采取强硬行动。","notes":"依据：先找做了什么，再解释这些动作在当时表现什么。不能只答“生动形象”。\n核对要点：答到题目所问的意思；依据与判断相符\n易错：只抄原句，没有回答题目。"},{"title":"狼狈的小狗 · 方法","body":"比喻（simile）：借相似的事物说明样子或感受。这里写“我”像小狗。","notes":"先解释概念，再回原句判断。"},{"title":"4.1 · 狼狈的小狗","body":"“我像一只狼狈的小狗”用了什么修辞手法？有什么作用？\n\n爸爸让“我”第一次花钱坐车上学，可能是什么原因？","notes":"教参随段问题改编。学生独立。先答再翻页。提示：“像”把谁比作什么？；留意“挨打”“冒着大雨”，不要只写比喻名称。"},{"title":"狼狈的小狗 · 核对","body":"把“我”比作狼狈的小狗，生动地写出挨打后冒雨上学时可怜、难堪的样子。联系大雨和爸爸后来的关心，可推想他也不愿“我”淋雨受冻；这是推断，课文没有写出他的想法。","notes":"依据：先认清本体是“我”，再解释“狼狈”的状态。关于坐车的原因，要分清明说的事实与根据上下文作出的推断。\n核对要点：答到题目所问的意思；依据与判断相符\n易错：只抄原句，没有回答题目。"},{"title":"4.2 · 担忧与事实","body":"“我”为什么擦去眼角的泪痕？\n\n“我”虽然迟到了，为什么没有被罚站？","notes":"教参随段问题改编。学生独立。先答再翻页。提示：回看“怕……”和“这是因为……”。；第13段写同学，第14段直接说明免罚原因。"},{"title":"担忧与事实 · 核对","body":"“我”怕同学看到泪痕后嘲笑自己。没有被罚站，是因为下雨天迟到可以原谅。","notes":"依据：前一个问题问擦泪的目的，后一个问题问免罚的原因，两者不能混为一谈。\n核对要点：答到题目所问的意思；依据与判断相符\n易错：只抄原句，没有回答题目。"},{"title":"第二课 · 第15—19段","body":"听了老师的话，“我”想到了什么？\n爸爸来到学校，又做了什么？","image":"assets/panel-31.webp","notes":"先完成后段自读，再进入全文综合。"},{"title":"5.1 · 鼻子一酸","body":"听了老师的话，为什么“我”会鼻子一酸？","notes":"教参随段问题改编。学生独立。先答再翻页。提示：老师问的哪两件事与今天早晨有关？；联系“听爸妈的话”“有礼貌地道别”和早晨的冲突。"},{"title":"鼻子一酸 · 核对","body":"老师问是否听父母的话、早晨有没有礼貌地道别，让“我”想起早上赖床、不听劝的经历，感到羞愧、难过，所以鼻子一酸。","notes":"依据：这是一道心理推断题：老师问的话是依据，早晨的经历是联系，羞愧、难过是有依据的推断。原文写“泪水不至于流出来”，不要写成已经泪流满面。\n核对要点：老师的话勾起早晨不听劝的经历（1）；因此羞愧、难过（1）\n易错：只抄原句，没有回答题目。"},{"title":"心提到嗓子眼 · 方法","body":"夸张（hyperbole）：有意把程度说得很大或很小，突出强烈的感受。","notes":"先解释概念，再回原句判断。"},{"title":"5.2 · 心提到嗓子眼","body":"“我刚平静下来的心一下子又提到了嗓子眼！”这句话用了什么修辞手法？有什么作用？","notes":"教参随段问题改编。师生共构。先答再翻页。提示：先判断这是实际发生的身体变化吗。；联系“爸爸为什么追到学校来？”和早晨挨打的经历。"},{"title":"心提到嗓子眼 · 核对","body":"运用了夸张，突出“我”突然看见爸爸站在教室窗外时十分紧张、害怕，担心他又来责罚自己。","notes":"依据：“心提到嗓子眼”把紧张的感觉夸大，不是心脏真的移位。她此时还不知道爸爸来送衣服。\n核对要点：夸张（1）；突出见到父亲时极度紧张、害怕（1）\n易错：只抄原句，没有回答题目。"},{"title":"无声的关心 · 方法","body":"动作与心意：先找行为，再想这些行为回应了人物什么需要。","notes":"先解释概念，再回原句判断。"},{"title":"6.1 · 无声的关心","body":"第18段运用了哪一种人物描写？表现了爸爸怎样的心意？\n\n找出爸爸关心“我”的动作，加入完整原句。","notes":"教参随段问题改编。学生独立。先答再翻页。提示：从“打开”后面找一连串动作。；先找衣物，再看最后还给了什么。"},{"title":"无声的关心 · 核对","body":"通过动作描写表现关心：爸爸带来花夹袄，递给“我”，看着“我”穿上，又给“我”两个铜板。这些具体行动说明他在严格要求之外，也照顾女儿的实际需要。","notes":"依据：“没有说什么”不等于没有关心。不能只取“拿出”半句，要把递衣、看穿和给钱读完整。铜板的具体用途在本文没有明说。\n核对要点：动作描写（1）；送衣、看她穿上、给铜板等关心行为（1）；解释关心实际需要（1）\n易错：只抄原句，没有回答题目。"},{"title":"结尾的改变 · 方法","body":"首尾照应（opening and ending echo）：开头与结尾互相联系，突出人物前后的变化。","notes":"先解释概念，再回原句判断。"},{"title":"6.2 · 结尾的改变","body":"为什么从那以后，“我”每天都是等待校工开校门的学生之一？","notes":"教参随段问题改编。学生独立。先答再翻页。提示：比较第1段与第19段的行为。；开头担心迟到，结尾已经早到校门前。"},{"title":"结尾的改变 · 核对","body":"经历这件事后，“我”改掉了赖床的毛病，早早到校。结合爸爸的严格要求和后来的关心，可以理解“我”受到教育，感受到父亲的爱而发生改变。","notes":"依据：结尾明说的是行为改变。联系全文说明原因时，既看严厉要求，也看送衣送钱的关心，不要简单归结为“只要打就有效”。\n核对要点：答到题目所问的意思；依据与判断相符\n易错：只抄原句，没有回答题目。"},{"title":"7 · 爸爸是怎样的人","body":"爸爸是一个怎样的人？请结合课文内容说明。","notes":"教师补充：整合课本“爸爸的爱”图示。学生独立。先答再翻页。提示：分别想想家里和学校两处行为。；选出最能支持你所写特点的原句，再补一句解释。"},{"title":"爸爸是怎样的人 · 核对","body":"爸爸对女儿要求严格，同时关心、疼爱她。他坚持迟到也必须上学，说明重视她养成守时和负责的习惯；他又亲自送来夹袄，看她穿上，并给铜板，说明关心她的实际需要。","notes":"依据：特点要由学生自己概括，用行为证明，再解释行为与特点的关系。可接受“严中有爱”等有依据的等义表达。理解父爱，不等于所有管教方式都值得照搬。\n核对要点：严格及关爱两方面特点（各1）；两方面各有恰当行为与解释（各1）\n易错：只写“爸爸很好”太笼统；只列动作没有特点；只抓挨打而忽略送衣。"},{"title":"人物题的完整回答","body":"特点＋行为依据＋解释\n\n他做了什么？\n为什么这个行为能说明这个特点？","notes":"学生自己写特点。不得先展示形容词选项代替概括。"},{"title":"详略与主题 · 方法","body":"详写与略写：详写把重要言行写具体，略写简要交代。两者共同服务主题。","notes":"先解释概念，再回原句判断。"},{"title":"8 · 详略与主题","body":"理清文章的详略和主题的关系。","notes":"课本“阅读放大镜”第三题。师生共构。先答再翻页。提示：比较爸爸出场的两个部分与妈妈催起、上学过程。；把“写得多”与“为什么值得多写”分开回答。"},{"title":"详略与主题 · 核对（1）","body":"第5—11段详写爸爸催起、命令、责打，突出严格；第15—18段详写静默、见到爸爸和送衣送钱，突出内心变化与关心。第3—4段妈妈催起、第12—14段冒雨上学略写，用简洁叙述交代事情发展。","notes":"依据：详写不是因为事情比较热闹，略写也不是没有用。重点看哪些内容更能突出爸爸的严格和关心。课本表格把第14段列在前后两个范围里：课堂按过渡段理解，不强迫它只能属于一栏。\n核对要点：两处详写内容及对应作用（各1）；略写内容与交代作用（1）；回扣爸爸严中有爱（1）\n易错：只抄原句，没有回答题目。"},{"title":"详略与主题 · 核对（2）","body":"详略围绕“爸爸严中有爱”安排。","notes":"依据：详写不是因为事情比较热闹，略写也不是没有用。重点看哪些内容更能突出爸爸的严格和关心。课本表格把第14段列在前后两个范围里：课堂按过渡段理解，不强迫它只能属于一栏。\n核对要点：两处详写内容及对应作用（各1）；略写内容与交代作用（1）；回扣爸爸严中有爱（1）\n易错：只抄原句，没有回答题目。"},{"title":"句子的语气 · 方法","body":"陈述：述说一件事情，一般用句号。\n\n疑问：提出问题，一般用问号。","notes":"先解释概念，再回原句判断。"},{"title":"句子的语气 · 方法","body":"感叹：表达强烈感情，一般用感叹号。\n\n祈使（imperative）：表示请求、命令等，可用句号或感叹号。","notes":"先解释概念，再回原句判断。"},{"title":"9 · 句子的语气","body":"了解句子的语气。\n\n根据提示，改写句子。（先说给同桌听，再由教师核对。）","notes":"课本“阅读放大镜”第一题。师生共构。先答再翻页。提示：先判断是在述说、提问、感叹还是叫别人做事。；“快起！”是命令，“是爸爸……”表达突然发现时的强烈感情。"},{"title":"句子的语气 · 核对","body":"陈述是述说事情；疑问是提出问题；感叹表达强烈感情；祈使表示请求或命令。改写时要保留原意，并按目的调整语气词和标点。","notes":"依据：先学课本的四个例句，再练习。祈使句也能用感叹号，所以不能只看“！”就判作感叹语气。\n核对要点：答到题目所问的意思；依据与判断相符\n易错：只改标点却没有形成所需语气；把命令句都当成感叹句。"},{"title":"课本句式练习","body":"小飞昨天和小琪吵架了。（改成感叹的语气）","notes":"先口头回答，教师抽查。"},{"title":"句式练习 · 核对","body":"小飞昨天和小琪吵架了！可补合适的感叹语气词，保留人物、时间和事情。","notes":"接受保留原意、语气正确的等义表达。"},{"title":"课本句式练习","body":"赶快去把垃圾倒掉！（改成疑问的语气）","notes":"先口头回答，教师抽查。"},{"title":"句式练习 · 核对","body":"你能赶快去把垃圾倒掉吗？","notes":"接受保留原意、语气正确的等义表达。"},{"title":"课本句式练习","body":"我明天可以重新带一个鸡蛋吗？（改成陈述的语气）","notes":"先口头回答，教师抽查。"},{"title":"句式练习 · 核对","body":"我明天可以重新带一个鸡蛋。","notes":"接受保留原意、语气正确的等义表达。"},{"title":"10 · 怎样看待父母打孩子","body":"在父母管教孩子方面，华人有句俗话“打是疼，骂是爱”。你是怎样看待父母打孩子的？","notes":"课本“阅读放大镜”第四题。学生独立。先答再翻页。提示：先分清父母的用意与采取的方法。；选一个具体例子，解释它怎样支持你的看法。"},{"title":"怎样看待父母打孩子 · 核对（1）","body":"示例：我不赞同把打孩子当作表达爱的方式。父母希望孩子改正错误，但应让孩子理解原因并学会负责。课文中爸爸送衣、看“我”穿上、给铜板的行动，同样能让女儿感到关心。","notes":"依据：这是评价题，立场可以不同。评分看理由、例子及解释是否相连，不按赞同或反对给分。不要把“文中后来改掉坏习惯”直接推成“所有孩子都必须挨打”。\n核对要点：立场清楚（1）；理由成立（1）；例子具体相关（1）；解释例子怎样支持立场（1）\n易错：“因为父母爱孩子，所以打孩子就是对的”缺少对方法的判断；只讲故事不回扣。"},{"title":"怎样看待父母打孩子 · 核对（2）","body":"因此，爱与严格可以同时存在，也可以用沟通、明确要求和承担合理后果来教育孩子。","notes":"依据：这是评价题，立场可以不同。评分看理由、例子及解释是否相连，不按赞同或反对给分。不要把“文中后来改掉坏习惯”直接推成“所有孩子都必须挨打”。\n核对要点：立场清楚（1）；理由成立（1）；例子具体相关（1）；解释例子怎样支持立场（1）\n易错：“因为父母爱孩子，所以打孩子就是对的”缺少对方法的判断；只讲故事不回扣。"},{"title":"当堂检查与订正","body":"人物题：特点、依据、解释齐了吗？\n开放题：例子怎样支持理由？\n订正后保存记录，整理自己的词语。","notes":"不增加新短文或课后一周小测。"}];let n=Math.max(0,Math.min(S.length-1,(+location.hash.slice(1)||1)-1));const e=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let s=S[n];document.querySelector('#slideTitle').textContent=s.title;document.querySelector('#slideLayout').className='slide-layout'+(s.image?' with-image':'');document.querySelector('#slideLayout').innerHTML='<div class="slide-body">'+e(s.body)+'</div>'+(s.image?'<img src="'+s.image+'" alt="课文原漫画">':'');document.querySelector('#page').textContent=(n+1)+' / '+S.length;document.querySelector('#notes').textContent=s.notes||'';document.querySelector('#prev').disabled=n===0;document.querySelector('#next').disabled=n===S.length-1;document.querySelector('#slidePick').value=n;}document.querySelector('#slidePick').innerHTML=S.map((s,i)=>'<option value="'+i+'">'+(i+1)+' · '+e(s.title)+'</option>').join('');document.querySelector('#slidePick').onchange=e=>{n=+e.target.value;render()};document.querySelector('#prev').onclick=()=>{n=Math.max(0,n-1);render()};document.querySelector('#next').onclick=()=>{n=Math.min(S.length-1,n+1);render()};document.querySelector('#fullscreen').onclick=()=>document.querySelector('#projector').requestFullscreen?.();document.addEventListener('keydown',e=>{if(e.target.matches('select,input,textarea'))return;if(e.key==='ArrowRight'){n=Math.min(S.length-1,n+1);render()}if(e.key==='ArrowLeft'){n=Math.max(0,n-1);render()}});render();</script></body></html>
