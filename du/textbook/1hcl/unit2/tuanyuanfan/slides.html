解释。接受符合证据的等义答案，不以关键词数量或答案长度自动评分。", "任务7—9；开放题留足独立表达和比较的时间。", "先解释线索的功能，下一页才让学生填写本课的事物线索。线索的判断既看反复出现，也看能否连接各件事。", "七行都是内容概括。请学生读对应段落，填入同一个事物“团圆饭”；网页填写一次可同步检查七处。随后概括主题，再展示参考答案。", "结尾是期待，不是已确认的结果。", "严格沿用课本第42页分类。“年年有余”是强调的词语，不改分为特别名称。用法须结合语境。", "先完成课本两句标点练习，再显示讲解。网页允许点选应加引号的部分，不要求反复输入整句。", "规范标点：第二句的句号属于整个陈述句，在引号外。", "课本第43页读后说原题。认同、部分认同、不认同都可以；先独立回答，不先显示示范立场。", "框架为立场、理由、例子、回扣。理由可以从人的需要、现实限制或可能影响中选一个角度。不要求每个角度全部写。", "这是示范而非唯一立场。认同者可解释现实限制与表达心意的价值；不认同者可强调父母的具体情感需要，但不能无证据断定姐姐不孝。", "不让学生机械填“因为……所以……”却只重复观点。引导其解释需要、限制或影响。", "没有新短文或课后一周小测。词语复习按个人需要进行。词语本只在本机保存，可导出和导入备份；未匹配的词须补充释义。"];let n=1;const $=s=>document.querySelector(s);function show(){const h=Number(location.hash.slice(1));n=Number.isInteger(h)&&h>=1&&h<=32?h:1;$("#slide").src="slides/"+String(n).padStart(2,"0")+".webp?v=20261019-r3";$("#slide").alt="第"+n+"页："+TITLES[n-1];$("#jump").value=String(n);$("#counter").textContent=n+" / 32";$("#notes").textContent=NOTES[n-1];$("#prev").disabled=n===1;$("#next").disabled=n===32}function move(d){location.hash=String(Math.min(32,Math.max(1,n+d)))}$("#prev").onclick=()=>move(-1);$("#next").onclick=()=>move(1);$("#jump").onchange=e=>location.hash=e.target.value;$("#fullscreen").onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if($("#projector").requestFullscreen)await $("#projector").requestFullscreen();else $("#counter").textContent=n+" / 32 · 请横屏投影"}catch{$("#counter").textContent=n+" / 32 · 请横屏投影"}};document.addEventListener("keydown",e=>{if(["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName))return;if(e.key==="ArrowRight"){e.preventDefault();move(1)}if(e.key==="ArrowLeft"){e.preventDefault();move(-1)}});window.addEventListener("hashchange",show);show();</script></body></html>
