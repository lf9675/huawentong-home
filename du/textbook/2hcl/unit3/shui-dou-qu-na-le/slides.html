<!doctype html><html lang="zh-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水都去哪儿了 · 在线投影</title><style>
*{box-sizing:border-box}body{margin:0;background:#142b34;color:#fff;font-family:system-ui,sans-serif}header,nav,details{max-width:1280px;margin:auto;padding:10px 18px}header{display:flex;justify-content:space-between;gap:20px}a{color:#d4f0f7}button,select{font:inherit;min-height:46px;padding:8px 14px;background:#fff;color:#183942;border:0;border-radius:6px}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}select{max-width:min(100%,600px)}#screen{margin:auto;max-width:1280px;background:#fffcf6;display:flex;align-items:center;justify-content:center}#slide{display:block;width:100%;height:auto}#screen:fullscreen{max-width:none;background:#142b34;width:100vw;height:100vh}#screen:fullscreen img{width:100%;height:100%;object-fit:contain}details{line-height:1.8}summary{cursor:pointer;min-height:44px}#notes{white-space:pre-line}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #ffbc66;outline-offset:3px}@media(max-width:600px){header{font-size:14px}nav{gap:8px}#picker{width:100%}}
</style></head><body><header><span>中二高级华文 · 单元三 · 一课时</span><a href="teacher.html">返回教师资料</a></header><main><div id="screen"><img id="slide" src="slides/slide-01.png" alt="第1页：水都去哪儿了"></div><nav aria-label="课件翻页"><button id="prev">上一页</button><span id="count" aria-live="polite"></span><button id="next">下一页</button><select id="picker" aria-label="选择课件页"></select><button id="fullscreen">全屏</button></nav><details id="teacherNotes"><summary>教师提示</summary><p id="notes"></p></details><p style="max-width:1280px;margin:12px auto;padding:0 18px">左右方向键翻页；全屏时也可点画面左右两侧翻页。<a href="downloads/water-lesson.pptx" download>下载可编辑PPT</a></p></main><script>
const slides=[{"title": "水都去哪儿了", "notes": "导入3分钟。问：生活中哪些事情需要用水？先听两三个回答，不增加书面题。"}, {"title": "水对个人和国家同样重要吗？", "notes": "水维持个人的生命，也支持国家持续发展。\n教师示范：先圈“生命”和“国家”，再分别解释。"}, {"title": "两个对象，两层意思", "notes": "直接信息有两个对象：个人与国家。“重要因素”指影响发展的重要条件，不只是饮用水。"}, {"title": "我国的“四大水喉”指什么？", "notes": "课本《阅读放大镜》二（1）；点选为教师支架\n先问后揭。不要提前读出下一页答案。"}, {"title": "四种供水来源", "notes": "“四大水喉”指四种供水来源。作答必须列出四种，不能把储水设施或家庭用途当成水源。"}, {"title": "四种水源分别面临什么挑战？", "notes": "教参2.2：“四大水喉”挑战题；配对为教师支架\n师生共构，9分钟环节的一部分。"}, {"title": "保障供水也有困难", "notes": "新生水：生产成本昂贵。淡化水：消耗能源较多。进口水：受运输、天气干旱等因素影响。收集雨水：扩大集水区、增加蓄水池需占地，而我国土地有限。\n最后一项应补足：我国土地资源有限。"}, {"title": "全国每日用水需求", "notes": "教参2.2：每日用水需求引导题\n教材资料截至2017年6月，不是2026年现况。"}, {"title": "45%的整体是什么？", "notes": "家庭用水占45%，非家庭用水占55%。非家庭用水是家庭以外的用水，例如工厂、商场等的用水。\n先由学生完成点选，再揭示此页。例子为教师解释。"}, {"title": "家庭用水的比例（%）", "notes": "课本《阅读放大镜》二（2）；其余口头追问来自教参2.2\n原数据：洗澡29%、冲马桶17%、处理食物16%、洗衣15%、洗手洗脸12%、清洗餐具7%、其他4%。总和100%。原图改自PUB 2018—2019年家庭用水量调查。"}, {"title": "家庭用水排在前三位的是什么？", "notes": "课本《阅读放大镜》二（2）；其余口头追问来自教参2.2\n学生独立完成下拉排序；第二问口头回答。"}, {"title": "家庭用水的前三位", "notes": "按图中百分比比较，不能按生活经验猜测。29%大于25%，因此洗澡用水超过四分之一。这里的29%与上一图的45%，统计范围不同。"}, {"title": "每人每日平均用水量（公升）", "notes": "课本《阅读放大镜》二（3）（4）；数据取证为教师支架\n教材图中2000—2018年的数据及2030年目标。横轴只列这些年份，不把未显示的年份当成连续逐年证据。"}, {"title": "课本读图题", "notes": "课本《阅读放大镜》二（3）（4）；数据取证为教师支架\n8分钟环节：第一问点选，第二问独立书面概括，先答后看参考。"}, {"title": "读数要对准年份与单位", "notes": "先核对年份与单位，再概括整个时段的变化。141公升是2018年的数据，130公升是2030年的目标，不能写成已经达到。图中没有每一年的数据，不能断言年年都下降。\n不能把143（2017年）或130（目标）写成2018数据。"}, {"title": "用数据支持趋势概括", "notes": "2018年是141公升。教材图中，2000—2018年我国每人每日平均用水量呈下降趋势，从165公升降至141公升；2030年130公升是目标。\n独立回答后比较：对象、时段、方向、两个数据。未写目标不应抹去已正确回答的趋势。"}, {"title": "为什么说“每滴水都来之不易”？", "notes": "教参2.2：结尾引导题\n师生共构。不要求额外文字作答。"}, {"title": "限制与“来之不易”的关系", "notes": "因为取得和储存水需要投入成本、能源、土地等资源，进口水还受运输、干旱等因素影响。水虽然能从水龙头流出，保障供水却不容易。\n开源：拓展水源；节流：减少不必要的用水。"}, {"title": "用课文词语替换画线部分（1—3）", "notes": "课本《阅读放大镜》一（1）—（5）\n完整原句与学习单一致。先在学习单做五题，答案页再揭示。"}, {"title": "词语替换（1—3）", "notes": "替换后要保持原句意思。艰巨强调任务困难而繁重；昂贵说价格高；消耗与体力、能源等搭配；干旱指降雨不足而缺水；趋势指发展的方向。"}, {"title": "用课文词语替换画线部分（4—5）", "notes": "课本《阅读放大镜》一（1）—（5）\n完整原句与学习单一致。"}, {"title": "词语替换（4—5）", "notes": "替换后要保持原句意思。艰巨强调任务困难而繁重；昂贵说价格高；消耗与体力、能源等搭配；干旱指降雨不足而缺水；趋势指发展的方向。"}, {"title": "课本：网上搜一搜", "notes": "课本《阅读放大镜》三；资料来源PUB官方网页与地图\n点击教师页的PUB资料和地图。两三人一组，按区域指认，全班汇总。\nhttps://www.pub.gov.sg/Public/WaterLoop/OurWaterStory/Local-Catchment-Water\nhttps://www.pub.gov.sg/-/media/PUB/SG-Water-Loop/localcatchmentwater/Reservoir_Blue_Map_SG.png"}, {"title": "PUB资料：17个蓄水池", "notes": "PUB资料列出17个蓄水池，分布在中央、北部／东北部、西部、东部、南部市区及东北外岛。请结合官方地图核对全部名称与位置。\n中央：MacRitchie、Lower Peirce、Upper Peirce、Upper Seletar；北部／东北部：Kranji、Lower Seletar、Punggol、Serangoon；西部：Tengeh、Poyan、Murai、Sarimbun、Jurong Lake、Pandan；东部：Bedok；南部市区：Marina；东北外岛：Tekong。英文名称用于与官方地图对应。\nhttps://www.pub.gov.sg/Public/WaterLoop/OurWaterStory/Local-Catchment-Water\nhttps://www.pub.gov.sg/-/media/PUB/SG-Water-Loop/localcatchmentwater/Reservoir_Blue_Map_SG.png\n核对日期：2026年10月20日。"}, {"title": "我的节水建议（必做）", "notes": "教师补充必做开放题；回应课文结尾及教参实践活动方向\n独立写3—4句。接下来只给结构，不提前给具体建议。"}, {"title": "建议要说清“为什么”", "notes": "先提出具体建议，再解释原因，用数据或情境支持，最后说明做法怎样减少浪费。可以提出其他合理办法，示例不是唯一答案。不能凭空声称一定节省某个百分比。\n开放题由教师核对，不按关键词自动评分。"}, {"title": "开放题示例：针对洗澡用水", "notes": "示例：我建议家人缩短淋浴时间，并在涂肥皂时关水。因为教材图中洗澡占家庭用水的29%，是比例最高的用途。比如涂肥皂时不让水继续流，就能减少这段时间不必要的用水。这样能针对用水较多的地方减少浪费。\n示例不是唯一答案。不虚构可节省的精确百分比。"}, {"title": "对照、订正、留下记录", "notes": "建议具体可行；解释为什么；引用数据或具体情境；说明怎样减少浪费\n无新增出口题。用已有两项文字作答进行当堂检查。"}];
const $=s=>document.querySelector(s);let n=1;
$('#picker').innerHTML=slides.map((s,i)=>`<option value="${i+1}">${i+1}. ${s.title}</option>`).join('');
function render(){const v=Number(location.hash.slice(1));n=Number.isInteger(v)&&v>=1&&v<=slides.length?v:1;$('#slide').src=`slides/slide-${String(n).padStart(2,'0')}.png`;$('#slide').alt=`第${n}页：${slides[n-1].title}`;$('#count').textContent=`${n} / ${slides.length}`;$('#picker').value=n;$('#notes').textContent=slides[n-1].notes;$('#prev').disabled=n===1;$('#next').disabled=n===slides.length;$('#teacherNotes').open=false;}
function go(v){location.hash=String(Math.max(1,Math.min(slides.length,v)));render()}
$('#prev').onclick=()=>go(n-1);$('#next').onclick=()=>go(n+1);$('#picker').onchange=e=>go(+e.target.value);$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if($('#screen').requestFullscreen)await $('#screen').requestFullscreen();else $('#fullscreen').textContent='请使用浏览器全屏'}catch{$('#fullscreen').textContent='请使用浏览器全屏'}};
document.addEventListener('keydown',e=>{if(e.target.matches('select,input,textarea'))return;if(e.key==='ArrowRight'){e.preventDefault();go(n+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(n-1)}});$('#screen').onclick=e=>{if(document.fullscreenElement)go(n+(e.clientX<innerWidth/2?-1:1))};window.addEventListener('hashchange',render);render();
</script></body></html>
