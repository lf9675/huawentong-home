*{box-sizing:border-box}body{margin:0;background:#142b34;color:#fff;font-family:system-ui,sans-serif}header,nav,details{max-width:1280px;margin:auto;padding:10px 18px}header{display:flex;justify-content:space-between;gap:20px}a{color:#d4f0f7}button,select{font:inherit;min-height:46px;padding:8px 14px;background:#fff;color:#183942;border:0;border-radius:6px}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}select{max-width:min(100%,600px)}#screen{margin:auto;max-width:1280px;background:#fffcf6;display:flex;align-items:center;justify-content:center}#slide{display:block;width:100%;height:auto}#screen:fullscreen{max-width:none;background:#142b34;width:100vw;height:100vh}#screen:fullscreen img{width:100%;height:100%;object-fit:contain}details{line-height:1.8}summary{cursor:pointer;min-height:44px}#notes{white-space:pre-line}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #ffbc66;outline-offset:3px}@media(max-width:600px){header{font-size:14px}nav{gap:8px}#picker{width:100%}}
</style></head><body><header><span>中二高级华文 · 单元三 · 2—3课时</span><a href="teacher.html">返回教师资料</a></header><main><div id="screen"><img id="slide" src="slides/slide-01.png" alt="第1页：人类最糟糕的发明"></div><nav aria-label="课件翻页"><a href="#1">第一课</a><a href="#15">第二课</a><a href="#29">第三课</a><button id="prev">上一页</button><span id="count" aria-live="polite"></span><button id="next">下一页</button><select id="picker" aria-label="选择课件页"></select><button id="fullscreen">全屏</button></nav><details id="teacherNotes"><summary>教师提示</summary><p id="notes"></p></details><p style="max-width:1280px;margin:12px auto;padding:0 18px">左右方向键翻页；全屏时也可点画面左右两侧翻页。<a href="downloads/plastic-lesson.pptx" download>下载可编辑PPT</a></p></main><script>
const slides=[{"title": "人类最糟糕的发明", "notes": "导入：家里会留下多少塑料袋？买一次东西会用几个？听两三名学生回答，不另增书面任务。", "lesson": 1}, {"title": "第一段：“得奖”为什么加引号？", "notes": "教参2.2：第一段引号题\n教师示范先比较词语通常含义与本段语境。先问后揭。", "lesson": 1}, {"title": "“得奖”的特殊含义", "notes": "“得奖”通常是好事，但这里获评的是“最糟糕的发明”。引号表示特殊含义，带有反讽意味，突出这种发明产生的负面影响。\n不把引号一律解释成引用人物说话。", "lesson": 1}, {"title": "第二段：结合图表读趋势", "notes": "课本第二段图表旁注；其余追问来自教参2.2\n在学习单点取与趋势对应的原句。", "lesson": 1}, {"title": "全球塑料产量", "notes": "保留教材原图的曲线与绘图区，仅将坐标标签放大为可编辑文字。没有逐年原始数据，不制作虚假的精确年度序列。纵轴单位为百万吨，横轴为年份。局部下降可见。", "lesson": 1}, {"title": "趋势概括要保留对象与范围", "notes": "从二十世纪五十年代开始，全球塑料产量整体上升很快。\n塑料不等于塑料袋，全球不等于我国。“几乎直线上升”不表示每年增加。", "lesson": 1}, {"title": "第三段：为什么风靡全世界？", "notes": "教参2.2：塑料袋风靡题\n学生独立点选，不因数量醒目就把结果当原因。", "lesson": 1}, {"title": "广泛流行的原因", "notes": "因为一次性塑料袋廉价、卫生、方便和耐用，适合人们购物等日常需要，所以很快在世界各地流行。\n四项信息均来自第三段。2011年每分钟100万个是课文历史资料。", "lesson": 1}, {"title": "第四段：饼状图在说明什么？", "notes": "课本第四段旁注；图表信息追问来自教参2.2\n先读图表标题，再看类别及比例。", "lesson": 1}, {"title": "每次上超市使用多少个塑料袋", "notes": "教材引自新加坡环境理事会。五类为0个15%、不去超市3%、1—2个33%、3—5个35%、6个或以上14%，合计100%。保留“不去超市”，不擅自重算分母。", "lesson": 1}, {"title": "“至少3个”包括哪些人？", "notes": "饼状图说明的主要内容是什么？\n课文使用了饼状图中的哪些主要信息？除了这些主要信息，饼状图还提供了哪些信息？\n为什么要列举这些数字？\n提示最低界线是3，不是只取3—5那一类。", "lesson": 1}, {"title": "用两类数据说明“大约一半”", "notes": "饼状图呈现受访者每次上超市使用塑料袋的数量类别及比例。课文选用3至5个占35%，并由35%加14%得出至少3个占49%，即大约一半。图中还显示0个占15%、不去超市占3%、1至2个占33%。这些数字具体说明人们使用塑料袋的情况，用量很大；8.2亿个及相当于126个滨海湾花园的比较，让庞大的用量更容易理解。\n其余资料：0个15%；不去超市3%；1—2个33%。", "lesson": 1}, {"title": "为什么要列举这些数字？", "notes": "课本第四段旁注；图表信息追问来自教参2.2\n第一课独立写答：数字作用。可点取多句证据，写2—3句。", "lesson": 1}, {"title": "从数量，解释到表达作用", "notes": "本题书面解释建议4分：用量大1分；引用适切数量或比例1分；指出用面积作比较1分；解释比较帮助理解庞大数量1分。各点独立给分。图表点选单独记录。\n第一课末核对和订正。不能只答“具体准确”。", "lesson": 1}, {"title": "第二课：第五段的危害图", "notes": "课本第五段旁注；示意图作用题来自教参2.2\n先找不同去向，再配对后果。", "lesson": 2}, {"title": "危害一：焚烧后的烟尘与毒气", "notes": "焚烧产生有害烟尘和有毒气体，会污染空气；填埋的塑料垃圾不易腐烂、降解，会严重污染土壤；进入河流和海洋的塑料垃圾会被动物当成食物吞食，导致消化道堵塞而死亡。示意图把不同去向和相应危害放在同一画面，配合文字，让读者更直观地理解。\n教材说明的是塑料垃圾焚烧产生的有害物质及其污染风险；不扩展成所有现代设施排放均未经处理。", "lesson": 2}, {"title": "危害二：填埋后难以降解", "notes": "焚烧产生有害烟尘和有毒气体，会污染空气；填埋的塑料垃圾不易腐烂、降解，会严重污染土壤；进入河流和海洋的塑料垃圾会被动物当成食物吞食，导致消化道堵塞而死亡。示意图把不同去向和相应危害放在同一画面，配合文字，让读者更直观地理解。\n保留“也不一定”，不能推断满200年一定完全分解。", "lesson": 2}, {"title": "危害三：动物误食", "notes": "焚烧产生有害烟尘和有毒气体，会污染空气；填埋的塑料垃圾不易腐烂、降解，会严重污染土壤；进入河流和海洋的塑料垃圾会被动物当成食物吞食，导致消化道堵塞而死亡。示意图把不同去向和相应危害放在同一画面，配合文字，让读者更直观地理解。\n动物将水中的塑料垃圾当作食物，误食导致消化道堵塞，可能死亡。依据是教材说明，不只看漫画推断。", "lesson": 2}, {"title": "示意图为什么能帮助说明？", "notes": "你认为课文为什么要用示意图来说明塑料垃圾的危害？\n学生先口头解释，再揭下一页。", "lesson": 2}, {"title": "图把去向和危害对应起来", "notes": "把“塑料垃圾去哪里”和“造成什么危害”对应起来，再说图怎样帮助理解。保留“200年也不一定能腐烂、降解”的限定，不能写成恰好200年便完全分解。\n这些关系同时呈现，使危害更直观。“生动形象”四字本身不是完整作用。", "lesson": 2}, {"title": "第六段：怎样看出问题严重？", "notes": "课本第六段旁注及教参2.2\n第二课独立书面作答，允许累加两句原文。", "lesson": 2}, {"title": "两句证据，各自说明什么？", "notes": "课文指出，我国每年使用17.6亿个塑料制品，其中将近一半是在超市使用的塑料袋，说明使用量庞大。2017年，这些塑料制品绝大部分最终成为垃圾，仅6%再循环使用，说明回收比例很低。因此，大量使用加上少量回收，造成严重的塑料垃圾问题。\n课文还有“将近一半是在超市使用的塑料袋”。保留限定。", "lesson": 2}, {"title": "证据与结论之间的联系", "notes": "建议4分：17.6亿个及对象准确1分；说明用量大1分；2017年仅6%再循环或绝大部分成垃圾1分；解释大量使用而回收少造成垃圾多1分。各点独立给分。将近一半是可补充证据，不因漏答这一项清零。\n仅抄出数字可见定位；解释其意义才完成证据与判断的联系。", "lesson": 2}, {"title": "6%的对象与年份", "notes": "只抄第一句评价；只写回收率低而漏掉庞大用量；把6%说成当前塑料袋回收率。\n不要把这一数字写成2026年塑料袋的回收率。此页用于答后纠错。", "lesson": 2}, {"title": "第七段：其他国家的措施", "notes": "教师随段支架，为教参第八段比较题作准备\n这是第八段比较的随段支架，口头回答即可。", "lesson": 2}, {"title": "减用与改变材料", "notes": "征收塑料袋税，让消费者付费购买塑料袋，不提供塑料袋；此外，使用可降解材料制造塑料袋，以减少环境污染。\n不把可降解理解为在任何环境都立即消失。", "lesson": 2}, {"title": "第八段：本地做法有什么不同？", "notes": "课本第八段旁注及教参2.2\n让学生先点选，再口头说明比较理由。", "lesson": 2}, {"title": "课文特别写出的本地做法", "notes": "课文特别指出，我国许多机构采用宣传、教育和奖励等方式，鼓励国人购物时自备购物袋。收费则是两段都提到的做法。\n“不同”只限课文信息，不推出别国没有宣传教育。", "lesson": 2}, {"title": "第三课：第九段与开头的关系", "notes": "教参2.2结尾题；课本预习三\n先概括末段，再回看首段，不提前打乱逐段阅读。", "lesson": 3}, {"title": "结尾概括两面，并提出反思", "notes": "结尾概括塑料带来的便利和塑料袋造成的严重环境威胁，并提出对未来发明的反思。它呼应开头“最糟糕的发明”的评价，提醒人们在享受便利时也要考虑长远危害。以此为题能引起读者对这一反差的关注，并点明文章所说明的环境问题。\n第9段“然而”提示两面。", "lesson": 3}, {"title": "首尾呼应", "notes": "先概括末段，再回看开头。首尾呼应是内容相互照应，不是简单重复相同字词。题目是文中引用的评价，不代表对所有发明做了客观排名。\n首尾呼应（ending echoes the opening）。不只因两个词重复而判定。", "lesson": 3}, {"title": "为什么用“人类最糟糕的发明”为题？", "notes": "读课文，想一想本文为什么以“人类最糟糕的发明”为题目。\n保留课本预习三的问法。先口头答，后揭。", "lesson": 3}, {"title": "题目引起对便利与危害的关注", "notes": "结尾概括塑料带来的便利和塑料袋造成的严重环境威胁，并提出对未来发明的反思。它呼应开头“最糟糕的发明”的评价，提醒人们在享受便利时也要考虑长远危害。以此为题能引起读者对这一反差的关注，并点明文章所说明的环境问题。\n评价来自课文引述，不是独立核实的客观发明排名。", "lesson": 3}, {"title": "课文中有哪些图表？", "notes": "课本预习二。先请学生说，下一步再对照这页；通过全文图表回看核对。此页为讲评，不作为新评分任务。", "lesson": 3}, {"title": "课本预习：根据解释找词语", "notes": "课本预习一（1—5）\n五项按原序保留。已预习者只核对。", "lesson": 3}, {"title": "词语与意思对应", "notes": "价钱很便宜：廉价；独占、专卖：垄断；制止、控制：遏制；充满，到处都是：充斥；费尽心思：煞费苦心。\n每个词放回对应段落理解。", "lesson": 3}, {"title": "说明用语：先核对对象和关系", "notes": "保持原句所说明的对象与范围。25÷40=62.5%，因此超过二分之一；也可用能满足比较且正确的分数，但不能说超过三分之二。第三、四句原有“大约”，改写后仍须保留。\n在学习单“课本例句”可展开教材六个例句。每一形式都先示例，再操作。", "lesson": 3}, {"title": "改写练习一：趋势", "notes": "1. 由于天气干旱，这条河的水位越来越低。（有……的趋势）\n先口头改写，再在学习单点选。", "lesson": 3}, {"title": "趋势说明变化方向", "notes": "课本《阅读放大镜》一（1）。保留对象“这条河的水位”，变化方向是下降。", "lesson": 3}, {"title": "改写练习二：分数比较", "notes": "2. 这个班级的总人数是40人，其中女生有25人。（……超过……的几分之几）\n算清部分和整体的关系。", "lesson": 3}, {"title": "25人占40人的多少？", "notes": "课本《阅读放大镜》一（2）。也接受超过五分之三等正确改写；不能说超过三分之二。", "lesson": 3}, {"title": "改写练习三：百分比", "notes": "3. 根据我的调查，我们班同学的零用钱大约一半用于午餐。（……有百分之几……）\n不能省去“大约”。", "lesson": 3}, {"title": "比例改写仍需保留“大约”", "notes": "课本《阅读放大镜》一（3）。零用钱是这里的整体，不是同学人数。", "lesson": 3}, {"title": "改写练习四：面积比较", "notes": "4. 新加坡国家美术馆占地6万4000平方米，大约有9个足球场那么大。（……相当于……）\n沿用教材练习的陈述，不将其说成核实后的当前场馆资料。", "lesson": 3}, {"title": "用熟悉的面积帮助理解", "notes": "课本《阅读放大镜》一（4）。保留“大约”，用面积与面积比较。", "lesson": 3}, {"title": "开放回应：你认同吗？", "notes": "教师开放题，承接教参3.2“发明塑料袋的用意”“为何成为最糟糕的发明”的讨论\n必做。先独立想，再讨论，最后形成个人书面回应。", "lesson": 3}, {"title": "立场、理由、例子、回扣", "notes": "立场可以不同，重点是讲清“为什么”。说明发明满足什么需要、使用或处理带来什么后果，再用具体资料支持判断。不能只说“因为不好，所以最糟糕”。\n四个输入框为同一道开放题；不要只勾“已讨论”或只选立场。", "lesson": 3}, {"title": "示例：部分认同的理由", "notes": "我部分认同。塑料袋廉价、方便，解决了购物携带物品的需要；但大量使用和丢弃会造成长期污染。例如课文示意图说明，动物会误食流入河海的塑料垃圾，导致消化道堵塞。这个后果说明，我们不能只看发明带来的便利，还要减少不必要的使用并妥善处理废物。因此，我认为更应反思人们的使用和处理方式。\n仅在学生完成初答后显示。不是唯一立场。", "lesson": 3}, {"title": "例子要解释怎样支持看法", "notes": "建议4分：立场1分；解释合理1分；具体依据1分；解释依据与立场的联系1分。接受不同立场及等义表述。不给关键词自动分，不因不同意示例而扣分。\n允许认同或不认同，但需准确理解课文、合理解释。", "lesson": 3}, {"title": "当堂对照与订正", "notes": "无新短文，无一周测。教师核对三项书面回应。自动正确率只统计客观任务，不能代表全部阅读能力。", "lesson": 3}];
const $=s=>document.querySelector(s);let n=1;
$('#picker').innerHTML=slides.map((s,i)=>`<option value="${i+1}">${i+1}. ${s.title}</option>`).join('');
function render(){const v=Number(location.hash.slice(1));n=Number.isInteger(v)&&v>=1&&v<=slides.length?v:1;$('#slide').src=`slides/slide-${String(n).padStart(2,'0')}.png`;$('#slide').alt=`第${n}页：${slides[n-1].title}`;$('#count').textContent=`${n} / ${slides.length}`;$('#picker').value=n;$('#notes').textContent=slides[n-1].notes;$('#prev').disabled=n===1;$('#next').disabled=n===slides.length;$('#teacherNotes').open=false;}
function go(v){location.hash=String(Math.max(1,Math.min(slides.length,v)));render()}
$('#prev').onclick=()=>go(n-1);$('#next').onclick=()=>go(n+1);$('#picker').onchange=e=>go(+e.target.value);$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if($('#screen').requestFullscreen)await $('#screen').requestFullscreen();else $('#fullscreen').textContent='请使用浏览器全屏'}catch{$('#fullscreen').textContent='请使用浏览器全屏'}};
document.addEventListener('keydown',e=>{if(e.target.matches('select,input,textarea'))return;if(e.key==='ArrowRight'){e.preventDefault();go(n+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(n-1)}});$('#screen').onclick=e=>{if(document.fullscreenElement)go(n+(e.clientX<innerWidth/2?-1:1))};window.addEventListener('hashchange',render);render();
</script></body></html>
