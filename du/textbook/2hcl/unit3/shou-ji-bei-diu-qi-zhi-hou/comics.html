<!doctype html><html lang="zh-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机被丢弃之后 · 图文回读 · 华文通</title><link rel="stylesheet" href="../../../shared/lesson-v1/style.css?v=20261023-ipad-all1"><link rel="stylesheet" href="lesson.css?v=20261023-ipad-all1"></head><body><header class="site-header"><a href="../../../../../index.html#2/texts"><img src="../../../../../assets/huawentong-logo.png" alt="华文通"></a><span>中二高级华文 · 单元三 · 阅读巩固</span></header><main><nav class="actions"><a class="btn" href="index.html">课文主页</a><a class="btn" href="reading.html">互动学习</a></nav><h1>图文回读</h1><p>漫画辅助理解；回答问题时回到课文和图表核对。</p><div id="fullReading"></div><details><summary>查看四张完整原图</summary><img class="comic-full" src="assets/comic1.png" alt="原有漫画第1页"><img class="comic-full" src="assets/comic2.png" alt="原有漫画第2页"><img class="comic-full" src="assets/comic3.png" alt="原有漫画第3页"><img class="comic-full" src="assets/comic4.png" alt="原有漫画第4页"></details></main><script src="content.js?v=20261023-ipad-all1"></script><script>const L=window.LESSON,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names=['一','二','三','四','五','六','七','八','九'];function pic(n){const r=L.panelRects[n-1];return `<div class="panel panel-direct"><img src="${L.panelImages[n-1]}" alt="原有漫画第${n}格" width="${r[2]}" height="${r[3]}" loading="eager" decoding="async"></div>`}
function figure(f){if(!f)return '';let s='<h3>'+esc(f.title)+'</h3>';if(f.src){const r=f.rect;s+=`<div class="panel panel-direct"><img src="${f.directSrc}" alt="${esc(f.alt||f.title)}" width="${r[2]}" height="${r[3]}" loading="eager" decoding="async"></div>`}if(f.rows)s+='<table>'+f.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+(f.kind==='pie'&&typeof x==='number'?'%':'')+'</td>').join('')+'</tr>').join('')+'</table>';return s+'<p class="data-note">'+esc(f.note)+'</p>'}
document.querySelector('#fullReading').innerHTML=L.paragraphs.map((p,i)=>'<section class="paper"><h2>第'+names[i]+'段</h2><div class="workspace"><div><p class="source-text">'+esc(p)+'</p>'+figure(L.figures[i+1])+'</div><div>'+L.panels[i].map(pic).join('')+'</div></div></section>').join('');</script></body></html>
