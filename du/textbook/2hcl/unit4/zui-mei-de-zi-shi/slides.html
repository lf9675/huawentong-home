const slides=[{"title": "最美的姿势", "notes": "第一课读第1—5段，第二课读第6—10段。每课50分钟，四项书写任务，其他用口头、点选和取证。", "kind": "cover", "lesson": 1, "lines": ["中二高级华文 · 单元四 · 巩固阅读", "两课时：从自卑到自信", "一张照片，怎样让“我”重新看见自己？"]}, {"title": "拍照时，你会摆什么姿势？", "notes": "教参1.2导入。口头交流5分钟，不评价学生外貌，不要求展示个人照片。", "kind": "question", "lesson": 1, "lines": ["你拍照时最喜欢摆什么姿势？", "摆出什么姿势会让你有自信？为什么？", "只谈愿意分享的内容。"]}, {"title": "第一段 · 先分清人物的感受", "notes": "先读第一段完整原文。原文中的“我觉得”表明叙述者主观感受，不能据此断定同学的意图。", "kind": "question", "lesson": 1, "lines": ["“即使是别人不经意的一瞥……”", "“我觉得同学们的目光都落在……”", "无意的一眼，在“我”心里有多大影响？"]}, {"title": "比喻要说清具体作用", "notes": "概念先教后练。“像”字不一定单独决定修辞，要看有无用另一事物突出相似特点。", "kind": "concept", "lesson": 1, "lines": ["“声音像雷声” → 突出声音大。", "比喻（metaphor / simile）：写相似特点。", "找到比较对象，再解释特点与感受。"]}, {"title": "第一段 · 两个比喻有什么作用？", "notes": "课本第1段旁注；教参第1—2段\n教师示范。\n这一段的两个比喻句有什么作用？\n参考：把别人的一瞥比作射向自己的利箭，把被注视时的感受比作被烈日炙烤，生动地表现“我”觉得受伤、难受，非常在意别人的目光，内心敏感而自卑。\n解析：“利箭”突出受伤感，“烈日炙烤”突出被注视时的难受。两处写的是“我”的心理体验；不能据此断言同学故意伤害“我”。\n课堂建议4分：两个比喻各1分；受伤、难受的具体感受1分；敏感自卑、在意目光1分。只写“生动形象”不给作用分。\n常见误读：不把“我”的感受直接写成同学的实际意图。", "kind": "question", "lesson": 1, "lines": ["这一段的两个比喻句有什么作用？", "“射向我的利箭”", "“好像被烈日炙烤着”"]}, {"title": "两个比喻 · 从感受到心理", "notes": "课本第1段旁注；教参第1—2段\n教师示范。\n这一段的两个比喻句有什么作用？\n参考：把别人的一瞥比作射向自己的利箭，把被注视时的感受比作被烈日炙烤，生动地表现“我”觉得受伤、难受，非常在意别人的目光，内心敏感而自卑。\n解析：“利箭”突出受伤感，“烈日炙烤”突出被注视时的难受。两处写的是“我”的心理体验；不能据此断言同学故意伤害“我”。\n课堂建议4分：两个比喻各1分；受伤、难受的具体感受1分；敏感自卑、在意目光1分。只写“生动形象”不给作用分。\n常见误读：不把“我”的感受直接写成同学的实际意图。", "kind": "answer", "lesson": 1, "lines": ["一瞥像利箭 → 目光使“我”感到受伤。", "被注视像被炙烤 → 内心非常难受。", "共同表现：“我”敏感、自卑，在意目光。"]}, {"title": "第二段 · 没有信心的依据", "notes": "课本第2段旁注；教参第1—2段\n学生独立。\n从哪里可以看出“我”对自己的外表没有自信？\n参考：“我”用沉默和独来独往武装自己，害怕摄像头，认为怎样打扮也掩饰不了缺陷，并认定自己像丑小鸭一样永远不会变美。\n解析：先找行为，再找想法；不是因为不喜欢同学，而是因为否定自己的外表，害怕拍照暴露缺陷。\n按意义理解核对；接受有依据的等义表达。各意义单位独立给分。\n常见误读：只答不爱交朋友、不喜欢社交媒体；把丑小鸭不会变天鹅当作作者认同的真理。", "kind": "question", "lesson": 1, "lines": ["从哪里可以看出“我”对自己的外表", "没有自信？", "找行为，再找想法；可连续加入多句原文。"]}, {"title": "行为与想法，一起证明", "notes": "课本第2段旁注；教参第1—2段\n学生独立。\n从哪里可以看出“我”对自己的外表没有自信？\n参考：“我”用沉默和独来独往武装自己，害怕摄像头，认为怎样打扮也掩饰不了缺陷，并认定自己像丑小鸭一样永远不会变美。\n解析：先找行为，再找想法；不是因为不喜欢同学，而是因为否定自己的外表，害怕拍照暴露缺陷。\n按意义理解核对；接受有依据的等义表达。各意义单位独立给分。\n常见误读：只答不爱交朋友、不喜欢社交媒体；把丑小鸭不会变天鹅当作作者认同的真理。", "kind": "answer", "lesson": 1, "lines": ["行为：沉默、独来独往，害怕摄像头。", "想法：怎样打扮也掩饰不了缺陷。", "“丑小鸭”是“我”否定自己的看法。"]}, {"title": "仿写句子 · 先独立写一句", "notes": "课本巩固练习一；教参3.1\n学生独立。\n仿写句子。\n例：在我看来，丑小鸭就是丑小鸭，永远都成不了天鹅。\n在我看来，________就是________，________。\n参考：示例：在我看来，朋友就是愿意真诚相待的人，不会只凭外表评价别人。\n解析：“在我看来”提出个人看法，“就是”表现比较坚持的判断。仿用句式即可，不需要赞成原句中否定自己的想法。\n课堂建议2分：句式正确1分；意思完整、前后连贯1分。示例不是唯一答案。\n常见误读：只换词而语义不通；认为仿句必须延续“我永远不如人”的想法。\n第一课文字作答1。可仿用句式，不必赞同原句。", "kind": "question", "lesson": 1, "lines": ["例：在我看来，丑小鸭就是丑小鸭，\n永远都成不了天鹅。", "在我看来，________就是________，", "________。"]}, {"title": "仿句参考 · 表达自己的看法", "notes": "课本巩固练习一；教参3.1\n学生独立。\n仿写句子。\n例：在我看来，丑小鸭就是丑小鸭，永远都成不了天鹅。\n在我看来，________就是________，________。\n参考：示例：在我看来，朋友就是愿意真诚相待的人，不会只凭外表评价别人。\n解析：“在我看来”提出个人看法，“就是”表现比较坚持的判断。仿用句式即可，不需要赞成原句中否定自己的想法。\n课堂建议2分：句式正确1分；意思完整、前后连贯1分。示例不是唯一答案。\n常见误读：只换词而语义不通；认为仿句必须延续“我永远不如人”的想法。\n先收取学生句子再显示示例。", "kind": "answer", "lesson": 1, "lines": ["在我看来，朋友就是愿意真诚相待的人，", "不会只凭外表评价别人。", "“在我看来”＋判断＋相关说明"]}, {"title": "第三段 · 两种不同的心情", "notes": "课本第3段旁注；教参第3—7段\n学生独立。\n“我”和同学们的心情有什么不同？\n参考：同学们兴致勃勃，积极讨论和摆姿势；“我”却心情低落、害怕拍照，因为对自己的外表没有信心。\n解析：题目要比较双方，不能只答“我”害怕。用“却”连接两种不同心情；“沉到谷底”形容心情极度低落。\n按意义理解核对；接受有依据的等义表达。各意义单位独立给分。\n常见误读：只写一方；把低落解释成无聊；误加比赛或奖品。", "kind": "question", "lesson": 1, "lines": ["“我”和同学们的心情有什么不同？", "先说同学，再说“我”。", "用“却”连起两种心情。"]}, {"title": "期待拍照与害怕拍照", "notes": "课本第3段旁注；教参第3—7段\n学生独立。\n“我”和同学们的心情有什么不同？\n参考：同学们兴致勃勃，积极讨论和摆姿势；“我”却心情低落、害怕拍照，因为对自己的外表没有信心。\n解析：题目要比较双方，不能只答“我”害怕。用“却”连接两种不同心情；“沉到谷底”形容心情极度低落。\n按意义理解核对；接受有依据的等义表达。各意义单位独立给分。\n常见误读：只写一方；把低落解释成无聊；误加比赛或奖品。", "kind": "answer", "lesson": 1, "lines": ["同学：兴致勃勃，积极讨论和摆姿势。", "“我”：心沉到谷底，心情低落。", "区别源于“我”对自己的外表缺乏信心。"]}, {"title": "第四段 · 轮到“我”拍照", "notes": "原漫画第16格对应第4段。先读第4—5段完整原文，再观察画面帮助理解；答题以原句为准。", "kind": "comic", "lesson": 1, "panel": 16}, {"title": "第四、五段 · 反应与原因", "notes": "课本第4段旁注；教参第3—7段\n学生独立。\n轮到“我”拍照时，“我”有什么反应？为什么“我”会有这样的反应？\n参考：“我”慢吞吞地走上前，拘束地站着，心里慌乱，被同学注视时更加局促不安，脸红发烫，还沮丧地说自己没有美的姿势。因为“我”对外表没有信心，觉得无法掩饰缺陷，不知道怎样面对镜头和同学的注视。\n解析：反应要写行为、心理或神态；原因要联系第1—2段的自卑。教室安静与同学注视使“我”更紧张，但安静本身不能证明大家嘲笑“我”。\n课堂建议4分：两种不同反应各1分；外表缺乏信心1分；不知如何面对镜头或注视1分。反应与原因独立给分。只写“因为紧张”属于循环解释。\n常见误读：把同学安静当作嘲笑证据；把脸红解释为天气热；只重复“因为慌乱所以慌乱”。\n第一课文字作答2。", "kind": "question", "lesson": 1, "lines": ["轮到“我”拍照时，“我”有什么反应？", "为什么“我”会有这样的反应？", "先独立写，再比较。"]}, {"title": "反应与原因，要分开回答", "notes": "先让学生独立写答；需要时才提供此框架。要求反应＋原因，避免循环解释。", "kind": "concept", "lesson": 1, "lines": ["反应：做了什么？心里怎样？神态怎样？", "原因：为什么这样？联系前文哪一句？", "不能用“因为慌乱”解释“心里慌乱”。"]}, {"title": "反应参考 · 至少两种表现", "notes": "课本第4段旁注；教参第3—7段\n学生独立。\n轮到“我”拍照时，“我”有什么反应？为什么“我”会有这样的反应？\n参考：“我”慢吞吞地走上前，拘束地站着，心里慌乱，被同学注视时更加局促不安，脸红发烫，还沮丧地说自己没有美的姿势。因为“我”对外表没有信心，觉得无法掩饰缺陷，不知道怎样面对镜头和同学的注视。\n解析：反应要写行为、心理或神态；原因要联系第1—2段的自卑。教室安静与同学注视使“我”更紧张，但安静本身不能证明大家嘲笑“我”。\n课堂建议4分：两种不同反应各1分；外表缺乏信心1分；不知如何面对镜头或注视1分。反应与原因独立给分。只写“因为紧张”属于循环解释。\n常见误读：把同学安静当作嘲笑证据；把脸红解释为天气热；只重复“因为慌乱所以慌乱”。", "kind": "answer", "lesson": 1, "lines": ["慢吞吞走上前，拘束地站着。", "心里慌乱，更加局促不安，脸红发烫。", "沮丧地说：自己没有美的姿势。"]}, {"title": "原因参考 · 连接前文", "notes": "课本第4段旁注；教参第3—7段\n学生独立。\n轮到“我”拍照时，“我”有什么反应？为什么“我”会有这样的反应？\n参考：“我”慢吞吞地走上前，拘束地站着，心里慌乱，被同学注视时更加局促不安，脸红发烫，还沮丧地说自己没有美的姿势。因为“我”对外表没有信心，觉得无法掩饰缺陷，不知道怎样面对镜头和同学的注视。\n解析：反应要写行为、心理或神态；原因要联系第1—2段的自卑。教室安静与同学注视使“我”更紧张，但安静本身不能证明大家嘲笑“我”。\n课堂建议4分：两种不同反应各1分；外表缺乏信心1分；不知如何面对镜头或注视1分。反应与原因独立给分。只写“因为紧张”属于循环解释。\n常见误读：把同学安静当作嘲笑证据；把脸红解释为天气热；只重复“因为慌乱所以慌乱”。", "kind": "answer", "lesson": 1, "lines": ["对外表没有信心，觉得掩饰不了缺陷。", "不知道怎样面对镜头和同学的注视。", "别人的目光，让“我”更紧张。"]}, {"title": "教室为什么突然安静？", "notes": "课本第4段旁注；教参第3—7段\n学生独立。\n轮到“我”拍照时，“我”有什么反应？为什么“我”会有这样的反应？\n参考：“我”慢吞吞地走上前，拘束地站着，心里慌乱，被同学注视时更加局促不安，脸红发烫，还沮丧地说自己没有美的姿势。因为“我”对外表没有信心，觉得无法掩饰缺陷，不知道怎样面对镜头和同学的注视。\n解析：反应要写行为、心理或神态；原因要联系第1—2段的自卑。教室安静与同学注视使“我”更紧张，但安静本身不能证明大家嘲笑“我”。\n课堂建议4分：两种不同反应各1分；外表缺乏信心1分；不知如何面对镜头或注视1分。反应与原因独立给分。只写“因为紧张”属于循环解释。\n常见误读：把同学安静当作嘲笑证据；把脸红解释为天气热；只重复“因为慌乱所以慌乱”。\n教参补充原题，口头讨论，不增加打字。可推测大家把注意力转向“我”，不能断言嘲笑。", "kind": "question", "lesson": 1, "lines": ["轮到“我”拍照时，", "教室里为什么突然变得无比安静？", "同学的具体想法，原文写明了吗？"]}, {"title": "第一课 · 用已有答案自检", "notes": "第一课最后4分钟，对照已有回答并订正，整理收藏词语。不加新出口题。", "kind": "concept", "lesson": 1, "lines": ["比喻：有没有写出具体感受与心理？", "反应和原因：有没有分别说明？", "原文证据：有没有把“我觉得”当事实？"]}, {"title": "第二课 · 什么帮助“我”改变", "notes": "回顾前文3分钟。第二课两项书写为主题题和必做开放题。", "kind": "section", "lesson": 2, "lines": ["读第6—10段，按段落顺序思考。", "老师与同学做了什么？", "这些言行怎样影响“我”？"]}, {"title": "第六段 · 怎样理解老师的话", "notes": "课本第6段旁注；教参第3—7段\n学生独立。\n你如何理解“这个世界上每个人都有自己最美丽的姿势”这句话？\n参考：每个人都有值得自己骄傲、自信的一面；即使有不完美的地方，也能发现和展现自己的美。\n解析：老师先肯定“每个人”，再邀请大家帮宜欣设计姿势。句意不局限于一种拍照动作，也不是说人必须毫无缺陷。\n按意义理解核对；接受有依据的等义表达。各意义单位独立给分。\n常见误读：只解释拍照动作；说必须消除全部缺陷才能自信。", "kind": "question", "lesson": 2, "lines": ["你如何理解这句话？", "“这个世界上每个人都有自己", "最美丽的姿势。”"]}, {"title": "每个人都有可以自信的一面", "notes": "课本第6段旁注；教参第3—7段\n学生独立。\n你如何理解“这个世界上每个人都有自己最美丽的姿势”这句话？\n参考：每个人都有值得自己骄傲、自信的一面；即使有不完美的地方，也能发现和展现自己的美。\n解析：老师先肯定“每个人”，再邀请大家帮宜欣设计姿势。句意不局限于一种拍照动作，也不是说人必须毫无缺陷。\n按意义理解核对；接受有依据的等义表达。各意义单位独立给分。\n常见误读：只解释拍照动作；说必须消除全部缺陷才能自信。", "kind": "answer", "lesson": 2, "lines": ["即使有不完美，也有值得欣赏的地方。", "老师先肯定“每个人”，", "再请大家帮助宜欣找到美。"]}, {"title": "第七段 · 帮助变成具体行动", "notes": "原漫画第24格，老师为宜欣拍下照片。先读第7段动作；原文的左右手细节以文字为准。", "kind": "comic", "lesson": 2, "panel": 24}, {"title": "第七段 · 照片展的用意", "notes": "教参第3—7段引导题\n师生共构。\n你认为陈老师为什么提议办照片展？\n参考：从老师“展现最美的自己”的提议、肯定每个人都有美的一面，以及引导同学帮助宜欣，可推测她希望学生发现并欣赏自己的美，也学会欣赏和鼓励同学，增强信心。\n解析：这是一道推测目的题，要用老师说的话和做法支持。原文只写老师喜爱摄影，没有明确说照片展专为宜欣一人安排。\n口头核对：目的合理，且至少一项老师言行能支持；不计自动分。\n常见误读：断言老师为了比赛、宣传或只为宜欣办展；只说老师爱摄影而未联系言行。", "kind": "question", "lesson": 2, "lines": ["你认为陈老师为什么提议办照片展？", "联系照片展名称、老师说的话和做法。", "哪些是明写的信息？哪些是你的推测？"]}, {"title": "用言行支持对目的的推测", "notes": "教参第3—7段引导题\n师生共构。\n你认为陈老师为什么提议办照片展？\n参考：从老师“展现最美的自己”的提议、肯定每个人都有美的一面，以及引导同学帮助宜欣，可推测她希望学生发现并欣赏自己的美，也学会欣赏和鼓励同学，增强信心。\n解析：这是一道推测目的题，要用老师说的话和做法支持。原文只写老师喜爱摄影，没有明确说照片展专为宜欣一人安排。\n口头核对：目的合理，且至少一项老师言行能支持；不计自动分。\n常见误读：断言老师为了比赛、宣传或只为宜欣办展；只说老师爱摄影而未联系言行。", "kind": "answer", "lesson": 2, "lines": ["希望学生发现、展现自己的美。", "也学会欣赏、帮助和鼓励同学。", "这是有依据的推测，不能说只为宜欣办展。"]}, {"title": "第八段 · 为什么鼓掌", "notes": "课本第8段旁注；教参第8段\n学生独立。\n为什么同学们都鼓起掌来？\n参考：同学们觉得“我”的照片好看，也想通过赞美和掌声鼓励因外表而自卑的“我”，帮助“我”获得信心。\n解析：“照片多好看”“宜欣真美”是直接信息；结合此前的拘束、沮丧以及同学热心帮助，可理解掌声也含有鼓励。感动落泪是“我”的反应，不是鼓掌的起因。\n按意义理解核对；接受有依据的等义表达。各意义单位独立给分。\n常见误读：只答照片漂亮而漏掉鼓励；倒置为因为宜欣哭了才鼓掌。", "kind": "question", "lesson": 2, "lines": ["为什么同学们都鼓起掌来？", "同学先说了什么？", "联系前文，掌声还可能有什么用？"]}, {"title": "掌声 · 赞美与鼓励", "notes": "课本第8段旁注；教参第8段\n学生独立。\n为什么同学们都鼓起掌来？\n参考：同学们觉得“我”的照片好看，也想通过赞美和掌声鼓励因外表而自卑的“我”，帮助“我”获得信心。\n解析：“照片多好看”“宜欣真美”是直接信息；结合此前的拘束、沮丧以及同学热心帮助，可理解掌声也含有鼓励。感动落泪是“我”的反应，不是鼓掌的起因。\n按意义理解核对；接受有依据的等义表达。各意义单位独立给分。\n常见误读：只答照片漂亮而漏掉鼓励；倒置为因为宜欣哭了才鼓掌。", "kind": "answer", "lesson": 2, "lines": ["直接信息：同学觉得照片好看。", "结合前文：希望鼓励因外表而自卑的宜欣。", "感动落泪是反应，不能倒过来当鼓掌原因。"]}, {"title": "第九段 · 变化与原因", "notes": "教参第9—10段引导题\n学生独立。\n“我”后来发生什么变化？为什么“我”会发生这样的变化？\n参考：“我”找回信心和勇气，不再以沉默和独来独往保护自己，开始主动交流，并交了许多朋友。因为照片和同学们的肯定让“我”发现自己也可以很美，同学并不在意自己的缺陷，因而突破心防。\n解析：变化既包括心态，也包括行动；原因是照片与同学的肯定带来的自我认识改变。课文没有写脖子恢复正常。\n按意义理解核对；接受有依据的等义表达。各意义单位独立给分。\n常见误读：把外表缺陷消失当成变化原因；只说变开心，漏掉主动交流。", "kind": "question", "lesson": 2, "lines": ["“我”后来发生什么变化？", "为什么“我”会发生这样的变化？", "分别找心态、行动和促成变化的原因。"]}, {"title": "变化 · 从心态走向行动", "notes": "教参第9—10段引导题\n学生独立。\n“我”后来发生什么变化？为什么“我”会发生这样的变化？\n参考：“我”找回信心和勇气，不再以沉默和独来独往保护自己，开始主动交流，并交了许多朋友。因为照片和同学们的肯定让“我”发现自己也可以很美，同学并不在意自己的缺陷，因而突破心防。\n解析：变化既包括心态，也包括行动；原因是照片与同学的肯定带来的自我认识改变。课文没有写脖子恢复正常。\n按意义理解核对；接受有依据的等义表达。各意义单位独立给分。\n常见误读：把外表缺陷消失当成变化原因；只说变开心，漏掉主动交流。", "kind": "answer", "lesson": 2, "lines": ["照片与肯定 → 发现自己也可以很美。", "找回信心和勇气 → 突破心防。", "主动交流、结交朋友；没有脖子复原的情节。"]}, {"title": "第十段 · “姿势”的意思", "notes": "课本第10段旁注；教参第9—10段\n学生独立。\n这里“姿势”的意思和前面的一样吗？\n参考：不一样。前面的“姿势”指拍照时摆出的具体动作；结尾的“姿势”指每个人身上的优点，或值得骄傲、自信的一面。\n解析：结尾由宜欣的经历推广到“每个人”，从具体动作引出自信生活的道理。要说明前后两层意思，不能只说“不一样”。\n按意义理解核对；接受有依据的等义表达。各意义单位独立给分。\n常见误读：只说不一样；解释成托腮动作或掩饰缺陷。", "kind": "question", "lesson": 2, "lines": ["这里“姿势”的意思和前面的一样吗？", "先解释拍照时的“姿势”，", "再解释结尾的“姿势”。"]}, {"title": "从动作，写到人的优点", "notes": "课本第10段旁注；教参第9—10段\n学生独立。\n这里“姿势”的意思和前面的一样吗？\n参考：不一样。前面的“姿势”指拍照时摆出的具体动作；结尾的“姿势”指每个人身上的优点，或值得骄傲、自信的一面。\n解析：结尾由宜欣的经历推广到“每个人”，从具体动作引出自信生活的道理。要说明前后两层意思，不能只说“不一样”。\n按意义理解核对；接受有依据的等义表达。各意义单位独立给分。\n常见误读：只说不一样；解释成托腮动作或掩饰缺陷。", "kind": "answer", "lesson": 2, "lines": ["前面：拍照时摆出的具体动作。", "结尾：自身优点，或值得自信的一面。", "由宜欣一个人的经历，写到每个人。"]}, {"title": "关键句 · 先分清两种作用", "notes": "课本巩固练习二之前先解释概念。例句为教师补充。不要先公布本课关键句。", "kind": "concept", "lesson": 2, "lines": ["抒情句：直接表达情感。\n例：“多么令人高兴啊！”", "议论句：提出看法或道理。\n例：“真诚能帮助人建立友谊。”"]}, {"title": "课本巩固练习二 · 关键句与主题", "notes": "课本巩固练习二；教参3.2\n学生独立。\n找出课文中的关键句，结合内容理解文章的主题。\n分别找出抒情句、议论句，再写出这篇文章的主题。\n参考：抒情句：“原来，我也可以很美！”议论句：“其实，每个人或多或少都有不完美的地方。但是，我们都可以找到自己最美的姿势，都可以活得自信，活出精彩。”主题：每个人都有不完美之处，但能发现自己的优点，建立自信，活出精彩。宜欣在老师与同学的帮助和肯定下重拾信心，也体现欣赏和鼓励对他人的帮助。\n解析：抒情句直接表达欣喜，议论句提出道理。把“我”的拍照经历和改变与结尾道理连起来，不能只抄关键句便停下。\n课堂建议5分：抒情句1分；议论句完整意思1分；接纳不完美与发现优点1分；自信生活1分；联系经历说明1分。按意义而非固定句长；合理的其他抒情句由教师结合表达效果判断。\n常见误读：只抄关键句而没有概括主题；只说摆好动作便能变美；说得到赞美才有价值。\n第二课文字作答1。两个证据框可累加多句；主题不可只抄原文。", "kind": "question", "lesson": 2, "lines": ["找出课文中的关键句，", "结合内容理解文章的主题。", "找抒情句、议论句，再写主题与内容依据。"]}, {"title": "关键句参考", "notes": "课本巩固练习二；教参3.2\n学生独立。\n找出课文中的关键句，结合内容理解文章的主题。\n分别找出抒情句、议论句，再写出这篇文章的主题。\n参考：抒情句：“原来，我也可以很美！”议论句：“其实，每个人或多或少都有不完美的地方。但是，我们都可以找到自己最美的姿势，都可以活得自信，活出精彩。”主题：每个人都有不完美之处，但能发现自己的优点，建立自信，活出精彩。宜欣在老师与同学的帮助和肯定下重拾信心，也体现欣赏和鼓励对他人的帮助。\n解析：抒情句直接表达欣喜，议论句提出道理。把“我”的拍照经历和改变与结尾道理连起来，不能只抄关键句便停下。\n课堂建议5分：抒情句1分；议论句完整意思1分；接纳不完美与发现优点1分；自信生活1分；联系经历说明1分。按意义而非固定句长；合理的其他抒情句由教师结合表达效果判断。\n常见误读：只抄关键句而没有概括主题；只说摆好动作便能变美；说得到赞美才有价值。", "kind": "answer", "lesson": 2, "lines": ["抒情句：“原来，我也可以很美！”", "议论句：第10段的两句话。", "从“每个人或多或少都有不完美的地方”\n到“活得自信，活出精彩”。"]}, {"title": "主题参考 · 连接经历与道理", "notes": "课本巩固练习二；教参3.2\n学生独立。\n找出课文中的关键句，结合内容理解文章的主题。\n分别找出抒情句、议论句，再写出这篇文章的主题。\n参考：抒情句：“原来，我也可以很美！”议论句：“其实，每个人或多或少都有不完美的地方。但是，我们都可以找到自己最美的姿势，都可以活得自信，活出精彩。”主题：每个人都有不完美之处，但能发现自己的优点，建立自信，活出精彩。宜欣在老师与同学的帮助和肯定下重拾信心，也体现欣赏和鼓励对他人的帮助。\n解析：抒情句直接表达欣喜，议论句提出道理。把“我”的拍照经历和改变与结尾道理连起来，不能只抄关键句便停下。\n课堂建议5分：抒情句1分；议论句完整意思1分；接纳不完美与发现优点1分；自信生活1分；联系经历说明1分。按意义而非固定句长；合理的其他抒情句由教师结合表达效果判断。\n常见误读：只抄关键句而没有概括主题；只说摆好动作便能变美；说得到赞美才有价值。\n可补充欣赏和鼓励他人的价值，但不能取代核心自信主题。", "kind": "answer", "lesson": 2, "lines": ["每个人都有不完美之处，", "但可以发现自己的优点，自信生活。", "宜欣获得帮助和肯定，重拾信心并主动交友。"]}, {"title": "课本巩固练习三 · 必做", "notes": "课本巩固练习三；教参3.3\n学生独立。\n你觉得人们在结交朋友时，比较注重外在美还是内在美？为什么？\n参考：示例：我觉得人们建立长久友谊时，通常更看重内在美，因为真诚、体贴会让人感到被理解和支持。课文中甜甜热心地帮助宜欣，其他同学也真诚地称赞、鼓励她，宜欣因此敢于交流，交到朋友。这些行动体现内在美，能帮助建立信任，所以内在美对友谊更重要。\n解析：先回答你观察到的情况，再解释为什么。可以认为外在美影响初识，也可以认为内在美更影响长期相处，或提出其他有依据的看法；不因立场不同扣分。要解释例子如何支持观点。\n课堂建议4分：明确看法1分；合理理由1分；具体例证1分；例证与观点的联系1分。各点独立判断；主观题不自动评分。\n常见误读：只说“内在美比较重要，因为内在美好”；只举例不解释；只答自己应怎么做而未回应人们交友的情况。\n第二课文字作答2。题目问实际观察；先回应，再谈应有态度。", "kind": "question", "lesson": 2, "lines": ["你觉得人们在结交朋友时，", "比较注重外在美还是内在美？", "为什么？"]}, {"title": "理由要解释，例子要连接", "notes": "可讨论初识和长期相处的差别。两者都重视也可接受，但须回答比较关系或说明条件。", "kind": "concept", "lesson": 2, "lines": ["看法＋理由：比较看重什么？为什么？", "例子：哪个具体行为能说明？", "回扣：这个行为怎样影响友谊？"]}, {"title": "开放题示范 · 用课文说明", "notes": "课本巩固练习三；教参3.3\n学生独立。\n你觉得人们在结交朋友时，比较注重外在美还是内在美？为什么？\n参考：示例：我觉得人们建立长久友谊时，通常更看重内在美，因为真诚、体贴会让人感到被理解和支持。课文中甜甜热心地帮助宜欣，其他同学也真诚地称赞、鼓励她，宜欣因此敢于交流，交到朋友。这些行动体现内在美，能帮助建立信任，所以内在美对友谊更重要。\n解析：先回答你观察到的情况，再解释为什么。可以认为外在美影响初识，也可以认为内在美更影响长期相处，或提出其他有依据的看法；不因立场不同扣分。要解释例子如何支持观点。\n课堂建议4分：明确看法1分；合理理由1分；具体例证1分；例证与观点的联系1分。各点独立判断；主观题不自动评分。\n常见误读：只说“内在美比较重要，因为内在美好”；只举例不解释；只答自己应怎么做而未回应人们交友的情况。\n示例不是唯一立场，学生先答后显示。", "kind": "answer", "lesson": 2, "lines": ["我觉得长久友谊通常更看重内在美，\n因为真诚、体贴使人感到被理解。", "甜甜热心帮助宜欣，同学们鼓励她，\n使她敢于交流，交到朋友。", "这些行动帮助建立信任，\n说明内在美对友谊很重要。"]}, {"title": "对照、订正、留下记录", "notes": "第二课最后3分钟。不新增短文、课后一周小测或打卡。主观题由教师核对；个人词语本可跨课收藏。", "kind": "concept", "lesson": 2, "lines": ["主题：关键句与情节有没有连起来？", "开放题：有没有说清“为什么”？", "订正后，可从检查页导出学习记录。"]}];
const $=s=>document.querySelector(s);let n=1;
$('#picker').innerHTML=slides.map((s,i)=>`<option value="${i+1}">${i+1}. ${s.title}</option>`).join('');
function render(){const v=Number(location.hash.slice(1));n=Number.isInteger(v)&&v>=1&&v<=slides.length?v:1;$('#slide').src=`slides/slide-${String(n).padStart(2,'0')}.png`;$('#slide').alt=`第${n}页：${slides[n-1].title}`;$('#count').textContent=`${n} / ${slides.length}`;$('#picker').value=n;$('#notes').textContent=slides[n-1].notes;$('#prev').disabled=n===1;$('#next').disabled=n===slides.length;$('#teacherNotes').open=false;}
function go(v){location.hash=String(Math.max(1,Math.min(slides.length,v)));render()}
$('#prev').onclick=()=>go(n-1);$('#next').onclick=()=>go(n+1);$('#picker').onchange=e=>go(+e.target.value);$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if($('#screen').requestFullscreen)await $('#screen').requestFullscreen();else $('#fullscreen').textContent='请使用浏览器全屏'}catch{$('#fullscreen').textContent='请使用浏览器全屏'}};
document.addEventListener('keydown',e=>{if(e.target.matches('select,input,textarea'))return;if(e.key==='ArrowRight'){e.preventDefault();go(n+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(n-1)}});$('#screen').onclick=e=>{if(document.fullscreenElement)go(n+(e.clientX<innerWidth/2?-1:1))};window.addEventListener('hashchange',render);render();
