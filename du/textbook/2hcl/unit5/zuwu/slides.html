const slides=[{"title": "组屋", "notes": "50分钟。词语单独复习，本课重点为需要、措施与作用。四张漫画保持原样；只按段落展示对应画格。", "kind": "cover", "lesson": 1}, {"title": "熟悉的组屋生活", "notes": "导入3分钟。学生只需口头说一个特点，不新增文字输入。漫画人物为情境示意。", "kind": "question", "lesson": 1}, {"title": "第一段 · 大力兴建组屋", "notes": "完整原文。先读本段，再进入对应原题。网页可并列看漫画，漫画细节不作为额外答案依据。", "kind": "concept", "lesson": 1, "lines": ["建国初期，多数国人的住房比较简陋，生活条件也比较落后。1960年，政府成立了建屋发展局，开辟土地，兴建了大量的组屋。四年后，政府实施“居者有其屋”计划，让国人能够以优惠的价格买到属于自己的房子。"]}, {"title": "1 兴建组屋的原因", "notes": "课本《阅读放大镜》第二题\n教师示范。因为建国初期，多数国人的住房比较简陋，生活条件也比较落后。\n题目问兴建前的问题。第一句的两项情况回答原因；成立建屋发展局和推行计划属于措施，不能代替原因。\n建议内容核对2点：住房简陋1点、生活条件落后1点。教师示范任务，不作为独立掌握证据。\n常见误读：只列1960年成立建屋局、开辟土地或买房计划，是用措施代替原因。", "kind": "question", "lesson": 1, "lines": ["政府为什么要大力兴建组屋？"]}, {"title": "兴建原因 · 参考", "notes": "课本《阅读放大镜》第二题\n教师示范。因为建国初期，多数国人的住房比较简陋，生活条件也比较落后。\n题目问兴建前的问题。第一句的两项情况回答原因；成立建屋发展局和推行计划属于措施，不能代替原因。\n建议内容核对2点：住房简陋1点、生活条件落后1点。教师示范任务，不作为独立掌握证据。\n常见误读：只列1960年成立建屋局、开辟土地或买房计划，是用措施代替原因。\n教师示范：从问题找原因，再筛掉不回答题目的措施。", "kind": "answer", "lesson": 1, "lines": ["多数国人的住房比较简陋。", "生活条件比较落后。", "成立建屋局、开辟土地是措施。"]}, {"title": "第二段 · 重视市镇规划", "notes": "完整原文。先读本段，再进入对应原题。网页可并列看漫画，漫画细节不作为额外答案依据。", "kind": "concept", "lesson": 1, "lines": ["为了满足人民的生活所需，增强社区居民的凝聚力，政府在兴建组屋时也重视市镇的规划。市镇里一般都有邻里中心、游乐场、图书馆、公园、小贩中心、宗教场所、市镇理事会、民众俱乐部、综合诊疗所等。"]}, {"title": "2 市镇规划的表现", "notes": "课本《阅读放大镜》第二题\n师生共构。从市镇里一般设有邻里中心、游乐场、图书馆、公园、小贩中心、宗教场所、市镇理事会、民众俱乐部、综合诊疗所等多种设施，可以看出政府重视市镇规划。\n先概括“设置多种配套设施”，再举原文中的具体例子。第一句的满足生活所需、增强凝聚力说明目的；第二句的具体安排才能直接证明重视规划。\n建议内容核对2点：多种设施1点；至少两类明确的课文例子1点。设施全列为示范，学生不必机械背出九项；目的可补充，但不能代替表现。\n常见误读：只答“为了满足人民的生活所需”没有给出表现；只答“有组屋”也没有说明配套规划。", "kind": "question", "lesson": 1, "lines": ["从哪里可以看出政府重视市镇规划？"]}, {"title": "市镇规划 · 参考", "notes": "课本《阅读放大镜》第二题\n师生共构。从市镇里一般设有邻里中心、游乐场、图书馆、公园、小贩中心、宗教场所、市镇理事会、民众俱乐部、综合诊疗所等多种设施，可以看出政府重视市镇规划。\n先概括“设置多种配套设施”，再举原文中的具体例子。第一句的满足生活所需、增强凝聚力说明目的；第二句的具体安排才能直接证明重视规划。\n建议内容核对2点：多种设施1点；至少两类明确的课文例子1点。设施全列为示范，学生不必机械背出九项；目的可补充，但不能代替表现。\n常见误读：只答“为了满足人民的生活所需”没有给出表现；只答“有组屋”也没有说明配套规划。", "kind": "answer", "lesson": 1, "lines": ["市镇里一般设有多种配套设施。", "例如邻里中心、图书馆、公园、\n小贩中心和综合诊疗所等。", "这些具体安排，能说明政府重视规划。"]}, {"title": "设施怎样满足生活所需", "notes": "课本《阅读放大镜》第二题\n师生共构。从市镇里一般设有邻里中心、游乐场、图书馆、公园、小贩中心、宗教场所、市镇理事会、民众俱乐部、综合诊疗所等多种设施，可以看出政府重视市镇规划。\n先概括“设置多种配套设施”，再举原文中的具体例子。第一句的满足生活所需、增强凝聚力说明目的；第二句的具体安排才能直接证明重视规划。\n建议内容核对2点：多种设施1点；至少两类明确的课文例子1点。设施全列为示范，学生不必机械背出九项；目的可补充，但不能代替表现。\n常见误读：只答“为了满足人民的生活所需”没有给出表现；只答“有组屋”也没有说明配套规划。\n口头追问，不额外填写；设施与作用是理解说明，不替代原题的具体规划证据。", "kind": "answer", "lesson": 1, "nativeTable": true, "lines": ["设施：作用", "图书馆：提供阅读空间", "综合诊疗所：方便居民看病", "小贩中心：方便居民用餐"]}, {"title": "第三段 · 改进组屋设计", "notes": "完整原文。先读本段，再进入对应原题。网页可并列看漫画，漫画细节不作为额外答案依据。", "kind": "concept", "lesson": 1, "lines": ["随着新加坡经济的蓬勃发展，国人的生活越来越富裕，生活水平也提高了。为了与时俱进，建屋发展局给组屋的设计注入更多活力，推出了许多设计新颖、造型美观的新组屋。"]}, {"title": "3 改进设计的原因", "notes": "课本《阅读放大镜》第二题\n学生独立。因为新加坡经济蓬勃发展，国人的生活越来越富裕，生活水平提高了；建屋发展局为了与时俱进，因此改进组屋设计。\n先交代经济和生活的变化，再说明与时俱进的目的。“设计新颖、造型美观”是改进后的特点，不是改进的原因。\n建议人工核对3点：经济发展1点、生活改善1点、与时俱进1点。各点独立；“生活越来越富裕”和“生活水平提高”视为同一生活改善意义，不机械重复计分。\n常见误读：只写设计新颖、造型美观，是把结果当成原因；写为了得奖，原文没有提供这个动机。", "kind": "question", "lesson": 1, "lines": ["建屋发展局为什么要改进组屋设计？"]}, {"title": "改进设计 · 参考", "notes": "课本《阅读放大镜》第二题\n学生独立。因为新加坡经济蓬勃发展，国人的生活越来越富裕，生活水平提高了；建屋发展局为了与时俱进，因此改进组屋设计。\n先交代经济和生活的变化，再说明与时俱进的目的。“设计新颖、造型美观”是改进后的特点，不是改进的原因。\n建议人工核对3点：经济发展1点、生活改善1点、与时俱进1点。各点独立；“生活越来越富裕”和“生活水平提高”视为同一生活改善意义，不机械重复计分。\n常见误读：只写设计新颖、造型美观，是把结果当成原因；写为了得奖，原文没有提供这个动机。\n独立写两三句话后才揭示，教师按3个意义点核对。", "kind": "answer", "lesson": 1, "lines": ["原因：经济蓬勃发展，\n国人生活富裕、生活水平提高。", "目的：为了与时俱进。", "新颖、美观是改进后的特点。"]}, {"title": "第四段 · 打造宜居家园", "notes": "完整原文。先读本段，再进入对应原题。网页可并列看漫画，漫画细节不作为额外答案依据。", "kind": "concept", "lesson": 1, "lines": ["时代不断变迁，建屋发展局在设计组屋时越来越关注环保和人口老化等问题。组屋区里为居民提供了更多的交流空间，环保和无障碍设施也越来越完善。"]}, {"title": "4 打造宜居家园的努力", "notes": "课本《阅读放大镜》第二题\n学生独立。建屋发展局为居民提供更多交流空间，并不断完善环保设施和无障碍设施。\n题目问已经做出的努力，回答具体做法。关注环保和人口老化是背景与方向；第二句包含三项措施。“环保和无障碍设施”可拆成两个不同方面，不能漏掉其中一个。\n建议内容核对3点：交流空间、环保设施、无障碍设施各1点。只答关注问题不给措施点，但已答对的措施独立给分。\n常见误读：只写“关注环保和人口老化”没有具体措施；只写“完善设施”太笼统，漏了两种设施的区别。", "kind": "question", "lesson": 1, "lines": ["建屋发展局为打造宜居家园做出哪些努力？"]}, {"title": "宜居家园 · 三项努力", "notes": "课本《阅读放大镜》第二题\n学生独立。建屋发展局为居民提供更多交流空间，并不断完善环保设施和无障碍设施。\n题目问已经做出的努力，回答具体做法。关注环保和人口老化是背景与方向；第二句包含三项措施。“环保和无障碍设施”可拆成两个不同方面，不能漏掉其中一个。\n建议内容核对3点：交流空间、环保设施、无障碍设施各1点。只答关注问题不给措施点，但已答对的措施独立给分。\n常见误读：只写“关注环保和人口老化”没有具体措施；只写“完善设施”太笼统，漏了两种设施的区别。\n先口头分点，再揭示；不能只写关注环保和人口老化。", "kind": "answer", "lesson": 1, "lines": ["提供更多交流空间。", "不断完善环保设施。", "不断完善无障碍设施。"]}, {"title": "第五段 · 总结", "notes": "完整原文。先读本段，再进入对应原题。网页可并列看漫画，漫画细节不作为额外答案依据。", "kind": "concept", "lesson": 1, "lines": ["如今，新加坡的组屋驰名海内外，市镇规划和组屋设计也屡次得奖，获得许多荣誉。组屋已是新加坡的重要标志之一，也成为新加坡一道美丽的风景线。"]}, {"title": "四个小标题 · 内容配对", "notes": "整合旧网页结构练习；读后追问参考教参2.3\n学生独立。大力兴建组屋：改善住房条件；重视市镇规划：设置生活配套；改进组屋设计：随经济和生活变化改进外观设计；打造宜居家园：关注交流、环保和无障碍设施。\n四个小标题分别概括不同方面。课文先介绍兴建背景，再介绍规划、设计及宜居措施；不能据此断言四方面在现实中互不重叠、依次结束。\n四组配对各核对1项；课堂记录按整组是否首次全对显示，不设速度分。口头追问由教师听答，不新增书写任务。\n常见误读：不能把四个方面讲成严格分割、互不重叠的四段历史；也不能只凭漫画的外观来解释全文。\n把四个小标题与屏幕上的内容配对；学生在学习单中点选。", "kind": "question", "lesson": 1, "lines": ["改善早期住房条件。", "设置居民生活配套。", "推出新颖美观的组屋。", "完善交流、环保与无障碍设施。"]}, {"title": "全文归纳 · 参考", "notes": "整合旧网页结构练习；读后追问参考教参2.3\n学生独立。大力兴建组屋：改善住房条件；重视市镇规划：设置生活配套；改进组屋设计：随经济和生活变化改进外观设计；打造宜居家园：关注交流、环保和无障碍设施。\n四个小标题分别概括不同方面。课文先介绍兴建背景，再介绍规划、设计及宜居措施；不能据此断言四方面在现实中互不重叠、依次结束。\n四组配对各核对1项；课堂记录按整组是否首次全对显示，不设速度分。口头追问由教师听答，不新增书写任务。\n常见误读：不能把四个方面讲成严格分割、互不重叠的四段历史；也不能只凭漫画的外观来解释全文。", "kind": "answer", "lesson": 1, "nativeTable": true, "lines": ["小标题：主要内容", "大力兴建组屋：改善住房条件", "重视市镇规划：设置生活配套", "改进组屋设计：推出新颖美观的组屋", "打造宜居家园：完善交流空间及设施"]}, {"title": "一道美丽的风景线", "notes": "整合旧网页结构练习；读后追问参考教参2.3\n学生独立。大力兴建组屋：改善住房条件；重视市镇规划：设置生活配套；改进组屋设计：随经济和生活变化改进外观设计；打造宜居家园：关注交流、环保和无障碍设施。\n四个小标题分别概括不同方面。课文先介绍兴建背景，再介绍规划、设计及宜居措施；不能据此断言四方面在现实中互不重叠、依次结束。\n四组配对各核对1项；课堂记录按整组是否首次全对显示，不设速度分。口头追问由教师听答，不新增书写任务。\n常见误读：不能把四个方面讲成严格分割、互不重叠的四段历史；也不能只凭漫画的外观来解释全文。\n不强迫在外观与居民生活之间二选一。", "kind": "question", "lesson": 1, "lines": ["为什么组屋成为新加坡", "一道美丽的风景线？", "回看全文，口头说出依据。"]}, {"title": "“美丽”的依据", "notes": "整合旧网页结构练习；读后追问参考教参2.3\n学生独立。大力兴建组屋：改善住房条件；重视市镇规划：设置生活配套；改进组屋设计：随经济和生活变化改进外观设计；打造宜居家园：关注交流、环保和无障碍设施。\n四个小标题分别概括不 $('#picker').innerHTML=slides.map((s,i)=>`<option value="${i+1}">${i+1}. ${s.title}</option>`).join('');
function render(){const v=Number(location.hash.slice(1));n=Number.isInteger(v)&&v>=1&&v<=slides.length?v:1;$('#slide').src=`slides/slide-${String(n).padStart(2,'0')}.png`;$('#slide').alt=`第${n}页：${slides[n-1].title}`;$('#count').textContent=`${n} / ${slides.length}`;$('#picker').value=n;$('#notes').textContent=slides[n-1].notes;$('#prev').disabled=n===1;$('#next').disabled=n===slides.length;$('#teacherNotes').open=false;}
function go(v){location.hash=String(Math.max(1,Math.min(slides.length,v)));render()}
$('#prev').onclick=()=>go(n-1);$('#next').onclick=()=>go(n+1);$('#picker').onchange=e=>go(+e.target.value);$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if($('#screen').requestFullscreen)await $('#screen').requestFullscreen();else $('#fullscreen').textContent='请使用浏览器全屏'}catch{$('#fullscreen').textContent='请使用浏览器全屏'}};
document.addEventListener('keydown',e=>{if(e.target.matches('select,input,textarea'))return;if(e.key==='ArrowRight'){e.preventDefault();go(n+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(n-1)}});$('#screen').onclick=e=>{if(document.fullscreenElement)go(n+(e.clientX<innerWidth/2?-1:1))};window.addEventListener('hashchange',render);render();
</script><p id="packStatus" role="status"></p><script src="pack.js"></script></body></html>
