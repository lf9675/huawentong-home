<!doctype html><html lang="zh-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="中二高级华文 单元一 把爱说出来 课文教学配套"><title>把爱说出来 · 在线投影 · 华文通</title><link rel="stylesheet" href="../../../shared/lesson-v1/style.css?v=20261023-ipad-all1"></head><body><header class="site-header"><a href="../../../../../index.html"><img src="../../../../../assets/huawentong-logo.png" alt="华文通"></a><span>中二高级华文 · 单元一</span></header><main><p class="crumb"><a href="teacher.html">教师资料</a> / 在线投影</p><div class="toolbar"><a class="btn" href="#1">第一课</a><a class="btn" href="#21">第二课</a><a class="btn" href="#35">第三课</a><select id="slideSelect" aria-label="选择课件页"></select></div><section class="projector" id="projector"><img id="slideImage" alt="课件"><div class="toolbar"><button id="prev">上一页</button><button id="next">下一页</button><button id="full">全屏</button><span class="slide-label" id="slideLabel"></span></div></section><details class="slide-notes"><summary>教师提示</summary><p id="notes"></p></details></main><script>const SLIDES=[{"title": "把爱说出来", "lines": ["中二高级华文　单元一", "有爱在心，为什么难以开口？"], "lesson": 1, "kind": "cover", "panel": 27, "notes": "使用本次上传的原有漫画；不重画。建议3×50分钟，2×50分钟压缩用法见教师方案。"}, {"title": "一句话的温暖", "lines": ["有人真诚地感谢你时，\n你有什么感受？", "先想一想，不必公开私人经历。"], "lesson": 1, "kind": "teach", "panel": 12, "notes": "短导入3分钟。可用假设情境；不要求每人披露家庭经历，也不要求当堂给家长发消息。"}, {"title": "今天读懂什么", "lines": ["比较人物表达爱的方式", "用原文解释心理变化", "说明结尾歌声与主题的关系"], "lesson": 1, "kind": "teach", "panel": null, "notes": "四个目标的完整表述见教师方案；开放回应贯穿第三课。 问题严格按段落顺序进行，全文人物比较放在第16段之后。"}, {"title": "女儿的崇拜", "lines": ["从哪里可以看出女儿很崇拜“我”？"], "lesson": 1, "kind": "question", "panel": null, "notes": "来源：课本旁注 第1、2段。任务身份：我们做。\n\n参考：女儿带着崇拜的眼神再三赞叹，还拿文章再看一遍，爱不释手。儿子却不愿听，马上逃走，并说“我不想听，千万别念给我听”。\n常见误区：只写“截然相反”没有具体表现；只答一人不完整。\n提示1：比较两人听文章时的反应。\n提示2：看第1、2段：再三赞叹、再看一遍、逃走。"}, {"title": "证据怎样回答问题", "lines": ["“再三赞叹”表现反复称赞。", "“再看一遍”“爱不释手”表现珍爱文章。", "这些具体表现支持“崇拜”。", "直接信息（direct info）"], "lesson": 1, "kind": "answer", "panel": 3, "notes": "来源：课本旁注 第1、2段。任务身份：我们做。\n\n参考：女儿带着崇拜的眼神再三赞叹，还拿文章再看一遍，爱不释手。儿子却不愿听，马上逃走，并说“我不想听，千万别念给我听”。\n常见误区：只写“截然相反”没有具体表现；只答一人不完整。\n提示1：比较两人听文章时的反应。\n提示2：看第1、2段：再三赞叹、再看一遍、逃走。"}, {"title": "同样听文章，不同表现", "lines": ["儿子的表现和女儿的有什么不一样？", "同一件事，两个人都要答。"], "lesson": 1, "kind": "question", "panel": null, "notes": "来源：课本旁注 第1、2段。任务身份：我们做。\n\n参考：女儿带着崇拜的眼神再三赞叹，还拿文章再看一遍，爱不释手。儿子却不愿听，马上逃走，并说“我不想听，千万别念给我听”。\n常见误区：只写“截然相反”没有具体表现；只答一人不完整。\n提示1：比较两人听文章时的反应。\n提示2：看第1、2段：再三赞叹、再看一遍、逃走。 读完第2段再比较第1、2段。"}, {"title": "比较的是具体表现", "lines": ["女儿：赞叹，又拿文章重读。", "儿子：拒绝听，马上逃走。", "“截然相反”只是概括。"], "lesson": 1, "kind": "answer", "panel": null, "notes": "来源：课本旁注 第1、2段。任务身份：我们做。\n\n参考：女儿带着崇拜的眼神再三赞叹，还拿文章再看一遍，爱不释手。儿子却不愿听，马上逃走，并说“我不想听，千万别念给我听”。\n常见误区：只写“截然相反”没有具体表现；只答一人不完整。\n提示1：比较两人听文章时的反应。\n提示2：看第1、2段：再三赞叹、再看一遍、逃走。"}, {"title": "女儿为什么“张大眼睛”", "lines": ["可以删掉“张大眼睛”吗？", "为什么？", "细节的作用"], "lesson": 1, "kind": "question", "panel": 6, "notes": "来源：教参 第3段。任务身份：口头讨论。\n\n参考：不宜删掉。这个神态细节表现女儿看见新衣时的惊喜和欣赏，和真诚的赞美互相配合。\n常见误区：只说“生动形象”而没有说明具体内容。\n提示1：结合本段内容，说出具体作用。\n提示2：说明这处文字写出了什么。"}, {"title": "神态配合真诚的赞美", "lines": ["不宜删掉。", "“张大眼睛”表现惊喜与欣赏。", "它和“真诚”“双眼含笑”等互相配合。", "课本归为外貌描写，细分是神态。"], "lesson": 1, "kind": "answer", "panel": null, "notes": "来源：教参 第3段。任务身份：口头讨论。\n\n参考：不宜删掉。这个神态细节表现女儿看见新衣时的惊喜和欣赏，和真诚的赞美互相配合。\n常见误区：只说“生动形象”而没有说明具体内容。\n提示1：结合本段内容，说出具体作用。\n提示2：说明这处文字写出了什么。"}, {"title": "儿子爱“我”吗", "lines": ["你觉得儿子爱“我”吗？为什么？", "哪些是事实？哪些是推断？"], "lesson": 1, "kind": "question", "panel": null, "notes": "来源：课本旁注 第4段。任务身份：你做。\n\n参考：我认为儿子可能也爱妈妈，只是不习惯赞美或说出感情。不过，课文没有足够证据确定他的内心，不能只凭拒绝听文章、说妹妹拍马屁，就断定他不爱妈妈。\n常见误区：拒绝“儿子一定不爱妈妈”或“所有孩子天生都爱妈妈”的无依据断言。\n提示1：没有说赞美的话，就一定没有爱吗？\n提示2：第2、4段写出他的表现，但没有直接说明他的内心。"}, {"title": "判断不能超过证据", "lines": ["事实：儿子拒听文章，否定妹妹的赞美。", "可能：他不习惯赞美、说出感情。", "不能单凭这些表现断定他不爱妈妈。"], "lesson": 1, "kind": "answer", "panel": null, "notes": "来源：课本旁注 第4段。任务身份：你做。\n\n参考：我认为儿子可能也爱妈妈，只是不习惯赞美或说出感情。不过，课文没有足够证据确定他的内心，不能只凭拒绝听文章、说妹妹拍马屁，就断定他不爱妈妈。\n常见误区：拒绝“儿子一定不爱妈妈”或“所有孩子天生都爱妈妈”的无依据断言。\n提示1：没有说赞美的话，就一定没有爱吗？\n提示2：第2、4段写出他的表现，但没有直接说明他的内心。"}, {"title": "“我”的感受", "lines": ["结合上文女儿和儿子的表现，", "说说“我”的感受。"], "lesson": 1, "kind": "question", "panel": null, "notes": "来源：课本旁注 第8段。任务身份：你做。\n\n参考：女儿的赞美让“我”有成就感、心情愉快；看到女儿的卡片，又觉得再辛苦也是值得的。\n常见误区：只写“开心”不够具体；也不能把女儿带来的温暖归因于儿子的拒绝或否定。\n提示1：留意课文直接写出的感受。\n提示2：回看第1、3、8段。"}, {"title": "女儿的话让“我”温暖", "lines": ["第1段：有成就感。", "第3段：无比愉快。", "第8段：看到卡片，觉得再辛苦也值得。"], "lesson": 1, "kind": "answer", "panel": null, "notes": "来源：课本旁注 第8段。任务身份：你做。\n\n参考：女儿的赞美让“我”有成就感、心情愉快；看到女儿的卡片，又觉得再辛苦也是值得的。\n常见误区：只写“开心”不够具体；也不能把女儿带来的温暖归因于儿子的拒绝或否定。\n提示1：留意课文直接写出的感受。\n提示2：回看第1、3、8段。"}, {"title": "第九段　母亲的情况", "lines": ["为什么作者要写父亲过世后", "母亲的情况？"], "lesson": 1, "kind": "question", "panel": null, "notes": "来源：教参 第9段。任务身份：口头讨论。\n\n参考：交代母亲寂寞、沉默的背景及为家务付出的爱，使“我”的感激有依据，也与结尾歌声形成对照。\n常见误区：只说“生动形象”而没有说明具体内容。\n提示1：结合本段内容，说出具体作用。\n提示2：说明这处文字写出了什么。"}, {"title": "理解母亲的心情与付出", "lines": ["父亲过世后，母亲抑郁、沉默寡言。", "她仍旧照顾家人、承担家务。", "这些内容让我们理解“我”的感激。"], "lesson": 1, "kind": "answer", "panel": null, "notes": "来源：教参 第9段。任务身份：口头讨论。\n读到结尾后再回看歌声与此处的对照；此时不提前混入第16段。\n参考：交代母亲寂寞、沉默的背景及为家务付出的爱，使“我”的感激有依据，也与结尾歌声形成对照。\n常见误区：只说“生动形象”而没有说明具体内容。\n提示1：结合本段内容，说出具体作用。\n提示2：说明这处文字写出了什么。"}, {"title": "第10段写了什么", "lines": ["第10段主要运用了哪一种人物描写？", "表现了“我”怎样的特点？", "是说出口的话，还是心里想的？"], "lesson": 1, "kind": "question", "panel": null, "notes": "来源：课本旁注 第10段。任务身份：我们做。\n\n参考：主要是心理描写。写出“我”感激母亲的付出，也反省自己从未表达感谢，想向女儿学习。这可支持“懂得感恩、善于反思”的特点。\n常见误区：“一边开车”是真实行动，但不能把整段主体判为行动描写。\n提示1：这些话是说出口的，还是心里想的？\n提示2：留意“一边想”“扪心自问”和后面连续两个问句。"}, {"title": "从感激到决定", "lines": ["“一边想”“扪心自问”：心理描写。", "感谢母亲的付出：懂得感恩。", "反省自己从未表达：善于反思。", "体会女儿话语的温暖，决定学习她。"], "lesson": 1, "kind": "answer", "panel": null, "notes": "来源：课本旁注 第10段。任务身份：我们做。\n反思自己的原句包括连续两个问句。证据框支持加入多句，不以一句话限制学生。\n参考：主要是心理描写。写出“我”感激母亲的付出，也反省自己从未表达感谢，想向女儿学习。这可支持“懂得感恩、善于反思”的特点。\n常见误区：“一边开车”是真实行动，但不能把整段主体判为行动描写。\n提示1：这些话是说出口的，还是心里想的？\n提示2：留意“一边想”“扪心自问”和后面连续两个问句。"}, {"title": "反思自己的两个问句", "lines": ["“我不是常常因为女儿的甜言蜜语", "而感到幸福吗？”", "“我是不是应该学学女儿，勇敢地", "向母亲表达感谢，表达爱呢？”"], "lesson": 1, "kind": "answer", "panel": null, "notes": "来源：课本旁注 第10段。任务身份：我们做。\n连续两个问句共同写出反思：先想到自己得到的温暖，再想到自己应该如何表达。原句完整写在第10段；证据框可连续加入。\n参考：主要是心理描写。写出“我”感激母亲的付出，也反省自己从未表达感谢，想向女儿学习。这可支持“懂得感恩、善于反思”的特点。\n常见误区：“一边开车”是真实行动，但不能把整段主体判为行动描写。\n提示1：这些话是说出口的，还是心里想的？\n提示2：留意“一边想”“扪心自问”和后面连续两个问句。"}, {"title": "第十一段　下定决心", "lines": ["第11段可不可以删掉？为什么？"], "lesson": 1, "kind": "question", "panel": null, "notes": "来源：教参 第11段。任务身份：口头讨论。\n\n参考：不宜删掉。它写“我”下决心并给自己打气，接续第10段的反思，引出后面的尝试和退缩，使心理变化完整。\n常见误区：只说“生动形象”而没有说明具体内容。\n提示1：结合本段内容，说出具体作用。\n提示2：说明这处文字写出了什么。"}, {"title": "承接反思，引出尝试", "lines": ["不宜删掉。", "这一段写“我”下定决心。", "它承接上文的反思，", "引出下文向母亲表达爱的尝试。"], "lesson": 1, "kind": "answer", "panel": null, "notes": "来源：教参 第11段。任务身份：口头讨论。\n\n参考：不宜删掉。它写“我”下决心并给自己打气，接续第10段的反思，引出后面的尝试和退缩，使心理变化完整。\n常见误区：只说“生动形象”而没有说明具体内容。\n提示1：结合本段内容，说出具体作用。\n提示2：说明这处文字写出了什么。"}, {"title": "第二课　迟迟说不出口", "lines": ["第十二至十五段", "下定决心后，为什么还会退缩？"], "lesson": 2, "kind": "section", "panel": 21, "notes": "先一次一段阅读，再整合心理变化。"}, {"title": "第一次一定最难吗", "lines": ["“我”认为第一次对母亲说出爱总是最难的。", "你同意吗？为什么？"], "lesson": 2, "kind": "question", "panel": null, "notes": "来源：课本旁注 第12段。任务身份：我们做。\n\n参考：可以部分同意。对一向把感情藏在心里的人，第一次开口要克服害羞和不习惯，像文中的“我”；但对平时就常表达感情的人，例如女儿，开口可能较自然。因此，难不难与个人习惯和关系情境有关。\n常见误区：只写“同意，因为第一次最难”是循环解释。\n提示1：难不难与个人习惯有什么关系？\n提示2：可以比较“我”和女儿平时表达感情的习惯。"}, {"title": "不同立场怎样成立", "lines": ["对不习惯表达的人，第一次要克服害羞。", "对平时常表达的人，开口可能较自然。", "因此可以同意、部分同意或不同意，", "但理由必须说明适用的人或条件。"], "lesson": 2, "kind": "answer", "panel": null, "notes": "来源：课本旁注 第12段。任务身份：我们做。\n\n参考：可以部分同意。对一向把感情藏在心里的人，第一次开口要克服害羞和不习惯，像文中的“我”；但对平时就常表达感情的人，例如女儿，开口可能较自然。因此，难不难与个人习惯和关系情境有关。\n常见误区：只写“同意，因为第一次最难”是循环解释。\n提示1：难不难与个人习惯有什么关系？\n提示2：可以比较“我”和女儿平时表达感情的习惯。"}, {"title": "惯用语的比喻义", "lines": ["碰钉子：遭到拒绝，目标未达到。", "泼冷水：打击别人的热情。", "口头禅：经常挂在口头的习惯语。"], "lesson": 2, "kind": "teach", "panel": null, "notes": "来源：课本 阅读放大镜一。任务身份：你做。\n\n参考：1. 碰钉子　2. 打退堂鼓　3. 泼冷水。\n常见误区：不能按字面把惯用语理解为真实动作。\n提示1：想想是被拒绝、被打击热情，还是自己退缩。\n提示2：碰钉子＝被拒绝；泼冷水＝热情受打击；打退堂鼓＝自己退缩。"}, {"title": "惯用语中的不同关系", "lines": ["拍马屁：用好听的话讨好别人。", "打退堂鼓：自己做事中途退缩。", "谁对谁做什么？"], "lesson": 2, "kind": "teach", "panel": null, "notes": "来源：课本 阅读放大镜一。任务身份：你做。\n\n参考：1. 碰钉子　2. 打退堂鼓　3. 泼冷水。\n常见误区：不能按字面把惯用语理解为真实动作。\n提示1：想想是被拒绝、被打击热情，还是自己退缩。\n提示2：碰钉子＝被拒绝；泼冷水＝热情受打击；打退堂鼓＝自己退缩。"}, {"title": "用什么惯用语", "lines": ["1. 他常常乱花钱，今天又向妈妈要钱，", "　结果________。", "2. 我们要对自己有信心，不要一遇到困难", "　就________。", "3. 我想去学街舞，但哥哥一直给我________，", "　说我不适合跳舞。"], "lesson": 2, "kind": "question", "panel": null, "notes": "来源：课本 阅读放大镜一。任务身份：你做。\n\n参考：1. 碰钉子　2. 打退堂鼓　3. 泼冷水。\n常见误区：不能按字面把惯用语理解为真实动作。\n提示1：想想是被拒绝、被打击热情，还是自己退缩。\n提示2：碰钉子＝被拒绝；泼冷水＝热情受打击；打退堂鼓＝自己退缩。"}, {"title": "惯用语答案与依据", "lines": ["1. 碰钉子：妈妈拒绝了要钱的要求。", "2. 打退堂鼓：遇到困难，自己退缩。", "3. 泼冷水：哥哥的话打击我的热情。"], "lesson": 2, "kind": "answer", "panel": null, "notes": "来源：课本 阅读放大镜一。任务身份：你做。\n\n参考：1. 碰钉子　2. 打退堂鼓　3. 泼冷水。\n常见误区：不能按字面把惯用语理解为真实动作。\n提示1：想想是被拒绝、被打击热情，还是自己退缩。\n提示2：碰钉子＝被拒绝；泼冷水＝热情受打击；打退堂鼓＝自己退缩。"}, {"title": "“破天荒”指什么", "lines": ["“破天荒”是什么意思？", "在文中有什么含义？"], "lesson": 2, "kind": "question", "panel": null, "notes": "来源：教参补充 第14段。任务身份：我们做。\n\n参考：指以前从未有过。这里指“我”第一次直接向母亲说出感谢和爱。\n常见误区：只解释“第一次”而不说明第一次做什么，不完整；不能说“我”以前不爱母亲。\n提示1：“第一次”指什么事情？\n提示2：注意“说道”后面的内容。"}, {"title": "第一次说出感谢和爱", "lines": ["“破天荒”：以前从未有过。", "文中指“我”第一次直接向母亲", "说出感谢和爱。", "她以前已有关爱，只是不曾这样表达。"], "lesson": 2, "kind": "answer", "panel": null, "notes": "来源：教参补充 第14段。任务身份：我们做。\n\n参考：指以前从未有过。这里指“我”第一次直接向母亲说出感谢和爱。\n常见误区：只解释“第一次”而不说明第一次做什么，不完整；不能说“我”以前不爱母亲。\n提示1：“第一次”指什么事情？\n提示2：注意“说道”后面的内容。"}, {"title": "为什么难以表达爱", "lines": ["结合上文，说一说为什么“我”", "难以向母亲表达爱。", "证据 → 原因", "不能只复述吃饭的经过。"], "lesson": 2, "kind": "question", "panel": null, "notes": "来源：课本旁注 第14段。任务身份：你做。\n\n参考：“我”从未向母亲直接表达感激和爱，不习惯把感情说出口，因此觉得难以启齿。真正面对母亲时，“我”又害羞、不自在，怕难为情，所以迟迟说不出口。\n常见误区：不可把母亲不爱“我”、忙得没有时间，或特定文化背景写成确定原因。\n提示1：说明表达上的困难，不必复述吃饭经过。\n提示2：第10段“从未”，第12段“害羞”，第14段“第一次”。"}, {"title": "原因要由证据推出", "lines": ["“从未”“第一次”：不习惯直接表达。", "“害羞”“心里有些疙瘩”：难为情。", "所以面对母亲时，迟迟说不出口。", "特定文化影响只是可能原因。"], "lesson": 2, "kind": "answer", "panel": null, "notes": "来源：课本旁注 第14段。任务身份：你做。\n\n参考：“我”从未向母亲直接表达感激和爱，不习惯把感情说出口，因此觉得难以启齿。真正面对母亲时，“我”又害羞、不自在，怕难为情，所以迟迟说不出口。\n常见误区：不可把母亲不爱“我”、忙得没有时间，或特定文化背景写成确定原因。\n提示1：说明表达上的困难，不必复述吃饭经过。\n提示2：第10段“从未”，第12段“害羞”，第14段“第一次”。"}, {"title": "能否删去这个比较", "lines": ["可以去掉“比当年参加毕业考试”吗？", "为什么？"], "lesson": 2, "kind": "question", "panel": null, "notes": "来源：课本旁注 第15段。任务身份：我们做。\n\n参考：不宜去掉。作者把向母亲表达爱时的心情，与参加毕业考试时的紧张相比较，突出她这次格外紧张。删去后仍有“紧张”的意思，但程度不够鲜明。\n常见误区：只写“生动形象”或“句子变短”没有回答具体作用。\n提示1：比较突出的是紧张的程度。\n提示2：注意“比……还紧张”。"}, {"title": "比较突出紧张程度", "lines": ["不宜去掉。", "把这次示爱与毕业考试的紧张作比较，", "突出向母亲表达爱时格外紧张。", "只说“紧张”，未说明紧张的程度。"], "lesson": 2, "kind": "answer", "panel": null, "notes": "来源：课本旁注 第15段。任务身份：我们做。\n\n参考：不宜去掉。作者把向母亲表达爱时的心情，与参加毕业考试时的紧张相比较，突出她这次格外紧张。删去后仍有“紧张”的意思，但程度不够鲜明。\n常见误区：只写“生动形象”或“句子变短”没有回答具体作用。\n提示1：比较突出的是紧张的程度。\n提示2：注意“比……还紧张”。"}, {"title": "“我”的心理变化", "lines": ["下定决心（第11段）", "害羞退缩，又鼓励自己（第12段）", "寻找机会，仍不自在（第13段）", "终于开口，紧张离开（第14–15段）"], "lesson": 2, "kind": "teach", "panel": null, "notes": "这些是教师概括，不冒充原文引句。让学生先根据段落口头排序，再揭示本页。"}, {"title": "第三课　熟悉的歌声", "lines": ["那天傍晚下班回家，我一进门就听见母亲的歌声。她一边在厨房忙着准备晚餐，一边唱着歌。自从父亲过世后，我还是第一次听到这熟悉的歌声。"], "lesson": 3, "kind": "section", "panel": null, "notes": "完整第16段原文。先阅读，不急于公布主题。"}, {"title": "两次表达爱的回应", "lines": ["女儿对“我”表达爱：", "“我”的反应与感受是什么？", "“我”对母亲表达爱：", "母亲的反应与感受是什么？", "行为写得明白，感受需要推断。"], "lesson": 3, "kind": "question", "panel": null, "notes": "来源：课本 阅读放大镜二；第16段旁注。任务身份：你做。\n\n参考：女儿对“我”表达爱，使“我”有成就感、心情愉快，觉得再辛苦也值得。“我”表达爱后，母亲一边做饭一边唱歌；结合先前的抑郁沉默，可推断她感受到女儿的爱与安慰，心情有所好转。结尾用歌声的变化突出爱的表达带来的力量，呼应题目。\n常见误区：不能推断她从此永不悲伤或完全摆脱丧亲之痛。\n提示1：留意心情的变化，不只看做饭的动作。\n提示2：第9段“沉默寡言”，第16段“唱着歌”“第一次”。"}, {"title": "直接信息与必要推断", "lines": ["“我”：有成就感、愉快，辛苦也值得。", "母亲的行为：一边做饭，一边唱歌。", "母亲的感受：受到爱与安慰，心情好转。", "后一点须结合第9段的沉默来推断。"], "lesson": 3, "kind": "answer", "panel": null, "notes": "来源：课本 阅读放大镜二；第16段旁注。任务身份：你做。\n\n参考：女儿对“我”表达爱，使“我”有成就感、心情愉快，觉得再辛苦也值得。“我”表达爱后，母亲一边做饭一边唱歌；结合先前的抑郁沉默，可推断她感受到女儿的爱与安慰，心情有所好转。结尾用歌声的变化突出爱的表达带来的力量，呼应题目。\n常见误区：不能推断她从此永不悲伤或完全摆脱丧亲之痛。\n提示1：留意心情的变化，不只看做饭的动作。\n提示2：第9段“沉默寡言”，第16段“唱着歌”“第一次”。"}, {"title": "最后一句的含义", "lines": ["最后一句话有什么含义？", "“自从父亲过世后，我还是第一次", "听到这熟悉的歌声。”"], "lesson": 3, "kind": "question", "panel": null, "notes": "来源：课本 阅读放大镜二；第16段旁注。任务身份：你做。\n\n参考：女儿对“我”表达爱，使“我”有成就感、心情愉快，觉得再辛苦也值得。“我”表达爱后，母亲一边做饭一边唱歌；结合先前的抑郁沉默，可推断她感受到女儿的爱与安慰，心情有所好转。结尾用歌声的变化突出爱的表达带来的力量，呼应题目。\n常见误区：不能推断她从此永不悲伤或完全摆脱丧亲之痛。\n提示1：留意心情的变化，不只看做饭的动作。\n提示2：第9段“沉默寡言”，第16段“唱着歌”“第一次”。"}, {"title": "歌声表现爱的力量", "lines": ["第9段：抑郁、沉默寡言。", "第16段：重新唱起歌。", "母亲感受到爱与安慰，心情有所转变。", "不能推断她从此完全摆脱悲痛。"], "lesson": 3, "kind": "answer", "panel": 30, "notes": "来源：课本 阅读放大镜二；第16段旁注。任务身份：你做。\n\n参考：女儿对“我”表达爱，使“我”有成就感、心情愉快，觉得再辛苦也值得。“我”表达爱后，母亲一边做饭一边唱歌；结合先前的抑郁沉默，可推断她感受到女儿的爱与安慰，心情有所好转。结尾用歌声的变化突出爱的表达带来的力量，呼应题目。\n常见误区：不能推断她从此永不悲伤或完全摆脱丧亲之痛。\n提示1：留意心情的变化，不只看做饭的动作。\n提示2：第9段“沉默寡言”，第16段“唱着歌”“第一次”。"}, {"title": "文章主题", "lines": ["“爱的语言让人觉得温暖，我们应该……”"], "lesson": 3, "kind": "question", "panel": null, "notes": "来源：课本 阅读放大镜三；第10段旁注后半问。任务身份：你做。\n\n参考：念文章、穿新衣时，儿子不愿赞美妈妈，说话直接，还否定妹妹的称赞；女儿真诚欣赏妈妈，既赞叹又重读文章。表达爱时，女儿自然、主动，写卡片说“我爱你们”；“我”虽然懂得感恩、善于反思，却不习惯直接表达，面对母亲害羞、低头、说话断续。两组比较表明：爱的语言能使家人感到温暖，应把爱真诚地表达出来。\n常见误区：不提供特点选项代替学生思考。不由儿子的一两句话推断他“自私、不孝”或认定他不爱妈妈。\n提示1：比较每个人表达感情的方式。\n提示2：儿子和女儿看语言、行动；“我”还要看心理与犹豫。"}, {"title": "主题与两次表达", "lines": ["我们应该把爱真诚地表达出来。", "女儿的话，让“我”感到温暖。", "“我”的表达，让母亲重新唱歌。"], "lesson": 3, "kind": "answer", "panel": null, "notes": "来源：课本 阅读放大镜二；第16段旁注。任务身份：你做。\n\n参考：女儿对“我”表达爱，使“我”有成就感、心情愉快，觉得再辛苦也值得。“我”表达爱后，母亲一边做饭一边唱歌；结合先前的抑郁沉默，可推断她感受到女儿的爱与安慰，心情有所好转。结尾用歌声的变化突出爱的表达带来的力量，呼应题目。\n常见误区：不能推断她从此永不悲伤或完全摆脱丧亲之痛。\n提示1：留意心情的变化，不只看做饭的动作。\n提示2：第9段“沉默寡言”，第16段“唱着歌”“第一次”。"}, {"title": "通过比较把握人物特点", "lines": ["从文中画出描写儿子、女儿和“我”的句子，", "通过比较把握人物特点，理解文章主题。", "特点 ＋ 行为依据 ＋ 解释", "先自主概括，不从选项里挑特点。"], "lesson": 3, "kind": "question", "panel": null, "notes": "来源：课本 阅读放大镜三；第10段旁注后半问。任务身份：你做。\n\n参考：念文章、穿新衣时，儿子不愿赞美妈妈，说话直接，还否定妹妹的称赞；女儿真诚欣赏妈妈，既赞叹又重读文章。表达爱时，女儿自然、主动，写卡片说“我爱你们”；“我”虽然懂得感恩、善于反思，却不习惯直接表达，面对母亲害羞、低头、说话断续。两组比较表明：爱的语言能使家人感到温暖，应把爱真诚地表达出来。\n常见误区：不提供特点选项代替学生思考。不由儿子的一两句话推断他“自私、不孝”或认定他不爱妈妈。\n提示1：比较每个人表达感情的方式。\n提示2：儿子和女儿看语言、行动；“我”还要看心理与犹豫。"}, {"title": "儿子与女儿", "lines": ["儿子不愿赞美，说话直接。", "依据：拒听文章，并否定妹妹的赞美。", "女儿真诚欣赏，自然表达。", "依据：赞叹、重读文章、称赞新衣。"], "lesson": 3, "kind": "answer", "panel": null, "notes": "来源：课本 阅读放大镜三；第10段旁注后半问。任务身份：你做。\n接受证据支持的等义特点。不把“不愿赞美”扩大为“不孝、自私、不爱妈妈”。让学生比较自己的首次答案。\n参考：念文章、穿新衣时，儿子不愿赞美妈妈，说话直接，还否定妹妹的称赞；女儿真诚欣赏妈妈，既赞叹又重读文章。表达爱时，女儿自然、主动，写卡片说“我爱你们”；“我”虽然懂得感恩、善于反思，却不习惯直接表达，面对母亲害羞、低头、说话断续。两组比较表明：爱的语言能使家人感到温暖，应把爱真诚地表达出来。\n常见误区：不提供特点选项代替学生思考。不由儿子的一两句话推断他“自私、不孝”或认定他不爱妈妈。\n提示1：比较每个人表达感情的方式。\n提示2：儿子和女儿看语言、行动；“我”还要看心理与犹豫。"}, {"title": "女儿与“我”", "lines": ["女儿自然地把爱说出来，也写卡片。", "“我”心存感恩，懂得反思，", "却不习惯开口：害羞、低头、说话断续。", "证据必须解释具体特点。"], "lesson": 3, "kind": "answer", "panel": null, "notes": "来源：课本 阅读放大镜三；第10段旁注后半问。任务身份：你做。\n\n参考：念文章、穿新衣时，儿子不愿赞美妈妈，说话直接，还否定妹妹的称赞；女儿真诚欣赏妈妈，既赞叹又重读文章。表达爱时，女儿自然、主动，写卡片说“我爱你们”；“我”虽然懂得感恩、善于反思，却不习惯直接表达，面对母亲害羞、低头、说话断续。两组比较表明：爱的语言能使家人感到温暖，应把爱真诚地表达出来。\n常见误区：不提供特点选项代替学生思考。不由儿子的一两句话推断他“自私、不孝”或认定他不爱妈妈。\n提示1：比较每个人表达感情的方式。\n提示2：儿子和女儿看语言、行动；“我”还要看心理与犹豫。"}, {"title": "爱需不需要说出来", "lines": ["你认为对家人的爱需不需要用语言表达出来？", "说说你的理由。"], "lesson": 3, "kind": "question", "panel": null, "notes": "来源：课本 读后说。任务身份：你做。\n\n参考：我认为需要用真诚的语言表达爱，并配合行动。因为家人未必知道我们的感激，明确说出来能让他们感到被珍惜。例如文中的母亲已经同“我”住在一起，也为家里做事；“我”直接表达爱后，母亲重新唱起歌。这个变化说明，语言能把心里的爱清楚传达给家人，因此有机会时应真诚表达。\n常见误区：只写“因为这样很好”没有解释；只列做家务却不说明对方怎样感受到爱，例子关系不完整。\n提示1：解释为什么这种表达方式有帮助。\n提示2：可从家人的需要、可能的误会或行动的作用来解释。"}, {"title": "开放回应的四步", "lines": ["立场：我怎么看？", "理由：为什么？需要、影响或限制？", "例子：什么具体事情能说明？", "回扣：这个例子怎样支持我的立场？"], "lesson": 3, "kind": "teach", "panel": null, "notes": "来源：课本 读后说。任务身份：你做。\n\n参考：我认为需要用真诚的语言表达爱，并配合行动。因为家人未必知道我们的感激，明确说出来能让他们感到被珍惜。例如文中的母亲已经同“我”住在一起，也为家里做事；“我”直接表达爱后，母亲重新唱起歌。这个变化说明，语言能把心里的爱清楚传达给家人，因此有机会时应真诚表达。\n常见误区：只写“因为这样很好”没有解释；只列做家务却不说明对方怎样感受到爱，例子关系不完整。\n提示1：解释为什么这种表达方式有帮助。\n提示2：可从家人的需要、可能的误会或行动的作用来解释。"}, {"title": "一种合理的回答", "lines": ["我认为需要，也要配合行动。", "因为说出来能让家人明确感到被珍惜。", "文中“我”表达爱后，母亲重新唱歌，", "说明语言能把心里的爱传达给家人。"], "lesson": 3, "kind": "answer", "panel": null, "notes": "来源：课本 读后说。任务身份：你做。\n必须在学生独立提交后揭示。完整版参考答案见教师方案和网页；允许不同立场。\n参考：我认为需要用真诚的语言表达爱，并配合行动。因为家人未必知道我们的感激，明确说出来能让他们感到被珍惜。例如文中的母亲已经同“我”住在一起，也为家里做事；“我”直接表达爱后，母亲重新唱起歌。这个变化说明，语言能把心里的爱清楚传达给家人，因此有机会时应真诚表达。\n常见误区：只写“因为这样很好”没有解释；只列做家务却不说明对方怎样感受到爱，例子关系不完整。\n提示1：解释为什么这种表达方式有帮助。\n提示2：可从家人的需要、可能的误会或行动的作用来解释。"}, {"title": "另一种合理的方向", "lines": ["也可以认为“不一定需要用语言”。", "具体照顾也能让家人感受到爱。", "例子须说明对方如何感受到关心，", "并解释这怎样支持你的观点。"], "lesson": 3, "kind": "answer", "panel": null, "notes": "来源：课本 读后说。任务身份：你做。\n\n参考：我认为需要用真诚的语言表达爱，并配合行动。因为家人未必知道我们的感激，明确说出来能让他们感到被珍惜。例如文中的母亲已经同“我”住在一起，也为家里做事；“我”直接表达爱后，母亲重新唱起歌。这个变化说明，语言能把心里的爱清楚传达给家人，因此有机会时应真诚表达。\n常见误区：只写“因为这样很好”没有解释；只列做家务却不说明对方怎样感受到爱，例子关系不完整。\n提示1：解释为什么这种表达方式有帮助。\n提示2：可从家人的需要、可能的误会或行动的作用来解释。"}, {"title": "答案自检与订正", "lines": ["我的理由是否回答了“为什么”？", "例子是否具体、与立场一致？", "我有没有解释例子怎样支持观点？", "保留首次回答，在订正框补足。"], "lesson": 3, "kind": "teach", "panel": null, "notes": "不以关键词或字数自动评分。按四个意义单位分别反馈，教师复核。"}, {"title": "当堂整理", "lines": ["把不熟的词加入个人词语本。", "先回想，再翻卡核对。", "保存或导出首次回答与订正。", "当堂完成整理。"], "lesson": 3, "kind": "teach", "panel": null, "notes": "不加新短文、一周后小测或强制打卡。词语本与答案保存在同设备浏览器，可导出备份。"}];const $=s=>document.querySelector(s);let n=1;$('#slideSelect').innerHTML=SLIDES.map((s,i)=>`<option value="${i+1}">${i+1}. ${s.title}</option>`).join('');function show(){n=Math.max(1,Math.min(SLIDES.length,parseInt(location.hash.slice(1))||1));$('#slideImage').src='slides/slide-'+String(n).padStart(2,'0')+'.png';$('#slideImage').alt=SLIDES[n-1].title;$('#slideLabel').textContent=n+' / '+SLIDES.length;$('#notes').textContent=SLIDES[n-1].notes;$('#slideSelect').value=n;$('#prev').disabled=n===1;$('#next').disabled=n===SLIDES.length;}$('#prev').onclick=()=>location.hash=n-1;$('#next').onclick=()=>location.hash=n+1;$('#slideSelect').onchange=e=>location.hash=e.target.value;$('#full').onclick=()=>$('#projector').requestFullscreen?.();window.onhashchange=show;window.onkeydown=e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight'&&n<SLIDES.length)location.hash=n+1;if(e.key==='ArrowLeft'&&n>1)location.hash=n-1;};show();</script></body></html>
