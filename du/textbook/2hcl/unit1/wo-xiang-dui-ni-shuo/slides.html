<!doctype html><html lang="zh-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我想对你说 · 在线投影 · 华文通</title><link rel="stylesheet" href="../../../shared/lesson-v1/style.css?v=20261020-wx-1"><style>.concept b{color:var(--red)}.source-text,.text-full p{white-space:pre-line}.reading-links{display:flex;gap:12px;flex-wrap:wrap}</style></head><body><header class="site-header"><a href="../../../../../index.html"><img src="../../../../../assets/huawentong-logo.png" alt="华文通"></a><span>中二高级华文 · 单元一</span></header><main><p class="crumb"><a href="teacher.html">教师资料</a> / 在线投影</p><div class="toolbar"><select id="slideSelect" aria-label="选择课件页"></select></div><section class="projector" id="projector"><img id="slideImage" alt="课件"><div class="toolbar"><button id="prev">上一页</button><button id="next">下一页</button><button id="full">全屏</button><span class="slide-label" id="slideLabel"></span></div></section><details class="slide-notes"><summary>教师提示</summary><p id="notes"></p></details></main><script>const SLIDES=[{"title": "我想对你说", "lines": ["中二高级华文 · 单元一 · 生活空间", "一课时：读懂烦恼，学会表达"], "kind": "cover", "panel": null, "notes": "按课文消息顺序阅读。六条消息编号为六个教学段，并非教材原有段号。", "lesson": 1}, {"title": "想关心，却不知怎样开口", "lines": ["看见家人疲惫或不开心时，", "你会怎样表达关心？", "先说一种做法，再说明为什么。"], "kind": "question", "panel": null, "notes": "短导入3分钟。可使用假设情境，不要求学生公开家庭私事。", "lesson": 1}, {"title": "第一段 国明的留言", "lines": ["“我想安慰他，又怕打扰他，", "我不知道该怎么做。”", "他想做什么？又担心什么？"], "kind": "text", "panel": 3, "notes": "先在网页或课本读完整留言。画面帮助理解，答案回到原文。", "lesson": 1}, {"title": "国明的烦恼", "lines": ["哪一项最准确地概括国明的烦恼？", "A. 盼爸爸早点回家陪自己聊天", "B. 想关心爸爸又怕打扰到爸爸", "C. 想问爸爸为何每天加班工作", "D. 怕爸爸因自己成绩不好生气"], "kind": "question", "panel": null, "notes": "来源：课本《阅读放大镜》二：国明的烦恼；点选为教师支架。教师示范。先答后讲；烦恼不只是爸爸晚回家。国明卡在哪一步？", "lesson": 1}, {"title": "国明的烦恼", "lines": ["爸爸疲惫，而且不开心。", "国明想安慰，又怕打扰，不知怎样做。", "只写“爸爸晚回家”，还没说出他的两难。"], "kind": "answer", "panel": null, "notes": "爸爸的状态是背景，“想安慰，又怕打扰”才是国明左右为难之处。课文没有交代爸爸疲惫或不开心的具体原因。", "lesson": 1}, {"title": "第二段 辅导员的回应", "lines": ["“别犹豫，把你的关心直接表达出来。”", "“你可以写一张卡片为他打气，", "或者给他一个拥抱。”"], "kind": "text", "panel": null, "notes": "国明11:06；辅导员12:23。先读完整第二段，再挑出建议。", "lesson": 1}, {"title": "把关心表达出来", "lines": ["课文可以确定哪一件事？", "A. 国明已经送出亲手写的卡片", "B. 国明拥抱后爸爸露出了笑容", "C. 爸爸已向国明说明烦恼原因", "D. 辅导员鼓励国明主动表达关心"], "kind": "question", "panel": null, "notes": "来源：课本《阅读放大镜》二：国明一行；教参2.2。教师示范后师生共构。先答后讲；先分清辅导员的赞许和具体建议。", "lesson": 1}, {"title": "国明这一行怎么写", "lines": ["烦恼：想安慰爸爸，又怕打扰。", "建议：直接表达关心，", "可以写卡片打气，或给爸爸一个拥抱。"], "kind": "answer", "panel": null, "notes": "示范筛选与概括。写卡片、拥抱是建议；不能说已经发生或已经解决烦恼。网页保留可填写表格，课堂先口头共同整理。", "lesson": 1}, {"title": "第三段 美华的留言", "lines": ["“我因为和同学一起做小组作业，很晚才回家。”", "“妈妈就不分青红皂白地把我教训了一顿。”", "“我跟她解释，她却说我顶嘴，还说我越来越叛逆。”"], "kind": "text", "panel": null, "notes": "摘录原文，完整原文见网页。“却”提示解释没有被接受。不要把妈妈的评价直接当成人物事实。", "lesson": 1}, {"title": "美华为什么难过", "lines": ["哪一项最准确地概括美华的烦恼？", "A. 作业晚归遭责备且解释被误解", "B. 作业没完成却被妈妈催促回家", "C. 小组同学责怪她回家时间太早", "D. 想晚些回家却被妈妈提前接走"], "kind": "question", "panel": null, "notes": "来源：课本《阅读放大镜》二：美华的烦恼；点选为教师支架。师生共构。先答后讲；注意美华是在做什么，不要只看到“晚回家”。", "lesson": 1}, {"title": "美华的烦恼", "lines": ["做小组作业晚回家，妈妈没问清原因就责备。", "她想解释，却被说成顶嘴、叛逆。", "“委屈”：受到不应有的指责而难过。"], "kind": "answer", "panel": null, "notes": "“因为”交代晚回家的原因；“却”显示她想解释，但妈妈不接受。我们可以据此理解她的委屈，不把“叛逆”当作已经证实的特点。", "lesson": 1}, {"title": "第四段 先理解，再沟通", "lines": ["“你一定很委屈吧？”", "“如果没有，妈妈说你几句，也是可以理解的，你要体谅她。”", "“说不定她现在也很内疚”"], "kind": "text", "panel": null, "notes": "摘录。先在网页完整读第四段；明确“如果没有”承接是否提前告知，“说不定”表示可能。", "lesson": 1}, {"title": "辅导员给美华什么建议", "lines": ["先口头整理美华这一行。", "找出“怎样看待妈妈”与“下一步怎样做”。", "加入相关原句，可连续加入两句。"], "kind": "question", "panel": null, "notes": "课本《阅读放大镜》二：美华一行；教参2.2—2.3。师生共构。建议既包括理解对方，也包括下一步怎样做。", "lesson": 1}, {"title": "美华这一行怎么写", "lines": ["烦恼：晚归受责备，解释被当成顶嘴。", "建议：体谅妈妈的担心，找机会好好沟通。", "未确定：是否提前告知、妈妈是否已经内疚。"], "kind": "answer", "panel": null, "notes": "理解父母担心，不代表每种责备方式都合适。教参2.3追问：你对建议有什么看法？为什么？允许有理据的补充。", "lesson": 1}, {"title": "第五段 匿名同学的留言", "lines": ["“爸爸每天只允许我玩半个小时，", "还天天监督我。”", "“我在家根本没有自由”"], "kind": "text", "panel": 18, "notes": "摘录原文。“根本没有自由”是感受；“窒息”在语境中形容压抑。", "lesson": 1}, {"title": "游戏限制带来的烦恼", "lines": ["哪一项是同学明确说出的具体限制？", "A. 爸爸禁止他再接触电子游戏", "B. 爸爸要求他放学后一直读书", "C. 每天只准玩半小时并天天监督", "D. 游戏成绩不好就不准他出门"], "kind": "question", "panel": null, "notes": "来源：课本《阅读放大镜》二：匿名同学的烦恼；点选为教师支架。学生独立。先答后讲；不要把同学的强烈感受，直接当成所有事情的事实。", "lesson": 1}, {"title": "第六段 父母的顾虑", "lines": ["“有些人玩上瘾了，不但无心学习，\n和家人的关系也越来越疏远”", "“所以父母才会限制孩子玩游戏的时间。”", "“你设身处地从爸爸的角度想一想”"], "kind": "text", "panel": null, "notes": "摘录。阅读完整第六段。保留“有些人”和“也许”，不能断言匿名同学已经成瘾。", "lesson": 1}, {"title": "独立完成 匿名这一行", "lines": ["根据课文内容，写出三位同学的烦恼及辅导员的建议。", "现在独立完成“匿名”这一行。"], "kind": "question", "panel": null, "notes": "本课第一项书面任务。左栏具体限制及感受；右栏建议。原文取证后用自己的话填写。", "lesson": 1, "table": [["同学", "烦恼", "辅导员的建议"], ["匿名", "________", "________"]]}, {"title": "匿名这一行怎么写", "lines": ["烦恼：每天只准玩半小时，还受监督，", "因此觉得不自由、不被理解。", "建议：从爸爸角度想，体谅他对学习和", "家人关系受影响的担心。"], "kind": "answer", "panel": null, "notes": "各意义点独立核对。完整答案见教师手册。网页保留首次表格回答与订正，不自动评分这题。", "lesson": 1}, {"title": "为什么这个建议可能有帮助", "lines": ["先理解爸爸担心什么，", "才能商量双方可以接受的安排。", "“有些人”不等于“这位同学”；", "“也许”不保证问题马上解决。"], "kind": "answer", "panel": null, "notes": "口头说明关系，不要求额外长答。教参2.3：除了辅导员的建议，还有哪些方法？选一位同学说明做法及理由。", "lesson": 1}, {"title": "从课文找词语 一", "lines": ["1. 拿不定主意。", "2. 受到不应有的指责而心里难过。", "3. 内心感到惭愧。"], "kind": "question", "panel": null, "notes": "课本《阅读放大镜》一（1）—（3）。网页统一词语库点选，先回想再核对。", "lesson": 1}, {"title": "词语核对 一", "lines": ["1. 犹豫", "2. 委屈：受到不应有的指责。", "3. 内疚：自己觉得有亏欠而惭愧。"], "kind": "answer", "panel": null, "notes": "不要用词语本释义代替首次思考；辨清委屈与内疚的原因。", "lesson": 1}, {"title": "从课文找词语 二", "lines": ["4. 不写出姓名。", "5. 呼吸困难，甚至停止。", "6. 比喻关键问题解决了，其他相关问题就很容易解决。"], "kind": "question", "panel": null, "notes": "课本《阅读放大镜》一（4）—（6）。保留原题措辞。", "lesson": 1}, {"title": "词语核对 二", "lines": ["4. 匿名", "5. 窒息", "6. 迎刃而解", "“快要窒息了”在文中形容压抑。"], "kind": "answer", "panel": null, "notes": "第五项是基本义，人物说法是语境义。不要把它当作实际呼吸停止的报告。", "lesson": 1}, {"title": "我想对你说", "lines": ["每个人都会有烦恼，如果有机会，", "你想对父母或辅导员说些什么？", "为什么想说这些话？", "请用一个具体情境说明。"], "kind": "question", "panel": null, "notes": "课本《阅读放大镜》三。后两句为教师补充。第二项书面任务，必做3—4句。允许明确写假设，保护学生不愿分享的经历。", "lesson": 1}, {"title": "把想说的话说清楚", "lines": ["想说的话：希望对方理解什么？", "理由：为什么要说？", "例子：哪一个情境能说明？", "回扣：这样怎样帮助解决烦恼？"], "kind": "concept", "panel": null, "notes": "学生先写，下一页才揭示示例。允许请求帮助、表达感谢或提出不同意见；不要强制顺从父母。", "lesson": 1}, {"title": "回应示例 假设情境", "lines": ["妈妈，假如我因小组作业晚回家，希望您先听我解释，因为被当成顶嘴会让我难过。", "我会提前发消息说明地点和预计回家时间。", "这样您能放心，我们也能减少误会。"], "kind": "answer", "panel": null, "notes": "不是唯一答案。教师核对对象、理由、例子和联系。学生比较自己的回答并订正，不能只照抄示例。", "lesson": 1}, {"title": "当堂检查", "lines": ["三位同学：烦恼与建议有没有对应？", "有没有把“可能”写成“已经”？", "开放回应有没有说明为什么？", "订正后，收藏词语并导出学习记录。"], "kind": "concept", "panel": null, "notes": "最后2分钟。没有额外课后一周小测。记录保存在本机本浏览器；课后需要备份可导出，不自动收件。", "lesson": 1}];let n=1;$('#slideSelect').innerHTML=SLIDES.map((s,i)=>`<option value="${i+1}">${i+1}. ${s.title}</option>`).join('');function show(){n=Math.max(1,Math.min(SLIDES.length,parseInt(location.hash.slice(1))||1));$('#slideImage').src='slides/slide-'+String(n).padStart(2,'0')+'.png';$('#slideImage').alt=SLIDES[n-1].title;$('#slideLabel').textContent=n+' / '+SLIDES.length;$('#notes').textContent=SLIDES[n-1].notes;$('#slideSelect').value=n;$('#prev').disabled=n===1;$('#next').disabled=n===SLIDES.length;}$('#prev').onclick=()=>location.hash=n-1;$('#next').onclick=()=>location.hash=n+1;$('#slideSelect').onchange=e=>location.hash=e.target.value;$('#full').onclick=()=>$('#projector').requestFullscreen?.();window.onhashchange=show;window.onkeydown=e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight'&&n<SLIDES.length)location.hash=n+1;if(e.key==='ArrowLeft'&&n>1)location.hash=n-1;};show();</script></body></html>
