<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高级华文 · 开放题苏格拉底引导练习 v2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh;}
.app{max-width:800px;margin:0 auto;padding:1.5rem 1.25rem;}

/* ── 顶部栏 ── */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;}
.topbar h1{font-size:19px;font-weight:700;color:#1a1a1a;}
.mode-btns{display:flex;gap:6px;}
.mode-btn{padding:6px 14px;font-size:12px;font-weight:600;border:1px solid #d1d5db;border-radius:20px;cursor:pointer;background:#fff;color:#555;}
.mode-btn.active{background:#1d4ed8;color:#fff;border-color:#1d4ed8;}

/* ── 学生模式 ── */
.qtabs{display:flex;gap:6px;margin-bottom:1.25rem;flex-wrap:wrap;}
.qtab{padding:6px 14px;font-size:13px;border:1px solid #ccc;border-radius:8px;cursor:pointer;background:#fff;color:#555;}
.qtab:hover{background:#f0f0f0;}
.qtab.active{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd;font-weight:700;}
.qtab.done{border-color:#86efac;color:#166534;background:#f0fdf4;}

.qcard{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1.1rem 1.3rem;margin-bottom:1rem;}
.qcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.qcard-label{font-size:11px;font-weight:700;color:#1d4ed8;background:#dbeafe;padding:3px 9px;border-radius:5px;display:inline-block;margin-bottom:7px;flex-shrink:0;}
.qcard-text{font-size:15px;color:#1a1a1a;line-height:1.7;}
.qcard-marks{font-size:12px;color:#888;margin-top:5px;}
.speak-btn{background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;color:#0369a1;white-space:nowrap;flex-shrink:0;margin-top:2px;}
.speak-btn:hover{background:#e0f2fe;}
.speak-btn.speaking{background:#fef3c7;border-color:#fcd34d;color:#92400e;}

.progress-track{display:flex;gap:5px;margin-bottom:1rem;align-items:center;}
.prog-dot{width:28px;height:28px;border-radius:50%;border:1px solid #ccc;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#aaa;background:#fff;flex-shrink:0;}
.prog-dot.active{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd;}
.prog-dot.done{background:#dcfce7;color:#166534;border-color:#86efac;}
.prog-line{flex:1;height:1px;background:#e5e7eb;}

.step-box{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1.2rem;margin-bottom:1rem;}
.step-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px;}
.step-q{font-size:15px;color:#1a1a1a;line-height:1.6;font-weight:700;flex:1;}
.step-sub{font-size:13px;color:#555;margin-bottom:12px;line-height:1.55;}
textarea{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:10px 12px;font-size:14px;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#1a1a1a;background:#fff;resize:vertical;min-height:80px;line-height:1.6;}
textarea:focus{outline:none;border-color:#93c5fd;box-shadow:0 0 0 3px rgba(147,197,253,0.15);}
textarea:disabled{background:#f9fafb;color:#444;}
.btn-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
.btn-submit{padding:8px 18px;font-size:13px;font-weight:700;border:1px solid #93c5fd;border-radius:8px;cursor:pointer;background:#dbeafe;color:#1d4ed8;}
.btn-submit:hover{background:#bfdbfe;}
.btn-next{padding:8px 18px;font-size:13px;font-weight:700;border:1px solid #86efac;border-radius:8px;cursor:pointer;background:#dcfce7;color:#166534;display:none;}
.btn-next:hover{background:#bbf7d0;}
.btn-reset{padding:7px 13px;font-size:12px;border:1px solid #d1d5db;border-radius:8px;cursor:pointer;background:#fff;color:#888;}
.btn-reset:hover{background:#f3f4f6;}
.btn-grade{padding:8px 18px;font-size:13px;font-weight:700;border:1px solid #c4b5fd;border-radius:8px;cursor:pointer;background:#ede9fe;color:#6d28d9;display:none;}
.btn-grade:hover{background:#ddd6fe;}

.feedback{display:none;border-radius:8px;padding:10px 13px;margin-top:10px;font-size:13px;line-height:1.65;}
.feedback.good{background:#f0fdf4;color:#166534;border-left:3px solid #4ade80;}
.feedback.warn{background:#fffbeb;color:#92400e;border-left:3px solid #fbbf24;}

.history{margin-bottom:1rem;}
.hist-item{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:8px 12px;margin-bottom:6px;}
.hist-q{font-size:11px;color:#888;margin-bottom:2px;font-weight:700;}
.hist-a{font-size:13px;color:#1a1a1a;line-height:1.5;}

.done-banner{background:#f0fdf4;border:1px solid #86efac;border-radius:10px;padding:1rem 1.2rem;margin-bottom:1rem;font-size:14px;color:#166534;font-weight:700;}

.model-ans{display:none;background:#fff;border:1px solid #e5e7eb;border-left:3px solid #60a5fa;border-radius:10px;padding:1.1rem 1.25rem;margin-top:1rem;}
.model-ans.show{display:block;}
.ma-title{font-size:12px;font-weight:700;color:#1d4ed8;margin-bottom:11px;}
.ma-row{margin-bottom:9px;}
.ma-label{font-size:11px;color:#888;margin-bottom:2px;font-weight:700;}
.ma-text{font-size:14px;color:#1a1a1a;line-height:1.7;}
.ma-text em{font-style:normal;color:#1d4ed8;font-weight:700;}

/* AI批改区 */
.grade-box{background:#faf5ff;border:1px solid #c4b5fd;border-radius:12px;padding:1.2rem;margin-top:1rem;display:none;}
.grade-box.show{display:block;}
.grade-title{font-size:13px;font-weight:700;color:#6d28d9;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.grade-body{font-size:14px;color:#1a1a1a;line-height:1.8;white-space:pre-wrap;}
.grade-loading{font-size:13px;color:#7c3aed;font-style:italic;}

/* ── 老师模式 ── */
.teacher-panel{display:none;}
.teacher-panel.show{display:block;}
.t-section{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1.2rem;margin-bottom:1rem;}
.t-section h2{font-size:15px;font-weight:700;color:#1a1a1a;margin-bottom:4px;}
.t-section p{font-size:13px;color:#666;margin-bottom:12px;line-height:1.5;}
.t-label{font-size:12px;font-weight:700;color:#555;margin-bottom:5px;margin-top:10px;}
input[type=password],input[type=text]{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:9px 12px;font-size:14px;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#1a1a1a;background:#fff;}
input[type=password]:focus,input[type=text]:focus{outline:none;border-color:#93c5fd;}
.t-textarea{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:10px 12px;font-size:14px;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#1a1a1a;background:#fff;resize:vertical;min-height:100px;line-height:1.6;}
.t-textarea:focus{outline:none;border-color:#93c5fd;}
.btn-gen{padding:9px 22px;font-size:13px;font-weight:700;border:1px solid #86efac;border-radius:8px;cursor:pointer;background:#dcfce7;color:#166534;margin-top:10px;}
.btn-gen:hover{background:#bbf7d0;}
.btn-save-key{padding:8px 18px;font-size:13px;font-weight:700;border:1px solid #93c5fd;border-radius:8px;cursor:pointer;background:#dbeafe;color:#1d4ed8;margin-top:10px;}
.gen-output{background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:1rem;margin-top:12px;font-size:13px;color:#1a1a1a;line-height:1.8;white-space:pre-wrap;display:none;}
.gen-output.show{display:block;}
.btn-add-q{padding:8px 18px;font-size:13px;font-weight:700;border:1px solid #c4b5fd;border-radius:8px;cursor:pointer;background:#ede9fe;color:#6d28d9;margin-top:8px;display:none;}
.key-saved{font-size:12px;color:#166534;margin-top:6px;display:none;}

.q-list{margin-top:6px;}
.q-list-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:5px;background:#fff;font-size:13px;color:#1a1a1a;}
.btn-del{padding:3px 9px;font-size:11px;border:1px solid #fca5a5;border-radius:6px;cursor:pointer;background:#fee2e2;color:#b91c1c;}

.hidden{display:none!important;}
.spin{display:inline-block;animation:spin 1s linear infinite;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
/* 关键词点选 */
.kw-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px;}
.kw-chip{padding:5px 13px;font-size:13px;border:1.5px solid #93c5fd;border-radius:20px;cursor:pointer;background:#fff;color:#1d4ed8;font-family:"Microsoft YaHei","PingFang SC",sans-serif;}
.kw-chip:hover{background:#dbeafe;}
.kw-chip.selected{background:#1d4ed8;color:#fff;border-color:#1d4ed8;}

/* 角度选择 */
.angle-opts{display:flex;flex-direction:column;gap:7px;margin-bottom:8px;}
.angle-opt{padding:9px 14px;font-size:13px;border:1.5px solid #d1d5db;border-radius:8px;cursor:pointer;background:#fff;color:#374151;text-align:left;font-family:"Microsoft YaHei","PingFang SC",sans-serif;}
.angle-opt:hover{background:#f9fafb;border-color:#93c5fd;}
.angle-opt.selected{background:#dcfce7;color:#166534;border-color:#86efac;}

/* 解题准备标签 */
.prep-badge{display:inline-block;background:#fef3c7;color:#92400e;border:1px solid #fcd34d;border-radius:6px;font-size:11px;font-weight:700;padding:2px 8px;margin-right:6px;}
</style>
</head>
<body>
<div class="app">

<!-- 语音诊断 -->
<div id="diag-panel" style="background:#fefce8;border:1px solid #fcd34d;border-radius:10px;padding:1rem;margin-bottom:1rem;font-size:13px;">
  <strong>🔧 语音诊断工具</strong>（确认可用后可关闭）<br><br>
  <button onclick="diagTest()" style="padding:6px 14px;background:#fbbf24;border:1px solid #f59e0b;border-radius:6px;cursor:pointer;font-weight:600;margin-right:8px;">① 测试最简单的语音</button>
  <button onclick="diagList()" style="padding:6px 14px;background:#dbeafe;border:1px solid #93c5fd;border-radius:6px;cursor:pointer;font-weight:600;margin-right:8px;">② 列出所有可用声音</button>
  <button onclick="document.getElementById('diag-panel').style.display='none'" style="padding:6px 14px;background:#f3f4f6;border:1px solid #d1d5db;border-radius:6px;cursor:pointer;">隐藏诊断</button>
  <div id="diag-out" style="margin-top:10px;white-space:pre-wrap;font-family:monospace;font-size:12px;color:#1a1a1a;"></div>
</div>

<!-- 顶部 -->
<div class="topbar">
  <h1>📖 高级华文开放题练习</h1>
  <div class="mode-btns">
    <button class="mode-btn active" onclick="setMode('student')">学生模式</button>
    <button class="mode-btn" onclick="setMode('teacher')">老师模式</button>
  </div>
</div>

<!-- ══ 学生模式 ══ -->
<div id="student-panel">
  <div class="qtabs" id="qtabs"></div>
  <div id="qcontent"></div>
</div>

<!-- ══ 老师模式 ══ -->
<div class="teacher-panel" id="teacher-panel">

  <div class="t-section">
    <h2>🔑 设置 API Key</h2>
    <p>AI批改和AI生成题目都需要DeepSeek API Key，输入后保存在本地，不会上传到任何服务器。</p>
    <div class="t-label">DeepSeek API Key</div>
    <input type="password" id="api-key-input" placeholder="sk-..." />
    <br>
    <button class="btn-save-key" onclick="saveKey()">保存 Key</button>
    <div class="key-saved" id="key-saved">✅ Key 已保存</div>
  </div>

  <div class="t-section">
    <h2>✨ AI 生成新开放题</h2>
    <p>输入一段文章或题目要求，AI会自动生成符合格式的开放题、苏格拉底追问步骤和范文答案。</p>
    <div class="t-label">文章段落或题目要求（可以是中文或英文）</div>
    <textarea class="t-textarea" id="gen-input" placeholder="例如：文章中说「失败是成功之母」，请围绕这句话出一道开放题……&#10;或者直接贴入文章段落，AI会从中提炼题目。"></textarea>
    <div class="t-label" style="margin-top:10px;">分值设置</div>
    <input type="text" id="gen-marks" value="5分（说明3分+例子2分）" style="max-width:260px;" />
    <br>
    <button class="btn-gen" onclick="genQuestion()">🤖 生成题目</button>
    <div class="gen-output" id="gen-output"></div>
    <button class="btn-add-q" id="btn-add-q" onclick="addGenQuestion()">➕ 加入练习库</button>
  </div>

  <div class="t-section">
    <h2>📋 练习题目管理</h2>
    <p>当前练习库中的题目。系统预设 4 道题，AI生成的新题加入后可以在学生模式中看到。</p>
    <div class="q-list" id="q-list"></div>
  </div>

</div>
</div>

<script>
// ═══════════════════════════════════════════
// 题库（初始4题）
// ═══════════════════════════════════════════
var QBANK = [
  {
    label: '题目一',
    qtext: '作者认为「一个人的成功，是因为他有一些优秀的性格和品德」。你同意吗？试举生活中的例子加以说明。',
    marks: '共 5 分（说明 3 分 + 例子 2 分）',
    keywords: ['优秀的品德', '成功'],
    modelAns: [
      {label:'立场', text:'我同意。'},
      {label:'理由（正向）', text:'拥有<em>诚实、为他人着想</em>等优秀品德的人，能赢得别人的信任和合作机会，这是走向成功的重要基础。'},
      {label:'理由（反向）', text:'相反，一个缺乏品德的人，即使一时得逞，最终也会失去别人的信任，难以持久成功。'},
      {label:'例子', text:'一名推销员靠着<em>诚实</em>脱颖而出——他如实告知顾客产品的优缺点，把顾客需要放第一。顾客被他的诚意打动，销售成绩因此非常出色。这正是<em>优秀品德带来成功</em>的体现。'}
    ],
    modelAnsEn: [
      {label:'Position', text:'I agree with the author.'},
      {label:'Positive Reasoning', text:'A person with strong moral character — such as honesty and consideration for others — earns the trust and cooperation of those around them. This trust forms the foundation for lasting success.'},
      {label:'Counter Reasoning', text:'In contrast, a person who lacks good character may achieve short-term gains, but will eventually lose the trust of others and find it difficult to sustain any real success.'},
      {label:'Example', text:'Consider a salesperson who stood out through his honesty. He always gave customers a fair and accurate picture of his products, putting their needs before his own commission. Customers were moved by his sincerity and chose to buy from him, resulting in outstanding sales performance. This clearly shows how strong moral character leads to success.'}
    ],
    steps: [
      {type:'keyword', q:'解题准备：找出题目的关键词。', sub:'题目说「优秀的性格和品德」让人「成功」。请点选你认为最重要的关键词，然后说明它们之间的关系。', keywords:['优秀的品德','成功','性格','一个人'], ph:'关键词是「优秀的品德」和「成功」。有了优秀的品德，才能取得成功。', minLen:8, fb_good:'很好！抓住关键词是答题的第一步，你已经清楚题目在问什么了。', fb_warn:'请再想想：题目的核心是哪两个词？它们之间是什么关系？试着用「有了___，才能___」来表达。'},
      {type:'text', q:'第一步：表明立场。', sub:'你同意还是不同意？用一句话写出来。', ph:'我同意 / 我不同意，因为……', minLen:4, fb_good:'立场清楚，答题必须有这一句。', fb_warn:'请明确写出「我同意」或「我不同意」，立场不清楚会直接失分。'},
      {type:'angle', q:'第二步：选择你的分析角度。', sub:'想出理由有两个方向，你打算用哪个？（两个都用更有说服力）', options:['✅ 正向：有优秀品德 → 会怎样？（好处）','❌ 反向：没有品德 → 会怎样？（后果）','两个都用（最完整）'], ph:'我打算从正向/反向/两个方向来说理由……', minLen:4, fb_good:'好，选好角度，接下来就按这个方向想理由。', fb_warn:'请选择一个分析方向，这样你的理由才有结构。'},
      {type:'text', q:'第三步（正向）：有优秀品德的人，会有什么好处？', sub:'紧扣关键词「优秀品德」和「成功」：有这种品德的人会怎么做？别人会怎么对他？最终怎么成功？', ph:'有优秀品德的人会……别人会……所以他能……', minLen:12, fb_good:'说出了正向的因果关系，这是得分的核心。', fb_warn:'你的理由还不够清楚。请紧扣「品德→成功」这条线：有品德的人会做什么？因此别人会怎样对他？他怎么成功？'},
      {type:'text', q:'第四步（反向）：没有品德的人，会有什么后果？', sub:'从反面想：一个不诚实、不顾他人的人，别人会怎么看他？他能成功吗？', ph:'相反，一个缺乏品德的人会……别人会……所以他……', minLen:10, fb_good:'正反对比都有了，理由更有说服力。', fb_warn:'反面论证不够有力。请想：一个没有品德的人，短期内也许能得到一些东西，但长期结果会怎样？'},
      {type:'text', q:'第五步：举一个生活中的例子，紧扣关键词。', sub:'例子中必须出现「优秀品德」和「成功」这两个元素。结构：人物 → 他有什么品德 → 因此怎么成功。最后一句说明例子怎么扣回关键词。', ph:'例如：有一个人……他……（品德）……因此……（成功）。这说明有优秀的品德，才能……', minLen:20, fb_good:'例子完整，而且扣回了关键词，答得好。', fb_warn:'你的例子缺少了关键内容。请检查：①人物有什么品德？②他因为这个品德怎么成功？③最后有没有一句话扣回「品德→成功」？'},
      {type:'text', q:'第六步：总结，呼应立场。', sub:'用一句话把你的立场和关键词重新说一遍，让答案有始有终。', ph:'因此，我认为一个人的成功确实和他的……有关，因为……', minLen:8, fb_good:'有总结的答案更完整，印象分更好。', fb_warn:'总结太短。请用一句完整的话，把「品德」和「成功」都带进去，呼应你的立场。'}
    ]
  },
  {
    label: '题目二',
    qtext: '「救济是不是真的能帮助穷人？」这个问题对你有什么启发？试举生活中的例子加以说明。',
    marks: '共 4 分（说明 2 分 + 例子 2 分）',
    keywords: ['救济', '帮助穷人'],
    modelAns: [
      {label:'解释关键词', text:'「救济」是指给予物质上的帮助，例如给钱、给食物。'},
      {label:'启发（核心观点）', text:'单靠救济<em>不能真正帮助穷人</em>——长期接受救济会让人养成<em>依赖心理</em>，失去自力更生的动力，反而造成永久的贫穷。'},
      {label:'正确做法', text:'真正的帮助，是教穷人学习一技之长，让他们靠自己的努力改变生活。'},
      {label:'例子', text:'有些人长期靠政府援助度日，从不寻找工作，久而久之<em>丧失了自食其力的能力</em>。这说明：单靠救济，反而会让穷人<em>永远无法摆脱贫穷</em>。'}
    ],
    modelAnsEn: [
      {label:'Key Term', text:'The word "relief aid" refers to providing material assistance to those in need — for example, giving money or food.'},
      {label:'Core Insight', text:'This question teaches us that simply providing relief aid cannot truly help the poor. When people receive aid on a long-term basis, they tend to develop a mindset of dependency. They lose the motivation to support themselves, which ultimately traps them in permanent poverty.'},
      {label:'Better Approach', text:'The right way to help the poor is to equip them with practical skills and knowledge, so they can earn a living through their own efforts and break the cycle of poverty.'},
      {label:'Example', text:'Some people rely on government assistance for years without ever looking for work. Over time, they lose the ability and the will to support themselves. This shows that relying solely on relief aid does not solve the problem — it only makes the poor more dependent and less able to escape poverty on their own.'}

// 状态
// ═══════════════════════════════════════════
var curMode = 'student';
var curQ = 0;
var apiKey = localStorage.getItem('zuowen_key') || '';
// 平滑迁移：旧键名 hcw_api_key → zuowen_key
if (!apiKey) { var oldKey = localStorage.getItem('hcw_api_key'); if (oldKey) { apiKey = oldKey; localStorage.setItem('zuowen_key', oldKey); } }
var genResult = null; // 暂存AI生成的题目JSON

// 每道题的练习状态
function freshState() { return {step:0, answers:[], done:false, pv:''}; }
var STATE = QBANK.map(function(){ return freshState(); });

// ═══════════════════════════════════════════
// 模式切换
// ═══════════════════════════════════════════
function setMode(m) {
  if (m === 'teacher') {
    var pwd = prompt('请输入老师模式密码：');
    if (pwd !== 'nhhs20262026') {
      alert('密码错误，无法进入老师模式。');
      return;
    }
  }
  curMode = m;
  document.querySelectorAll('.mode-btn').forEach(function(b,i){
    b.classList.toggle('active', (i===0 && m==='student') || (i===1 && m==='teacher'));
  });
  document.getElementById('student-panel').style.display = m==='student' ? '' : 'none';
  var tp = document.getElementById('teacher-panel');
  tp.style.display = m==='teacher' ? 'block' : 'none';
  if (m==='teacher') { renderQList(); if(apiKey) { document.getElementById('api-key-input').value=apiKey; document.getElementById('key-saved').style.display='block'; } }
}

// ═══════════════════════════════════════════
// 渲染学生模式
// ═══════════════════════════════════════════
function renderTabs() {
  var html = '';
  QBANK.forEach(function(q, i){
    var cls = 'qtab' + (i===curQ?' active':'') + (STATE[i].done?' done':'');
    html += '<button class="' + cls + '" onclick="switchQ(' + i + ')">' + q.label + '</button>';
  });
  document.getElementById('qtabs').innerHTML = html;
}

function switchQ(i) {
  curQ = i;
  renderTabs();
  renderQ(i);
}

function renderQ(qi) {
  var q = QBANK[qi];
  var s = STATE[qi];
  var steps = q.steps;
  var html = '';

  // 题目卡片
  html += '<div class="qcard">';
  html += '<div class="qcard-top">';
  html += '<div><span class="qcard-label">' + q.label + '</span><div class="qcard-text">' + escHtml(q.qtext) + '</div><div class="qcard-marks">' + q.marks + '</div></div>';
  html += '<button class="speak-btn" id="speak-q-' + qi + '" onclick="speakText(' + qi + ', -1)">🔊 朗读题目</button>';
  html += '</div></div>';

  // 进度条
  html += '<div class="progress-track">';
  for (var i=0; i<steps.length; i++){
    var cls = 'prog-dot';
    if (i < s.step) cls='prog-dot done';
    else if (i===s.step && !s.done) cls='prog-dot active';
    var dotLabel = (i === 0) ? '准' : String(i); html += '<div class="' + cls + '">' + dotLabel + '</div>';
    if (i < steps.length-1) html += '<div class="prog-line"></div>';
  }
  html += '</div>';

  // 历史回答
  if (s.answers.length > 0) {
    html += '<div class="history">';
    for (var j=0; j<s.answers.length; j++){
      var lbl = steps[j].q.replace(/第.步[（）A-Za-z正反向：:]+/, '').replace('解题准备：','').trim();
      html += '<div class="hist-item"><div class="hist-q">第'+(j+1)+'步：'+escHtml(lbl)+'</div><div class="hist-a">'+escHtml(s.answers[j])+'</div></div>';
    }
    html += '</div>';
  }

  // 当前步骤 or 完成
  if (s.done) {
    html += '<div class="done-banner">✅ 你已完成所有步骤！请对照范文，看看自己答得怎样。</div>';
    // 批改按钮
    html += '<div class="btn-row">';
    html += '<button class="btn-grade" id="grade-btn-' + qi + '" style="display:inline-block" onclick="gradeAnswers(' + qi + ')">🤖 AI批改我的答案</button>';
    html += '<button class="btn-reset" onclick="resetQ(' + qi + ')">重新练习</button>';
    html += '</div>';
    // AI批改结果区
    html += '<div class="grade-box" id="grade-box-' + qi + '">' +
    '<div class="grade-title">🤖 AI批改结果' +
    '<button class="speak-btn" id="speak-grade-zh-' + qi + '" onclick="speakGrade(' + qi + ',\'zh\')" style="margin-left:8px;">🔊 中文朗读</button>' +
    '<button class="speak-btn" id="speak-grade-en-' + qi + '" onclick="speakGrade(' + qi + ',\'en\')" style="margin-left:6px;">🔊 English</button>' +
    '</div>' +
    '<div class="grade-body" id="grade-body-' + qi + '"></div></div>';
    // 范文
    html += '<div class="model-ans show" id="model-ans-' + qi + '">' +
    '<div class="ma-title" style="display:flex;align-items:center;gap:8px;">完整范文参考' +
    '<button class="speak-btn" id="speak-model-zh-' + qi + '" onclick="speakModel(' + qi + ',\'zh\')">🔊 中文朗读</button>' +
    '<button class="speak-btn" id="speak-model-en-' + qi + '" onclick="speakModel(' + qi + ',\'en\')">🔊 English</button>' +
    '</div>';
    q.modelAns.forEach(function(row){
      html += '<div class="ma-row"><div class="ma-label">'+row.label+'</div><div class="ma-text">'+row.text+'</div></div>';
    });
    html += '</div>';
  } else {
    var cur = steps[s.step];
    var isLast = s.step >= steps.length - 1;
    html += '<div class="step-box">';
    html += '<div class="step-head"><div class="step-q">' + escHtml(cur.q) + '</div>';
    html += '<button class="speak-btn" id="speak-s-' + qi + '" onclick="speakText(' + qi + ',' + s.step + ')">🔊 朗读</button></div>';
    html += '<div class="step-sub">' + escHtml(cur.sub) + '</div>';

    // 关键词点选步骤
    if (cur.type === 'keyword') {
      html += '<div class="kw-chips" id="kwchips' + qi + '">';
      cur.keywords.forEach(function(kw, ki) {
        html += '<button class="kw-chip" id="kwc' + qi + '_' + ki + '" onclick="toggleKw(' + qi + ',' + ki + ',this)">' + escHtml(kw) + '</button>';
      });
      html += '</div>';
      html += '<div class="step-sub" style="margin-top:6px;margin-bottom:8px;">点选关键词后，在下方说明它们之间的关系：</div>';
    }

    // 角度选择步骤

function doSubmit(qi) {
  var inp = document.getElementById('inp'+qi);
  var val = inp ? inp.value : '';
  var fb = document.getElementById('fb'+qi);
  var nxt = document.getElementById('nxt'+qi);
  var sub = document.getElementById('sub'+qi);
  var cur = QBANK[qi].steps[STATE[qi].step];

  if (!val.trim() || val.trim().length < 2) {
    fb.className='feedback warn'; fb.style.display='block';
    fb.textContent='请先填写你的回答，再提交。';
    return;
  }
  fb.style.display='block';
  if (val.trim().length >= cur.minLen) {
    fb.className='feedback good'; fb.textContent=cur.fb_good;
  } else {
    fb.className='feedback warn'; fb.textContent=cur.fb_warn;
  }
  inp.disabled=true;
  sub.style.display='none';
  nxt.style.display='inline-block';
  STATE[qi].pv=val;
}

function nextStep(qi) {
  var s = STATE[qi];
  s.answers.push(s.pv);
  s.step++;
  if (s.step >= QBANK[qi].steps.length) {
    s.done=true;
    document.querySelectorAll('.qtab')[qi] && document.querySelectorAll('.qtab')[qi].classList.add('done');
  }
  renderTabs();
  renderQ(qi);
}

function resetQ(qi) {
  STATE[qi] = freshState();
  renderTabs();
  renderQ(qi);
}

// ═══════════════════════════════════════════
// 语音核心：cancel后必须等50ms再speak
// ═══════════════════════════════════════════
function getBestVoice(lang) {
  var voices = window.speechSynthesis.getVoices();
  if (lang === 'zh') {
    var zhPriority = [
      'Microsoft Xiaoxiao Online (Natural) - Chinese (Mainland)',
      'Microsoft XiaoxiaoNeural',
      'Microsoft Xiaoxiao - Chinese (Mainland)',
      'Microsoft Huihui - Chinese (Mainland)',
      'Tingting', 'Meijia', 'Ting-Ting'
    ];
    for (var i=0; i<zhPriority.length; i++) {
      for (var j=0; j<voices.length; j++) {
        if (voices[j].name === zhPriority[i]) return voices[j];
      }
    }
    var zhPartial = ['Xiaoxiao','Huihui','Xiaoyi','Tingting','Meijia','Xiao'];
    for (var p=0; p<zhPartial.length; p++) {
      for (var j=0; j<voices.length; j++) {
        if (voices[j].name.indexOf(zhPartial[p]) !== -1 && voices[j].lang.indexOf('zh') !== -1) return voices[j];
      }
    }
    var malePat = /yunyang|yunxi|yunfeng|male|man|boy/i;
    for (var j=0; j<voices.length; j++) {
      if (voices[j].lang === 'zh-CN' && !malePat.test(voices[j].name)) return voices[j];
    }
    for (var j=0; j<voices.length; j++) {
      if (voices[j].lang.indexOf('zh') !== -1) return voices[j];
    }
  } else {
    var enFemale = ['Hazel','Kate','Serena','Moira','Fiona','Samantha','Karen','Victoria','Susan','Zira'];
    for (var i=0; i<enFemale.length; i++) {
      for (var j=0; j<voices.length; j++) {
        if (voices[j].name.indexOf(enFemale[i]) !== -1) return voices[j];
      }
    }
    for (var j=0; j<voices.length; j++) { if (voices[j].lang === 'en-GB') return voices[j]; }
    for (var j=0; j<voices.length; j++) { if (voices[j].lang === 'en-AU') return voices[j]; }
    for (var j=0; j<voices.length; j++) { if (voices[j].lang === 'en-US') return voices[j]; }
  }
  return null;
}

function doSpeak(text, lang) {
  if (!window.speechSynthesis) { alert('你的浏览器不支持语音功能。'); return; }
  window.speechSynthesis.cancel();
  setTimeout(function() {
    var utter = new SpeechSynthesisUtterance(text);
    if (lang === 'zh') {
      utter.lang = 'zh-CN'; utter.rate = 0.88; utter.pitch = 1.05;
    } else {
      utter.lang = 'en-GB'; utter.rate = 0.88; utter.pitch = 1.05;
    }
    var voice = getBestVoice(lang);
    if (voice) utter.voice = voice;
    window.speechSynthesis.speak(utter);
  }, 50);
}

function cleanForSpeech(t) {
  if (!t) return '';
  t = t.replace(/#{1,6} */g, '');
  t = t.replace(/\*\*/g, '');
  t = t.replace(/\*/g, '');
  t = t.replace(/^- /gm, '');
  t = t.replace(/^• /gm, '');
  t = t.replace(/`/g, '');
  t = t.replace(/【[^】]*】/g, '');
  t = t.replace(/\[[^\]]*\]/g, '');
  t = t.replace(/「[^」]*」/g, '');
  t = t.replace(/《[^》]*》/g, '');
  return t.trim();
}

        'x-deepseek-key': key


      },
      body: JSON.stringify({
        model: 'deepseek-v4-flash',
        max_tokens: 600,
        temperature: 0.3,
        messages: [{
          role: 'user',
          content: 'Translate the following Chinese feedback into clear, natural, professional English suitable for a secondary school student. Keep the structure and numbered points. Output only the translated text, nothing else.\n\n' + text
        }]
      })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (btn) { btn.disabled = false; }
      var enText = '';
      if (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) {
        enText = data.choices[0].message.content.trim();
      } else {
        if (btn) { btn.textContent = '🔊 English'; btn.style.background = ''; }
        alert('Translation failed. Please check your API Key.');
        return;
      }
      if (btn) { btn.textContent = '🔊 Reading…'; }
      window.speechSynthesis.cancel();
      setTimeout(function() {
        var utter = new SpeechSynthesisUtterance(enText);
        utter.lang = 'en-GB'; utter.rate = 0.88; utter.pitch = 1.0;
        var voice = getBestVoice('en');
        if (voice) utter.voice = voice;
        utter.onend = function() { if (btn) { btn.textContent = '🔊 English'; btn.style.background = ''; } };
        utter.onerror = function() { if (btn) { btn.textContent = '🔊 English'; btn.style.background = ''; } };
        window.speechSynthesis.speak(utter);
      }, 80);
    })
    .catch(function(e) {
      if (btn) { btn.textContent = '🔊 English'; btn.style.background = ''; btn.disabled = false; }
      alert('Network error: ' + e.message);
    });
  }
}

function speakModel(qi, lang) {
  var q = QBANK[qi];
  var text = '';
  if (lang === 'zh') {
    text = '完整范文参考。';
    q.modelAns.forEach(function(r) {
      text += r.label + '：' + r.text.replace(/<[^>]+>/g, '') + '。';
    });
  } else {
    // Use pre-written English translations stored in modelAnsEn
    if (q.modelAnsEn && q.modelAnsEn.length > 0) {
      text = 'Model answer reference. ';
      q.modelAnsEn.forEach(function(r) {
        text += r.label + '. ' + r.text.replace(/<[^>]+>/g, '') + ' ';
      });
    } else {
      text = 'No English translation available for this question.';
    }
  }
  if (!window.speechSynthesis) { alert('Your browser does not support speech. Please use Chrome or Edge.'); return; }
  var btn = document.getElementById('speak-model-' + lang + '-' + qi);
  if (btn) { btn.textContent = '🔊 朗读中…'; btn.style.background = '#fef3c7'; }
  window.speechSynthesis.cancel();
  setTimeout(function() {
    var utter = new SpeechSynthesisUtterance(text);
    if (lang === 'zh') { utter.lang = 'zh-CN'; utter.rate = 0.85; utter.pitch = 1.0; }
    else { utter.lang = 'en-GB'; utter.rate = 0.88; utter.pitch = 1.0; }
    var voice = getBestVoice(lang);
    if (voice) utter.voice = voice;
    utter.onend = function() {
      if (btn) { btn.textContent = lang === 'zh' ? '🔊 中文朗读' : '🔊 English'; btn.style.background = ''; }
    };
    utter.onerror = function() {
      if (btn) { btn.textContent = lang === 'zh' ? '🔊 中文朗读' : '🔊 English'; btn.style.background = ''; }
    };
    window.speechSynthesis.speak(utter);
  }, 80);
}

// ═══════════════════════════════════════════
// 语音诊断函数
// ═══════════════════════════════════════════
function diagTest() {
  var out = document.getElementById('diag-out');
  out.textContent = '正在测试…';
  if (!window.speechSynthesis) {
    out.textContent = '❌ 你的浏览器完全不支持 speechSynthesis。请改用 Chrome 或 Edge。';
    return;
  }
  // 最简单的测试：不选声音，直接speak
  window.speechSynthesis.cancel();
  setTimeout(function() {
    var u = new SpeechSynthesisUtterance('你好，语音测试。Hello, speech test.');
    u.onstart = function() { out.textContent += '\n✅ onstart 触发了（语音开始播放）'; };
    u.onend   = function() { out.textContent += '\n✅ onend 触发了（语音播放完毕）'; };
    u.onerror = function(e) { out.textContent += '\n❌ onerror: ' + e.error; };
    out.textContent = 'speechSynthesis 存在: ✅\n已调用 speak()，等待 onstart…';
    window.speechSynthesis.speak(u);
    setTimeout(function() {
      out.textContent += '\n（500ms后）pending: ' + window.speechSynthesis.pending +
                         '  speaking: ' + window.speechSynthesis.speaking +
                         '  paused: '   + window.speechSynthesis.paused;
    }, 500);
  }, 100);
}

function diagList() {
  var out = document.getElementById('diag-out');
  var voices = window.speechSynthesis.getVoices();
  if (!voices || voices.length === 0) {
    out.textContent = '⚠️ getVoices() 返回空数组。\n可能原因：\n1. 浏览器还未加载声音列表，请等2秒后再点。\n2. 设备没有安装语音包。';
    // try again after 1s
    setTimeout(function() {
      voices = window.speechSynthesis.getVoices();
      if (voices.length > 0) {
        showVoices(voices, out);
      } else {
        out.textContent += '\n1秒后重试仍为空。请确认：系统是否安装了TTS语音包？';
      }
    }, 1000);
    return;
  }
  showVoices(voices, out);
}

function showVoices(voices, out) {
  var lines = ['共找到 ' + voices.length + ' 个声音：\n'];
  voices.forEach(function(v, i) {
    lines.push((i+1) + '. [' + v.lang + '] ' + v.name + (v.default?' (默认)':''));
  });
  out.textContent = lines.join('\n');
}
