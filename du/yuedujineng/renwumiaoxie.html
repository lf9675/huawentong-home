<!DOCTYPE html>
<html lang="zh-SG">
<head>
    <meta charset="UTF-8">
    <title>人物描写：从句子看人物</title>
    <style>
        :root { --primary: #3498db; --secondary: #2ecc71; --accent: #e67e22; --bg: #f5f7fa; --text: #2c3e50; --wrong: #e74c3c; }
        body { font-family: 'Songti SC', SimSun, serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; line-height: 1.6; }
        .container { max-width: 950px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        
        .target-sentence-box { font-family: KaiTi, STKaiti, 'Kaiti SC', serif; background: #fffbe6; border-left: 6px solid #fadb14; padding: 15px 20px; border-radius: 8px; margin-bottom: 25px; font-size: 1.25em; line-height: 1.8; color: #333; }
        .target-sentence-box strong { color: #d46b08; font-size: 0.85em; display: block; margin-bottom: 5px; text-transform: uppercase; }

        .step-box { background: #fff; border: 2px solid #eef2f5; border-radius: 10px; padding: 20px; margin-bottom: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.02);}
        .step-title { font-size: 1.2em; font-weight: bold; color: var(--primary); margin-bottom: 15px; display: flex; align-items: center; }
        .step-title span { background: var(--primary); color: white; border-radius: 50%; width: 28px; height: 28px; display: inline-flex; justify-content: center; align-items: center; margin-right: 10px; font-size: 0.9em; }

        .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
        .btn-opt { font-family: KaiTi, STKaiti, 'Kaiti SC', serif; background: #f9f9f9; border: 2px solid #ddd; padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 1em; }
        .btn-opt:hover { border-color: var(--primary); background: #ebf5ff; }
        .btn-opt.selected { background: var(--primary); color: white; border-color: var(--primary); }

        .sentence-chunk { font-family: KaiTi, STKaiti, 'Kaiti SC', serif; display: inline-block; padding: 5px 8px; margin: 4px; background: #f0f4f8; border-radius: 5px; cursor: pointer; font-size: 1.2em; border: 2px solid transparent; transition: 0.3s; }
        .sentence-chunk:hover { background: #e2e8f0; }
        .sentence-chunk.selected { background: #e6f7ff; border-color: #91d5ff; color: #0958d9; }

        .word-bank { display: flex; flex-wrap: wrap; gap: 10px; padding: 15px; background: #fafafa; border-radius: 8px; border: 1px dashed #ccc; }
        .word-chip { font-family: KaiTi, STKaiti, 'Kaiti SC', serif; background: white; border: 1px solid #bbb; padding: 8px 15px; border-radius: 20px; cursor: pointer; transition: 0.2s; font-size: 1.05em; }
        .word-chip:hover { background: #e8f4fd; }
        .word-chip.selected { background: var(--secondary); color: white; border-color: var(--secondary); }

        .formula-hint { background: #e6f7ff; padding: 12px; border-left: 4px solid #1890ff; margin-bottom: 15px; font-size: 0.95em; color: #0050b3; }
        textarea { font-family: KaiTi, STKaiti, 'Kaiti SC', serif; width: 100%; height: 100px; padding: 15px; border: 2px solid #ccc; border-radius: 8px; font-size: 1.1em; font-family: inherit; resize: vertical; box-sizing: border-box; }
        textarea:focus { border-color: var(--primary); outline: none; }

        .btn-submit { display: block; width: 100%; padding: 15px; font-size: 1.2em; font-weight: bold; color: white; background: var(--accent); border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .btn-submit:hover { background: #d35400; }
        
        .feedback-area { margin-top: 20px; padding: 20px; border-radius: 8px; display: none; font-size: 1.1em; line-height: 1.6; }
        .btn-next { display: none; width: 100%; padding: 15px; font-size: 1.2em; font-weight: bold; color: white; background: var(--secondary); border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; }

        .reference-box { margin-top: 18px; padding: 18px; border-radius: 10px; background: #f6ffed; border: 1px solid #b7eb8f; }
        .reference-box h3 { margin: 0 0 12px; color: #237804; }
        .reference-answer { font-family: KaiTi, STKaiti, 'Kaiti SC', serif; font-size: 1.08em; line-height: 1.8; }
        .reference-meta { margin-top: 12px; font-size: 0.95em; line-height: 1.7; color: #445; }
        .answer-status { margin-top: 8px; color: #6b7280; font-size: 0.92em; }
        .attempt-warning { margin-top: 12px; padding: 10px 12px; background: #fff7e6; border-left: 4px solid #fa8c16; border-radius: 6px; color: #874d00; display: none; }

        .progress-text { text-align: center; color: #7f8c8d; font-weight: bold; margin-bottom: 20px; font-size: 1.1em; }
    </style>
</head>
<body>

<div class="container">
    <h1>人物描写：从句子看人物</h1>
    <div class="progress-text" id="progress-text">第 1 / 10 题</div>
    <div id="game-area"></div>
</div>

<script>
    // --- 10 道课文人物描写题 ---
    const questions = [
        {
            source: "《母与女》",
            fullSentence: "她小心地打开皮包，拿纸巾，擦鼻子，又小心地调整身体的姿势。自始至终，她的右肩动也不敢动。",
            chunks: [
                {text: "她", isKey: false},
                {text: "小心地打开皮包，拿纸巾，擦鼻子，", isKey: true},
                {text: "又", isKey: false},
                {text: "小心地调整身体的姿势。", isKey: true},
                {text: "自始至终，她的右肩", isKey: false},
                {text: "动也不敢动。", isKey: true}
            ],
            method: "行动描写 / 动作描写",
            traits: ["体贴", "关爱女儿", "细心"],
            traitOptions: ["体贴", "关爱女儿", "细心", "冷漠", "粗心大意", "严厉"],
            person: "母亲",
            standardAnswer: "通过母亲小心取纸巾、调整姿势，而且始终不敢移动右肩的行动描写，表现了母亲怕惊醒女儿、处处为女儿着想的体贴与关爱。"
        },
        {
            source: "《我现在要去救人》",
            fullSentence: "曾喆身穿白衬衫，戴着手套。面对死亡的威胁，他的表情仍然很镇静。",
            chunks: [
                {text: "曾喆身穿白衬衫，戴着手套。", isKey: false},
                {text: "面对死亡的威胁，", isKey: false},
                {text: "他的表情仍然很镇静。", isKey: true}
            ],
            method: "肖像描写 / 外貌描写",
            traits: ["镇静", "沉着", "勇敢"],
            traitOptions: ["镇静", "沉着", "勇敢", "紧张", "鲁莽", "冷漠"],
            person: "曾喆",
            standardAnswer: "通过曾喆面对死亡威胁时仍然镇静的神态描写，表现了他临危不乱、沉着勇敢的特点。"
        },
        {
            source: "《幸运饺子》",
            fullSentence: "奶奶对全家人说：“儿媳妇既要工作，又要照顾一家老小，是这个家里最辛苦的人。希望她在新的一年天天幸福快乐！”",
            chunks: [
                {text: "奶奶对全家人说：", isKey: false},
                {text: "“儿媳妇既要工作，又要照顾一家老小，", isKey: true},
                {text: "是这个家里最辛苦的人。", isKey: true},
                {text: "希望她在新的一年天天幸福快乐！”", isKey: true}
            ],
            method: "语言描写",
            traits: ["体贴", "善解人意", "关心家人"],
            traitOptions: ["体贴", "善解人意", "关心家人", "自私", "冷漠", "严厉"],
            person: "奶奶",
            standardAnswer: "通过奶奶体谅儿媳妇工作又照顾家庭的辛苦，并祝福她幸福快乐的语言描写，表现了奶奶体贴、善解人意和关心家人的特点。"
        },
        {
            source: "《迟到》",
            fullSentence: "我刚平静下来的心一下子又提到了嗓子眼！爸爸为什么追到学校来？",
            chunks: [
                {text: "我刚平静下来的心", isKey: false},
                {text: "一下子又提到了嗓子眼！", isKey: true},
                {text: "爸爸为什么追到学校来？", isKey: true}
            ],
            method: "心理描写",
            traits: ["紧张", "害怕", "不安"],
            traitOptions: ["紧张", "害怕", "不安", "开心", "自信", "得意"],
            person: "我",
            standardAnswer: "通过“心一下子又提到了嗓子眼”和对爸爸为什么追到学校来的疑问，表现了“我”看到爸爸来到学校时紧张、不安的心理。"
        },
        {
            source: "《一个蛋两个蛋三个蛋》",
            fullSentence: "第二天，他小心翼翼地用纸巾把蛋层层包好，放进裤兜，这样果然安全多了。",
            chunks: [
                {text: "第二天，他", isKey: false},
                {text: "小心翼翼地", isKey: true},
                {text: "用纸巾把蛋层层包好，", isKey: true},
                {text: "放进裤兜，", isKey: true},
                {text: "这样果然安全多了。", isKey: false}
            ],
            method: "行动描写 / 动作描写",
            traits: ["小心谨慎", "认真", "有责任心"],
            traitOptions: ["小心谨慎", "认真", "有责任心", "粗心大意", "敷衍", "冲动"],
            person: "马小跳",
            standardAnswer: "通过马小跳小心翼翼地把鸡蛋层层包好并放进裤兜的行动描写，表现了他这次保护鸡蛋时十分小心、认真，也开始表现出责任心。"
        },
        {
            source: "《最美的姿势》",
            fullSentence: "陈老师笑着大声说：“你错了，这个世界上每个人都有自己最美丽的姿势，都可以为这个世界留下最美的镜头！”",
            chunks: [
                {text: "陈老师笑着大声说：", isKey: false},
                {text: "“你错了，", isKey: false},
                {text: "这个世界上每个人都有自己最美丽的姿势，", isKey: true},
                {text: "都可以为这个世界留下最美的镜头！”", isKey: true}
            ],
            method: "语言描写",
            traits: ["善解人意", "鼓励学生", "关爱学生"],
            traitOptions: ["善解人意", "鼓励学生", "关爱学生", "冷漠", "严厉", "不耐烦"],
            person: "陈老师",
            standardAnswer: "通过陈老师肯定每个人都有自己最美丽的姿势、鼓励宜欣留下最美镜头的语言描写，表现了她善解人意、懂得鼓励和关爱学生。"
        },
        {
            source: "《放风筝》",
            fullSentence: "爸爸则两眼布满血丝，神色焦虑。",
            chunks: [
                {text: "爸爸则", isKey: false},
                {text: "两眼布满血丝，", isKey: true},
                {text: "神色焦虑。", isKey: true}
            ],
            method: "肖像描写 / 外貌描写",
            traits: ["焦虑", "担心", "关心孩子"],
            traitOptions: ["焦虑", "担心", "关心孩子", "生气", "冷漠", "得意"],
            person: "爸爸",
            standardAnswer: "通过爸爸两眼布满血丝、神色焦虑的外貌和神态描写，表现了他因为孩子晚归而十分焦虑、担心，体现了他对孩子的关心。"
        },
        {
            source: "《最美的姿势》",
            fullSentence: "大家都兴致勃勃，叽叽喳喳地讨论着摆什么姿势好。我的心却沉到了谷底。",
            chunks: [
                {text: "大家都兴致勃勃，叽叽喳喳地讨论着摆什么姿势好。", isKey: false},
                {text: "我的心却沉到了谷底。", isKey: true}
            ],
            method: "心理描写",
            traits: ["自卑", "沮丧", "不安"],
            traitOptions: ["自卑", "沮丧", "不安", "自信", "兴奋", "得意"],
            person: "我",
            standardAnswer: "通过“我的心却沉到了谷底”的心理描写，表现了“我”想到要在同学面前拍照时非常自卑、沮丧和不安。"
        },
        {
            source: "《一个蛋两个蛋三个蛋》",
            fullSentence: "“赔我一百个我都不要，我就要这一个！”马小跳哭得更伤心了，“这是我保护了一天的鸡蛋，呜呜呜……”",
            chunks: [
                {text: "“赔我一百个我都不要，", isKey: true},
                {text: "我就要这一个！”", isKey: true},
                {text: "马小跳哭得更伤心了，", isKey: false},
                {text: "“这是我保护了一天的鸡蛋，", isKey: true},
                {text: "呜呜呜……”", isKey: false}
            ],
            method: "语言描写",
            traits: ["珍惜", "重视责任", "有责任心"],
            traitOptions: ["珍惜", "重视责任", "有责任心", "自私", "冷漠", "无所谓"],
            person: "马小跳",
            standardAnswer: "通过马小跳坚持不要赔偿、只要自己保护了一天的那个鸡蛋的语言描写，表现了他十分珍惜自己的劳动成果，也开始懂得重视责任。"
        },
        {
            source: "《我与父亲的秘密》",
            fullSentence: "父亲没有再说什么，只是默默地在一边帮我拾掇在学校寄宿需要用到的东西。",
            chunks: [
                {text: "父亲没有再说什么，", isKey: false},
                {text: "只是默默地", isKey: true},
                {text: "在一边帮我拾掇", isKey: true},
                {text: "在学校寄宿需要用到的东西。", isKey: true}
            ],
            method: "行动描写 / 动作描写",
            traits: ["关爱孩子", "体贴", "默默付出"],
            traitOptions: ["关爱孩子", "体贴", "默默付出", "冷漠", "自私", "粗心"],
            person: "父亲",
            standardAnswer: "通过父亲不多说话，却默默替“我”收拾寄宿用品的行动描写，表现了父亲体贴孩子、默默付出的深沉父爱。"
        }
    ];

    // 描写手法选项
    const methodOptions = ["肖像描写 / 外貌描写", "语言描写", "行动描写 / 动作描写", "心理描写"];
    let currentIdx = 0;
    let selectedMethod = "";
    let hasViewedReference = false;
    let firstAnswerSnapshot = "";

    function shuffleArray(array) { return array.sort(() => Math.random() - 0.5); }

    function renderQuestion() {
        const q = questions[currentIdx];
        const area = document.getElementById('game-area');

        selectedMethod = "";
        hasViewedReference = false;
        firstAnswerSnapshot = localStorage.getItem(`renwumiaoxie:first:${currentIdx}`) || "";
        const shuffledTraits = shuffleArray([...q.traitOptions]);
        const savedAnswer = localStorage.getItem(`renwumiaoxie:answer:${currentIdx}`) || "";

        let html = `
            <div class="target-sentence-box">
                <strong>Read the sentence（读句子）</strong>
                ${q.fullSentence}
                <div style="margin-top:8px; font-size:0.8em; color:#7f8c8d;">课文：${q.source}</div>
            </div>

            <div class="step-box">
                <div class="step-title"><span>1</span> Method（描写手法）</div>
                <div class="options-grid">
                    ${methodOptions.map(m => `<button class="btn-opt method-btn" onclick="selectMethod('${m}', this)">${m}</button>`).join('')}
                </div>
            </div>

            <div class="step-box">
                <div class="step-title"><span>2</span> Key words（关键词）</div>
                <div class="formula-hint">Tap the words that help you understand the character.（点击最能帮助你判断人物的词句）</div>
                <div style="line-height: 2.2;">
                    ${q.chunks.map((chunk, index) => `
                        <span class="sentence-chunk" data-index="${index}" onclick="handleChunkClick(this)">
                            ${chunk.text}
                        </span>
                    `).join('')}
                </div>
            </div>

            <div class="step-box">
                <div class="step-title"><span>3</span> Character / feeling（人物特点／心情）</div>
                <div class="word-bank">
                    ${shuffledTraits.map(t => `<span class="word-chip trait-chip" onclick="this.classList.toggle('selected')">${t}</span>`).join('')}
                </div>
            </div>

            <div class="step-box">
                <div class="step-title"><span>4</span> Explain（完整分析）</div>
                <div class="formula-hint">
                    Use the evidence, not just a label.（不要只写一个性格词）<br>
                    <b>句式：</b>通过……描写，表现了【谁】在【什么情况下】的【特点／心情】。
                </div>
                <textarea id="final-answer" placeholder="先写下自己的答案，再看参考答案。"></textarea>
                <div class="answer-status" id="answer-status">未看参考答案</div>
                <div class="attempt-warning" id="attempt-warning">Write your own answer first.（先写下自己的答案）</div>
            </div>

            <button class="btn-submit" id="btn-reference" onclick="revealReference()">查看参考答案</button>

            <div id="feedback-area" class="feedback-area"></div>
            <button class="btn-next" id="btn-next" onclick="nextQuestion()">下一题 ➔</button>
        `;

        area.innerHTML = html;
        const textarea = document.getElementById('final-answer');
        textarea.value = savedAnswer;
        textarea.addEventListener('input', () => {
            localStorage.setItem(`renwumiaoxie:answer:${currentIdx}`, textarea.value);
            if (hasViewedReference) {
                document.getElementById('answer-status').innerText = "已看参考 · 已修改";
            }
        });
        document.getElementById('progress-text').innerText = `第 ${currentIdx + 1} / ${questions.length} 题`;
    }

    function selectMethod(m, btn) {
        selectedMethod = m;
        document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function handleChunkClick(el) {
        el.classList.toggle('selected');
    }

    function hasMeaningfulAttempt(text) {
        return /[\\p{L}\\p{N}]/u.test(text);
    }

    function revealReference() {
        const q = questions[currentIdx];
        const textarea = document.getElementById('final-answer');
        const typedText = textarea.value.trim();
        const warning = document.getElementById('attempt-warning');
        const feedback = document.getElementById('feedback-area');

        if (!hasMeaningfulAttempt(typedText)) {
            warning.style.display = 'block';
            textarea.focus();
            return;
        }

        warning.style.display = 'none';

        if (!firstAnswerSnapshot) {
            firstAnswerSnapshot = typedText;
            localStorage.setItem(`renwumiaoxie:first:${currentIdx}`, firstAnswerSnapshot);
        }

        hasViewedReference = true;
        document.getElementById('answer-status').innerText = "已看参考 · 可直接修改上面的答案";
        document.getElementById('btn-reference').style.display = 'none';
        document.getElementById('btn-next').style.display = 'block';

        const keyWords = q.chunks.filter(c => c.isKey).map(c => c.text).join(" / ");

        feedback.style.display = 'block';
        feedback.style.background = "#fff";
        feedback.style.border = "1px solid #d9d9d9";
        feedback.innerHTML = `
            <div class="reference-box">
                <h3>Reference（参考答案）</h3>
                <div class="reference-answer">${q.standardAnswer}</div>
                <div class="reference-meta">
                    <b>Method（手法）:</b> ${q.method}<br>
                    <b>Key words（关键词）:</b> <span style="font-family:KaiTi,STKaiti,'Kaiti SC',serif;">${keyWords}</span><br>
                    <b>Character / feeling（人物特点／心情）:</b> ${q.traits.join("、")}<br>
                    <b>Why?</b> The answer links the evidence to the character or feeling.（答案要说明“这些词句怎样表现人物”）
                </div>
            </div>
        `;
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
            renderQuestion();
        } else {
            document.getElementById('game-area').innerHTML = `
                <div style="text-align:center; padding: 40px;">
                    <h2 style="color:var(--primary);">已完成 10 题</h2>
                    <p style="font-size:1.1em;">Review（回看）：哪一种描写最容易判断错？哪些词真正支持你的判断？</p>
                    <button class="btn-submit" style="width:220px; margin:30px auto;" onclick="location.reload()">重新练习</button>
                </div>
            `;
            document.getElementById('progress-text').innerText = "练习完成";
        }
    }

    // 页面加载后显示第一题
    renderQuestion();
</script>
</body>
</html>
