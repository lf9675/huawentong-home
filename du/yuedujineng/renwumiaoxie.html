        {

            person: "曾喆",
            standardAnswer: "“表情仍然很镇静”运用外貌／神态描写，表现了曾喆镇静、勇敢。"
        },
        {
            source: "《幸运饺子》",
            context: "我把幸运饺子夹给奶奶，奶奶又把它夹到妈妈的碗里。",

            fullSentence: "奶奶对全家人说：“儿媳妇既要工作，又要照顾一家老小，是这个家里最辛苦的人。希望她在新的一年天天幸福快乐！”",
            chunks: [
                {text: "奶奶对全家人说：", isKey: false},

            analysisNote: "陈老师不是只称赞宜欣，而是用话语改变她看待自己的角度，帮助她建立信心。因此重点是理解学生、鼓励学生和关爱学生，不只是“乐观”。",
            person: "陈老师",
            standardAnswer: "“每个人都有自己最美丽的姿势”运用语言描写，表现了陈老师善解人意、会鼓励学生。"
        },
        {
            source: "《放风筝》",
            context: "“我”晚上十点半才回家，发现爸爸妈妈还坐在沙发上等“我”。",
            grade: 2,
            fullSentence: "爸爸则两眼布满血丝，神色焦虑。",
            chunks: [
                {text: "爸爸则", isKey: false},
                {text: "两眼布满血丝，", isKey: true},
                {text: "神色焦虑。", isKey: true}

            method: "肖像描写 / 外貌描写",

    let activeQuestions = [];
    let currentIdx = 0;
    let selectedMethod = "";
    let hasViewedReference = false;
    let firstAnswerSnapshot = "";

    function renderSetup() {
        selectedGrade = null;
        document.getElementById('practice-area').style.display = 'none';
        const setup = document.getElementById('setup-area');
        setup.style.display = 'block';
        setup.innerHTML = `
            <div class="setup-hero">
                <h2>人物描写分析</h2>
                <p>Choose your level（选择年级）。题目只使用该年级学过的课文。</p>
            </div>
            <div class="grade-label">选择年级</div>
            <div class="grade-grid">
                <button class="grade-btn" id="grade-1" onclick="selectGrade(1)">
                    <strong>中一</strong>
                    <small>Secondary 1 · 识别描写 + 直接判断</small>
                </button>
                <button class="grade-btn" id="grade-2" onclick="selectGrade(2)">
                    <strong>中二</strong>
                    <small>Secondary 2 · 证据 + 解释关系</small>
                </button>
            </div>
            <button class="start-btn" id="start-btn" onclick="startPractice()" disabled>开始练习</button>
        `;
    }

    function selectGrade(grade) {
        selectedGrade = grade;
        document.querySelectorAll('.grade-btn').forEach(btn => btn.classList.remove('selected'));
        document.getElementById(`grade-${grade}`).classList.add('selected');
        document.getElementById('start-btn').disabled = false;
    }

    function startPractice() {
        if (!selectedGrade) return;
        activeQuestions = allQuestions.filter(q => q.grade === selectedGrade);
        currentIdx = 0;
        document.getElementById('setup-area').style.display = 'none';
        document.getElementById('practice-area').style.display = 'block';
        document.getElementById('grade-pill').innerText = selectedGrade === 1 ? '中一 · Secondary 1' : '中二 · Secondary 2';
        document.getElementById('level-note').innerHTML = selectedGrade === 1
            ? '<b>Focus（重点）:</b> 看懂人物说／做／想／神态。<br><b>Steps（步骤）:</b> ① 判手法 → ② 抓直接线索 → ③ 判断心情／特点 → ④ 套公式作答'
            : '<b>Focus（重点）:</b> 说明“证据为什么能支持这个判断”。<br><b>Steps（步骤）:</b> ① 判手法 → ② 找证据 → ③ 判断人物 → ④ 用证据套公式作答';
        renderQuestion();
    }

    function backToSetup() {
        renderSetup();
    }

    function shuffleArray(array) { return array.sort(() => Math.random() - 0.5); }

    function renderQuestion() {
        const q = activeQuestions[currentIdx];
        const area = document.getElementById('game-area');

        selectedMethod = "";
        hasViewedReference = false;
        firstAnswerSnapshot = localStorage.getItem(`renwumiaoxie:${selectedGrade}:first:${currentIdx}`) || "";
        const shuffledTraits = shuffleArray([...q.traitOptions]);
        const savedAnswer = localStorage.getItem(`renwumiaoxie:${selectedGrade}:answer:${currentIdx}`) || "";

        const step2Title = selectedGrade === 1 ? 'Direct clue（直接线索）' : 'Evidence（证据）';
        const step2Hint = selectedGrade === 1
            ? 'Tap the words that directly show what the person says, does, thinks or looks like.（点击直接表现人物的词句）'
            : 'Select the evidence that best supports your interpretation.（选择最能支持你判断的证据）';
        const step3Title = selectedGrade === 1 ? 'What does it show?（表现什么）' : 'Interpretation（解释）';
        const answerFormat = selectedGrade === 1
            ? '通过【____描写】，表现了【人物】【____的心情／特点】。'
            : '“【关键词】”运用【____描写】，表现了【人物】【____的心情／特点】。';

        let html = `
            <div class="target-sentence-box">
                <strong>Read the sentence（读句子）</strong>
                <div class="context-box"><b>Context（语境）:</b> ${q.context}</div>
                ${q.fullSentence}
                <div style="margin-top:8px; font-size:0.8em; color:#7f8c8d;">课文：${q.source}</div>
            </div>

            <div class="step-box">
                <div class="step-title"><span>1</span> Method（描写手法）</div>
                <div class="options-grid">
                    ${methodOptions.map(m => `<button class="btn-opt method-btn" onclick="selectMethod('${m}', this)">${m}</button>`).join('')}
                </div>
            </div>

            <div class="step-box">
                <div class="step-title"><span>2</span> ${step2Title}</div>
                <div class="formula-hint">${step2Hint}</div>
                <div style="line-height: 2.2;">
                    ${q.chunks.map((chunk, index) => `
                        <span class="sentence-chunk" data-index="${index}" onclick="handleChunkClick(this)">
                            ${chunk.text}
                        </span>
                    `).join('')}
                </div>
            </div>

            <div class="step-box">
                <div class="step-title"><span>3</span> ${step3Title}</div>
                <div class="word-bank">
                    ${shuffledTraits.map(t => `<span class="word-chip trait-chip" onclick="this.classList.toggle('selected')">${t}</span>`).join('')}
                </div>
            </div>

            <div class="step-box">
                <div class="step-title"><span>4</span> Explain（完整分析）</div>
                <div class="formula-hint">
                    ${selectedGrade === 1 ? 'Answer the key point only.（答到重点即可）' : 'Use one key piece of evidence.（用一个关键证据即可）'}
                    <div class="format-box">
                        <div class="format-row">
                            <div class="format-text" id="answer-format">${answerFormat}</div>
                            <button type="button" class="copy-format-btn" onclick="copyAnswerFormat()">Copy format</button>
                        </div>
                    </div>
                </div>
                <textarea id="final-answer" placeholder="先写下自己的答案，再看参考答案。"></textarea>
                <div class="answer-status" id="answer-status">未看参考答案</div>
                <div class="attempt-warning" id="attempt-warning">Write your own answer first.（先写下自己的答案）</div>
            </div>

            <button class="btn-submit" id="btn-reference" onclick="revealReference()">查看参考答案</button>

            <div id="feedback-area" class="feedback-area"></div>
            <button class="btn-next" id="btn-next" onclick="nextQuestion()">下一题 ➔</button>
        `;

        area.innerHTML = html;
        const textarea = document.getElementById('final-answer');
        textarea.value = savedAnswer;
        textarea.addEventListener('input', () => {
            localStorage.setItem(`renwumiaoxie:${selectedGrade}:answer:${currentIdx}`, textarea.value);
            if (hasViewedReference) {
                document.getElementById('answer-status').innerText = "已看参考 · 已修改";
            }
        });
        document.getElementById('progress-text').innerText = `第 ${currentIdx + 1} / ${activeQuestions.length} 题`;
    }

    async function copyAnswerFormat() {
        const text = document.getElementById('answer-format')?.innerText || '';
        if (!text) return;
        try {
            await navigator.clipboard.writeText(text);
        } catch (e) {
            const temp = document.createElement('textarea');
            temp.value = text;
            temp.style.position = 'fixed';
            temp.style.opacity = '0';
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            temp.remove();
        }
        const btn = document.querySelector('.copy-format-btn');
        if (btn) {
            const old = btn.innerText;
            btn.innerText = 'Copied';
            setTimeout(() => btn.innerText = old, 1000);
        }
    }

    function selectMethod(m, btn) {
        selectedMethod = m;
        document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function handleChunkClick(el) {
        el.classList.toggle('selected');
    }

    function hasMeaningfulAttempt(text) {
        return /[\p{L}\p{N}]/u.test(text);
    }

    function revealReference() {
        const q = activeQuestions[currentIdx];
        const textarea = document.getElementById('final-answer');
        const typedText = textarea.value.trim();
        const warning = document.getElementById('attempt-warning');
        const feedback = document.getElementById('feedback-area');

        if (!hasMeaningfulAttempt(typedText)) {
            warning.style.display = 'block';
            textarea.focus();
            return;
        }

        warning.style.display = 'none';

        if (!firstAnswerSnapshot) {
            firstAnswerSnapshot = typedText;
            localStorage.setItem(`renwumiaoxie:${selectedGrade}:first:${currentIdx}`, firstAnswerSnapshot);
        }

        hasViewedReference = true;
        document.getElementById('answer-status').innerText = "已看参考 · 可直接修改上面的答案";
        document.getElementById('btn-reference').style.display = 'none';
        document.getElementById('btn-next').style.display = 'block';

        const keyWords = q.chunks.filter(c => c.isKey).map(c => c.text).join(" / ");

        feedback.style.display = 'block';
        feedback.style.background = "#fff";
        feedback.style.border = "1px solid #d9d9d9";
        feedback.innerHTML = `
            <div class="reference-box">
                <h3>Reference（参考答案）</h3>
                <div class="reference-answer">${q.standardAnswer}</div>
                <div class="reference-meta">
                    <b>Method（手法）:</b> ${q.method}<br>
                    <b>${selectedGrade === 1 ? 'Direct clue（直接线索）' : 'Evidence（证据）'}:</b> <span style="font-family:KaiTi,STKaiti,'Kaiti SC',serif;">${keyWords}</span><br>
                    <b>${selectedGrade === 1 ? 'What it shows（表现）' : 'Interpretation（解释）'}:</b> ${q.traits.join("、")}
                </div>
            </div>
        `;
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < activeQuestions.length) {
            renderQuestion();
        } else {
            document.getElementById('game-area').innerHTML = `
                <div style="text-align:center; padding: 40px;">
                    <h2 style="color:var(--primary);">已完成 ${selectedGrade === 1 ? '中一' : '中二'} 5题</h2>
                    <p style="font-size:1.1em;">${selectedGrade === 1 ? 'Review（回看）：我能不能从“说、做、想、神态”快速判断描写和人物心情／特点？' : 'Review（回看）：我能不能说明“证据 → 人物特点／心情”的关系，而不是只写一个标签？'}</p>
                    <button class="btn-submit" style="max-width:260px; margin:24px auto 10px;" onclick="currentIdx=0; renderQuestion()">同年级再练一次</button>
                    <button class="back-btn" style="padding:10px 18px;" onclick="backToSetup()">返回选择年级</button>
                </div>
            `;
            document.getElementById('progress-text').innerText = selectedGrade === 1 ? "中一练习完成" : "中二练习完成";
        }
    }

    // 页面加载后先选择年级
    renderSetup();
</script>
</body>
</html>
