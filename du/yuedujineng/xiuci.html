<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>分析修辞的作用</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

:root {
  --bg: #f7f3eb;
  --paper: #fdfaf4;
  --ink: #1c2b1a;
  --ink2: #2d3e2b;
  --gold: #b8841a;
  --gold2: #d4a035;
  --green: #2a5c3f;
  --green2: #3a7a55;
  --green-light: #e8f2ec;
  --red: #b03a2e;
  --red-light: #fdf0ee;
  --border: #d6cdb8;
  --muted: #7a6e5a;
  --shadow: 0 4px 20px rgba(28,43,26,0.10);
  --radius: 16px;
  --step-active: #2a5c3f;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Noto Sans SC', sans-serif;
  min-height: 100vh;
  background-image: 
    radial-gradient(circle at 20% 50%, rgba(42,92,63,0.04) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(184,132,26,0.04) 0%, transparent 40%);
}

/* ─── HEADER ─── */
.header {
  background: var(--ink);
  padding: 16px 20px 14px;
  position: sticky; top: 0; z-index: 200;
  border-bottom: 2px solid var(--gold);
}
.header-inner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
.header-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px; font-weight: 900;
  color: var(--gold2); letter-spacing: 2px;
}
.header-sub { font-size: 11px; color: #7a8a6a; letter-spacing: 1px; margin-top: 2px; }
.score-pill {
  background: rgba(184,132,26,0.15);
  border: 1px solid rgba(184,132,26,0.3);
  color: var(--gold2); font-weight: 700; font-size: 13px;
  padding: 5px 14px; border-radius: 20px;
}

/* ─── MAIN WRAPPER ─── */
.main { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }

/* ─── SCREENS ─── */
.screen { display: none; }
.screen.active { display: block; animation: fadeUp .3s ease; }
@keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

/* ─── SETUP SCREEN ─── */
.setup-hero {
  background: var(--ink);
  border-radius: var(--radius);
  padding: 28px 24px 24px;
  margin-bottom: 24px;
  position: relative; overflow: hidden;
}
.setup-hero::after {
  content: '修辞'; position: absolute; right: -10px; bottom: -20px;
  font-family: 'Noto Serif SC', serif; font-size: 90px; font-weight: 900;
  color: rgba(184,132,26,0.07); line-height: 1; pointer-events: none;
  letter-spacing: -4px;
}
.setup-hero h1 {
  font-family: 'Noto Serif SC', serif; font-size: 24px; font-weight: 900;
  color: var(--gold2); letter-spacing: 3px; margin-bottom: 8px;
}
.setup-hero p { font-size: 13px; color: #9aaa8a; line-height: 1.7; }

.setup-section { margin-bottom: 24px; }
.setup-label {
  font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--muted);
  text-transform: uppercase; margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.setup-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.level-toggle {
  display: flex; gap: 10px;
}
.level-btn {
  flex: 1; padding: 16px 10px; border: 2px solid var(--border);
  border-radius: 12px; background: var(--paper); cursor: pointer;
  text-align: center; transition: all .2s; font-family: 'Noto Sans SC', sans-serif;
}
.level-btn .lv-num { font-size: 22px; font-weight: 900; color: var(--border); display: block; font-family: 'Noto Serif SC', serif; }
.level-btn .lv-name { font-size: 12px; color: var(--muted); margin-top: 3px; }
.level-btn.selected { border-color: var(--green); background: var(--green-light); }
.level-btn.selected .lv-num { color: var(--green); }
.level-btn.selected .lv-name { color: var(--green2); }

.rhetoric-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
}
.rhet-chip {
  padding: 12px 8px; border: 2px solid var(--border);
  border-radius: 10px; background: var(--paper); cursor: pointer;
  text-align: center; font-size: 15px; font-weight: 600;
  transition: all .2s; font-family: 'Noto Sans SC', sans-serif;
  color: var(--muted);
}
.rhet-chip.sel { border-color: var(--gold); background: #fdf3e0; color: var(--gold); }
.rhet-chip .rhet-en { display: block; font-size: 9px; color: var(--muted); font-weight: 400; margin-top: 3px; letter-spacing: 0.3px; }

.start-btn {
  width: 100%; background: var(--green); color: #fff;
  border: none; border-radius: 12px; padding: 17px;
  font-size: 16px; font-weight: 700; letter-spacing: 2px;
  cursor: pointer; font-family: 'Noto Sans SC', sans-serif;
  transition: all .2s; margin-top: 8px;
}
.start-btn:active { transform: scale(.98); }
.start-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

/* ─── PRACTICE SCREEN ─── */
.progress-bar-wrap {
  background: var(--border); border-radius: 99px;
  height: 5px; margin-bottom: 20px; overflow: hidden;
}
.progress-bar-fill {
  height: 100%; background: var(--green); border-radius: 99px;
  transition: width .4s ease;
}

.q-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.q-meta-left { display: flex; align-items: center; gap: 8px; }
.rhet-badge {
  font-size: 11px; font-weight: 700; padding: 4px 10px;
  border-radius: 8px; letter-spacing: 0.5px;
}
.rhet-badge.比喻 { background: #fff3e0; color: #b8841a; }
.rhet-badge.拟人 { background: #fce4ec; color: #c2185b; }
.rhet-badge.夸张 { background: #fff8e1; color: #f57f17; }
.rhet-badge.排比 { background: #e8f5e9; color: #2e7d32; }
.rhet-badge.反问 { background: #e3f2fd; color: #1565c0; }
.rhet-badge.设问 { background: #f3e5f5; color: #6a1b9a; }

.q-counter { font-size: 12px; color: var(--muted); font-weight: 600; }

/* step indicator */
.steps-row {
  display: flex; gap: 6px; margin-bottom: 18px; align-items: center;
}
.step-dot {
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; flex-shrink: 0;
  border: 2px solid var(--border); color: var(--muted); background: var(--paper);
  transition: all .25s;
}
.step-dot.active { background: var(--green); border-color: var(--green); color: #fff; }
.step-dot.done { background: var(--green-light); border-color: var(--green); color: var(--green); }
.step-line { flex: 1; height: 2px; background: var(--border); border-radius: 2px; }
.step-line.done { background: var(--green); }

/* sentence card */
.sentence-card {
  background: var(--paper); border: 1.5px solid var(--border);
  border-radius: var(--radius); padding: 22px 18px;
  margin-bottom: 16px; box-shadow: var(--shadow);
  border-left: 4px solid var(--gold);
}
.sentence-label { font-size: 11px; color: var(--muted); letter-spacing: 1.5px; margin-bottom: 10px; font-weight: 600; }
.sentence-text {
  font-family: 'Noto Serif SC', serif; font-size: 18px;
  line-height: 1.9; color: var(--ink);
}
.sentence-text .kw-highlight {
  background: #fff3cd; border-bottom: 2px solid var(--gold);
  border-radius: 3px; padding: 0 2px; font-weight: 700; color: var(--ink);
}
.sentence-text .kw-selected {
  background: var(--green-light); border-bottom: 2px solid var(--green);
  border-radius: 3px; padding: 0 2px; font-weight: 700; color: var(--green);
  cursor: pointer;
}
.sentence-text .kw-tap {
  cursor: pointer; border-bottom: 2px dashed var(--border); border-radius: 3px;
  padding: 0 2px; transition: all .15s;
}
.sentence-text .kw-tap:active { background: #f0ece4; }

/* interaction panels */
.panel {
  background: var(--paper); border: 1.5px solid var(--border);
  border-radius: var(--radius); padding: 18px 16px;
  margin-bottom: 14px; box-shadow: var(--shadow);
  animation: fadeUp .25s ease;
}
.panel-title {
  font-size: 13px; font-weight: 700; color: var(--ink2);
  margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
}
.panel-title .step-num {
  width: 22px; height: 22px; background: var(--green); color: #fff;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; flex-shrink: 0;
}

/* choice grid */
.choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.choice-grid.single { grid-template-columns: 1fr; }
.choice-btn {
  padding: 13px 12px; border: 2px solid var(--border);
  border-radius: 10px; background: var(--bg); cursor: pointer;
  font-size: 14px; font-weight: 500; color: var(--ink);
  text-align: center; transition: all .15s; font-family: 'Noto Sans SC', sans-serif;
}
.choice-btn:active { transform: scale(.97); }
.choice-btn.selected { border-color: var(--gold); background: #fdf3e0; color: var(--gold); font-weight: 700; }
.choice-btn.correct { border-color: var(--green); background: var(--green-light); color: var(--green); font-weight: 700; }
.choice-btn.wrong { border-color: var(--red); background: var(--red-light); color: var(--red); font-weight: 700; }
.choice-btn.reveal { border-color: var(--green); background: var(--green-light); color: var(--green); }
.choice-btn:disabled { cursor: not-allowed; }

/* keyword tokens */
.token-area { display: flex; flex-wrap: wrap; gap: 8px; }
.token {
  padding: 9px 14px; border: 2px solid var(--border);
  border-radius: 8px; background: var(--bg); cursor: pointer;
  font-size: 14px; font-family: 'Noto Serif SC', serif;
  transition: all .15s; color: var(--ink2);
}
.token:active { transform: scale(.96); }
.token.selected { border-color: var(--green); background: var(--green-light); color: var(--green); font-weight: 700; }
.token.wrong { border-color: var(--red); background: var(--red-light); color: var(--red); }
.token.reveal { border-color: var(--green); background: var(--green-light); color: var(--green); }

/* ─── FORMULA BUILDER ─── */
.formula-header {
  font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: var(--muted);
  text-transform: uppercase; margin-bottom: 10px;
}
/* The formula display: dark card showing the sentence being assembled */
.formula-sentence {
  background: var(--ink); border-radius: 12px; padding: 16px 16px 14px;
  margin-bottom: 14px; line-height: 2.2;
  font-family: 'Noto Serif SC', serif; font-size: 15px;
}
.fs-static { color: #c8b88a; }
/* A slot in the formula sentence */
.fs-slot {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 6px; padding: 2px 10px; margin: 0 2px;
  font-size: 14px; font-weight: 600; vertical-align: middle;
  min-width: 52px; transition: all .25s;
}
.fs-slot.prefilled {
  background: rgba(42,92,63,0.45); border: 1.5px solid rgba(100,200,140,0.5);
  color: #88d8a8;
}
.fs-slot.prefilled-gold {
  background: rgba(184,132,26,0.25); border: 1.5px solid rgba(212,160,53,0.5);
  color: var(--gold2);
}
.fs-slot.empty {
  background: rgba(255,255,255,0.06); border: 2px dashed rgba(200,184,138,0.35);
  color: #6a7a6a; cursor: default; min-width: 70px;
}
.fs-slot.filled-correct {
  background: rgba(42,92,63,0.6); border: 2px solid #6ad8a0;
  color: #b0f0c8; animation: slotPop .25s ease;
}
.fs-slot.filled-wrong {
  background: rgba(176,58,46,0.4); border: 2px solid rgba(220,100,90,0.6);
  color: #f8a0a0;
}
@keyframes slotPop {
  0%   { transform: scale(0.85); opacity:0.5; }
  60%  { transform: scale(1.08); }
  100% { transform: scale(1);   opacity:1; }
}

/* The word-bank below the formula */
.wordbank-label {
  font-size: 11px; color: var(--muted); font-weight: 700;
  letter-spacing: 1px; margin: 12px 0 8px;
  display: flex; align-items: center; gap: 6px;
}
.wordbank-label::after { content:''; flex:1; height:1px; background:var(--border); }
.wordbank { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
.wb-chip {
  padding: 9px 14px; border: 2px solid var(--border);
  border-radius: 20px; background: var(--bg); cursor: pointer;
  font-size: 14px; font-family: 'Noto Serif SC', serif;
  transition: all .15s; color: var(--ink2);
  user-select: none;
}
.wb-chip:active { transform: scale(.95); }
.wb-chip.selected { border-color: var(--gold); background: #fdf3e0; color: var(--gold); font-weight: 700; }
.wb-chip.correct  { border-color: var(--green); background: var(--green-light); color: var(--green); font-weight: 700; pointer-events: none; }
.wb-chip.wrong    { border-color: var(--red); background: var(--red-light); color: var(--red); pointer-events: none; }
.wb-chip.reveal   { border-color: var(--green); background: var(--green-light); color: var(--green); pointer-events: none; opacity:.7; }
.wb-chip.disabled { pointer-events: none; opacity:.45; }

/* model answer reveal */
.model-answer-box {
  background: #f0f7f3; border-radius: 10px; padding: 14px 16px;
  border-left: 3px solid var(--green); margin-top: 12px;
  font-family: 'Noto Serif SC', serif; font-size: 15px; line-height: 1.9;
  color: var(--ink); animation: fadeUp .3s ease;
}
.model-answer-label {
  font-size: 11px; font-weight: 700; color: var(--green);
  letter-spacing: 1px; margin-bottom: 6px;
}

/* answer textarea (kept for possible future use) */

/* ─── METHOD CARD (dark box with steps + audio + EN) ─── */
.method-card {
  background: var(--ink); border-radius: 12px;
  padding: 14px 16px; margin-bottom: 4px;
}
.method-title-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.method-badge {
  font-family: 'Noto Serif SC', serif; font-size: 13px; font-weight: 700;
  color: var(--gold2); letter-spacing: 1px;
}
.method-btn-audio {
  background: rgba(184,132,26,0.2); border: 1px solid rgba(184,132,26,0.4);
  color: var(--gold2); border-radius: 20px; padding: 5px 12px;
  font-size: 12px; font-weight: 600; cursor: pointer;
  font-family: 'Noto Sans SC', sans-serif; transition: all .15s;
}
.method-btn-audio:active { transform: scale(.95); background: rgba(184,132,26,0.35); }
.method-btn-en {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  color: #9aaa8a; border-radius: 20px; padding: 5px 12px;
  font-size: 12px; font-weight: 700; cursor: pointer;
  font-family: 'Noto Sans SC', sans-serif; letter-spacing: 0.5px; transition: all .15s;
}
.method-btn-en:active { transform: scale(.95); background: rgba(255,255,255,0.15); }
.method-steps { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.method-step {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 8px; background: rgba(255,255,255,0.05); border-radius: 8px;
  padding: 8px 10px;
}
.method-step-text {
  font-size: 13px; color: #d0d8b8; line-height: 1.5; flex: 1;
  font-family: 'Noto Sans SC', sans-serif;
}
.method-step-audio {
  background: none; border: none; cursor: pointer; font-size: 14px;
  opacity: 0.6; flex-shrink: 0; padding: 0 2px; transition: opacity .15s;
}
.method-step-audio:active { opacity: 1; transform: scale(1.1); }
.method-formula-line {
  display: flex; align-items: center; margin-bottom: 4px;
}
.method-formula-text {
  font-size: 12px; color: #7a9a6a; font-family: 'Noto Sans SC', sans-serif;
  background: rgba(255,255,255,0.04); border-radius: 6px; padding: 6px 10px;
  letter-spacing: 0.3px;
}

/* feedback */
.feedback {
  border-radius: 10px; padding: 14px 16px; margin-bottom: 14px;
  font-size: 14px; line-height: 1.7; display: none;
  animation: fadeUp .2s ease;
}
.feedback.show { display: block; }
.feedback.ok { background: var(--green-light); border-left: 3px solid var(--green); }
.feedback.ng { background: var(--red-light); border-left: 3px solid var(--red); }
.feedback.info { background: #fff8e1; border-left: 3px solid var(--gold); }
.feedback strong { display: block; margin-bottom: 4px; font-size: 15px; }
.model-answer {
  background: #f0f7f3; border-radius: 8px; padding: 12px 14px;
  font-family: 'Noto Serif SC', serif; font-size: 14px; line-height: 1.9;
  border-left: 3px solid var(--green); margin-top: 10px; color: var(--ink);
}

/* action buttons */
.action-btn {
  width: 100%; border: none; border-radius: 12px; padding: 15px;
  font-size: 15px; font-weight: 700; letter-spacing: 1px;
  cursor: pointer; font-family: 'Noto Sans SC', sans-serif; transition: all .15s;
}
.action-btn:active { transform: scale(.98); }
.action-btn.primary { background: var(--green); color: #fff; }
.action-btn.secondary { background: var(--ink); color: var(--gold2); }
.action-btn.gold { background: var(--gold); color: #fff; }
.action-btn:disabled { background: var(--border); color: var(--muted); cursor: wait; }
.btn-gap { height: 10px; }

/* loading */
.loading { display: flex; gap: 5px; justify-content: center; padding: 16px 0; }
.loading span { width: 8px; height: 8px; background: var(--green); border-radius: 50%; animation: bounce 1s infinite; }
.loading span:nth-child(2) { animation-delay: .15s; }
.loading span:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%,100%{transform:translateY(0);opacity:.4} 50%{transform:translateY(-7px);opacity:1} }

/* result screen */
.result-card {
  background: var(--ink); border-radius: var(--radius); padding: 28px 22px;
  text-align: center; margin-bottom: 20px;
}
.result-emoji { font-size: 56px; margin-bottom: 10px; }
.result-title { font-family: 'Noto Serif SC', serif; font-size: 22px; font-weight: 900; color: var(--gold2); }
.result-score { font-size: 52px; font-weight: 900; color: var(--gold2); margin: 6px 0 4px; }
.result-sub { font-size: 13px; color: #7a8a6a; }
.stat-row { display: flex; gap: 10px; margin-bottom: 16px; }
.stat-box { flex: 1; background: var(--paper); border: 1.5px solid var(--border); border-radius: 12px; padding: 14px 10px; text-align: center; }
.stat-num { font-size: 26px; font-weight: 900; color: var(--green); }
.stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* toast */
.toast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--ink); color: var(--gold2); padding: 10px 20px;
  border-radius: 20px; font-size: 13px; font-weight: 600;
  opacity: 0; transition: all .3s; z-index: 999; white-space: nowrap;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* hint toggle */
.hint-toggle {
  font-size: 12px; color: var(--gold); cursor: pointer;
  text-decoration: underline; display: inline-block; margin-bottom: 8px;
}
.hint-box {
  background: #fff8e1; border-radius: 8px; padding: 10px 14px;
  font-size: 13px; color: #7a5a00; line-height: 1.6;
  border-left: 3px solid var(--gold); margin-bottom: 10px;
  display: none;
}
.hint-box.show { display: block; }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div>
      <div class="header-title">分析修辞的作用</div>
      <div class="header-sub">HCL 修辞手法互动练习</div>
    </div>
    <div class="score-pill" id="scorePill">0 分</div>
  </div>
</div>

<div class="main">

<!-- ══════════════════════════════════ -->
<!-- SETUP SCREEN                       -->
<!-- ══════════════════════════════════ -->
<div class="screen active" id="screen-setup">
  <div class="setup-hero">
    <h1>修辞分析练习</h1>
    <p>五步引导，从识别修辞到写出完整分析句。<br>请选择年级和要练习的修辞手法。</p>
  </div>

  <div class="setup-section">
    <div class="setup-label">选择年级</div>
    <div class="level-toggle">
      <button class="level-btn selected" id="btn-s1" onclick="selectLevel(1)">
        <span class="lv-num">中一</span>
      </button>
      <button class="level-btn" id="btn-s2" onclick="selectLevel(2)">
        <span class="lv-num">中二</span>
      </button>
    </div>
  </div>

  <div class="setup-section">
    <div class="setup-label">选择修辞手法（可多选）</div>
    <div class="rhetoric-grid" id="rhetoricGrid">
      <!-- injected by JS -->
    </div>
  </div>

  <button class="start-btn" id="startBtn" onclick="startPractice()">开始练习 →</button>
  <!-- note: enabled by default since chips are pre-selected -->
</div>

<!-- ══════════════════════════════════ -->
<!-- PRACTICE SCREEN                    -->
<!-- ══════════════════════════════════ -->
<div class="screen" id="screen-practice">
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
  </div>

  <div class="q-header">
    <div class="q-meta-left">
      <span class="rhet-badge" id="qRhetBadge">比喻</span>
    </div>

let S = {
  level: 1,
  selectedRhetorics: ['比喻'],
  queue: [],
  qIdx: 0,
  step: 0,  // 0=rhetoric, 1=writeType, 2=keyword, 3=answer
  score: 0,
  correct: 0,
  // current q temps
  selectedRhetoric: null,
  selectedWriteType: null,
  selectedTokens: [],
  answerText: '',
  aiResult: null
};

// ═══════════════════════════════════════════════
// SETUP
// ═══════════════════════════════════════════════
function selectLevel(lv) {
  S.level = lv;
  S.selectedRhetorics = [...RHETORICS_BY_LEVEL[lv]]; // reset to all for new level
  document.getElementById('btn-s1').classList.toggle('selected', lv===1);
  document.getElementById('btn-s2').classList.toggle('selected', lv===2);
  renderRhetoricChips();
}

function renderRhetoricChips() {
  const avail = RHETORICS_BY_LEVEL[S.level];
  const grid = document.getElementById('rhetoricGrid');
  const enMap = {比喻:'Simile/Metaphor', 拟人:'Personification', 夸张:'Hyperbole', 排比:'Parallelism', 反问:'Rhetoric Q.', 设问:'Self-Q&A'};
  grid.innerHTML = avail.map(r => `
    <button class="rhet-chip ${S.selectedRhetorics.includes(r)?'sel':''}" onclick="toggleRhetic('${r}')">
      ${r}
      <span class="rhet-en">${enMap[r]||''}</span>
    </button>
  `).join('');
  updateStartBtn();
}

function toggleRhetic(r) {
  if (S.selectedRhetorics.includes(r)) {
    if (S.selectedRhetorics.length === 1) { showToast('请至少选择一种修辞'); return; }
    S.selectedRhetorics = S.selectedRhetorics.filter(x=>x!==r);
  } else {
    S.selectedRhetorics.push(r);
  }
  renderRhetoricChips();
}

function updateStartBtn() {
  document.getElementById('startBtn').disabled = S.selectedRhetorics.length === 0;
}

function startPractice() {
  S.queue = [];
  const selectedSet = new Set(S.selectedRhetorics);
  const allSelected = selectedSet.size === RHETORICS_BY_LEVEL[S.level].length;

  S.selectedRhetorics.forEach(r => {
    const pool = (QUESTIONS[S.level][r] || []).slice();
    // Filter: if player selected only ONE rhetoric type, exclude sentences
    // that belong to TWO rhetorics (they'd be confusing / marked wrong)
    // If multiple rhetorics selected, include dual-rhetoric sentences
    const filtered = pool.filter(q => {
      if (!q.extraRhetoric) return true; // single rhetoric, always include
      // dual-rhetoric: include only if the extra is also selected, OR all selected
      return allSelected || selectedSet.has(q.extraRhetoric);
    });
    // shuffle
    for (let i=filtered.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[filtered[i],filtered[j]]=[filtered[j],filtered[i]];}
    S.queue.push(...filtered.slice(0, 4)); // up to 4 per rhetoric
  });
  // deduplicate (dual-rhetoric sentence may appear in two buckets)
  const seen = new Set();
  S.queue = S.queue.filter(q => {
    const key = q.sentence;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  // shuffle full queue
  for(let i=S.queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[S.queue[i],S.queue[j]]=[S.queue[j],S.queue[i]];}
  S.qIdx=0; S.score=0; S.correct=0;
  showScreen('practice');
  renderQuestion();
}

function goSetup() { showScreen('setup'); }
function restartSame() { startPractice(); }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));

}

// QUESTION RENDERING
// ═══════════════════════════════════════════════
function renderQuestion() {
  const q = S.queue[S.qIdx];
  S.step = 0;
  S.selectedRhetoric = null;
  S.selectedWriteType = null;
  S.selectedTokens = [];
  S.answerText = '';
  S.aiResult = null;
  S.formulaSlots = { feature: null, emotion: null };

  // progress
  const pct = (S.qIdx / S.queue.length) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('qCounter').textContent = (S.qIdx+1) + ' / ' + S.queue.length;

  // badge
  const badge = document.getElementById('qRhetBadge');
  badge.textContent = '?';
  badge.className = 'rhet-badge';

  // sentence
  const sentEl = document.getElementById('sentenceDisplay');
  // parse {word} as tapable tokens
  sentEl.innerHTML = parseSentence(q.sentence, false);

  // steps
  renderStepsRow(0);
  renderStep(0);
  hideFeedback();
  document.getElementById('mainActionBtn').textContent = '确认';
  document.getElementById('mainActionBtn').disabled = false;
  document.getElementById('scorePill').textContent = S.score + ' 分';
}

function parseSentence(sentence, highlightKeys) {
  // {word} marks keyword hints shown after step 2
  return sentence.replace(/\{([^}]+)\}/g, (_, w) => {
    if (highlightKeys) {
      return `<span class="kw-highlight">${w}</span>`;
    }
    return w;
  });
}

function renderStepsRow(activeStep) {
  const steps = ['识别修辞','分析对象','找关键词','写分析句'];
  const row = document.getElementById('stepsRow');
  row.innerHTML = steps.map((s,i) => {
    let cls = i < activeStep ? 'done' : i === activeStep ? 'active' : '';
    const lineClass = i < activeStep ? 'done' : '';
    return (i>0?`<div class="step-line ${lineClass}"></div>`:'') + 
           `<div class="step-dot ${cls}" title="${s}">${i+1}</div>`;
  }).join('');
}

// ═══════════════════════════════════════════════
// STEP RENDERING
// ═══════════════════════════════════════════════
function renderStep(step) {
  const q = S.queue[S.qIdx];
  const container = document.getElementById('stepPanels');
  hideFeedback();

  if (step === 0) {
    // STEP 1: Identify rhetoric
    // For dual-rhetoric sentences, both answers are valid choices
    const allOptions = ['比喻','拟人','夸张','排比','反问','设问'];
    const correctAnswers = new Set([q.rhetoric]);
    if (q.extraRhetoric) correctAnswers.add(q.extraRhetoric);

    // Build choice pool: correct answers + distractors to fill up to 4
    const distractors = allOptions.filter(o => !correctAnswers.has(o));
    const shuffledDistractors = shuffle(distractors);
    const pool = [...correctAnswers, ...shuffledDistractors].slice(0, 4);
    // Ensure we have exactly 4 (pad with more distractors if needed)
    const shuffled = shuffle(pool);

    // Hint for dual-rhetoric
    const dualHint = q.extraRhetoric
      ? `<div class="hint-box show" style="margin-top:8px;font-size:12px;">💡 这个句子用了<strong>${q.fullRhetoricLabel || q.rhetoric + '、' + q.extraRhetoric}</strong>两种修辞，选其中一种都算对！</div>`
      : '';

    container.innerHTML = `
      <div class="panel">
        <div class="panel-title"><div class="step-num">1</div>这个句子用了哪种修辞手法？</div>
        ${q.extraRhetoric ? '<div style="font-size:12px;color:var(--gold);margin-bottom:10px;font-weight:600;">⭐ 这句话有两种修辞哦！</div>' : ''}
        <div class="choice-grid" id="step0-choices">
          ${shuffled.map(c=>`<button class="choice-btn" onclick="selectRhetoric('${c}',this)">${c}</button>`).join('')}
        </div>
        ${dualHint}
      </div>`;
    document.getElementById('mainActionBtn').style.display = 'block';
    document.getElementById('mainActionBtn').textContent = '确认';

  } else if (step === 1) {
    // STEP 2: Write type
    container.innerHTML = `
      <div class="panel">
        <div class="panel-title"><div class="step-num">2</div>这个修辞句子在写什么？</div>
        <div class="choice-grid single" id="step1-choices">
          ${q.writeTypeChoices.map(c=>`<button class="choice-btn" onclick="selectWriteType('${c}',this)">${c}</button>`).join('')}
        </div>
      </div>`;
    document.getElementById('mainActionBtn').textContent = '确认';

  } else if (step === 2) {
    // STEP 3: Keywords
    // highlight the {tokens} in sentence now
    const sentEl = document.getElementById('sentenceDisplay');
    sentEl.innerHTML = parseSentence(q.sentence, false); // plain for now

    container.innerHTML = `
      <div class="panel">
        <div class="panel-title"><div class="step-num">3</div>${q.keywordPrompt}</div>
        <div class="token-area" id="tokenArea">
          ${q.tokens.map(t=>`<div class="token" onclick="toggleToken('${escHtml(t)}',this)">${t}</div>`).join('')}
        </div>
        <div style="margin-top:10px">
          <span class="hint-toggle" onclick="toggleHint()">💡 查看提示</span>
          <div class="hint-box" id="kwHint">${q.keyHint}</div>
        </div>
      </div>`;
    document.getElementById('mainActionBtn').textContent = '确认';

  } else if (step === 3) {
    // STEP 4: Formula puzzle — click-to-fill slots
    // Highlight keywords in sentence display
    const sentEl = document.getElementById('sentenceDisplay');
    let shtml = q.sentence;
    q.correctTokens.forEach(kw => {
      shtml = shtml.replace(new RegExp('\\{?' + escRegex(kw) + '\\}?', 'g'),
        '<span class="kw-highlight">' + kw + '</span>');
    });
    shtml = shtml.replace(/\{([^}]+)\}/g, '$1');
    sentEl.innerHTML = shtml;

    // Reset slot state
    S.formulaSlots = { feature: null, emotion: null };

    container.innerHTML = buildFormulaPuzzle(q);
    document.getElementById('mainActionBtn').textContent = '查看答案 ✓';
    document.getElementById('mainActionBtn').style.display = 'block';
  }
}

function speak(text) {

    msg.lang = 'zh-CN';
    msg.rate = 0.95;

  }
}

}

function buildFormulaPuzzle(q) {
  const tpl = q.formulaTemplate;
  const parts = tpl.split(/(__ *[①②③] *__)/g);
  const normalize = s => s.replace(/\s/g,'');
  const meta = RHETORIC_META[q.rhetoric] || RHETORIC_META['比喻'];

  const preKeyword = S.selectedTokens.length ? S.selectedTokens.join('、') : q.correctTokens.join('、');
  const hasSlot1 = tpl.includes('__①__');
  const hasSlot2 = tpl.includes('__②__');
  const hasSlot3 = tpl.includes('__③__');

  // Build formula sentence HTML
  let sentHtml = '';
  parts.forEach(p => {
    const clean = normalize(p);
    if (clean === '__①__') {
      sentHtml += '<span class="fs-slot prefilled-gold" id="slot-1">' + escHtmlDisplay(preKeyword) + '</span>';
    } else if (clean === '__②__') {
      sentHtml += '<span class="fs-slot empty" id="slot-2">' + meta.s2 + '…</span>';
    } else if (clean === '__③__') {
      sentHtml += '<span class="fs-slot empty" id="slot-3">' + meta.s3 + '…</span>';
    } else if (p.trim()) {
      sentHtml += '<span class="fs-static">' + p + '</span>';
    }
  });

  const featChoices = shuffle([...q.featureChoices]);
  const emotChoices = shuffle([...q.emotionChoices]);

  // Build the 5-step method guide card (dark box)
  // FIX: JSON.stringify produces double-quotes that break onclick="..." attributes.
  // Solution: .replace(/"/g, '&quot;') so the HTML stays valid.
  const formulaText = '答题格式：' + tpl.replace(/__[①②③]__/g,'____');

  const stepsCardHtml = '<div class="method-card" id="methodCard">'
    + '<div class="method-title-row">'
    + '<span class="method-badge">' + q.rhetoric + ' 答题口诀</span>'
    + '<div style="display:flex;gap:6px;">'
    + '<button class="method-btn-audio" onclick="speakText(' + JSON.stringify(meta.tts).replace(/"/g, '&quot;') + ')" title="中文语音讲解">🔊 听讲解</button>'
    + '<button class="method-btn-en" onclick="toggleEnTranslation(&apos;methodEn&apos;);speakEn(' + JSON.stringify(meta.methodEn).replace(/"/g, '&quot;') + ')" title="English translation">EN &#128266;</button>'
    + '</div>'
    + '</div>'
    + '<div id="methodEn" style="display:none;background:rgba(255,255,255,0.06);border-radius:8px;padding:10px 12px;margin-bottom:10px;">'
    + '<div style="font-size:11px;color:#9aaa7a;font-weight:700;letter-spacing:1px;margin-bottom:6px;">ENGLISH GUIDE</div>'
    + meta.steps.map((s,i) => '<div style="font-size:12px;color:#b8c8a0;margin-bottom:4px;">' + s.en + '</div>').join('')
    + '</div>'
    + '<div class="method-steps">'
    + meta.steps.map((s,i) => {
        const audioText = s.zh.replace(/[①②③]/g, ['第一步','第二步','第三步'][i]);
        return '<div class="method-step">'
          + '<span class="method-step-text">' + s.zh + '</span>'
          + '<button class="method-step-audio" onclick="speakText(' + JSON.stringify(audioText).replace(/"/g, '&quot;') + ')" title="朗读这一步">🔊</button>'
          + '</div>';
      }).join('')
    + '</div>'
    + '<div class="method-formula-line">'
    + '<span style="font-size:10px;color:#7a8a6a;font-weight:700;letter-spacing:1px;">答题格式</span>'
    + '<button class="method-step-audio" onclick="speakText(' + JSON.stringify(formulaText).replace(/"/g, '&quot;') + ')" style="margin-left:6px;">🔊</button>'
    + '</div>'
    + '<div class="method-formula-text">' + escHtmlDisplay(meta.method) + '</div>'
    + '</div>'; // end method-card

  // Colour key
  const keyHtml = '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">'
    + (hasSlot1 ? '<span style="font-size:11px;background:rgba(212,160,53,0.2);border:1px solid rgba(212,160,53,0.5);border-radius:6px;padding:3px 8px;color:#b8841a;">🔑 ' + meta.s1 + '（上一步已答）</span>' : '')
    + (hasSlot2 ? '<span style="font-size:11px;background:rgba(42,92,63,0.12);border:1px solid rgba(42,92,63,0.3);border-radius:6px;padding:3px 8px;color:#2a5c3f;">② 点选 → ' + meta.s2 + '</span>' : '')
    + (hasSlot3 ? '<span style="font-size:11px;background:rgba(42,92,63,0.12);border:1px solid rgba(42,92,63,0.3);border-radius:6px;padding:3px 8px;color:#2a5c3f;">③ 点选 → ' + meta.s3 + '</span>' : '')
    + '</div>';

  return '<div class="panel">'
    + '<div class="panel-title"><div class="step-num">4</div>点选词块，拼出完整的分析句</div>'
    + stepsCardHtml
    + '<div class="formula-header" style="margin-top:14px;">📝 拼出分析句</div>'
    + keyHtml
    + '<div class="formula-sentence" id="formulaSentence">' + sentHtml + '</div>'
    + (hasSlot2
        ? '<div class="wordbank-label">② ' + meta.s2 + '</div>'
          + '<div class="wordbank" id="wb-feature">'
          + featChoices.map(c => '<button class="wb-chip" onclick="pickSlot(\'feature\',\'' + escHtmlAttr(c) + '\',this)">' + c + '</button>').join('')
          + '</div>'
        : '')
    + (hasSlot3
        ? '<div class="wordbank-label">③ ' + meta.s3 + '</div>'
          + '<div class="wordbank" id="wb-emotion">'
          + emotChoices.map(c => '<button class="wb-chip" onclick="pickSlot(\'emotion\',\'' + escHtmlAttr(c) + '\',this)">' + c + '</button>').join('')
          + '</div>'
        : '')
    + '<div id="formula-feedback"></div>'
    + '</div>';
}

function pickSlot(slotName, val, el) {
  const q = S.queue[S.qIdx];
  const wbId = 'wb-' + slotName;
  const slotNum = slotName === 'feature' ? '2' : '3';
  const correctVal = slotName === 'feature' ? q.correctFeature : q.correctEmotion;

  // Deselect others in same wordbank
  document.querySelectorAll('#' + wbId + ' .wb-chip').forEach(b => {
    if (b !== el) b.classList.remove('selected');
  });
  el.classList.toggle('selected');

  if (el.classList.contains('selected')) {
    S.formulaSlots[slotName] = val;
    // Update slot in formula
    const slot = document.getElementById('slot-' + slotNum);
    if (slot) {
      slot.textContent = val;
      slot.className = 'fs-slot filled-correct';
    }
  } else {
    S.formulaSlots[slotName] = null;
    const slot = document.getElementById('slot-' + slotNum);
    if (slot) {
      slot.textContent = slotNum === '2' ? '特点…' : '感情…';
      slot.className = 'fs-slot empty';
    }
  }
}

function confirmStep3(q) {
  const feat = S.formulaSlots.feature;
  const emot = S.formulaSlots.emotion;
  const hasSlot2 = q.formulaTemplate.includes('__②__');
  const hasSlot3 = q.formulaTemplate.includes('__③__');

  if (hasSlot2 && !feat && hasSlot3 && !emot) { showToast('请先点选词块'); return; }
  if (hasSlot2 && !feat) { showToast('请点选②的词块'); return; }
  if (hasSlot3 && !emot) { showToast('请点选③的词块'); return; }

  const featCorrect = !hasSlot2 || feat === q.correctFeature;
  const emotCorrect = !hasSlot3 || emot === q.correctEmotion;
  let pts = 0;

  // Lock + mark feature wordbank
  if (hasSlot2) {
    document.querySelectorAll('#wb-feature .wb-chip').forEach(b => {
      const bVal = b.textContent.trim();
      b.classList.remove('selected');
      if (bVal === q.correctFeature) b.classList.add('correct');
      else if (bVal === feat && feat !== q.correctFeature) b.classList.add('wrong');
      else b.classList.add('disabled');
      b.onclick = null;
    });
    const slot2 = document.getElementById('slot-2');
    if (slot2) {
      slot2.className = featCorrect ? 'fs-slot filled-correct' : 'fs-slot prefilled';
      slot2.textContent = q.correctFeature;
      if (featCorrect) pts += 15;
    }
  }

  // Lock + mark emotion wordbank
  if (hasSlot3) {
    document.querySelectorAll('#wb-emotion .wb-chip').forEach(b => {
      const bVal = b.textContent.trim();
      b.classList.remove('selected');
      if (bVal === q.correctEmotion) b.classList.add('correct');
      else if (bVal === emot && emot !== q.correctEmotion) b.classList.add('wrong');
      else b.classList.add('disabled');
      b.onclick = null;
    });
    const slot3 = document.getElementById('slot-3');
    if (slot3) {
      slot3.className = emotCorrect ? 'fs-slot filled-correct' : 'fs-slot prefilled';
      slot3.textContent = q.correctEmotion;
      if (emotCorrect) pts += 10;
    }
  }

  updateScore(pts);

  const allGood = featCorrect && emotCorrect;
  const fb = document.getElementById('formula-feedback');
  let msg = '';

  if (allGood) {
    msg = '<div style="color:var(--green);font-weight:700;font-size:15px;margin-bottom:10px;">✅ 全对！+' + pts + '分</div>';
  } else {
    msg = '<div style="font-weight:700;font-size:14px;margin-bottom:8px;color:var(--gold);">📝 已更正，请对照参考答案：</div>';
    if (hasSlot2 && !featCorrect) msg += '<div style="font-size:13px;margin-bottom:4px;color:var(--red);">② 正确答案：<strong>' + q.correctFeature + '</strong></div>';
    if (hasSlot3 && !emotCorrect) msg += '<div style="font-size:13px;margin-bottom:6px;color:var(--red);">③ 正确答案：<strong>' + q.correctEmotion + '</strong></div>';
  }

  msg += '<div class="model-answer-label" style="margin-top:10px;">📌 完整参考答案</div>'
       + '<div class="model-answer-box">' + q.modelAnswer + '</div>';
  fb.innerHTML = msg;

  const btn = document.getElementById('mainActionBtn');
  btn.textContent = S.qIdx < S.queue.length - 1 ? '下一题 →' : '查看成绩 →';
  btn.onclick = nextQuestion;
}
// ═══════════════════════════════════════════════
function selectRhetoric(val, el) {
  S.selectedRhetoric = val;
  document.querySelectorAll('#step0-choices .choice-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
}

function selectWriteType(val, el) {
  S.selectedWriteType = val;
  document.querySelectorAll('#step1-choices .choice-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
}

function toggleToken(val, el) {
  if (el.classList.contains('selected')) {
    el.classList.remove('selected');
    S.selectedTokens = S.selectedTokens.filter(t=>t!==val);
  } else {
    el.classList.add('selected');
    S.selectedTokens.push(val);
  }
}

function toggleHint() {
  const h = document.getElementById('kwHint');
  h.classList.toggle('show');
}

// ═══════════════════════════════════════════════
// ACTION HANDLER
// ═══════════════════════════════════════════════
function handleAction() {
  const q = S.queue[S.qIdx];
  if (S.step === 0) confirmStep0(q);
  else if (S.step === 1) confirmStep1(q);
  else if (S.step === 2) confirmStep2(q);
  else if (S.step === 3) confirmStep3(q);
}

function confirmStep0(q) {
  if (!S.selectedRhetoric) { showToast('请选择一种修辞手法'); return; }

  // For dual-rhetoric sentences, either answer is correct
  const correctAnswers = new Set([q.rhetoric]);
  if (q.extraRhetoric) correctAnswers.add(q.extraRhetoric);
  const correct = correctAnswers.has(S.selectedRhetoric);

  const btns = document.querySelectorAll('#step0-choices .choice-btn');
  btns.forEach(b => {
    b.disabled = true;
    const bText = b.textContent.trim();
    if (correctAnswers.has(bText)) b.classList.add('reveal');
    if (bText === S.selectedRhetoric && !correct) b.classList.add('wrong');
  });

  if (correct) {
    const badge = document.getElementById('qRhetBadge');
    badge.textContent = q.rhetoric;
    badge.className = 'rhet-badge ' + q.rhetoric;
    updateScore(10);
    S.correct++;

    let msg = `✅ 答对了！这句话用了<strong>${S.selectedRhetoric}</strong>。`;
    // If dual-rhetoric, inform about the other one
    if (q.extraRhetoric && S.selectedRhetoric !== q.extraRhetoric) {
      msg += `<br><span style="font-size:13px;color:var(--green);">🌟 加分！这句话还用了<strong>${q.extraRhetoric}</strong>，两种修辞都用了哦！</span>`;
    } else if (q.extraRhetoric && S.selectedRhetoric !== q.rhetoric) {
      msg += `<br><span style="font-size:13px;color:var(--green);">🌟 这句话还用了<strong>${q.rhetoric}</strong>，两种修辞都用了哦！</span>`;
    }
    showFeedback('ok', msg);
  } else {
    const correctList = [...correctAnswers].join('或');
    showFeedback('ng', `这句话用的是<strong>${correctList}</strong>，不是${S.selectedRhetoric}。`);
  }

  setTimeout(() => {
    S.step = 1;
    renderStepsRow(1);
    renderStep(1);
    hideFeedback();
  }, correct ? 1400 : 1800);
}

function confirmStep1(q) {
  if (!S.selectedWriteType) { showToast('请选择这句话在写什么'); return; }
  const correct = S.selectedWriteType === q.writeTypeCorrect;
  const btns = document.querySelectorAll('#step1-choices .choice-btn');
  btns.forEach(b => {
    b.disabled = true;
    if (b.textContent === q.writeTypeCorrect) b.classList.add('reveal');
    if (b.textContent === S.selectedWriteType && !correct) b.classList.add('wrong');
  });
  if (correct) {
    showFeedback('ok', `✅ 正确！这句${q.rhetoric}是在<strong>${q.writeTypeCorrect}</strong>。`);
    updateScore(8);
  } else {
    showFeedback('ng', `这句${q.rhetoric}是在<strong>${q.writeTypeCorrect}</strong>，不是${S.selectedWriteType}。`);
  }
  setTimeout(() => {
    S.step = 2;
    renderStepsRow(2);
    renderStep(2);
    hideFeedback();
  }, correct ? 900 : 1600);
}

function confirmStep2(q) {
  if (S.selectedTokens.length === 0) { showToast('请点选关键词'); return; }
  // check if intersection with correct
  const hit = S.selectedTokens.some(t => q.correctTokens.includes(t));
  const allCorrect = q.correctTokens.every(t => S.selectedTokens.includes(t)) &&
    S.selectedTokens.every(t => q.correctTokens.includes(t));

  // mark tokens
  document.querySelectorAll('#tokenArea .token').forEach(el => {
    const t = el.textContent.trim();
    el.style.cursor = 'default';
    if (q.correctTokens.includes(t)) el.classList.add('reveal');
    else if (S.selectedTokens.includes(t)) el.classList.add('wrong');
    el.onclick = null;
  });

  // show hint always
  document.getElementById('kwHint').classList.add('show');

  if (allCorrect) {
    showFeedback('ok', `✅ 关键词找对了！<br><small>${q.keyHint}</small>`);
    updateScore(12);
  } else if (hit) {
    showFeedback('info', `找到了部分关键词。完整关键词：<strong>${q.correctTokens.join('、')}</strong><br><small>${q.keyHint}</small>`);
    updateScore(6);
  } else {
    showFeedback('ng', `关键词应该是：<strong>${q.correctTokens.join('、')}</strong><br><small>${q.keyHint}</small>`);
  }
  setTimeout(() => {
    S.step = 3;
    renderStepsRow(3);
    renderStep(3);
    hideFeedback();
  }, 1800);
}


// ═══════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════
function nextQuestion() {
  S.qIdx++;
  if (S.qIdx >= S.queue.length) {
    showResult();
  } else {
    document.getElementById('mainActionBtn').onclick = handleAction;
    renderQuestion();
  }
}

function showResult() {
  const total = S.queue.length;
  const pct = Math.round(S.correct/total*100);
  const emoji = pct>=80?'🏆':pct>=60?'😊':'💪';
  document.getElementById('resultCard').innerHTML = `
    <div class="result-emoji">${emoji}</div>
    <div class="result-title">练习完成！</div>
    <div class="result-score">${S.score}</div>
    <div class="result-sub">总积分 · 答对 ${S.correct}/${total} 题（第一步）</div>
  `;
  document.getElementById('statRow').innerHTML = `
    <div class="stat-box"><div class="stat-num">${S.correct}</div><div class="stat-label">修辞识别正确</div></div>
    <div class="stat-box"><div class="stat-num">${total-S.correct}</div><div class="stat-label">需要复习</div></div>
    <div class="stat-box"><div class="stat-num">${S.score}</div><div class="stat-label">总积分</div></div>
  `;
  showScreen('result');
}

// ═══════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════
function updateScore(d) {
  S.score += d;
  document.getElementById('scorePill').textContent = S.score + ' 分';
}
function showFeedback(type, html) {
  const fb = document.getElementById('mainFeedback');
  fb.className = 'feedback show ' + type;
  fb.innerHTML = html;
}
function hideFeedback() {
  const fb = document.getElementById('mainFeedback');
  fb.className = 'feedback';
  fb.innerHTML = '';
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function escHtml(s) { return s.replace(/'/g,"\\'"); }
function escHtmlDisplay(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escHtmlAttr(s) { return s.replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }
function escRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

// Score chip styles inline
const styleEl = document.createElement('style');
styleEl.textContent = `.score-high{background:#e8f5e9;color:#2e7d32}.score-mid{background:#fff8e1;color:#f57f17}.score-low{background:#fdecea;color:#b03a2e}`;
document.head.appendChild(styleEl);

// Init
S.selectedRhetorics = [...RHETORICS_BY_LEVEL[S.level]]; // select all by default
renderRhetoricChips();
document.getElementById('startBtn').disabled = false;
</script>
