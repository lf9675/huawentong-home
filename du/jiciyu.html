<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>汉字结构大乱斗 v2.0</title>
<style>
:root{--red:#e74c3c;--green:#27ae60;--blue:#2980b9;--orange:#e67e22;--gold:#f39c12;--bg:#fdf6e3;--text:#2c3e50;--card:#fff;--sh:0 2px 12px rgba(0,0,0,.1)}
*{box-sizing:border-box;touch-action:none;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow-y:auto;touch-action:auto;padding-bottom:72px;padding-top:57px}
.header{width:100%;background:var(--card);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--sh);position:fixed;top:0;left:0;right:0;z-index:50}
.select-group{display:flex;gap:6px}
select{padding:6px 8px;border-radius:8px;font-size:14px;border:1.5px solid #ddd;font-weight:bold;background:#f8f9fa;color:var(--text);outline:none;font-family:inherit}
.header-mid{font-size:12px;color:#95a5a6;text-align:center;flex:1;padding:0 6px}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.score-display{font-size:17px;font-weight:bold;color:var(--red)}
.combo-display{font-size:11px;font-weight:bold;min-height:14px;color:var(--orange)}
.progress-wrap{width:100%;height:5px;background:#ecf0f1;position:fixed;top:52px;left:0;right:0;z-index:49}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green),#2ecc71);transition:width .5s cubic-bezier(.4,0,.2,1);width:0%}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:500;display:flex;align-items:center;justify-content:center}
.modal{background:var(--card);border-radius:20px;padding:32px 24px;width:88%;max-width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:popIn .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal-emoji{font-size:52px;margin-bottom:12px}
.modal-title{font-size:22px;font-weight:bold;color:var(--text);margin-bottom:6px}
.modal-sub{font-size:13px;color:#7f8c8d;margin-bottom:20px;line-height:1.5}
.modal-input{width:100%;padding:13px;font-size:17px;border:2px solid #ecf0f1;border-radius:10px;text-align:center;margin-bottom:14px;font-family:inherit;outline:none;transition:border-color .2s}
.modal-input:focus{border-color:var(--green)}
.modal-btn{width:100%;padding:14px;font-size:16px;background:var(--green);color:#fff;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-family:inherit}
.modal-btn:active{opacity:.9;transform:scale(.98)}
.ach-toast{position:fixed;top:62px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#f39c12,#e67e22);color:#fff;padding:10px 22px;border-radius:30px;font-size:14px;font-weight:bold;z-index:400;box-shadow:0 6px 20px rgba(243,156,18,.45);animation:toastIn .35s cubic-bezier(.34,1.56,.64,1);display:none;white-space:nowrap}
@keyframes toastIn{from{transform:translateX(-50%) translateY(-20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.pool-container{width:95%;max-width:500px;min-height:108px;background:rgba(255,255,255,.85);border:2px dashed #b2bec3;border-radius:14px;margin:12px 0 6px;padding:12px 14px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px}
.pool-title{width:100%;text-align:center;font-size:11px;color:#95a5a6;margin:-4px 0}
.component{width:46px;height:46px;background:var(--card);border:2px solid #2c3e50;border-radius:9px;font-size:24px;font-family:"KaiTi","楷体",serif;display:flex;align-items:center;justify-content:center;cursor:grab;user-select:none;box-shadow:2px 2px 0 #2c3e50;transition:transform .1s}
.component:active{cursor:grabbing;transform:scale(1.12)}
.target-info{font-size:14px;color:var(--text);font-weight:bold;text-align:center;margin-bottom:4px}
.pinyin-display{font-size:36px;color:var(--green);font-family:Arial,sans-serif;letter-spacing:3px;display:block;margin-top:2px;font-weight:bold}
.struct-hint{font-size:12px;color:var(--orange);margin:4px 0 10px}
.dynamic-board{width:160px;height:160px;background:var(--red);border:4px solid var(--red);gap:2px;margin-bottom:14px;transition:transform .35s,border-color .35s,background-color .35s}
.dynamic-board.success{transform:scale(1.06);box-shadow:0 0 24px rgba(39,174,96,.5);border-color:var(--green);background-color:var(--green)}
.grid-cell{background:#fff;display:flex;align-items:center;justify-content:center;font-size:46px;font-family:"KaiTi","楷体",serif;color:#000}
.grid-cell.shake{animation:cellShake .3s ease}
@keyframes cellShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.layout-lr{display:grid;grid-template-columns:1fr 1fr}
.layout-tb{display:grid;grid-template-rows:1fr 1fr}
.layout-lmr{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:36px}
.layout-tmb{display:grid;grid-template-rows:1fr 1fr 1fr;font-size:36px}
.layout-l-tr-br{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.layout-l-tr-br .cell-0{grid-row:1/3;grid-column:1/2}
.layout-l-tr-br .cell-1{grid-row:1/2;grid-column:2/3;font-size:35px}
.layout-l-tr-br .cell-2{grid-row:2/3;grid-column:2/3;font-size:35px}
.layout-l-tmb{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr}
.layout-l-tmb .cell-0{grid-row:1/4;grid-column:1/2}
.layout-l-tmb .cell-1{grid-row:1/2;grid-column:2/3;font-size:25px}
.layout-l-tmb .cell-2{grid-row:2/3;grid-column:2/3;font-size:25px}
.layout-l-tmb .cell-3{grid-row:3/4;grid-column:2/3;font-size:25px}
.layout-tb4{display:grid;grid-template-columns:1fr;grid-template-rows:1fr 1fr 1fr 1fr}
.layout-tb4 .cell-0,.layout-tb4 .cell-1,.layout-tb4 .cell-2,.layout-tb4 .cell-3{font-size:25px}
.layout-l-tb{display:block;position:relative;width:160px;height:160px;background:transparent;border:none;margin-bottom:14px}
.layout-l-tb.success{transform:scale(1.06);filter:drop-shadow(0 0 12px rgba(39,174,96,.5))}
.layout-l-tb .cell-0{position:absolute;top:0;left:0;width:100%;height:100%;border-top:6px dashed #9b59b6;border-left:6px dashed #9b59b6;border-bottom:6px dashed #9b59b6;border-radius:12px 0 0 12px;background:rgba(155,89,182,.05);font-size:42px;display:flex;align-items:center;padding-left:10px}
.layout-l-tb .cell-1{position:absolute;top:50%;transform:translateY(-50%);right:5px;width:78px;height:78px;border:4px dashed #1abc9c;border-radius:8px;background:rgba(26,188,156,.1);font-size:36px;display:flex;align-items:center;justify-content:center}
/* semi-bl: bottom-left wraps (辶/走 type) — TOP is open — inner at top-right */
.layout-semi-bl{display:block;position:relative;width:160px;height:160px;background:transparent;border:none;margin-bottom:14px}
.layout-semi-bl.success{transform:scale(1.06);filter:drop-shadow(0 0 12px rgba(39,174,96,.5))}
.layout-semi-bl .cell-0{position:absolute;top:0;left:0;width:100%;height:100%;border-left:6px dashed #9b59b6;border-bottom:6px dashed #9b59b6;border-radius:0 0 0 12px;background:rgba(155,89,182,.05);font-size:42px;display:flex;align-items:flex-end;padding-bottom:8px;padding-left:8px}
.layout-semi-bl .cell-1{position:absolute;top:5px;right:5px;width:100px;height:78px;border:4px dashed #1abc9c;border-radius:8px;background:rgba(26,188,156,.1);font-size:36px;display:flex;align-items:center;justify-content:center}
/* semi-tl: top-left wraps (厂/疒/尸/广 type) — BOTTOM is open — inner at bottom-right */
.layout-semi-tl{display:block;position:relative;width:160px;height:160px;background:transparent;border:none;margin-bottom:14px}
.layout-semi-tl.success{transform:scale(1.06);filter:drop-shadow(0 0 12px rgba(39,174,96,.5))}
.layout-semi-tl .cell-0{position:absolute;top:0;left:0;width:100%;height:100%;border-left:6px dashed #9b59b6;border-top:6px dashed #9b59b6;border-radius:12px 0 0 0;background:rgba(155,89,182,.05);font-size:42px;display:flex;align-items:flex-start;padding-top:8px;padding-left:8px}
.layout-semi-tl .cell-1{position:absolute;bottom:5px;right:5px;width:100px;height:78px;border:4px dashed #1abc9c;border-radius:8px;background:rgba(26,188,156,.1);font-size:36px;display:flex;align-items:center;justify-content:center}
.quiz-panel{width:95%;max-width:500px;background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--sh);display:none;flex-direction:column;gap:9px;margin-bottom:16px;animation:slideUp .3s ease-out}
@keyframes slideUp{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
.quiz-title{font-size:14px;color:#34495e;text-align:center}
.quiz-word{font-size:22px;color:var(--green);font-weight:bold;letter-spacing:2px}
.quiz-btn{width:100%;padding:13px;font-size:14px;text-align:left;background:#f8f9fa;border:2px solid #ecf0f1;border-radius:9px;cursor:pointer;transition:all .18s;font-family:inherit}
.quiz-btn:active{transform:scale(.98)}
.quiz-btn.correct{background:var(--green);color:#fff;border-color:var(--green)}
.quiz-btn.wrong{background:var(--red);color:#fff;border-color:var(--red)}
/* === 字形切割模式 === */
.cut-piece{padding:0!important;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fff}
.cut-piece svg{display:block}
.cut-board-v{display:flex;flex-direction:row;width:auto;height:160px;background:transparent;border:none;gap:0}
.cut-board-h{display:flex;flex-direction:column;width:160px;height:auto;background:transparent;border:none;gap:0}
.cut-cell{position:relative;border:2px dashed #b2bec3;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cut-board-v .cut-cell{width:80px;height:160px}
.cut-board-h .cut-cell{width:160px;height:53px}
.cut-cell[data-filled='true']{border-style:solid;border-color:var(--green)}
.cut-ghost{position:absolute;inset:0;opacity:0.12;pointer-events:none;display:flex;align-items:center;justify-content:center}
.cut-ghost svg{width:100%;height:100%}
/* === 同字词配对 === */
.match-panel{width:95%;max-width:500px;background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--sh);display:none;flex-direction:column;gap:12px;margin-bottom:16px;animation:slideUp .3s ease-out}
.match-panel.show{display:flex}
.match-title{font-size:14px;color:#34495e;text-align:center;line-height:1.7}
.match-char{font-family:"KaiTi","楷体",serif;font-size:22px;color:var(--green);font-weight:bold}
.match-sub{font-size:12px;color:#95a5a6}
.match-area{display:flex;flex-direction:column;gap:10px}
.match-row{display:flex;align-items:stretch;gap:10px;min-height:52px}
.match-word{flex:0 0 96px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ebf5fb,#d6eaf8);border:2px solid var(--blue);border-radius:10px;font-size:17px;font-weight:bold;color:var(--text);cursor:grab;user-select:none;font-family:"KaiTi","楷体",serif;touch-action:none;transition:transform .12s,opacity .2s}
.match-word:active{cursor:grabbing;transform:scale(1.06)}
.match-word.placed{opacity:.35;pointer-events:none;border-style:dashed}
.match-word.dragging{opacity:.7;box-shadow:0 6px 18px rgba(41,128,185,.4)}
.match-def{flex:1;display:flex;align-items:center;gap:8px;background:#f8f9fa;border:2px dashed #cdd5db;border-radius:10px;padding:8px 12px;font-size:13px;color:var(--text);min-height:52px;transition:all .15s}
.match-def .drop-slot{flex:0 0 90px;min-height:36px;border:2px dashed #b2bec3;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;color:#b2bec3;font-family:"KaiTi","楷体",serif}
.match-def.over{border-color:var(--blue);background:#eaf4fb}
.match-def.correct{border-color:var(--green);border-style:solid;background:rgba(39,174,96,.08)}
.match-def.correct .drop-slot{border-color:var(--green);border-style:solid;color:var(--green)}
.match-def.wrong-shake{animation:cellShake .3s ease}
.match-def-text{flex:1}
.match-def-en{color:#95a5a6;font-size:11px}
.progress-label{font-size:11px;color:#b2bec3;margin-bottom:6px}
.feedback-overlay{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:300;pointer-events:none;display:none;text-align:center;width:90%}
.feedback-text{font-size:38px;font-weight:bold;text-shadow:0 4px 12px rgba(0,0,0,.2);animation:bounceIn .45s}
@keyframes bounceIn{0%{transform:scale(0)}75%{transform:scale(1.12)}100%{transform:scale(1)}}
.particle{position:fixed;pointer-events:none;z-index:350;width:9px;height:9px;border-radius:50%;animation:pFly .75s ease-out forwards}
@keyframes pFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}
.bottom-nav{position:fixed;bottom:0;width:100%;max-width:600px;background:var(--card);display:flex;border-top:1px solid #ecf0f1;z-index:100;box-shadow:0 -2px 12px rgba(0,0,0,.07)}
.nav-btn{flex:1;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;font-family:inherit;position:relative}
.nav-btn:active{background:#f8f9fa}
.nav-icon{font-size:21px}
.nav-label{font-size:10px;color:#95a5a6}
.nav-btn.active .nav-label{color:var(--green);font-weight:bold}
.nav-badge{position:absolute;top:6px;right:calc(50% - 18px);background:var(--red);color:#fff;font-size:9px;font-weight:bold;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.page{width:100%;max-width:500px;display:none;padding:10px 12px}
.page.active{display:block}
#gamePage{flex-direction:column;align-items:center}
#gamePage.active{display:flex;flex-direction:column;align-items:center}
.page-title{font-size:18px;font-weight:bold;color:var(--text);margin:8px 0 4px;text-align:center}
.page-sub{font-size:12px;color:#95a5a6;text-align:center;margin-bottom:14px}
.stats-row{display:flex;justify-content:space-around;background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--sh)}
.stat-item{text-align:center}
.stat-num{font-size:24px;font-weight:bold;color:var(--text)}
.stat-lbl{font-size:11px;color:#95a5a6;margin-top:2px}
.unit-hd{font-size:13px;font-weight:bold;color:var(--text);background:#ecf0f1;padding:5px 12px;border-radius:7px;margin:12px 0 8px;display:flex;justify-content:space-between;align-items:center}
.unit-pct{font-size:11px;color:var(--green)}
.char-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:6px}
.char-card{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:"KaiTi","楷体",serif;font-size:22px;border:2px solid #ecf0f1;background:#f8f9fa;color:#bdc3c7;position:relative}
.char-card.blue{background:linear-gradient(135deg,#ebf5fb,#d6eaf8);border-color:#2980b9;color:var(--text)}
.char-card.gold{background:linear-gradient(135deg,#fef9e7,#fdebd0);border-color:var(--gold);color:var(--text);box-shadow:0 2px 8px rgba(243,156,18,.3)}
.card-badge{position:absolute;top:1px;right:2px;font-size:9px}
.error-list{display:flex;flex-direction:column;gap:9px}
.error-item{background:var(--card);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh);border-left:4px solid var(--red)}
.error-char{font-family:"KaiTi","楷体",serif;font-size:40px;min-width:46px;text-align:center}
.error-info{flex:1}
.error-word{font-size:15px;font-weight:bold;color:var(--text)}
.error-def{font-size:12px;color:#7f8c8d;margin-top:2px}
.error-cnt{font-size:11px;color:var(--red);margin-top:3px;font-weight:bold}
.empty-state{text-align:center;padding:50px 20px;color:#b2bec3}
.empty-icon{font-size:52px;margin-bottom:12px}
.empty-txt{font-size:14px;line-height:1.6}
.ach-list{display:flex;flex-direction:column;gap:10px}
.ach-item{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh);opacity:.4;transition:opacity .3s}
.ach-item.done{opacity:1}
.ach-icon{font-size:38px;min-width:46px;text-align:center}
.ach-info{flex:1}
.ach-name{font-size:15px;font-weight:bold;color:var(--text)}
.ach-desc{font-size:12px;color:#7f8c8d;margin-top:3px;line-height:1.4}
.ach-badge{font-size:11px;padding:4px 10px;border-radius:12px;background:#ecf0f1;color:#95a5a6;white-space:nowrap}
.ach-item.done .ach-badge{background:#d5f5e3;color:var(--green)}

.teacher-card{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.teacher-card-title{font-size:14px;font-weight:bold;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.class-code{font-size:36px;font-weight:bold;letter-spacing:6px;color:var(--blue);text-align:center;padding:10px 0;font-family:monospace}
.copy-btn{width:100%;padding:11px;background:var(--blue);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:bold;cursor:pointer;font-family:inherit;margin-top:4px}
.copy-btn:active{opacity:.85}
.copy-btn.green{background:var(--green)}
.dictation-list{list-style:none;padding:0;margin:0}
.dictation-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
.dictation-item:last-child{border-bottom:none}
.dictation-num{font-size:12px;color:#b2bec3;min-width:20px}
.dictation-char{font-family:"KaiTi","楷体",serif;font-size:24px;min-width:30px}
.dictation-py{color:#95a5a6;font-size:12px;flex:1}
.top-errors-row{display:flex;gap:8px;flex-wrap:wrap}
.top-err-chip{background:#fdebd0;border:1px solid #e59866;border-radius:8px;padding:6px 12px;display:flex;align-items:center;gap:6px;font-size:13px}
.top-err-chip span{font-family:"KaiTi","楷体",serif;font-size:22px}
.top-err-cnt{font-size:10px;color:var(--red);font-weight:bold}

.unit-picker-btn{padding:5px 9px;border-radius:8px;font-size:12px;border:1.5px solid #ddd;font-weight:bold;background:#f8f9fa;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:3px;font-family:inherit;max-width:130px;overflow:hidden;white-space:nowrap}
.unit-picker-panel{position:fixed;top:58px;left:8px;background:var(--card);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.2);z-index:200;padding:8px 10px;min-width:155px;display:none}
.unit-picker-panel.open{display:block}
.unit-check-item{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:7px;cursor:pointer;font-size:14px}
.unit-check-item input{width:16px;height:16px;cursor:pointer;accent-color:var(--green)}
.unit-check-all{font-weight:bold;border-bottom:1px solid #ecf0f1;margin-bottom:3px;padding-bottom:8px}

/* === Side feedback text === */
.feedback-left-side{position:fixed;right:calc(50% + 90px);top:38%;writing-mode:vertical-rl;text-orientation:mixed;font-size:30px;font-weight:900;color:#e74c3c;pointer-events:none;z-index:310;display:none;text-shadow:0 3px 10px rgba(231,76,60,.4);letter-spacing:4px}
.feedback-right-side{position:fixed;left:calc(50% + 90px);top:34%;writing-mode:vertical-rl;text-orientation:mixed;font-size:22px;font-weight:900;color:#e74c3c;pointer-events:none;z-index:310;display:none;text-shadow:0 3px 10px rgba(231,76,60,.4);letter-spacing:3px}
.feedback-side-anim{animation:sideIn .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes sideIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="overlay" id="nameModal">
<div class="modal">
<div class="modal-emoji">🎮</div>
<div class="modal-title">欢迎来到汉字大乱斗！</div>
<div class="modal-sub">请先填写你的班级和姓名<br>老师才能看到你的学习记录哦</div>
<input class="modal-input" id="classInput" placeholder="班级（例如：中二3班）" maxlength="12" type="text">
<input class="modal-input" id="nameInput" placeholder="姓名（例如：小明）" maxlength="8" type="text">
<button class="modal-btn" onclick="savePlayerName()">开始游戏 🚀</button>
</div>
</div>
<div class="ach-toast" id="achToast"></div>
<div class="header">

    parts.forEach(q=>{if(!allGlobalParts.includes(q))allGlobalParts.push(q);});
  }
  if(def)allDistractors.push(def);
});

// 从 unitKey 解析出 年级码/单元号/课文号。键格式：S1_U1_L1
function parseUnitKey(uk){
  const m=uk.match(/^(S\d)_U(\d+)_L(\d+)$/);
  if(!m)return null;
  return {gradeCode:m[1],unitNum:+m[2],lessonNum:+m[3]};
}
// 取某年级下所有"单元号"（去重排序）
function unitsOfGrade(gradeCode){
  const s=new Set();
  Object.keys(wordBank).forEach(uk=>{
    const pk=parseUnitKey(uk);
    if(pk&&pk.gradeCode===gradeCode)s.add(pk.unitNum);
  });
  return [...s].sort((a,b)=>a-b);
}
// 取某年级某单元下所有课文 unitKey（按课文号排序）
function lessonKeysOf(gradeCode,unitNum){
  return Object.keys(wordBank).filter(uk=>{
    const pk=parseUnitKey(uk);
    return pk&&pk.gradeCode===gradeCode&&pk.unitNum===unitNum;
  }).sort((a,b)=>parseUnitKey(a).lessonNum-parseUnitKey(b).lessonNum);
}

function cKey(u,w){return u+'|'+w;}
function masteryLevel(key){
  const m=ls.get(SK.mastery)||{};
  const d=m[key];
  if(!d)return 0;
  if(d.correct>=3)return 2;
  if(d.correct>=1)return 1;
  return 0;
}
function recordCorrect(u,w){
  const key=cKey(u,w),m=ls.get(SK.mastery)||{};
  if(!m[key])m[key]={correct:0,wrong:0};
  m[key].correct++;ls.set(SK.mastery,m);
}
function recordWrong(u,w,data){
  const key=cKey(u,w),m=ls.get(SK.mastery)||{};
  if(!m[key])m[key]={correct:0,wrong:0};
  m[key].wrong++;ls.set(SK.mastery,m);
  const errs=ls.get(SK.errors)||{};
  if(!errs[key])errs[key]={count:0,data};
  errs[key].count++;errs[key].data=data;
  ls.set(SK.errors,errs);updateErrorBadge();
}
function updateErrorBadge(){
  const errs=ls.get(SK.errors)||{};

  for(let i=0;i<10;i++){
    const p=document.createElement('div');

    const angle=(i/10)*360,dist=35+Math.random()*55;

    panel.appendChild(div);
  });

    updateUnitPickerLabel(gradeCode,allUnitNums);
    rebuildLessonSelect();
    initUnitGame(true);
  });
  updateUnitPickerLabel(gradeCode,allUnitNums);
  rebuildLessonSelect();

}

// 当前选中的课文：'all' 表示选中单元下全部课文，否则是具体 unitKey
let currentLessonKey='all';
// 重建课文下拉：列出当前选中单元下的所有课文
function rebuildLessonSelect(){
  const gradeCode=document.getElementById('gradeSelect').value;
  const allUnitNums=unitsOfGrade(gradeCode);
  const selUnits=getSelectedUnitNums(gradeCode,allUnitNums);
  const sel=document.getElementById('lessonSelect');
  sel.innerHTML='<option value="all">全部课文</option>';
  selUnits.forEach(un=>{
    lessonKeysOf(gradeCode,un).forEach(uk=>{
      const pk=parseUnitKey(uk);
      const o=document.createElement('option');
      o.value=uk;
      o.textContent='单元'+unitNumLabel(un)+' · '+LESSON_NAMES[pk.lessonNum];
      sel.appendChild(o);
    });
  });
  currentLessonKey='all';
  sel.value='all';
}
function onLessonChange(){
  currentLessonKey=document.getElementById('lessonSelect').value;
  initUnitGame(true);
}

function buildWeightedPool(selUnitKeys){
  const errs=ls.get(SK.errors)||{};
  let pool=[];
  selUnitKeys.forEach(uk=>{
    (wordBank[uk]||[]).forEach(item=>{
      const key=cKey(uk,item.w);
      const errCnt=(errs[key]?.count)||0;
      const copies=1+Math.min(3,errCnt);
      for(let i=0;i<copies;i++)pool.push({...item,_unit:uk});
    });
  });
  return pool.sort(()=>Math.random()-.5);
}
function refillPool(poolKey,selUnitKeys){
  if(!unitPlayQueue[poolKey]||unitPlayQueue[poolKey].length<5)
    unitPlayQueue[poolKey]=buildWeightedPool(selUnitKeys);
}
// 返回当前应练习的 unitKey 列表（已结合单元勾选 + 课文下拉）
function getCurrentSelUnits(){
  const gradeCode=document.getElementById('gradeSelect').value;
  const allUnitNums=unitsOfGrade(gradeCode);
  const selUnits=getSelectedUnitNums(gradeCode,allUnitNums);
  if(currentLessonKey&&currentLessonKey!=='all'){
    return [currentLessonKey];   // 指定了某一课
  }
  // 全部课文：展开选中单元下的所有课文 key
  let keys=[];
  selUnits.forEach(un=>{ keys=keys.concat(lessonKeysOf(gradeCode,un)); });
  return keys;
}
function initUnitGame(forceReset=false){
  const sel=getCurrentSelUnits();
  const poolKey='pool_'+sel.join('_');
  if(forceReset||!unitPlayQueue[poolKey]||unitPlayQueue[poolKey].length<5){
    unitPlayQueue[poolKey]=buildWeightedPool(sel);
    if(!forceReset)triggerFeedback(true,'🎉 全部完成！二刷开始！');
  }
  const n=Math.min(10,unitPlayQueue[poolKey].length);
  currentSet=unitPlayQueue[poolKey].splice(0,n);
  currentPoolKey=poolKey;currentWordIndex=0;loadWord();
}
function loadWord(){
  document.getElementById('quizPanel').style.display='none';
  const mp=document.getElementById('matchPanel');if(mp){mp.classList.remove('show');mp.style.display='none';}
  const data=currentSet[currentWordIndex];
  document.getElementById('pinyinHint').innerText=data.py;
  // Progress bar: show consecutive streak toward next achievement
  const _nextT=ACH_TIERS.find(a=>consecutiveCorrect<a.target);
  const _tIdx=_nextT?ACH_TIERS.indexOf(_nextT):ACH_TIERS.length;
  const _tMax=_nextT?_nextT.target:ACH_TIERS[ACH_TIERS.length-1].target;
  const _tBase=_tIdx>0?ACH_TIERS[_tIdx-1].target:0;
  const _pct=_nextT?Math.max(0,Math.min(100,((consecutiveCorrect-_tBase)/(_tMax-_tBase))*100)):100;
  document.getElementById('progressFill').style.width=_pct+'%';
  document.getElementById('progressLabel').innerText=_nextT?`连续 ${consecutiveCorrect}/${_tMax} 字 → ${_nextT.name}`:`🏆 已解锁全部成就！连续${consecutiveCorrect}字！`;
  const layoutMap={'lr':'左右结构','tb':'上下结构','lmr':'左中右结构','tmb':'上中下结构','l-tb':'半包围（右边开口）','semi-bl':'半包围（上方开口）','semi-tl':'半包围（下方开口）','l-tr-br':'左右结构(右边分上下)','l-tmb':'左右结构(右边分上中下)','tb4':'四层上下结构','cut':'看清字形，拼回完整字'};
  document.getElementById('structHint').innerHTML=`💡 提示：这是一个【${layoutMap[data.layout]||'特殊结构'}】的字`;

  if(data.mode==='cut'){ loadWordCut(data); return; }

  const pool=document.getElementById('pool');
  pool.innerHTML='<div class="pool-title">请从下方找出正确的偏旁部首，拖入红框中</div>';
  let poolParts=[...data.parts];
  const shuffled=[...allGlobalParts].sort(()=>Math.random()-.5);
  for(const p of shuffled){if(!poolParts.includes(p))poolParts.push(p);if(poolParts.length>=data.parts.length+4)break;}
  poolParts.sort(()=>Math.random()-.5);
  poolParts.forEach((pt,i)=>{
    const piece=document.createElement('div');
    piece.className='component';piece.innerText=pt;piece.id='piece-'+i;
    piece.addEventListener('mousedown',dragStart);
    piece.addEventListener('touchstart',dragStart,{passive:false});
    pool.appendChild(piece);
  });
  const board=document.getElementById('board');
  board.className=`dynamic-board layout-${data.layout}`;board.innerHTML='';
  data.parts.forEach((pt,idx)=>{
    const cell=document.createElement('div');
    cell.className=`grid-cell cell-${idx}`;
    cell.dataset.expected=pt;cell.dataset.filled='false';
    board.appendChild(cell);
  });
}

// ═══════════════════════════════════════════════════════════
//  字形切割模式：把真字切成N块，学生拖回拼成完整字
// ═══════════════════════════════════════════════════════════
function charSliceSVG(ch, dir, idx, n, boxW, boxH){
  // 用真实字体渲染整字，按 dir(h横切/v竖切) 取第 idx/n 段
  const S=200;
  let vbX,vbY,vbW,vbH;
  if(dir==='v'){ vbW=S/n; vbH=S; vbX=S/n*idx; vbY=0; }
  else { vbW=S; vbH=S/n; vbX=0; vbY=S/n*idx; }
  return `<svg width="${boxW}" height="${boxH}" viewBox="${vbX} ${vbY} ${vbW} ${vbH}" preserveAspectRatio="xMidYMid meet">`+
    `<text x="${S/2}" y="${S*0.8}" font-size="180" text-anchor="middle" font-family="KaiTi,'楷体',serif" fill="#000">${ch}</text></svg>`;
}
function loadWordCut(data){
  const n=data.cutN, dir=data.cutDir, ch=data.w;
  const pool=document.getElementById('pool');
  pool.innerHTML='<div class="pool-title">请把下面的字块，按正确位置拖进红框，拼成完整的字</div>';

  // 字块尺寸（池中）
  const PW = dir==='v' ? Math.round(120/n) : 92;
  const PH = dir==='v' ? 92 : Math.round(120/n);

  // 正确块
  const items=[];
  for(let idx=0;idx<n;idx++) items.push({ch,idx,n,dir,correct:true});
  // 干扰块：从别的字里取切片（同方向），数量 = n 个正确块配 2 个干扰
  const distractorChars=[];
  for(const uk in wordBank){
    for(const it of wordBank[uk]){
      if(it.mode==='cut' && it.w!==ch && it.cutDir===dir){ distractorChars.push(it); }
    }
  }
  const shufD=distractorChars.sort(()=>Math.random()-.5);
  let added=0;
  for(const d of shufD){
    if(added>=2)break;
    const ri=Math.floor(Math.random()*d.cutN);
    items.push({ch:d.w,idx:ri,n:d.cutN,dir,correct:false});
    added++;
  }
  // 打乱所有块
  items.sort(()=>Math.random()-.5);
  items.forEach((it,i)=>{
    const piece=document.createElement('div');
    piece.className='component cut-piece';
    piece.style.width=PW+'px';piece.style.height=PH+'px';
    piece.innerHTML=charSliceSVG(it.ch,it.dir,it.idx,it.n,PW,PH);
    // 只有正确块带 cutIdx 能匹配；干扰块 cutIdx 设为 -1（永不匹配）
    piece.dataset.cutIdx = it.correct ? it.idx : ('x'+i);
    piece.id='piece-'+i;
    piece.addEventListener('mousedown',dragStart);
    piece.addEventListener('touchstart',dragStart,{passive:false});
    pool.appendChild(piece);
  });

  // 字框：n 个格子，按 dir 排列
  const board=document.getElementById('board');
  board.className='dynamic-board '+(dir==='v'?'cut-board-v':'cut-board-h');
  board.innerHTML='';
  for(let idx=0;idx<n;idx++){
    const cell=document.createElement('div');
    cell.className='grid-cell cut-cell';
    cell.dataset.cutExpect=idx;cell.dataset.filled='false';
    cell.innerHTML=`<div class="cut-ghost">${charSliceSVG(ch,dir,idx,n,'100%','100%')}</div>`;
    board.appendChild(cell);
  }
}
function dragStart(e){
  if(!e.target.classList.contains('component'))return;
  activePiece=e.target;
  const ec=e.type.includes('touch')?e.touches[0]:e;
  activePiece.style.position='fixed';activePiece.style.zIndex=1000;
  movePiece(ec.clientX,ec.clientY);
  document.addEventListener('mousemove',dragMove);
  document.addEventListener('touchmove',dragMove,{passive:false});
  document.addEventListener('mouseup',dragEnd);
  document.addEventListener('touchend',dragEnd);
}
function dragMove(e){
  if(!activePiece)return;e.preventDefault();
  const ec=e.type.includes('touch')?e.touches[0]:e;
  movePiece(ec.clientX,ec.clientY);
}
function movePiece(x,y){activePiece.style.left=(x-22.5)+'px';activePiece.style.top=(y-22.5)+'px';}
function dragEnd(e){
  if(!activePiece)return;
  const ec=e.type.includes('touch')?e.changedTouches[0]:e;
  activePiece.style.visibility='hidden';
  const target=document.elementFromPoint(ec.clientX,ec.clientY);
  activePiece.style.visibility='visible';
  const cell=target?target.closest('.grid-cell'):null;
  if(cell&&cell.dataset.filled==='false'){
    // 切割模式：按 cutIdx 匹配 cutExpect
    if(activePiece.classList.contains('cut-piece')){
      if(cell.dataset.cutExpect===activePiece.dataset.cutIdx){
        cell.innerHTML='';
        const svg=activePiece.querySelector('svg').cloneNode(true);
        svg.setAttribute('width','100%');svg.setAttribute('height','100%');
        cell.appendChild(svg);
        cell.dataset.filled='true';
        activePiece.remove();incCombo();
        spawnParticles(ec.clientX,ec.clientY);
        checkGridComplete();
      }else{
        cell.classList.add('shake');setTimeout(()=>cell.classList.remove('shake'),300);
        triggerFeedback(false,'位置不对，再试试！');resetPiece(activePiece);
      }
      cleanupDrag();return;
    }
    // 语义模式（原逻辑）
    if(cell.dataset.expected===activePiece.innerText){
      cell.innerText=activePiece.innerText;cell.dataset.filled='true';
      activePiece.remove();incCombo();
      spawnParticles(ec.clientX,ec.clientY);
      checkGridComplete();
    }else{
      cell.classList.add('shake');setTimeout(()=>cell.classList.remove('shake'),300);
      addScore(-1);resetCombo();consecutiveCorrect=0;
      const uk=currentSet[currentWordIndex]._unit||getCurrentSelUnits()[0];
      recordWrong(uk,currentSet[currentWordIndex].w,currentSet[currentWordIndex]);
      triggerFeedback(false,'放错扣1分！');resetPiece(activePiece);
    }
  }else{resetPiece(activePiece);}
  cleanupDrag();
}
function resetPiece(p){p.style.position='static';p.style.zIndex='auto';}
function cleanupDrag(){
  activePiece=null;
  document.removeEventListener('mousemove',dragMove);
  document.removeEventListener('touchmove',dragMove);
  document.removeEventListener('mouseup',dragEnd);
  document.removeEventListener('touchend',dragEnd);
}
function checkGridComplete(){
  const cells=Array.from(document.querySelectorAll('.grid-cell'));
  if(!cells.every(c=>c.dataset.filled==='true'))return;
  new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA').play().catch(()=>{});
  document.getElementById('board').classList.add('success');
  const data=currentSet[currentWordIndex];
  const uk=data._unit||getCurrentSelUnits()[0];
  recordCorrect(uk,data.w);addScore(1);
  // Step 1: 立刻说"帅呆了"并显示左侧文字
  showFeedbackLeft('帅呆了！');
  // Step 2: 600ms后说词语，词语读完再显示选择题
  setTimeout(()=>{
    window.speechSynthesis.cancel();
    const utt=new SpeechSynthesisUtterance(data.vocab);
    utt.lang='zh-CN';
    let fired=false;
    const showQ=()=>{if(fired)return;fired=true;showQuiz(data);};
    utt.onend=showQ;
    setTimeout(showQ, Math.max(800, data.vocab.length*600));
    window.speechSynthesis.speak(utt);
  },600);
}
function showQuiz(data){
  // 若该字有≥2个同字词，进入"同字词配对"环节
  if(PAIRMAP[data.w] && PAIRMAP[data.w].length>=2){
    showMatch(data);
    return;
  }
  // 没有释义的字（多为切割字）：不出选择题，直接进下一题
  if(!data.def || !data.def.trim()){
    setTimeout(()=>{ advanceAfterQuiz(); },800);
    return;
  }
  document.getElementById('qw').innerText=`【${data.vocab}】`;
  const panel=document.getElementById('quizPanel');
  const cont=document.getElementById('optionsContainer');
  cont.innerHTML='';
  let opts=[data.def];
  const dist=allDistractors.filter(d=>d!==data.def).sort(()=>Math.random()-.5);
  opts.push(dist[0],dist[1],dist[2]);opts.sort(()=>Math.random()-.5);
  opts.forEach(opt=>{
    const btn=document.createElement('button');btn.className='quiz-btn';
    const m=opt.match(/(.*?)\s*\((.*?)\)/);
    btn.innerHTML=m?`${m[1]} <span style="color:#95a5a6;font-size:12px;">(${m[2]})</span>`:opt;
    btn.onclick=()=>handleAnswer(btn,opt===data.def);
    cont.appendChild(btn);
  });
  panel.style.display='flex';
}

// ═══════════════════════════════════════════════════════════
//  同字词配对：把词语拖到正确的释义上
// ═══════════════════════════════════════════════════════════
function splitDef(d){
  // 把 "原因 (Reason)" 拆成中文/英文
  const m=d.match(/^(.*?)\s*\((.*?)\)\s*$/);
  return m?{cn:m[1].trim(),en:m[2].trim()}:{cn:d,en:''};
}
function showMatch(data){
  document.getElementById('quizPanel').style.display='none';
  const panel=document.getElementById('matchPanel');
  const area=document.getElementById('matchArea');
  document.getElementById('matchChar').innerText=data.w;
  area.innerHTML='';

  const items=PAIRMAP[data.w].slice();         // [{w,d}]
  // 释义顺序打乱，词语顺序也打乱，避免位置对应
  const defs=items.slice().sort(()=>Math.random()-.5);
  const words=items.slice().sort(()=>Math.random()-.5);

  // 左列：词语（可拖）；右列：释义（放置区）。按释义行排布。
  defs.forEach((it)=>{
    const row=document.createElement('div');row.className='match-row';
    // 释义放置区
    const dz=document.createElement('div');dz.className='match-def';
    dz.dataset.answer=it.w;       // 这一行正确应放的词
    const sd=splitDef(it.d);
    dz.innerHTML=`<div class="drop-slot" data-slot="1">？</div>`+
      `<div class="match-def-text">${sd.cn}${sd.en?` <span class="match-def-en">(${sd.en})</span>`:''}</div>`;
    row.appendChild(dz);
    area.appendChild(row);
  });
  // 词语条放在顶部一排（独立容器），从释义行里分离，便于拖动
  const wordBar=document.createElement('div');
  wordBar.style.cssText='display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:4px';
  words.forEach(it=>{
    const wd=document.createElement('div');wd.className='match-word';
    wd.innerText=it.w;wd.dataset.word=it.w;
    attachMatchDrag(wd);
    wordBar.appendChild(wd);
  });
  area.insertBefore(wordBar, area.firstChild);

  matchRemaining=items.length;
  matchData=data;
  panel.classList.add('show');panel.style.display='flex';
}

let matchRemaining=0, matchData=null, mDragEl=null;
function attachMatchDrag(el){
  const start=(e)=>{
    if(el.classList.contains('placed'))return;
    e.preventDefault();
    mDragEl=el;el.classList.add('dragging');
    document.addEventListener('mousemove',mMove);
    document.addEventListener('touchmove',mMove,{passive:false});
    document.addEventListener('mouseup',mEnd);
    document.addEventListener('touchend',mEnd);
  };
  el.addEventListener('mousedown',start);
  el.addEventListener('touchstart',start,{passive:false});
}
function mMove(e){
  if(!mDragEl)return;
  e.preventDefault();
  const p=e.touches?e.touches[0]:e;
  mDragEl.style.position='fixed';mDragEl.style.zIndex=999;
  mDragEl.style.left=(p.clientX-48)+'px';mDragEl.style.top=(p.clientY-24)+'px';
  // 高亮悬停的释义区
  document.querySelectorAll('.match-def').forEach(d=>d.classList.remove('over'));
  const tgt=dropTargetAt(p.clientX,p.clientY);
  if(tgt&&!tgt.classList.contains('correct'))tgt.classList.add('over');
}
function dropTargetAt(x,y){
  const els=document.elementsFromPoint(x,y);
  for(const el of els){const d=el.closest&&el.closest('.match-def');if(d)return d;}
  return null;
}
function mEnd(e){
  if(!mDragEl)return;
  const p=e.changedTouches?e.changedTouches[0]:e;
  const tgt=dropTargetAt(p.clientX,p.clientY);
  const word=mDragEl.dataset.word;
  // 复位样式
  mDragEl.style.position='';mDragEl.style.left='';mDragEl.style.top='';mDragEl.style.zIndex='';
  mDragEl.classList.remove('dragging');
  document.querySelectorAll('.match-def').forEach(d=>d.classList.remove('over'));
  document.removeEventListener('mousemove',mMove);
  document.removeEventListener('touchmove',mMove);
  document.removeEventListener('mouseup',mEnd);
  document.removeEventListener('touchend',mEnd);

  if(tgt && !tgt.classList.contains('correct')){
    if(tgt.dataset.answer===word){
      // 正确：词放进slot，锁定
      const slot=tgt.querySelector('.drop-slot');
      slot.innerText=word;
      tgt.classList.add('correct');
      mDragEl.classList.add('placed');
      addScore(1);
      matchRemaining--;
      if(matchRemaining<=0){
        showFeedbackRight('全对！太厉害了！');
        setTimeout(()=>{advanceAfterQuiz();},1200);
      }
    }else{
      // 错误：抖动提示，可重拖
      tgt.classList.add('wrong-shake');
      setTimeout(()=>tgt.classList.remove('wrong-shake'),350);
      triggerFeedback(false,'再想想！');
    }
  }
  mDragEl=null;
}
// 配对/选择题结束后，进入下一题（抽取自原 handleAnswer 的推进逻辑）
function advanceAfterQuiz(){
  window.speechSynthesis.cancel();
  document.getElementById('matchPanel').classList.remove('show');
  document.getElementById('matchPanel').style.display='none';
  consecutiveCorrect++;checkAchievements();
  currentWordIndex++;
  if(currentWordIndex<currentSet.length){loadWord();}
  else{
    const sel=getCurrentSelUnits();
    const poolKey='pool_'+sel.join('_');
    refillPool(poolKey,sel);
    const n=Math.min(10,unitPlayQueue[poolKey].length);
    currentSet=unitPlayQueue[poolKey].splice(0,n);
    currentPoolKey=poolKey;currentWordIndex=0;loadWord();
  }
}
function handleAnswer(btn,isCorrect){
  if(btn.classList.contains('correct')||btn.classList.contains('wrong'))return;
  if(isCorrect){
    btn.classList.add('correct');addScore(1);
    consecutiveCorrect++;checkAchievements();
    showFeedbackRight('帅爆了，再来！');
    setTimeout(()=>{
      window.speechSynthesis.cancel();
      currentWordIndex++;
      if(currentWordIndex<currentSet.length){loadWord();}
      else{
        const sel=getCurrentSelUnits();
        const poolKey='pool_'+sel.join('_');
        refillPool(poolKey,sel);
        const n=Math.min(10,unitPlayQueue[poolKey].length);
        currentSet=unitPlayQueue[poolKey].splice(0,n);
        currentPoolKey=poolKey;currentWordIndex=0;loadWord();
      }
    },1100);
  }else{
    btn.classList.add('wrong');addScore(-1);resetCombo();consecutiveCorrect=0;
    const uk=currentSet[currentWordIndex]._unit||getCurrentSelUnits()[0];
    recordWrong(uk,currentSet[currentWordIndex].w,currentSet[currentWordIndex]);
    triggerFeedback(false,'再试一下！');
  }
}
function triggerFeedback(ok,txt){
  const fb=document.getElementById('feedbackMsg'),ft=document.getElementById('fbText');
  ft.innerText=txt;ft.style.color=ok?'var(--green)':'var(--red)';
  speakText(txt.replace(/[^a-zA-Z一-龥]/g,''));
  fb.style.display='block';setTimeout(()=>fb.style.display='none',1500);
}
function speakText(txt){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='zh-CN';window.speechSynthesis.speak(u);}

// ═══════════════════════════════════════════════════════════
//  老师管理
// ═══════════════════════════════════════════════════════════
function getOrCreateCode(){
  let code=ls.get('hzld_classcode');
  if(!code){code=Math.random().toString(36).substr(2,6).toUpperCase();ls.set('hzld_classcode',code);}
  return code;
}
function genNewCode(){
  const code=Math.random().toString(36).substr(2,6).toUpperCase();
  ls.set('hzld_classcode',code);
  document.getElementById('classCode').innerText=code;
}
function copyClassCode(){
  const code=document.getElementById('classCode').innerText;
  navigator.clipboard.writeText('班级码：'+code).then(()=>{
    const btn=document.querySelector('.copy-btn');
    btn.innerText='✅ 已复制！';setTimeout(()=>{btn.innerText='📋 复制班级码';},2000);
  }).catch(()=>alert('班级码：'+code));
}
function renderTeacher(){
  // 班级码
  document.getElementById('classCode').innerText=getOrCreateCode();
  // 错误率最高的字（前6个）
  const errs=ls.get(SK.errors)||{};
  const row=document.getElementById('topErrorsRow');
  const entries=Object.entries(errs).sort((a,b)=>b[1].count-a[1].count).slice(0,6);
  if(entries.length===0){
    row.innerHTML='<div style="color:#b2bec3;font-size:13px">暂无数据，请先开始游戏</div>';
  }else{
    row.innerHTML=entries.map(([k,v])=>
      `<div class="top-err-chip"><span>${v.data.w}</span><div><div style="font-size:11px">${v.data.py}</div><div class="top-err-cnt">错${v.count}次</div></div></div>`
    ).join('');
  }
  // 听写清单
  const sel=getCurrentSelUnits();
  const words=sel.flatMap(u=>wordBank[u]||[]);
  const list=document.getElementById('dictationList');
  list.innerHTML=words.map((item,i)=>
    `<li class="dictation-item"><span class="dictation-num">${i+1}.</span><span class="dictation-char">${item.w}</span><span class="dictation-py">${item.py}　${item.vocab}</span></li>`
  ).join('');
}
function copyDictation(){
  const gradeKey=document.getElementById('gradeSelect').value;
  const grade=gradeKey==='S1'?'中一':'中二';
  const sel=getCurrentSelUnits();
  const words=sel.flatMap(u=>wordBank[u]||[]);
  // 范围名称：若选了具体某课则显示课名，否则按单元
  let rangeName;
  if(currentLessonKey&&currentLessonKey!=='all'){
    const pk=parseUnitKey(currentLessonKey);
    rangeName='单元'+unitNumLabel(pk.unitNum)+LESSON_NAMES[pk.lessonNum];
  }else{
    const unitNums=[...new Set(sel.map(u=>parseUnitKey(u).unitNum))].sort((a,b)=>a-b);
    rangeName=unitNums.map(n=>'单元'+unitNumLabel(n)).join('、');
  }
  const text=`【${grade}${rangeName}听写清单】\n`+words.map((item,i)=>`${i+1}. ${item.w}（${item.py}）— ${item.vocab}`).join('\n');
  navigator.clipboard.writeText(text).then(()=>alert('✅ 已复制！可直接粘贴到家长群')).catch(()=>alert(text));
}

function showFeedbackLeft(txt){
  const el=document.getElementById('feedbackLeft');
  el.innerText=txt;
  el.className='feedback-left-side feedback-side-anim';
  el.style.display='block';
  speakText(txt.replace(/[^a-zA-Z\u4e00-\u9fa5]/g,''));
  setTimeout(()=>{el.style.display='none';el.className='feedback-left-side';},1600);
}
function showFeedbackRight(txt){
  const el=document.getElementById('feedbackRight');
  el.innerText=txt;
  el.className='feedback-right-side feedback-side-anim';
  el.style.display='block';
  speakText(txt.replace(/[^a-zA-Z\u4e00-\u9fa5]/g,''));
  spawnParticles(window.innerWidth/2,window.innerHeight*0.45);
  spawnParticles(window.innerWidth/2-60,window.innerHeight*0.5);
  spawnParticles(window.innerWidth/2+60,window.innerHeight*0.5);
  setTimeout(()=>{el.style.display='none';el.className='feedback-right-side';},1900);
}
window.onload=()=>{
  score=ls.get(SK.score)||0;
  document.getElementById('scoreVal').innerText=score;
  checkPlayerName();updateUnits();updateErrorBadge();
};
