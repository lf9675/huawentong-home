// ── 界面渲染与数据准备 ──
function renderUnitTags() {
  const c = document.getElementById('unit-tags');
  if (!c) return;
  c.innerHTML = '';
  Object.keys(VOCAB[currentGrade] || {}).forEach(u => {
    const t = document.createElement('span');
    t.className = 'tag' + (selectedUnits.has(u) ? ' active' : '');
    t.textContent = u;
    t.onclick = () => {
      if (selectedUnits.has(u)) { 
        selectedUnits.delete(u); 
        t.classList.remove('active'); 
      } else { 
        selectedUnits.add(u); 
        t.classList.add('active'); 
      }
      renderLessonSelect();
      buildWordQueue();
    };
    c.appendChild(t);
  });
}

function renderLessonSelect() {
  const sel = document.getElementById('lesson-select');
  if(!sel) return;
  sel.innerHTML = '<option value="all">全部课文</option>';
  selectedUnits.forEach(u => {
    Object.keys(VOCAB[currentGrade][u] || {}).forEach(l => {
      const o = document.createElement('option');
      o.value = u + '|' + l;
      o.textContent = u + ' · ' + l;
      sel.appendChild(o);
    });
  });
  currentLesson = 'all';
}

function buildWordQueue() {
  const raw = [];
  selectedUnits.forEach(u => {
    Object.entries(VOCAB[currentGrade][u] || {}).forEach(([lesson, words]) => {
      if (currentLesson === 'all' || currentLesson === (u + '|' + lesson)) {
        words.forEach(w => raw.push({ word: w, unit: u, lesson: lesson }));
      }
    });
  });
  wordQueue = raw.sort(() => Math.random() - 0.5);
}

// ── 本地错字本存储 ──
const STORAGE_KEY = 'tingxie_history_v2';
function loadRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { return []; }
}
function saveRecord(rec) {
  try {
    const recs = loadRecords();
    recs.unshift(rec);
    if (recs.length > 50) recs.length = 50;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(recs));
  } catch (e) {}
}

  renderUnitTags();
  renderLessonSelect();
  buildWordQueue();

  document.getElementById('lesson-select').addEventListener('change', (e) => {
    currentLesson = e.target.value;
    buildWordQueue();
  });

    // 安全地解锁引擎
    window.speechSynthesis.cancel();
    unlockSpeech();
    startDictation();
  });

  document.getElementById('btn-wrong-book').addEventListener('click', () => {
    studentClass = document.getElementById('student-class').value.trim(); 
    studentName = document.getElementById('student-name').value.trim();
    if (!studentClass || !studentName) { alert('请先输入班级和姓名！'); return; }

    const history = [...loadRecords()].reverse(); 
    const wordStatus = {}; 
    
    history.forEach(r => {
      if (r.wrongWords) r.wrongWords.forEach(w => { wordStatus[w] = 0; });
      if (r.correctWords) r.correctWords.forEach(w => {
        if (wordStatus[w] !== undefined) {
          wordStatus[w]++;
          if (wordStatus[w] >= 3) delete wordStatus[w]; 
        }
      });
    });

    const wwArray = Object.keys(wordStatus);
    if (wwArray.length === 0) {
      alert('🎉太棒了！你的错字本已经被全部消灭，目前不需要复习。');
      return;
    }
    
    wordQueue = wwArray.map(w => ({ word: w })).sort(() => Math.random() - 0.5);
    alert(`你的错字本中还有 ${wwArray.length} 个词需要消灭，现在开始复习！`);
    
    window.speechSynthesis.cancel();
    unlockSpeech(); 
    startDictation();
  });

  // “再读一遍”功能
  document.getElementById('btn-repeat').addEventListener('click', () => {
    window.speechSynthesis.cancel(); // 用户直接点击，安全取消当前声音
    playWord(); // 重新朗读当前词
  });
});

// ── 画板逻辑 ──
const canvas = document.getElementById('handwrite-canvas');
const ctx = canvas.getContext('2d');
let isDrawing = false;

function initCanvas() {
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 8; 
  ctx.strokeStyle = '#1a1a2e';
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
  return {
    x: clientX - rect.left,
    y: clientY - rect.top
  };
}

function startDraw(e) {
  e.preventDefault(); 
  isDrawing = true;
  const pos = getPos(e);
  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y);
  ctx.lineTo(pos.x, pos.y); 
  ctx.stroke();
}

function draw(e) {
  if (!isDrawing) return;
  e.preventDefault();
  const pos = getPos(e);
  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();
}

function stopDraw(e) {
  if (e) e.preventDefault();
  isDrawing = false;
}

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', stopDraw);
canvas.addEventListener('mouseout', stopDraw);

canvas.addEventListener('touchstart', startDraw, { passive: false });
canvas.addEventListener('touchmove', draw, { passive: false });
canvas.addEventListener('touchend', stopDraw);
canvas.addEventListener('touchcancel', stopDraw);

document.getElementById('btn-clear').addEventListener('click', () => { 
  ctx.clearRect(0,0,canvas.width,canvas.height); 
});

// ══════════════════════════════════════
// 🔥 终极朗读引擎：完全抛弃延迟代码，一次性连贯发声，防苹果屏蔽
// ══════════════════════════════════════
function unlockSpeech() {
  if (speechUnlocked) return;
  const u = new SpeechSynthesisUtterance(' ');
  u.volume = 0;
  window.speechSynthesis.speak(u);
  speechUnlocked = true;
}

// 防垃圾回收变量
window.currentTTS = null; 

function playWord() {
  const word = wordQueue[currentIndex].word;
  document.getElementById('reading-status').textContent = `正在朗读：🔊 (第 ${currentIndex + 1}/${wordQueue.length} 词)`;
  
  // 核心改动：把3遍朗读和长长的停顿，浓缩成一句话。句号会让声音产生自然的降调和长时间停顿。
  // 这样就不需要用到会导致苹果系统断声的 setTimeout 了。
  const textToSpeak = `${word}。 。 。 ${word}。 。 。 ${word}`;
  
  const u = new SpeechSynthesisUtterance(textToSpeak);
  u.lang = 'zh-CN';
  // 完美恢复你要求的语速和音调
  u.rate = 0.76; 
  u.pitch = 1.15;
  
  const voices = window.speechSynthesis.getVoices();
  // 强制抓取大陆普通话，严防香港粤语混入
  const zhVoice = voices.find(v => v.lang === 'zh-CN' || v.lang === 'zh_CN') 
               || voices.find(v => v.lang.includes('zh') && !v.lang.toLowerCase().includes('hk'));
               
  if (zhVoice) {
    u.voice = zhVoice;
  }

  // 绑定全局变量，防止声音在后台被苹果系统意外“杀掉”
  window.currentTTS = u;
  
  u.onend = () => {
    document.getElementById('reading-status').textContent = '请写完词语后点击「提交」';
  };

  window.speechSynthesis.speak(u);
}

function startDictation() {
  currentIndex = 0; scoreCorrect = 0; scoreWrong = 0; results = [];
  document.querySelectorAll('.phase').forEach(el => el.classList.remove('active'));
  document.getElementById('phase-writing').classList.add('active');
  
  initCanvas(); 
  ctx.clearRect(0,0,canvas.width,canvas.height);
  playWord();
}

// ── 提交与 AI 判卷 (Tesseract.js) ──
let _ocrReqId = 0;

document.getElementById('btn-submit').addEventListener('click', () => {
  // 注意：这里绝对不能写 window.speechSynthesis.cancel() ！！！
  // 让声音自然播完，防止打断苹果的音频授权链条。

  let snapshot = canvas.toDataURL('image/png');
  document.querySelectorAll('.phase').forEach(el => el.classList.remove('active'));
  document.getElementById('phase-marking').classList.add('active');
  
  const item = wordQueue[currentIndex];
  document.getElementById('answer-word').textContent = item.word;
  document.getElementById('marking-btns').style.display = 'none'; 
  
  runRecognition(snapshot, item.word);
});

async function runRecognition(snapshot, answer) {
  const myReq = ++_ocrReqId;
  const v = document.getElementById('ai-verdict');
  v.className = 'v-loading show';
  v.innerHTML = 'AI 正在自动识别你的笔迹...';
  
  if (!snapshot || typeof Tesseract === 'undefined') {
    v.className = 'v-wrong show';
    v.innerHTML = '⚠️ AI 识别引擎未加载，请手动判分。';
    document.getElementById('marking-btns').style.display = 'flex';
    return;
  }
  
  try {
    const { data } = await Tesseract.recognize(snapshot, 'chi_sim');
    if (myReq !== _ocrReqId) return; 

    const recog = (data.text || '').replace(/[^\u4E00-\u9FA5]/g, '');
    const ans = answer.replace(/[^\u4E00-\u9FA5]/g, '');

    if (recog === ans || (ans.length > 0 && recog.includes(ans))) {
      v.className = 'v-correct show';
      v.innerHTML = '✅ 识别完全正确！系统已记录，即将进入下一题...';
      setTimeout(() => markWord(true), 1500); 
    } else {
      v.className = 'v-wrong show';
      v.innerHTML = `❌ AI 判定为错字。<br>你写成了「${recog || '未识别出文字'}」，正确答案如上。<br>如果 AI 误判，你可以点击下方按钮手动纠正。`;
      document.getElementById('marking-btns').style.display = 'flex';
    }
  } catch (err) {
    if (myReq !== _ocrReqId) return;
    v.className = 'v-wrong show';
    v.innerHTML = '⚠️ 识别引擎出错，请手动判分。';
    document.getElementById('marking-btns').style.display = 'flex';
  }
}

function markWord(isCorrect) {
  _ocrReqId++; 
  document.getElementById('ai-verdict').className = ''; 
  
  const item = wordQueue[currentIndex];
  results.push({ word: item.word, correct: isCorrect });
  if (isCorrect) scoreCorrect++; else scoreWrong++;
  
  currentIndex++;
  if (currentIndex >= wordQueue.length) {
    finishDictation();
  } else {
    document.querySelectorAll('.phase').forEach(el => el.classList.remove('active'));
    document.getElementById('phase-writing').classList.add('active');
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 8;
    
    // 进入下一题并清空画板
    ctx.clearRect(0,0,canvas.width,canvas.height);
    playWord();
  }
}

function finishDictation() {
  document.querySelectorAll('.phase').forEach(el => el.classList.remove('active'));
  document.getElementById('phase-complete').classList.add('active');
  document.getElementById('res-c').textContent = scoreCorrect;
  document.getElementById('res-w').textContent = scoreWrong;
  document.getElementById('reading-status').textContent = '听写结束！';

  const wrongWords = results.filter(r => !r.correct).map(r => r.word);
  const correctWords = results.filter(r => r.correct).map(r => r.word); 

  saveRecord({
    name: studentName,
    class: studentClass,
    scope: currentLesson,
    correct: scoreCorrect,
    wrong: scoreWrong,
    total: wordQueue.length,
    wrongWords: wrongWords,
    correctWords: correctWords, 
    date: new Date().toLocaleString()
  });
}
