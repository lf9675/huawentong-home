<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新加坡成语闯关英雄 - 中一/中二</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #6C5CE7;
            --secondary: #A29BFE;
            --success: #00B894;
            --error: #D63031;
            --bg: #F0F2F5;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            width: 90%;
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        /* 顶部进度条 */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .score-board { font-size: 1.2rem; color: var(--primary); font-weight: bold; }

        /* 选关界面 */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .menu-card {
            background: var(--secondary);
            color: white;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s;
            border: none;
            font-size: 1rem;
        }
        .menu-card:hover { transform: translateY(-3px); background: var(--primary); }

        /* 字池区域 */
        .char-pool {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 25px 0;
            padding: 20px;
            background: #F9FAFB;
            border-radius: 15px;
            min-height: 120px;
        }

        .char-tile {
            width: 55px;
            height: 55px;
            background: white;
            border: 2px solid var(--secondary);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }
        .char-tile:active { transform: scale(0.9); }
        .char-tile.used { opacity: 0.3; pointer-events: none; }

        /* 答案框 */
        .answer-zone { display: flex; justify-content: center; gap: 12px; margin-bottom: 30px; }
        .slot {
            width: 65px;
            height: 65px;
            border-bottom: 4px solid var(--secondary);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            color: var(--primary);
        }
        .slot.win { border-bottom-color: var(--success); color: var(--success); animation: bounce; animation-duration: 0.5s; }

        /* 题目描述 */
        .question-card {
            background: #FFF9DB;
            padding: 20px;
            border-radius: 15px;
            border-left: 5px solid #FAB005;
            margin-bottom: 20px;
            text-align: left;
        }
        .sentence { font-size: 1.3rem; line-height: 1.8; margin-bottom: 10px; }
        .en-hint { color: #666; font-style: italic; font-size: 0.95rem; border-top: 1px dashed #DDD; padding-top: 10px; }
        .underline-placeholder { color: var(--error); font-weight: bold; border-bottom: 2px solid var(--error); padding: 0 10px; }

        /* 按钮控制 */
        .controls { margin-top: 20px; }
        .btn-next {
            display: none;
            padding: 12px 40px;
            font-size: 1.2rem;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,184,148,0.4);
        }

        .btn-reset { margin-top: 10px; background: none; border: none; color: #666; cursor: pointer; text-decoration: underline; }

        /* 掌声动画提示 */
        #feedback { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); font-size: 3rem; pointer-events: none; z-index: 100; }
    </style>
</head>

let currentSet = [];
let currentIndex = 0;
let userInput = [];

function startGame(rangeKey) {
    currentSet = IDIOM_DATA[rangeKey] || IDIOM_DATA["s1_1"];
    currentIndex = 0;
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';
    renderQuestion();
}

function renderQuestion() {
    const data = currentSet[currentIndex];
    userInput = [];
    document.getElementById('current-idx').innerText = currentIndex + 1;
    document.getElementById('total-idx').innerText = currentSet.length;
    document.getElementById('next-btn').style.display = 'none';
    
    // 清空答案框
    for(let i=0; i<4; i++) {
        const s = document.getElementById(`slot-${i}`);
        s.innerText = '';
        s.classList.remove('win');
    }

    // 设置题目
    document.getElementById('sentence-text').innerHTML = data.sentence.replace("______", "<span class='underline-placeholder'>____</span>");
    document.getElementById('english-hint').innerText = "提示 (English Hint): " + data.en;

    // 生成乱序字池 (16个字)
    let pool = data.word.split('');
    const extraChars = "志坚强不息努力向上成功坚持奋斗勇往直前天天向上大吉大利".split('');
    while(pool.length < 16) {
        let r = extraChars[Math.floor(Math.random()*extraChars.length)];
        if(!pool.includes(r)) pool.push(r);
    }
    pool.sort(() => Math.random() - 0.5);

    const poolContainer = document.getElementById('char-pool');
    poolContainer.innerHTML = '';
    pool.forEach((char, index) => {
        const btn = document.createElement('div');
        btn.className = 'char-tile animate__animated animate__fadeInUp';
        btn.innerText = char;
        btn.onclick = () => selectChar(char, btn);
        poolContainer.appendChild(btn);
    });
}

function selectChar(char, element) {
    if(userInput.length < 4) {
        userInput.push(char);
        element.classList.add('used');
        document.getElementById(`slot-${userInput.length-1}`).innerText = char;
        
        if(userInput.length === 4) checkResult();
    }
}

function checkResult() {
    const answer = userInput.join('');
    const correctWord = currentSet[currentIndex].word;

    if(answer === correctWord) {
        // 成功反馈
        triggerWinEffects();
        document.getElementById('next-btn').style.display = 'inline-block';
        for(let i=0; i<4; i++) document.getElementById(`slot-${i}`).classList.add('win');
    } else {
        // 失败反馈
        document.getElementById('feedback').innerText = "❌ 再试一次";
        speak("再试一次");
        setTimeout(() => {
            document.getElementById('feedback').innerText = "";
            resetCurrent();
        }, 1000);
    }
}

function triggerWinEffects() {
    // 1. 鲜花纸屑特效
    confetti({
        particleCount: 150,
        spread: 70,
        origin: { y: 0.6 }
    });

    // 2. 语音朗读成语
    speak(currentSet[currentIndex].word);

    // 3. 掌声图标
    document.getElementById('feedback').innerText = "👏 太棒了！🌷";
    setTimeout(() => { document.getElementById('feedback').innerText = ""; }, 2000);
}

function nextQuestion() {
    if(currentIndex < currentSet.length - 1) {
        currentIndex++;
        renderQuestion();
    } else {
        alert("恭喜！你已完成本组全部成语练习！");
        location.reload();
    }
}

function resetCurrent() {
    userInput = [];
    for(let i=0; i<4; i++) document.getElementById(`slot-${i}`).innerText = '';
    document.querySelectorAll('.char-tile').forEach(el => el.classList.remove('used'));
}

function speak(text) {
    const msg = new SpeechSynthesisUtterance();
    msg.text = text;
    msg.lang = 'zh-CN';
    msg.rate = 0.8;
    window.speechSynthesis.speak(msg);
}
