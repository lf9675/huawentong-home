<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8ff"/><stop offset="1" stop-color="#fffdf7"/></linearGradient></defs><rect width="1440" height="1080" fill="url(#g)"/><rect width="1440" height="160" fill="#8d5d2e"/><text x="70" y="100" font-size="62">🏪</text><text x="150" y="68" font-size="48" font-weight="900" fill="#fff">看图学词语</text><text x="150" y="118" font-size="28" font-weight="700" fill="#fff">第三课《差不多先生》</text><text x="1360" y="60" text-anchor="end" font-size="20" fill="#fff">中一 Higher Chinese</text><text x="1360" y="100" text-anchor="end" font-size="18" fill="#fff">看图 · 理解 · 听读 · 记忆</text><g><rect x="54" y="190" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#8d5d2e" stroke-width="3"/><text x="78" y="232" font-size="31" font-weight="800" fill="#123b5d">人人皆晓</text><text x="78" y="260" font-size="17" font-weight="600" fill="#8d5d2e">known by everyone</text><text x="78" y="289" font-size="18" fill="#334e68">大家都知道。</text></g><g><rect x="505.3333333333333" y="190" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#8d5d2e" stroke-width="3"/><text x="529.3333333333333" y="232" font-size="31" font-weight="800" fill="#123b5d">讲究</text><text x="529.3333333333333" y="260" font-size="17" font-weight="600" fill="#8d5d2e">be particular about</text><text x="529.3333333333333" y="289" font-size="18" fill="#334e68">重视要求、方法或细节。</text></g><g><rect x="956.6666666666666" y="190" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#8d5d2e" stroke-width="3"/><text x="980.6666666666666" y="232" font-size="31" font-weight="800" fill="#123b5d">何必</text><text x="980.6666666666666" y="260" font-size="17" font-weight="600" fill="#8d5d2e">why bother</text><text x="980.6666666666666" y="289" font-size="18" fill="#334e68">表示没有必要。</text></g><g><rect x="54" y="404.5" width="429.3333333333333" height="196.5" rx="20" 