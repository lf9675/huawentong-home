rx="20" fill="#fff" stroke="#8d5d2e" stroke-width="3"/><text x="980.6666666666666" y="661" font-size="31" font-weight="800" fill="#123b5d">起航</text><text x="980.6666666666666" y="689" font-size="17" font-weight="600" fill="#8d5d2e">set sail</text><text x="980.6666666666666" y="718" font-size="18" fill="#334e68">船只开始航行。</text></g><g><rect x="54" y="833.5" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#8d5d2e" stroke-width="3"/><text x="78" y="875.5" font-size="31" font-weight="800" fill="#123b5d">一命呜呼</text><text x="78" y="903.5" font-size="17" font-weight="600" fill="#8d5d2e">die</text><text x="78" y="932.5" font-size="18" fill="#334e68">诙谐说法，指人死去。</text></g><g><rect x="505.3333333333333" y="833.5" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#8d5d2e" stroke-width="3"/><text x="529.3333333333333" y="875.5" font-size="31" font-weight="800" fill="#123b5d">称赞</text><text x="529.3333333333333" y="903.5" font-size="17" font-weight="600" fill="#8d5d2e">praise</text><text x="529.3333333333333" y="932.5" font-size="18" fill="#334e68">用话语表示赞赏。</text></g></svg>