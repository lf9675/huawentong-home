<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8ff"/><stop offset="1" stop-color="#fffdf7"/></linearGradient></defs><rect width="1440" height="1080" fill="url(#g)"/><rect width="1440" height="160" fill="#a14c72"/><text x="70" y="100" font-size="62">🌧️</text><text x="150" y="68" font-size="48" font-weight="900" fill="#fff">看图学词语</text><text x="150" y="118" font-size="28" font-weight="700" fill="#fff">第二课《迟到》</text><text x="1360" y="60" text-anchor="end" font-size="20" fill="#fff">中一 Higher Chinese</text><text x="1360" y="100" text-anchor="end" font-size="18" fill="#fff">看图 · 理解 · 听读 · 记忆</text><g><rect x="54" y="190" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#a14c72" stroke-width="3"/><text x="78" y="232" font-size="31" font-weight="800" fill="#123b5d">赖床</text><text x="78" y="260" font-size="17" font-weight="600" fill="#a14c72">stay in bed</text><text x="78" y="289" font-size="18" fill="#334e68">醒来后仍不愿起床。</text></g><g><rect x="392.5" y="190" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#a14c72" stroke-width="3"/><text x="416.5" y="232" font-size="31" font-weight="800" fill="#123b5d">辫子</text><text x="416.5" y="260" font-size="17" font-weight="600" fill="#a14c72">braid</text><text x="416.5" y="289" font-size="18" fill="#334e68">把头发分股交叉编成的发式。</text></g><g><rect x="731" y="190" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#a14c72" stroke-width="3"/><text x="755" y="232" font-size="31" font-weight="800" fill="#123b5d">恐惧</text><text x="755" y="260" font-size="17" font-weight="600" fill="#a14c72">fear</text><text x="755" y="289" font-size="18" fill="#334e68">因害怕而产生的不安心情。</text></g><g><rect x="1069.5" y="190" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#a14c72" stroke-width="3"/><text x="1093.5" y="232" font-size="31" font-weight="800" fill="#123b5d">夹袄</text><text x="1093.5" y="260" font-size="17" font-weight="600" fill="#a14c72">padded jacket</text><text x="1093.5" y="289" font-size="18" fill="#334e68">里面有夹层、用于保暖的外衣。</text></g><g><rect x="54" y="361.6" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#a14c72" stroke-width="3"/><text x="78" y="403.6" font-size="31" font-weight="800" fill="#123b5d">滋味</text><text x="78" y="431.6" font-size="17" font-weight="600" fill="#a14c72">taste; feeling</text><text x="78" y="460.6" font-size="18" fill="#334e68">味道；也指某种感受。</text></g><g><rect x="392.5" y="361.6" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#a14c72" stroke-width="3"/><text x="416.5" y="403.6" font-size="31" font-weight="800" fill="#123b5d">催促</text><text x="416.5" y="431.6" font-size="17" font-weight="600" fill="#a14c72">urge</text><text x="416.5" y="460.6" font-size="18" fill="#334e68">不断提醒别人赶快行动。</text></g><g><rect x="731" y="361.6" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#a14c72" stroke-width="3"/><text x="755" y="403.6" font-size="31" font-weight="800" fill="#123b5d">哀求</text><text x="755" y="431.6" font-size="17" font-weight="600" fill="#a14c72">plead</text><text x="755" y="460.6" font-size="18" fill="#334e68">苦苦请求别人答应。</text></g><g><rect x="1069.5" y="361.6" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#a14c72" stroke-width="3"/><text x="1093.5" y="403.6" font-size="31" font-weight="800" fill="#123b5d">挪窝</text><text x="1093.5" y="431.6" font-size="17" font-weight="600" fill="#a14c72">move away</text><text x="1093.5" y="460.6" font-size="18" fill="#334e68">离开原来的地方。</text></g><g><rect x="54" y="533.2" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#a14c72" stroke-width="3"/><text x="78" y="575.2" font-size="31" font-weight="800" fill="#123b5d">藤鞭</text><text x="78" y="603.2" font-size="17" font-weight="600" fill="#a14c72">rattan cane</text><text x="78" y="632.2" font-size="18" fill="#334e68">用藤条制成的鞭子。</text></g><g><rect x="392.5" y="533.2" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#a14c72" stroke-width="3"/><text x="416.5" y="575.2" font-size="31" font-weight="800" fill="#123b5d">抡</text><text x="416.5" y="603.2" font-size="17" font-weight="600" fill="#a14c72">swing</text><text x="416.5" y="632.2" font-size="18" fill="#334e68">用力挥动。</text></g><g><rect x="731" y="533.2" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#a14c72" stroke-width="3"/><text x="755" y="575.2" font-size="31" font-weight="800" fill="#123b5d">挨打</text><text x="755" y="603.2" font-size="17" font-weight="600" fill="#a14c72">be beaten</text><text x="755" y="632.2" font-size="18" fill="#334e68">受到别人打。</text></g><g><rect x="1069.5" y="533.2" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#a14c72" stroke-width="3"/><text x="1093.5" y="575.2" font-size="31" font-weight="800" fill="#123b5d">狼狈</text><text x="1093.5" y="603.2" font-size="17" font-weight="600" fill="#a14c72">in a sorry state</text><text x="1093.5" y="632.2" font-size="18" fill="#334e68">处境窘迫、样子难堪。</text></g><g><rect x="54" y="704.8" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#a14c72" stroke-width="3"/><text x="78" y="746.8" font-size="31" font-weight="800" fill="#123b5d">女佣</text><text x="78" y="774.8" font-size="17" font-weight="600" fill="#a14c72">maid</text><text x="78" y="803.8" font-size="18" fill="#334e68">受雇做家务的女性。</text></g><g><rect x="392.5" y="704.8" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#a14c72" stroke-width="3"/><text x="416.5" y="746.8" font-size="31" font-weight="800" fill="#123b5d">雨篷</text><text x="416.5" y="774.8" font-size="17" font-weight="600" fill="#a14c72">rain canopy</text><text x="416.5" y="803.8" font-size="18" fill="#334e68">用来遮雨的篷子。</text></g><g><rect x="731" y="704.8" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#a14c72" stroke-width="3"/><text x="755" y="746.8" font-size="31" font-weight="800" fill="#123b5d">缘故</text><text x="755" y="774.8" font-size="17" font-weight="600" fill="#a14c72">reason; cause</text><text x="755" y="803.8" font-size="18" fill="#334e68">事情发生的原因。</text></g><g><rect x="1069.5" y="704.8" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#a14c72" stroke-width="3"/><text x="1093.5" y="746.8" font-size="31" font-weight="800" fill="#123b5d">泪痕</text><text x="1093.5" y="774.8" font-size="17" font-weight="600" fill="#a14c72">tear marks</text><text x="1093.5" y="803.8" font-size="18" fill="#334e68">眼泪流过后留下的痕迹。</text></g><g><rect x="54" y="876.4" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#a14c72" stroke-width="3"/><text x="78" y="918.4" font-size="31" font-weight="800" fill="#123b5d">嗓子眼</text><text x="78" y="946.4" font-size="17" font-weight="600" fill="#a14c72">throat</text><text x="78" y="975.4" font-size="18" fill="#334e68">口语中指喉咙部位。</text></g><g><rect x="392.5" y="876.4" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#a14c72" stroke-width="3"/><text x="416.5" y="918.4" font-size="31" font-weight="800" fill="#123b5d">包袱</text><text x="416.5" y="946.4" font-size="17" font-weight="600" fill="#a14c72">bundle</text><text x="416.5" y="975.4" font-size="18" fill="#334e68">用布包起来的一包东西。</text></g></svg>