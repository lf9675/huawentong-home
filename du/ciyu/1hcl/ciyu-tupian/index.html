function pickVoice(){const vs=speechSynthesis.getVoices?.()||[],zh=vs.filter(v=>/^(zh-CN|zh-Hans-CN)$/i.test(v.lang)),pref=[/Xiaoxiao/i,/Xiaoyi/i,/Yunxi/i,/普通话/i,/Mandarin/i,/Ting.?Ting/i];voice=null;for(const rx of pref){const m=zh.find(v=>rx.test(v.name));if(m){voice=m;break}}if(!voice&&zh.length)voice=zh[0];document.getElementById('voice').textContent=voice?'普通话语音：'+voice.name:'普通话语音：系统 zh-CN'}pickVoice();if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=pickVoice;
function stop(){reading=false;if('speechSynthesis'in window)speechSynthesis.cancel();document.querySelectorAll('.speaking').forEach(x=>x.classList.remove('speaking'))}
function say(w,b){pickVoice();stop();if(!('speechSynthesis'in window))return alert('这个浏览器暂不支持语音朗读。');const u=new SpeechSynthesisUtterance(w);u.lang='zh-CN';u.rate=.8;if(voice)u.voice=voice;b?.classList.add('speaking');u.onend=u.onerror=()=>b?.classList.remove('speaking');speechSynthesis.speak(u)}
async function readAll(words){stop();reading=true;for(const w of words){if(!reading)break;await new Promise(res=>{const u=new SpeechSynthesisUtterance(w);u.lang='zh-CN';u.rate=.76;if(voice)u.voice=voice;u.onend=()=>setTimeout(res,600);u.onerror=res;speechSynthesis.speak(u)})}reading=false}
function show(i){if(i<0||i>=DATA.length)return;stop();document.getElementById('cover').style.display='none';document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('p'+i).classList.add('active');scrollTo({top:0,behavior:'smooth'})}
