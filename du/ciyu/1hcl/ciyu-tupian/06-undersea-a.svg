<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8ff"/><stop offset="1" stop-color="#fffdf7"/></linearGradient></defs><rect width="1440" height="1080" fill="url(#g)"/><rect width="1440" height="160" fill="#087eaf"/><text x="70" y="100" font-size="62">🤿</text><text x="150" y="68" font-size="48" font-weight="900" fill="#fff">看图学词语</text><text x="150" y="118" font-size="28" font-weight="700" fill="#fff">第二课《海底牧场游记》（上）</text><text x="1360" y="60" text-anchor="end" font-size="20" fill="#fff">中一 Higher Chinese</text><text x="1360" y="100" text-anchor="end" font-size="18" fill="#fff">看图 · 理解 · 听读 · 记忆</text><g><rect x="54" y="190" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#087eaf" stroke-width="3"/><text x="78" y="232" font-size="31" font-weight="800" fill="#123b5d">牧场</text><text x="78" y="260" font-size="17" font-weight="600" fill="#087eaf">ranch; pasture</text><text x="78" y="289" font-size="18" fill="#334e68">放养牲畜的地方。</text></g><g><rect x="505.3333333333333" y="190" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#087eaf" stroke-width="3"/><text x="529.3333333333333" y="232" font-size="31" font-weight="800" fill="#123b5d">潜水</text><text x="529.3333333333333" y="260" font-size="17" font-weight="600" fill="#087eaf">dive</text><text x="529.3333333333333" y="289" font-size="18" fill="#334e68">进入水下活动。</text></g><g><rect x="956.6666666666666" y="190" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#087eaf" stroke-width="3"/><text x="980.6666666666666" y="232" font-size="31" font-weight="800" fill="#123b5d">腾空而起</text><text x="980.6666666666666" y="260" font-size="17" font-weight="600" fill="#087eaf">rise into the air</text><text x="980.6666666666666" y="289" font-size="18" fill="#334e68">一下子升到空中。</text></g><g><rect x="54" y="404.5" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#087eaf" stroke-width="3"/><text x="78" y="446.5" font-size="31" font-weight="800" fill="#123b5d">收拢</text><text x="78" y="474.5" font-size="17" font-weight="600" fill="#087eaf">gather; fold in</text><text x="78" y="503.5" font-size="18" fill="#334e68">把分散或张开的东西合起来。</text></g><g><rect x="505.3333333333333" y="404.5" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#087eaf" stroke-width="3"/><text x="529.3333333333333" y="446.5" font-size="31" font-weight="800" fill="#123b5d">艘</text><text x="529.3333333333333" y="474.5" font-size="17" font-weight="600" fill="#087eaf">measure word for ships</text><text x="529.3333333333333" y="503.5" font-size="18" fill="#334e68">船只的量词。</text></g><g><rect x="956.6666666666666" y="404.5" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#087eaf" stroke-width="3"/><text x="980.6666666666666" y="446.5" font-size="31" font-weight="800" fill="#123b5d">屁股</text><text x="980.6666666666666" y="474.5" font-size="17" font-weight="600" fill="#087eaf">bottom</text><text x="980.6666666666666" y="503.5" font-size="18" fill="#334e68">身体后部坐下时接触座位的部分。</text></g><g><rect x="54" y="619" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#087eaf" stroke-width="3"/><text x="78" y="661" font-size="31" font-weight="800" fill="#123b5d">翘</text><text x="78" y="689" font-size="17" font-weight="600" fill="#087eaf">tilt upward</text><text x="78" y="718" font-size="18" fill="#334e68">一端向上抬起。</text></g><g><rect x="505.3333333333333" y="619" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#087eaf" stroke-width="3"/><text x="529.3333333333333" y="661" font-size="31" font-weight="800" fill="#123b5d">潜水艇</text><text x="529.3333333333333" y="689" font-size="17" font-weight="600" fill="#087eaf">submarine</text><text x="529.3333333333333" y="718" font-size="18" fill="#334e68">能在水下航行的船。</text></g><g><rect x="956.6666666666666" y="619" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#087eaf" stroke-width="3"/><text x="980.6666666666666" y="661" font-size="31" font-weight="800" fill="#123b5d">悠然自得</text><text x="980.6666666666666" y="689" font-size="17" font-weight="600" fill="#087eaf">relaxed and content</text><text x="980.6666666666666" y="718" font-size="18" fill="#334e68">悠闲自在、很满足。</text></g><g><rect x="54" y="833.5" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#087eaf" stroke-width="3"/><text x="78" y="875.5" font-size="31" font-weight="800" fill="#123b5d">大白鲨</text><text x="78" y="903.5" font-size="17" font-weight="600" fill="#087eaf">great white shark</text><text x="78" y="932.5" font-size="18" fill="#334e68">一种体型很大的鲨鱼。</text></g></svg>