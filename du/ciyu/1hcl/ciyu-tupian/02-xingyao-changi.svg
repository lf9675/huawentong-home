<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8ff"/><stop offset="1" stop-color="#fffdf7"/></linearGradient></defs><rect width="1440" height="1080" fill="url(#g)"/><rect width="1440" height="160" fill="#158c76"/><text x="70" y="100" font-size="62">✈️</text><text x="150" y="68" font-size="48" font-weight="900" fill="#fff">看图学词语</text><text x="150" y="118" font-size="28" font-weight="700" fill="#fff">第二课《魅力四射 星耀樟宜》</text><text x="1360" y="60" text-anchor="end" font-size="20" fill="#fff">中一 Higher Chinese</text><text x="1360" y="100" text-anchor="end" font-size="18" fill="#fff">看图 · 理解 · 听读 · 记忆</text><g><rect x="54" y="190" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#158c76" stroke-width="3"/><text x="78" y="232" font-size="31" font-weight="800" fill="#123b5d">镶嵌</text><text x="78" y="260" font-size="17" font-weight="600" fill="#158c76">inlay; set in</text><text x="78" y="289" font-size="18" fill="#334e68">把物体嵌入另一物体中。</text></g><g><rect x="505.3333333333333" y="190" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#158c76" stroke-width="3"/><text x="529.3333333333333" y="232" font-size="31" font-weight="800" fill="#123b5d">横梁</text><text x="529.3333333333333" y="260" font-size="17" font-weight="600" fill="#158c76">beam</text><text x="529.3333333333333" y="289" font-size="18" fill="#334e68">横着架设、起支撑作用的梁。</text></g><g><rect x="956.6666666666666" y="190" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#158c76" stroke-width="3"/><text x="980.6666666666666" y="232" font-size="31" font-weight="800" fill="#123b5d">玻璃</text><text x="980.6666666666666" y="260" font-size="17" font-weight="600" fill="#158c76">glass</text><text x="980.6666666666666" y="289" font-size="18" fill="#334e68">透明或半透明的材料。</text></g><g><rect x="54" y="404.5" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#158c76" stroke-width="3"/><text x="78" y="446.5" font-size="31" font-weight="800" fill="#123b5d">循环</text><text x="78" y="474.5" font-size="17" font-weight="600" fill="#158c76">circulate; cycle</text><text x="78" y="503.5" font-size="18" fill="#334e68">周而复始地运行或使用。</text></g><g><rect x="505.3333333333333" y="404.5" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#158c76" stroke-width="3"/><text x="529.3333333333333" y="446.5" font-size="31" font-weight="800" fill="#123b5d">映衬</text><text x="529.3333333333333" y="474.5" font-size="17" font-weight="600" fill="#158c76">set off; highlight</text><text x="529.3333333333333" y="503.5" font-size="18" fill="#334e68">互相衬托，使特点更突出。</text></g><g><rect x="956.6666666666666" y="404.5" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#158c76" stroke-width="3"/><text x="980.6666666666666" y="446.5" font-size="31" font-weight="800" fill="#123b5d">山谷</text><text x="980.6666666666666" y="474.5" font-size="17" font-weight="600" fill="#158c76">valley</text><text x="980.6666666666666" y="503.5" font-size="18" fill="#334e68">两山之间较低的地方。</text></g><g><rect x="54" y="619" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#158c76" stroke-width="3"/><text x="78" y="661" font-size="31" font-weight="800" fill="#123b5d">盎然</text><text x="78" y="689" font-size="17" font-weight="600" fill="#158c76">full of life</text><text x="78" y="718" font-size="18" fill="#334e68">气氛、景象十分浓厚旺盛。</text></g><g><rect x="505.3333333333333" y="619" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#158c76" stroke-width="3"/><text x="529.3333333333333" y="661" font-size="31" font-weight="800" fill="#123b5d">株</text><text x="529.3333333333333" y="689" font-size="17" font-weight="600" fill="#158c76">measure word for plants</text><text x="529.3333333333333" y="718" font-size="18" fill="#334e68">植物的量词。</text></g><g><rect x="956.6666666666666" y="619" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#158c76" stroke-width="3"/><text x="980.6666666666666" y="661" font-size="31" font-weight="800" fill="#123b5d">松懈</text><text x="980.6666666666666" y="689" font-size="17" font-weight="600" fill="#158c76">slacken; relax vigilance</text><text x="980.6666666666666" y="718" font-size="18" fill="#334e68">放松原有的认真或警惕。</text></g><g><rect x="54" y="833.5" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#158c76" stroke-width="3"/><text x="78" y="875.5" font-size="31" font-weight="800" fill="#123b5d">领略</text><text x="78" y="903.5" font-size="17" font-weight="600" fill="#158c76">appreciate; experience</text><text x="78" y="932.5" font-size="18" fill="#334e68">了解并体会事物的特点。</text></g><g><rect x="505.3333333333333" y="833.5" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#158c76" stroke-width="3"/><text x="529.3333333333333" y="875.5" font-size="31" font-weight="800" fill="#123b5d">设施</text><text x="529.3333333333333" y="903.5" font-size="17" font-weight="600" fill="#158c76">facilities</text><text x="529.3333333333333" y="932.5" font-size="18" fill="#334e68">为生活或工作设置的设备。</text></g></svg>