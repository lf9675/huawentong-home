<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8ff"/><stop offset="1" stop-color="#fffdf7"/></linearGradient></defs><rect width="1440" height="1080" fill="url(#g)"/><rect width="1440" height="160" fill="#0b65a8"/><text x="70" y="100" font-size="62">🦈</text><text x="150" y="68" font-size="48" font-weight="900" fill="#fff">看图学词语</text><text x="150" y="118" font-size="28" font-weight="700" fill="#fff">第二课《海底牧场游记》（下）</text><text x="1360" y="60" text-anchor="end" font-size="20" fill="#fff">中一 Higher Chinese</text><text x="1360" y="100" text-anchor="end" font-size="18" fill="#fff">看图 · 理解 · 听读 · 记忆</text><g><rect x="54" y="190" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#0b65a8" stroke-width="3"/><text x="78" y="232" font-size="31" font-weight="800" fill="#123b5d">袭击</text><text x="78" y="260" font-size="17" font-weight="600" fill="#0b65a8">attack</text><text x="78" y="289" font-size="18" fill="#334e68">突然攻击。</text></g><g><rect x="505.3333333333333" y="190" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#0b65a8" stroke-width="3"/><text x="529.3333333333333" y="232" font-size="31" font-weight="800" fill="#123b5d">安然无恙</text><text x="529.3333333333333" y="260" font-size="17" font-weight="600" fill="#0b65a8">safe and sound</text><text x="529.3333333333333" y="289" font-size="18" fill="#334e68">平安无事，没有受到伤害。</text></g><g><rect x="956.6666666666666" y="190" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#0b65a8" stroke-width="3"/><text x="980.6666666666666" y="232" font-size="31" font-weight="800" fill="#123b5d">牙齿</text><text x="980.6666666666666" y="260" font-size="17" font-weight="600" fill="#0b65a8">teeth</text><text x="980.6666666666666" y="289" font-size="18" fill="#334e68">口腔内用来咬、咀嚼食物的器官。</text></g><g><rect x="54" y="404.5" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#0b65a8" stroke-width="3"/><text x="78" y="446.5" font-size="31" font-weight="800" fill="#123b5d">欺软怕硬</text><text x="78" y="474.5" font-size="17" font-weight="600" fill="#0b65a8">bully the weak, fear the strong</text><text x="78" y="503.5" font-size="18" fill="#334e68">欺负弱者，却害怕强者。</text></g><g><rect x="505.3333333333333" y="404.5" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#0b65a8" stroke-width="3"/><text x="529.3333333333333" y="446.5" font-size="31" font-weight="800" fill="#123b5d">一马平川</text><text x="529.3333333333333" y="474.5" font-size="17" font-weight="600" fill="#0b65a8">flat open land</text><text x="529.3333333333333" y="503.5" font-size="18" fill="#334e68">地势平坦开阔。</text></g><g><rect x="956.6666666666666" y="404.5" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#0b65a8" stroke-width="3"/><text x="980.6666666666666" y="446.5" font-size="31" font-weight="800" fill="#123b5d">浑身</text><text x="980.6666666666666" y="474.5" font-size="17" font-weight="600" fill="#0b65a8">whole body</text><text x="980.6666666666666" y="503.5" font-size="18" fill="#334e68">全身。</text></g><g><rect x="54" y="619" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#0b65a8" stroke-width="3"/><text x="78" y="661" font-size="31" font-weight="800" fill="#123b5d">打量</text><text x="78" y="689" font-size="17" font-weight="600" fill="#0b65a8">look over</text><text x="78" y="718" font-size="18" fill="#334e68">仔细地观察。</text></g><g><rect x="505.3333333333333" y="619" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#0b65a8" stroke-width="3"/><text x="529.3333333333333" y="661" font-size="31" font-weight="800" fill="#123b5d">一哄而散</text><text x="529.3333333333333" y="689" font-size="17" font-weight="600" fill="#0b65a8">scatter all at once</text><text x="529.3333333333333" y="718" font-size="18" fill="#334e68">许多人一下子同时散开。</text></g><g><rect x="956.6666666666666" y="619" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#0b65a8" stroke-width="3"/><text x="980.6666666666666" y="661" font-size="31" font-weight="800" fill="#123b5d">颁布</text><text x="980.6666666666666" y="689" font-size="17" font-weight="600" fill="#0b65a8">promulgate</text><text x="980.6666666666666" y="718" font-size="18" fill="#334e68">正式发布法令、规则等。</text></g><g><rect x="54" y="833.5" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#0b65a8" stroke-width="3"/><text x="78" y="875.5" font-size="31" font-weight="800" fill="#123b5d">手势</text><text x="78" y="903.5" font-size="17" font-weight="600" fill="#0b65a8">hand gesture</text><text x="78" y="932.5" font-size="18" fill="#334e68">用手的动作来表达意思。</text></g></svg>