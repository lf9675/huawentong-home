<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8ff"/><stop offset="1" stop-color="#fffdf7"/></linearGradient></defs><rect width="1440" height="1080" fill="url(#g)"/><rect width="1440" height="160" fill="#5a72c8"/><text x="70" y="100" font-size="62">📚</text><text x="150" y="68" font-size="48" font-weight="900" fill="#fff">看图学词语</text><text x="150" y="118" font-size="28" font-weight="700" fill="#fff">单元四 第一课《培养好习惯》</text><text x="1360" y="60" text-anchor="end" font-size="20" fill="#fff">中一 Higher Chinese</text><text x="1360" y="100" text-anchor="end" font-size="18" fill="#fff">看图 · 理解 · 听读 · 记忆</text><g><rect x="54" y="190" width="316.5" height="196.5" rx="20" fill="#fff" stroke="#5a72c8" stroke-width="3"/><text x="78" y="232" font-size="23" font-weight="800" fill="#123b5d">一寸光阴一寸金</text><text x="78" y="260" font-size="17" font-weight="600" fill="#5a72c8">time is precious</text><text x="78" y="289" font-size="18" fill="#334e68">时间十分宝贵，要珍惜。</text></g><g><rect x="392.5" y="190" width="316.5" height="196.5" rx="20" fill="#fff" stroke="#5a72c8" stroke-width="3"/><text x="416.5" y="232" font-size="31" font-weight="800" fill="#123b5d">一诺千金</text><text x="416.5" y="260" font-size="17" font-weight="600" fill="#5a72c8">a promise is precious</text><text x="416.5" y="289" font-size="18" fill="#334e68">答应别人的事非常重要。</text></g><g><rect x="731" y="190" width="316.5" height="196.5" rx="20" fill="#fff" stroke="#5a72c8" stroke-width="3"/><text x="755" y="232" font-size="31" font-weight="800" fill="#123b5d">言出必行</text><text x="755" y="260" font-size="17" font-weight="600" fill="#5a72c8">keep one&apos;s word</text><text x="755" y="289" font-size="18" fill="#334e68">说过的话一定做到。</text></g><g><rect x="1069.5" y="190" width="316.5" height="196.5" rx="20" fill="#fff" stroke="#5a72c8" stroke-width="3"/><text x="1093.5" y="232" font-size="31" font-weight="800" fill="#123b5d">起码</text><text x="1093.5" y="260" font-size="17" font-weight="600" fill="#5a72c8">at least</text><text x="1093.5" y="289" font-size="18" fill="#334e68">最低限度；至少。</text></g><g><rect x="54" y="404.5" width="316.5" height="196.5" rx="20" fill="#fff" stroke="#5a72c8" stroke-width="3"/><text x="78" y="446.5" font-size="31" font-weight="800" fill="#123b5d">开卷有益</text><text x="78" y="474.5" font-size="17" font-weight="600" fill="#5a72c8">reading is beneficial</text><text x="78" y="503.5" font-size="18" fill="#334e68">读书总会有收获。</text></g><g><rect x="392.5" y="404.5" width="316.5" height="196.5" rx="20" fill="#fff" stroke="#5a72c8" stroke-width="3"/><text x="416.5" y="446.5" font-size="31" font-weight="800" fill="#123b5d">新颖</text><text x="416.5" y="474.5" font-size="17" font-weight="600" fill="#5a72c8">novel; original</text><text x="416.5" y="503.5" font-size="18" fill="#334e68">新鲜、特别，不落俗套。</text></g><g><rect x="731" y="404.5" width="316.5" height="196.5" rx="20" fill="#fff" stroke="#5a72c8" stroke-width="3"/><text x="755" y="446.5" font-size="31" font-weight="800" fill="#123b5d">戏剧</text><text x="755" y="474.5" font-size="17" font-weight="600" fill="#5a72c8">drama</text><text x="755" y="503.5" font-size="18" fill="#334e68">通过表演讲故事的艺术。</text></g><g><rect x="1069.5" y="404.5" width="316.5" height="196.5" rx="20" fill="#fff" stroke="#5a72c8" stroke-width="3"/><text x="1093.5" y="446.5" font-size="31" font-weight="800" fill="#123b5d">工作坊</text><text x="1093.5" y="474.5" font-size="17" font-weight="600" fill="#5a72c8">workshop</text><text x="1093.5" y="503.5" font-size="18" fill="#334e68">以实践和互动为主的学习活动。</text></g><g><rect x="54" y="619" width="316.5" height="196.5" rx="20" fill="#fff" stroke="#5a72c8" stroke-width="3"/><text x="78" y="661" font-size="31" font-weight="800" fill="#123b5d">尴尬</text><text x="78" y="689" font-size="17" font-weight="600" fill="#5a72c8">awkward</text><text x="78" y="718" font-size="18" fill="#334e68">处境不自然、不好应付。</text></g><g><rect x="392.5" y="619" width="316.5" height="196.5" rx="20" fill="#fff" stroke="#5a72c8" stroke-width="3"/><text x="416.5" y="661" font-size="31" font-weight="800" fill="#123b5d">维护</text><text x="416.5" y="689" font-size="17" font-weight="600" fill="#5a72c8">maintain; protect</text><text x="416.5" y="718" font-size="18" fill="#334e68">保护，使保持良好状态。</text></g><g><rect x="731" y="619" width="316.5" height="196.5" rx="20" fill="#fff" stroke="#5a72c8" stroke-width="3"/><text x="755" y="661" font-size="31" font-weight="800" fill="#123b5d">友谊</text><text x="755" y="689" font-size="17" font-weight="600" fill="#5a72c8">friendship</text><text x="755" y="718" font-size="18" fill="#334e68">朋友之间的感情。</text></g><g><rect x="1069.5" y="619" width="316.5" height="196.5" rx="20" fill="#fff" stroke="#5a72c8" stroke-width="3"/><text x="1093.5" y="661" font-size="31" font-weight="800" fill="#123b5d">一帆风顺</text><text x="1093.5" y="689" font-size="17" font-weight="600" fill="#5a72c8">smooth sailing</text><text x="1093.5" y="718" font-size="18" fill="#334e68">事情进展顺利，没有阻碍。</text></g><g><rect x="54" y="833.5" width="316.5" height="196.5" rx="20" fill="#fff" stroke="#5a72c8" stroke-width="3"/><text x="78" y="875.5" font-size="31" font-weight="800" fill="#123b5d">有效</text><text x="78" y="903.5" font-size="17" font-weight="600" fill="#5a72c8">effective</text><text x="78" y="932.5" font-size="18" fill="#334e68">能产生预期的好效果。</text></g><g><rect x="392.5" y="833.5" width="316.5" height="196.5" rx="20" fill="#fff" stroke="#5a72c8" stroke-width="3"/><text x="416.5" y="875.5" font-size="31" font-weight="800" fill="#123b5d">策略</text><text x="416.5" y="903.5" font-size="17" font-weight="600" fill="#5a72c8">strategy</text><text x="416.5" y="932.5" font-size="18" fill="#334e68">为了达到目标采取的方法。</text></g><g><rect x="731" y="833.5" width="316.5" height="196.5" rx="20" fill="#fff" stroke="#5a72c8" stroke-width="3"/><text x="755" y="875.5" font-size="31" font-weight="800" fill="#123b5d">嘉宾</text><text x="755" y="903.5" font-size="17" font-weight="600" fill="#5a72c8">guest</text><text x="755" y="932.5" font-size="18" fill="#334e68">受邀请参加活动的重要客人。</text></g><g><rect x="1069.5" y="833.5" width="316.5" height="196.5" rx="20" fill="#fff" stroke="#5a72c8" stroke-width="3"/><text x="1093.5" y="875.5" font-size="31" font-weight="800" fill="#123b5d">辅导员</text><text x="1093.5" y="903.5" font-size="17" font-weight="600" fill="#5a72c8">counsellor</text><text x="1093.5" y="932.5" font-size="18" fill="#334e68">帮助学生解决问题的人员。</text></g></svg>