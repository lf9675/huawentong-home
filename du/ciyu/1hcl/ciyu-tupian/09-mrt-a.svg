<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8ff"/><stop offset="1" stop-color="#fffdf7"/></linearGradient></defs><rect width="1440" height="1080" fill="url(#g)"/><rect width="1440" height="160" fill="#d05a32"/><text x="70" y="100" font-size="62">🚇</text><text x="150" y="68" font-size="48" font-weight="900" fill="#fff">看图学词语</text><text x="150" y="118" font-size="28" font-weight="700" fill="#fff">第二课《我为狮城做贡献》（上）</text><text x="1360" y="60" text-anchor="end" font-size="20" fill="#fff">中一 Higher Chinese</text><text x="1360" y="100" text-anchor="end" font-size="18" fill="#fff">看图 · 理解 · 听读 · 记忆</text><g><rect x="54" y="190" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#d05a32" stroke-width="3"/><text x="78" y="232" font-size="31" font-weight="800" fill="#123b5d">截至</text><text x="78" y="260" font-size="17" font-weight="600" fill="#d05a32">as of; up to</text><text x="78" y="289" font-size="18" fill="#334e68">表示到某个时间为止。</text></g><g><rect x="505.3333333333333" y="190" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#d05a32" stroke-width="3"/><text x="529.3333333333333" y="232" font-size="31" font-weight="800" fill="#123b5d">行驶</text><text x="529.3333333333333" y="260" font-size="17" font-weight="600" fill="#d05a32">travel; run</text><text x="529.3333333333333" y="289" font-size="18" fill="#334e68">车辆在道路或轨道上运行。</text></g><g><rect x="956.6666666666666" y="190" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#d05a32" stroke-width="3"/><text x="980.6666666666666" y="232" font-size="31" font-weight="800" fill="#123b5d">延误</text><text x="980.6666666666666" y="260" font-size="17" font-weight="600" fill="#d05a32">delay</text><text x="980.6666666666666" y="289" font-size="18" fill="#334e68">比原定时间晚。</text></g><g><rect x="54" y="404.5" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#d05a32" stroke-width="3"/><text x="78" y="446.5" font-size="31" font-weight="800" fill="#123b5d">稳定</text><text x="78" y="474.5" font-size="17" font-weight="600" fill="#d05a32">stable</text><text x="78" y="503.5" font-size="18" fill="#334e68">保持正常，不容易发生变化。</text></g><g><rect x="505.3333333333333" y="404.5" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#d05a32" stroke-width="3"/><text x="529.3333333333333" y="446.5" font-size="31" font-weight="800" fill="#123b5d">漏液</text><text x="529.3333333333333" y="474.5" font-size="17" font-weight="600" fill="#d05a32">liquid leakage</text><text x="529.3333333333333" y="503.5" font-size="18" fill="#334e68">液体从缝隙中流出。</text></g><g><rect x="956.6666666666666" y="404.5" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#d05a32" stroke-width="3"/><text x="980.6666666666666" y="446.5" font-size="31" font-weight="800" fill="#123b5d">轨道</text><text x="980.6666666666666" y="474.5" font-size="17" font-weight="600" fill="#d05a32">railway track</text><text x="980.6666666666666" y="503.5" font-size="18" fill="#334e68">让列车行驶的铁轨。</text></g><g><rect x="54" y="619" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#d05a32" stroke-width="3"/><text x="78" y="661" font-size="31" font-weight="800" fill="#123b5d">凌晨</text><text x="78" y="689" font-size="17" font-weight="600" fill="#d05a32">early morning</text><text x="78" y="718" font-size="18" fill="#334e68">午夜以后到天亮前的一段时间。</text></g><g><rect x="505.3333333333333" y="619" width="429.3333333333333" height="196.5" rx="20" fill="#fff" stroke="#d05a32" stroke-width="3"/><text x="529.3333333333333" y="661" font-size="31" font-weight="800" fill="#123b5d">就绪</text><text x="529.3333333333333" y="689" font-size="17" font-weight="600" fill="#d05a32">ready</text><text x="529.3333333333333" y="718" font-size="18" fill="#334e68">已经准备好，可以开始。</text></g><g><rect x="956.6666666666666" y="619" width="429.3333333333333" height="196.5" rx="20" fill="