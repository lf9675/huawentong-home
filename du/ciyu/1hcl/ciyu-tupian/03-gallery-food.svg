<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8ff"/><stop offset="1" stop-color="#fffdf7"/></linearGradient></defs><rect width="1440" height="1080" fill="url(#g)"/><rect width="1440" height="160" fill="#b8641a"/><text x="70" y="100" font-size="62">🎨</text><text x="150" y="68" font-size="48" font-weight="900" fill="#fff">看图学词语</text><text x="150" y="118" font-size="28" font-weight="700" fill="#fff">第三课《国家美术馆探秘》＋第四课《食在新加坡》</text><text x="1360" y="60" text-anchor="end" font-size="20" fill="#fff">中一 Higher Chinese</text><text x="1360" y="100" text-anchor="end" font-size="18" fill="#fff">看图 · 理解 · 听读 · 记忆</text><g><rect x="54" y="190" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#b8641a" stroke-width="3"/><text x="78" y="232" font-size="31" font-weight="800" fill="#123b5d">殖民地</text><text x="78" y="260" font-size="17" font-weight="600" fill="#b8641a">colony</text><text x="78" y="289" font-size="18" fill="#334e68">受外国统治的地区。</text></g><g><rect x="392.5" y="190" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#b8641a" stroke-width="3"/><text x="416.5" y="232" font-size="31" font-weight="800" fill="#123b5d">投降</text><text x="416.5" y="260" font-size="17" font-weight="600" fill="#b8641a">surrender</text><text x="416.5" y="289" font-size="18" fill="#334e68">停止抵抗，承认失败。</text></g><g><rect x="731" y="190" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#b8641a" stroke-width="3"/><text x="755" y="232" font-size="31" font-weight="800" fill="#123b5d">棕色</text><text x="755" y="260" font-size="17" font-weight="600" fill="#b8641a">brown</text><text x="755" y="289" font-size="18" fill="#334e68">像棕榈果实一样的褐色。</text></g><g><rect x="1069.5" y="190" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#b8641a" stroke-width="3"/><text x="1093.5" y="232" font-size="31" font-weight="800" fill="#123b5d">氧化</text><text x="1093.5" y="260" font-size="17" font-weight="600" fill="#b8641a">oxidise</text><text x="1093.5" y="289" font-size="18" fill="#334e68">物质与氧发生反应而变化。</text></g><g><rect x="54" y="361.6" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#b8641a" stroke-width="3"/><text x="78" y="403.6" font-size="31" font-weight="800" fill="#123b5d">里程碑</text><text x="78" y="431.6" font-size="17" font-weight="600" fill="#b8641a">milestone</text><text x="78" y="460.6" font-size="18" fill="#334e68">标志重要发展阶段的事件。</text></g><g><rect x="392.5" y="361.6" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#b8641a" stroke-width="3"/><text x="416.5" y="403.6" font-size="31" font-weight="800" fill="#123b5d">尤其</text><text x="416.5" y="431.6" font-size="17" font-weight="600" fill="#b8641a">especially</text><text x="416.5" y="460.6" font-size="18" fill="#334e68">表示特别突出某一方面。</text></g><g><rect x="731" y="361.6" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#b8641a" stroke-width="3"/><text x="755" y="403.6" font-size="31" font-weight="800" fill="#123b5d">发掘</text><text x="755" y="431.6" font-size="17" font-weight="600" fill="#b8641a">discover; uncover</text><text x="755" y="460.6" font-size="18" fill="#334e68">发现并深入找出有价值的事物。</text></g><g><rect x="1069.5" y="361.6" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#b8641a" stroke-width="3"/><text x="1093.5" y="403.6" font-size="31" font-weight="800" fill="#123b5d">擅长</text><text x="1093.5" y="431.6" font-size="17" font-weight="600" fill="#b8641a">be good at</text><text x="1093.5" y="460.6" font-size="18" fill="#334e68">在某方面很有本领。</text></g><g><rect x="54" y="533.2" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#b8641a" stroke-width="3"/><text x="78" y="575.2" font-size="31" font-weight="800" fill="#123b5d">紧凑</text><text x="78" y="603.2" font-size="17" font-weight="600" fill="#b8641a">compact; tight</text><text x="78" y="632.2" font-size="18" fill="#334e68">安排密集而有条理。</text></g><g><rect x="392.5" y="533.2" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#b8641a" stroke-width="3"/><text x="416.5" y="575.2" font-size="31" font-weight="800" fill="#123b5d">打道回府</text><text x="416.5" y="603.2" font-size="17" font-weight="600" fill="#b8641a">head home</text><text x="416.5" y="632.2" font-size="18" fill="#334e68">动身回家。</text></g><g><rect x="731" y="533.2" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#b8641a" stroke-width="3"/><text x="755" y="575.2" font-size="31" font-weight="800" fill="#123b5d">杂技</text><text x="755" y="603.2" font-size="17" font-weight="600" fill="#b8641a">acrobatics</text><text x="755" y="632.2" font-size="18" fill="#334e68">表演高难度技巧的艺术。</text></g><g><rect x="1069.5" y="533.2" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#b8641a" stroke-width="3"/><text x="1093.5" y="575.2" font-size="31" font-weight="800" fill="#123b5d">甩</text><text x="1093.5" y="603.2" font-size="17" font-weight="600" fill="#b8641a">swing; fling</text><text x="1093.5" y="632.2" font-size="18" fill="#334e68">用力挥动或抛动。</text></g><g><rect x="54" y="704.8" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#b8641a" stroke-width="3"/><text x="78" y="746.8" font-size="31" font-weight="800" fill="#123b5d">薄</text><text x="78" y="774.8" font-size="17" font-weight="600" fill="#b8641a">thin</text><text x="78" y="803.8" font-size="18" fill="#334e68">厚度小。</text></g><g><rect x="392.5" y="704.8" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#b8641a" stroke-width="3"/><text x="416.5" y="746.8" font-size="31" font-weight="800" fill="#123b5d">不偏不倚</text><text x="416.5" y="774.8" font-size="17" font-weight="600" fill="#b8641a">right in the middle</text><text x="416.5" y="803.8" font-size="18" fill="#334e68">位置或做法不偏向任何一方。</text></g><g><rect x="731" y="704.8" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#b8641a" stroke-width="3"/><text x="755" y="746.8" font-size="31" font-weight="800" fill="#123b5d">咖喱</text><text x="755" y="774.8" font-size="17" font-weight="600" fill="#b8641a">curry</text><text x="755" y="803.8" font-size="18" fill="#334e68">用多种香料制成的调味食品。</text></g><g><rect x="1069.5" y="704.8" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#b8641a" stroke-width="3"/><text x="1093.5" y="746.8" font-size="31" font-weight="800" fill="#123b5d">沾</text><text x="1093.5" y="774.8" font-size="17" font-weight="600" fill="#b8641a">dip; touch</text><text x="1093.5" y="803.8" font-size="18" fill="#334e68">让某物接触或附着另一物。</text></g><g><rect x="54" y="876.4" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#b8641a" stroke-width="3"/><text x="78" y="918.4" font-size="31" font-weight="800" fill="#123b5d">泡沫</text><text x="78" y="946.4" font-size="17" font-weight="600" fill="#b8641a">foam</text><text x="78" y="975.4" font-size="18" fill="#334e68">液体表面形成的小气泡群。</text></g><g><rect x="392.5" y="876.4" width="316.5" height="153.6" rx="20" fill="#fff" stroke="#b8641a" stroke-width="3"/><text x="416.5" y="918.4" font-size="31" font-weight="800" fill="#123b5d">赞不绝口</text><text x="416.5" y="946.4" font-size="17" font-weight="600" fill="#b8641a">praise repeatedly</text><text x="416.5" y="975.4" font-size="18" fill="#334e68">不停地称赞。</text></g></svg>