const CATS=[['vocab','词语和成语','Words & idioms'],['texts','课文学习','Textbook learning'],['reading','阅读理解','Reading comprehension'],['writing','作文','Composition'],['email','实用文','Functional writing']];
const G={'1':'中一','2':'中二'};const root=document.getElementById('main');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){
 const bits=location.hash.slice(1).split('/');
 const g=G[bits[0]]?bits[0]:null;
 const cat=g?CATS.find(c=>c[0]===bits[1]):null;
 const sections=cat?DATA[g][cat[0]]:[];
 const section=/^\d+$/.test(bits[2]||'')?sections[Number(bits[2])]:null;
 const number=i=>String(i+1).padStart(2,'0');
 let out='';
 if(!g){
  out='<p class="kicker">LEARNING RESOURCES</p><h1>选择年级</h1><p class="hint">Choose your level.</p><div class="grades">'+Object.entries(G).map(([id,n])=>`<a class="grade" href="#${id}"><div><span class="num">SECONDARY ${id}</span><strong>${n}</strong></div><span class="en">Higher Chinese</span><span class="enter">Open resources →</span></a>`).join('')+'</div>';
 }else{
  out='<nav class="crumb" aria-label="Breadcrumb"><a href="#">所有年级 / Levels</a><span>/</span>';
  out+=cat?`<a href="#${g}">${G[g]}</a><span>/</span>`:`<span aria-current="page">${G[g]}</span>`;
  if(cat)out+=section?`<a href="#${g}/${cat[0]}">${cat[1]}</a><span>/</span><span aria-current="page">${esc(section.title)}</span>`:`<span aria-current="page">${cat[1]}</span>`;
  out+=`</nav><p class="kicker">${G[g]} · SECONDARY ${g}</p>`;
  if(!cat){
   out+=`<h1>${G[g]} · 学习栏目</h1><p class="hint">Choose a learning area.</p><div class="categories">`+CATS.map((c,i)=>`<a class="cat" href="#${g}/${c[0]}"><i>${number(i)}</i><b>${c[1]}</b><span>${c[2]}</span></a>`).join('')+'</div>';
  }else if(!section){
   out+=`<h1>${cat[1]}</h1><p class="hint">Choose a section.</p><div class="categories">`+sections.map((s,i)=>s.items.length?`<a class="cat" href="#${g}/${cat[0]}/${i}"><i>${number(i)}</i><b>${esc(s.title)}</b><span>Open activities →</span></a>`:`<div class="cat" aria-disabled="true"><i>${number(i)}</i><b>${esc(s.title)}</b><span>Coming soon</span></div>`).join('')+`</div><a class="back" href="#${g}">← Back to ${G[g]}</a>`;
  }else{
   out+=`<h1>${esc(section.title)}</h1><p class="hint">Choose an activity.</p><div class="categories">`+section.items.map((x,i)=>`<a class="cat" href="${esc(x.url)}"><i>${number(i)}</i><b>${esc(x.title)}</b>${x.note?`<span>${esc(x.note)}</span>`:''}</a>`).join('')+`</div>${section.items.length?'':'<p class="hint">Coming soon</p>'}<a class="back" href="#${g}/${cat[0]}">← Back to ${cat[1]}</a>`;
  }
 }
 root.innerHTML=out;
 document.title=(g?G[g]+(cat?' · '+cat[1]:'')+(section?' · '+section.title:''):'学习资源')+'｜华文通';
