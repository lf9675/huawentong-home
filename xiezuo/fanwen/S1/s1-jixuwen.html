<!DOCTYPE html>
<html lang="zh-Hans-SG">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>中一记叙文·三篇范文·红笔批注版</title>
<style>
:root{
  --paper:#FFFFFF;
  --paper-tint:#F4F6F3;
  --grid:#C9DACE;
  --ink:#1B1B1B;
  --ink-soft:#5A5F5C;
  --red:#C0272D;
  --red-soft:#FBEDED;
  --blue:#2C5F8A;
  --blue-soft:#EAF1F7;
  --mark:#FCE96A;
  --line:#DDE3DE;
  --green:#2F6B4F;
  --green-soft:#E8F2EC;
  --font-body:"Songti SC","Noto Serif CJK SC","SimSun",serif;
  --font-ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  min-height:100vh;
  overflow-y:auto;
  background:var(--paper-tint);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink);
  font-family:var(--font-ui);
  padding-bottom:100px;
}
.wrap{max-width:840px;margin:0 auto;padding:0 14px;}

header.top{background:var(--paper);border-bottom:3px solid var(--ink);padding:18px 0 0;}
.title-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
h1{font-family:var(--font-body);font-size:26px;margin:0;letter-spacing:1px;}
.sub{font-size:13px;color:var(--ink-soft);}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0 14px;font-size:12.5px;color:var(--ink-soft);}
.legend b{color:var(--red);font-weight:600;}
.legend i{color:var(--blue);font-style:normal;font-weight:600;}

nav.tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
nav.tabs button{
  flex:0 0 auto;border:1px solid var(--line);border-bottom:none;background:var(--paper-tint);
  color:var(--ink-soft);font-family:var(--font-ui);font-size:14px;padding:10px 14px;
  border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;
}
nav.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);font-weight:700;border-color:var(--ink);box-shadow:inset 0 3px 0 var(--red);}

.toolbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:8px 0;margin-bottom:16px;}
.toolbar .wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:13.5px;padding:8px 12px;border-radius:20px;cursor:pointer;}
.btn:active{transform:scale(.97);}
.btn.on{background:var(--red);border-color:var(--red);color:#fff;}
.btn.on.blue{background:var(--blue);border-color:var(--blue);}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
.card h2{font-family:var(--font-body);font-size:19px;margin:0 0 10px;padding-bottom:8px;border-bottom:2px solid var(--ink);}
.card h3{font-size:14px;margin:18px 0 6px;color:var(--blue);letter-spacing:.5px;}
.card h3:first-of-type{margin-top:14px;}

.prompt{background:var(--blue-soft);border-left:5px solid var(--blue);border-radius:0 8px 8px 0;padding:12px 14px;font-family:var(--font-body);font-size:16.5px;line-height:1.8;}
.type-chip{display:inline-block;background:var(--ink);color:#fff;font-size:12px;padding:3px 9px;border-radius:4px;margin-bottom:8px;}
.must{background:var(--red-soft);border:1.5px solid var(--red);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.75;color:#4A1F21;margin-top:8px;}
.must b{color:var(--red);}

table.kw{width:100%;border-collapse:collapse;font-size:14px;}
table.kw th,table.kw td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;line-height:1.65;}
table.kw th{background:var(--paper-tint);font-weight:700;white-space:nowrap;}
table.kw td.k{font-weight:700;white-space:nowrap;}
table.kw tr.star td.k{color:var(--red);}
table.kw tr.star td.k::after{content:" ★最重要";font-size:11px;font-weight:400;}

.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{background:var(--paper-tint);border:1px dashed var(--ink-soft);border-radius:14px;padding:5px 10px;font-size:13px;}

.center-box{background:var(--mark);border-radius:8px;padding:12px 14px;font-family:var(--font-body);font-size:16px;line-height:1.8;}

.mat{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mat>div{border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.75;}
.mat .good{background:var(--green-soft);border-left:4px solid var(--green);}
.mat .bad{background:var(--red-soft);border-left:4px solid var(--red);}
.mat h4{margin:0 0 6px;font-size:13.5px;}
.mat .good h4{color:var(--green);}
.mat .bad h4{color:var(--red);}
.mat ul{margin:0;padding-left:18px;}
.mat li{margin-bottom:3px;}
.mat .note-why{margin:8px 0 0;font-size:13px;color:var(--ink-soft);}
@media(max-width:560px){.mat{grid-template-columns:1fr;}}

.ratio{display:flex;width:100%;height:34px;border:1px solid var(--ink);border-radius:6px;overflow:hidden;margin-top:6px;}
.ratio div{display:flex;align-items:center;justify-content:center;font-size:11.5px;color:#fff;border-right:1px solid rgba(255,255,255,.5);overflow:hidden;}
.ratio div:last-child{border-right:none;}
.ratio-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:12.5px;color:var(--ink-soft);}
.ratio-legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--sw);}

.essay{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 0 4px;}
.para{border-bottom:1px dashed var(--line);padding:14px 16px;}
.para:last-child{border-bottom:none;}
.para-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.part{font-size:12px;color:var(--blue);background:var(--blue-soft);border-radius:4px;padding:3px 8px;font-weight:700;letter-spacing:.5px;}
.speak{border:1px solid var(--line);background:var(--paper);border-radius:50%;width:30px;height:30px;font-size:14px;line-height:1;cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;margin-left:auto;flex:0 0 auto;}
.speak.on{background:var(--blue);border-color:var(--blue);color:#fff;}
.text{font-family:var(--font-body);font-size:18px;line-height:2.05;text-indent:2em;margin:0;}
.text mark{background:var(--mark);padding:0 2px;border-radius:2px;}
.text .dlg{display:block;text-indent:2em;}
.it{
  font-family:var(--font-ui);font-size:11.5px;color:var(--blue);background:var(--blue-soft);
  border-radius:3px;padding:1px 5px;margin:0 3px;white-space:nowrap;text-indent:0;
}
body.hide-it .it{display:none;}

.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.tag{border:1.5px solid var(--red);color:var(--red);background:var(--paper);font-size:13px;padding:5px 11px;border-radius:16px;cursor:pointer;font-family:var(--font-ui);}
.tag::before{content:"✎ ";}
.tag[aria-expanded="true"]{background:var(--red);color:#fff;}
.tag:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
.note{display:none;margin-top:8px;background:var(--red-soft);border-left:4px solid var(--red);border-radius:0 8px 8px 0;padding:10px 12px;font-size:14.5px;line-height:1.8;color:#4A1F21;}
.note.show{display:block;}
.note .en{display:block;margin-top:5px;font-size:12.5px;color:#7A4A4C;font-style:italic;}

.why{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:16px;margin-bottom:16px;}
.why h2{border-bottom:none;margin-bottom:6px;font-family:var(--font-body);font-size:19px;}
.why ol{margin:0;padding-left:20px;font-size:15px;line-height:1.9;}
.why li{margin-bottom:4px;}

table.ref{width:100%;border-collapse:collapse;font-size:14.5px;}
table.ref th,table.ref td{border:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top;line-height:1.7;}
table.ref th{background:var(--ink);color:#fff;}
table.ref td.t{font-weight:700;color:var(--red);white-space:nowrap;}


/* ---- 10秒审题图：关键词 → 发散 → 筛选 ---- */
.thinkmap{border:2px solid var(--ink);border-radius:14px;background:#fff;padding:14px;margin-top:8px;}
.tm-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.tm-badge{background:var(--ink);color:#fff;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;}
.tm-hint{font-size:13px;color:var(--ink-soft);font-weight:700;}
.tm-kws{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:8px 0 2px;}
.tm-kw{border:2px solid var(--blue);background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:800;}
.tm-kw.core{border-color:var(--red);background:var(--red-soft);color:var(--red);transform:scale(1.04);}
.tm-arrow{text-align:center;font-size:22px;line-height:1;color:var(--ink-soft);margin:7px 0;}
.tm-question{max-width:650px;margin:0 auto;background:var(--mark);border:2px solid #D3B800;border-radius:12px;padding:10px 14px;text-align:center;font-size:17px;font-weight:900;line-height:1.55;}
.tm-branches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px;position:relative;}
.tm-branch{min-width:0;background:var(--green-soft);border:1.5px solid #A9C8B6;border-radius:10px;padding:9px 8px;text-align:center;line-height:1.4;}
.tm-branch b{display:block;color:var(--green);font-size:14px;margin-bottom:4px;}
.tm-branch span{font-size:12.5px;color:#365244;}
.tm-filter{max-width:650px;margin:0 auto;background:#FFF8E5;border:1.5px dashed #B07A1E;border-radius:10px;padding:9px 12px;text-align:center;font-size:14px;font-weight:800;line-height:1.55;color:#6A4C14;}
.tm-pick{max-width:650px;margin:9px auto 0;background:var(--green-soft);border-left:5px solid var(--green);border-radius:8px;padding:9px 12px;font-size:14px;line-height:1.55;}
.tm-pick b{color:var(--green);}
.tm-limits{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:10px;}
.tm-limit{font-size:12px;border:1px dashed var(--ink-soft);border-radius:999px;padding:5px 9px;background:var(--paper-tint);color:var(--ink-soft);}
.more-audit{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper-tint);overflow:hidden;}
.more-audit summary{cursor:pointer;padding:9px 11px;font-size:13px;font-weight:800;color:var(--blue);list-style:none;}
.more-audit summary::-webkit-details-marker{display:none;}
.more-audit summary::before{content:'＋ ';}
.more-audit[open] summary::before{content:'－ ';}
.more-audit .inside{padding:0 11px 11px;font-size:13px;line-height:1.7;color:var(--ink-soft);}
.more-audit .inside ul{margin:6px 0 0;padding-left:18px;}
@media(max-width:700px){.tm-branches{grid-template-columns:repeat(2,1fr)}}
@media(max-width:430px){.tm-question{font-size:16px}.tm-branch b{font-size:13px}.tm-branch span{font-size:12px}.tm-kws{gap:5px}.tm-kw{font-size:13px;padding:6px 10px}}


/* ---- 弱生支撑：英文/语音默认隐藏，按需打开 ---- */
.support-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 8px;}
.support-tools .mini,.why-tools .mini{font-size:12px;}
.support-en{display:none;margin-top:7px;padding:8px 10px;border-radius:8px;background:#F4F8FB;color:var(--blue);font-size:12.5px;line-height:1.6;font-style:italic;}
.support-en.show{display:block;}
.audit-en{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
.audit-en li{margin-bottom:5px;}
.why-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.why-tools{display:flex;gap:6px;align-items:center;}
.why-en-list{display:none;margin:8px 0 0;padding:9px 12px 9px 30px;background:#F4F8FB;border-radius:8px;color:var(--blue);font-size:12.5px;line-height:1.65;font-style:italic;}
.why-en-list.show{display:block;}
.story-support{position:relative;}
.story-support .support-tools{justify-content:flex-end;margin-top:-2px;}
.ratio-support{margin-top:7px;}


.panel{display:none;}
.panel.active{display:block;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
@media (max-width:480px){
  h1{font-size:22px;}
  .text{font-size:17px;line-height:1.95;}
  table.kw{font-size:13px;}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="title-row">
      <h1>中一记叙文 · 三篇范文</h1>
      <span class="sub">中一高级华文｜红笔批注版</span>
    </div>
    <div class="legend">
      <span><i>蓝标</i> = 这一段／这一句在做什么</span>
      <span><b>✎ 红批</b> = 用了什么技巧，点开看</span>
      <span>🔊 = 朗读这一段</span>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <button class="btn" id="toggleAll">展开全部红批</button>
    <button class="btn" id="toggleInline">隐藏句子标注</button>
    <button class="btn" id="stopSpeak">停止朗读</button>
  </div>
</div>

<main class="wrap" id="panels"></main>

<script>
/* ================= 技巧速查 ================= */
const REF = [
 [
  "开门见山两步走",
  "第一段先点出人物／原来的看法，再马上引出主要事件。不要把天气、早餐、上学过程写成开头。",
  "State the person or starting belief, then move straight into the event."
 ],
 [
  "关键词贯穿全文",
  "题目给出的关键词不能只在开头出现一次；经过、结果、结尾都要不断用事件把它证明出来。",
  "Keep proving the key words throughout the essay."
 ],
 [
  "一主两辅（人物题）",
  "人物题可用两三个很短的日常细节作辅助，再用一件核心事件详写。重点永远放在最能证明人物特点的那件事。",
  "Use brief supporting details plus one main event."
 ],
 [
  "人物特点要用动作证明",
  "不要反复写「他很认真、很负责」。写他检查了什么、发现了什么、问题出现后怎样处理，读者自然会得出结论。",
  "Prove traits through actions, not labels."
 ],
 [
  "侧面描写",
  "用周围人的反应衬托人物，例如大家急着走，他还留下来核对物品；不用作者自己不断称赞。",
  "Let other people's reactions reveal the character."
 ],
 [
  "关键选择写责任心",
  "真正的责任心通常出现在「可以推给别人，却选择自己承担」的时刻。把这个选择写慢、写清楚。",
  "Responsibility is clearest when the character could avoid it but chooses to own it."
 ],
 [
  "前后对照",
  "先写原来的做法／想法，再写事情后的变化。两边要正面对应，变化才清楚。",
  "Make the before and after directly answer each other."
 ],
 [
  "因果链",
  "每个后果都要能追溯到前面的原因：没有计划→任务混乱；拒绝意见→现场出问题。这样中心才是故事自己推出来的。",
  "Make each consequence grow from an earlier cause."
 ],
 [
  "计划要写具体",
  "不能只写「我们制定了计划」。要让读者看得见时间表、分工、先后次序、检查点或备用方案。",
  "Show the actual schedule, roles, order and checkpoints."
 ],
 [
  "分歧要响",
  "有意见冲突时用对话写清双方理由。不是「她劝我，我不听」一句带过。",
  "Use dialogue so both sides' reasons can be heard."
 ],
 [
  "后果验证意见",
  "第3题最重要：后来发生的事必须证明对方的意见确实指出了你的盲点，否则「学会接受意见」没有根据。",
  "The later outcome must prove why the advice mattered."
 ],
 [
  "转变要有动作",
  "真正接受不是心里想通而已，要写出一个可见动作：重新排桌、改方案、重新分工、主动问别人怎么看。",
  "Show change through a visible action."
 ],
 [
  "行动要慢",
  "核心情节把一秒钟拆开：停住、看见、伸手、改动、再确认。动作越具体，人物越可信。",
  "Slow the key moment into small actions."
 ],
 [
  "心理要真",
  "不要只写「我很后悔／很紧张」。写出当时脑中两个声音怎样拉扯，读者才看得到转变。",
  "Show the inner conflict, not just an emotion label."
 ],
 [
  "详略分明",
  "开头和结果要短，核心经过要长。凡是直接证明题目关键词的情节，都值得详写。",
  "Spend the most space on what directly proves the prompt."
 ],
 [
  "首尾呼应",
  "结尾回到开头那句旧看法，把它翻过来。文章会有明显的闭合感。",
  "Return to the opening belief and turn it around."
 ],
 [
  "感悟不要喊口号",
  "结尾只写「这件事改变了我什么」，不要突然变成「我们每个人都应该……」。",
  "Keep the reflection personal instead of preaching."
 ],
 [
  "因果检验",
  "删掉最后的道理，只看故事本身：读者还能不能读出人物特点／计划的重要／接受意见的必要？能，才说明经过写对了。",
  "Delete the moral: can the story still prove the point?"
 ]
];

/* ================= 三篇 ================= */

const THINKMAP={
 e1:{
  kws:[['沉默寡言',false],['做事认真',false],['责任心',true]],
  q:'哪件事能让他“可以不管，却选择负责到底”？',
  branches:[['成果展物资','清单＋突发遗漏'],['小组资料','发现缺漏＋补齐'],['班级图书角','记录＋查遗失'],['活动设备','借出＋归还核对']],
  filter:'筛：这件事能同时看出“认真＋负责”吗？',
  pick:'最稳角度：<b>成果展物资负责人</b>——既能写逐项检查，也能写出问题后不推卸、负责到底。',
  limits:['主角是同学','三个特点都有证据','核心事件详写']
 },
 e2:{
  kws:[['最近一件事',false],['制定计划',true],['重要性',false]],
  q:'什么事情“步骤多＋时间紧”，没有计划很容易乱？',
  branches:[['小组短片','脚本→拍摄→剪辑'],['班级活动','场地→物资→分工'],['学习项目','资料→制作→检查'],['考试复习','科目→时间→调整']],
  filter:'筛：前面的“乱”真是没计划造成？后面的“顺”真是计划带来？',
  pick:'最稳角度：<b>小组短片</b>——步骤多、期限清楚，最容易做出“无计划 vs 有计划”的前后对照。',
  limits:['只写一件事','计划要具体可见','前乱后顺有因果']
 },
 e3:{
  kws:[['坚持自己看法',false],['不愿接受意见',false],['有些时候要接受',true]],
  q:'什么事情里，别人能看见“我没看到的问题”？',
  branches:[['义卖摊位','动线／摆放'],['小组展示','观众角度'],['比赛策略','队友看见漏洞'],['活动分工','时间／人手冲突']],
  filter:'筛：对方的意见有理由吗？我接受后，局面真的改善吗？',
  pick:'最稳角度：<b>义卖摊位布置</b>——我的方案和同学的动线建议都说得通，现场结果可以马上验证。',
  limits:['先写清双方理由','拒绝后出现对应后果','接受后有实际改变']
 }
};



const AUDIT_CN={
 e1:[

    "tags": [
     {

      "en": "Acceptance is shown through concrete changes, not a sentence saying you agreed."

     {

    "tags": [
     {
      "t": "改变不能只发生一次",
      "n": "第二次出现意见时，我不再自动反驳，而是「先看库存，再决定」。这句话真正扣住题目里的「学会」。",

/* ================= 渲染 ================= */
const tabsEl=document.getElementById('tabs');
const panelsEl=document.getElementById('panels');

function ratioHTML(list,e){
  const bar=list.map(r=>`<div style="width:${r.pct}%;background:${r.color}">${r.pct}%</div>`).join('');
  const leg=list.map(r=>`<span style="--sw:${r.color}">${r.label} ${r.pct}%</span>`).join('');
  const id=`${e.id}-ratio-note`, enId=`${e.id}-ratio-en`;
  return `<div class="ratio">${bar}</div><div class="ratio-legend">${leg}</div>
  <div class="ratio-support"><div class="support-tools"><button class="mini" data-en="${enId}">EN</button><button class="speak" data-read="${id}" title="朗读详略说明">🔊</button></div>
  <p id="${id}" style="font-size:13px;color:var(--ink-soft);margin:0;line-height:1.7">开头要短；<b>直接证明题目关键词的核心经过要最长</b>。不要头重脚轻。</p>
  <div class="support-en" id="${enId}">${RATIO_EN[e.id]||'Keep the opening short and spend most space on the main event.'}</div></div>`;
}

function materialHTML(m){
  const g=m.good.map(x=>`<li>${x}</li>`).join('');
  const b=m.bad.map(x=>`<li>${x}</li>`).join('');
  return `<div class="mat">
    <div class="good"><h4>✔ 可以写</h4><ul>${g}</ul></div>
    <div class="bad"><h4>✘ 不要写</h4><ul>${b}</ul></div>
  </div><p class="note-why">${m.why}</p>`;
}


function thinkHTML(e){
  const d=THINKMAP[e.id]; if(!d) return '';
  const en=THINK_EN[e.id]||{};
  const kws=d.kws.map(x=>`<span class="tm-kw ${x[1]?'core':''}">${x[0]}</span>`).join('');
  const bs=d.branches.map(x=>`<div class="tm-branch"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
  const ls=d.limits.map(x=>`<span class="tm-limit">${x}</span>`).join('');
  const enIdeas=(en.ideas||[]).map(x=>`<li>${x}</li>`).join('');
  const enId=`${e.id}-think-en`;
  return `<div class="thinkmap">
    <div class="tm-top"><span class="tm-badge">10秒审题</span><span class="tm-hint">圈 → 问 → 发散 → 筛</span><button class="mini" data-en="${enId}">EN</button></div>
    <div class="tm-kws">${kws}</div>
    <div class="tm-arrow">↓</div>
    <div class="tm-question">问：${d.q}</div>
    <div class="tm-arrow">↓</div>
    <div class="tm-branches">${bs}</div>
    <div class="tm-arrow">↓</div>
    <div class="tm-filter">${d.filter}</div>
    <div class="tm-pick">✓ ${d.pick}</div>
    <div class="tm-limits">${ls}</div>
    <div class="support-en" id="${enId}"><b>Question:</b> ${en.q||''}<ul style="margin:5px 0 5px 18px">${enIdeas}</ul><b>Filter:</b> ${en.filter||''}<br><b>Best angle:</b> ${en.pick||''}</div>
  </div>`;
}

function auditDetails(e){
  const cn=AUDIT_CN[e.id]||e.kw.map(k=>k.v);
  const ens=KW_DETAIL_EN[e.id]||[];
  const items=e.kw.map((k,i)=>`<li><b>${k.k}：</b>${cn[i]||k.v}</li>`).join('');
  const enItems=ens.map((x,i)=>`<li><b>${e.kw[i]?.k||''}:</b> ${x}</li>`).join('');
  const enId=`${e.id}-audit-en`;
  return `<details class="more-audit"><summary>需要时再看：关键词详细解释</summary><div class="inside">
    <div class="support-tools"><button class="mini" data-en="${enId}">EN</button></div>
    <ul>${items}</ul><div class="support-en audit-en" id="${enId}"><ul style="margin:0;padding-left:18px">${enItems}</ul></div>
  </div></details>`;
}

function storyHTML(e){
  const id=`${e.id}-story`, enId=`${e.id}-story-en`;
  return `<div class="center-box story-support" style="background:var(--blue-soft);border-left:5px solid var(--blue)">
    <div class="support-tools"><button class="mini" data-en="${enId}">EN</button><button class="speak" data-read="${id}" title="朗读故事安排">🔊</button></div>
    <div id="${id}">${e.shape}</div><div class="support-en" id="${enId}">${SHAPE_EN[e.id]||''}</div></div>`;
}

function whyHTML(e){
  const en=WHY_EN[e.id]||[]; const enId=`${e.id}-why-en`;
  const cn=e.why.map(w=>`<li>${w}</li>`).join('');
  const ens=en.map(w=>`<li>${w}</li>`).join('');
  return `<div class="why" style="margin-top:16px"><div class="why-head"><h2 style="margin-bottom:0">这一篇为什么能拿高分</h2><div class="why-tools"><button class="mini" data-en="${enId}">EN</button></div></div><ol>${cn}</ol><ol class="why-en-list" id="${enId}">${ens}</ol></div>`;
}

function essayHTML(e,idx){
  const kwRows=e.kw.map(k=>`<tr class="${k.star?'star':''}"><td class="k">${k.k}</td><td>${k.v}</td></tr>`).join('');
  const limits=e.limits.map(l=>`<span class="chip">${l}</span>`).join('');
  const mustBlock=e.must?`<div class="must"><b>这一题的特别要求：</b>${e.must}</div>`:'';
  const matBlock=e.material?`<h3>三、选材（先判断，再动笔）</h3>${materialHTML(e.material)}`:'';
  const paras=e.paras.map((p,i)=>{
    const tags=p.tags.map((t,j)=>`<button class="tag" aria-expanded="false" data-note="${e.id}-n${i}-${j}">${t.t}</button>`).join('');
    const notes=p.tags.map((t,j)=>`<div class="note" id="${e.id}-n${i}-${j}"><b>${t.t}｜</b>${t.n}<span class="en">${t.en}</span></div>`).join('');
    return `<div class="para">
      <div class="para-head"><span class="part">${p.part}</span>
      <button class="speak" data-read="${e.id}-p${i}" title="朗读这一段">🔊</button></div>
      <p class="text" id="${e.id}-p${i}">${p.text}</p>
      <div class="tagrow">${tags}</div>${notes}
    </div>`;
  }).join('');
  const why=e.why.map(w=>`<li>${w}</li>`).join('');
  return `<section class="panel${idx===0?' active':''}" id="panel-${e.id}" role="tabpanel">
    <div class="card">
      <span class="type-chip">${e.type}</span>
      <div class="prompt">${e.prompt}</div>
      <h3>一、审题一张图：从关键词想到选材</h3>
      ${thinkHTML(e)}
      ${auditDetails(e)}
      <h3>二、故事怎么排</h3>
      ${storyHTML(e)}
      <h3>三、中心一句话</h3>
      <div class="center-box">${e.center}</div>
      <h3>四、详略比例</h3>
      ${ratioHTML(e.ratio,e)}
    </div>
    <div class="card" style="padding-bottom:10px"><h2>范文</h2>
      <p style="font-size:13px;color:var(--ink-soft);margin:-4px 0 0;line-height:1.7">先读一遍，什么都不点；读完再点开红批，看每一段用了什么技巧。</p>
    </div>
    <div class="essay">${paras}</div>
    ${whyHTML(e)}
  </section>`;
}

function refHTML(){
  const rows=REF.map(r=>`<tr><td class="t">${r[0]}</td><td>${r[1]}<span style="display:block;font-size:12.5px;color:var(--ink-soft);font-style:italic;margin-top:4px">${r[2]}</span></td></tr>`).join('');
  return `<section class="panel" id="panel-ref" role="tabpanel">
    <div class="card"><h2>技巧速查表</h2>
    <p style="font-size:13.5px;color:var(--ink-soft);margin:0 0 10px;line-height:1.7">这些就是三篇范文红批里出现的全部技巧，和课堂笔记用的是同一套名称。</p>
    <table class="ref"><tr><th style="width:32%">技巧</th><th>怎么做</th></tr>${rows}</table></div>
    <div class="card"><h2>写作五步（顺序不能乱）</h2>
    <p style="font-family:var(--font-body);font-size:17px;line-height:2.2;margin:0">圈关键词　→　找限制　→　定中心和故事逻辑　→　选材　→　按模板规划结构</p></div>
    <div class="card"><h2>三篇的经过，排法各不相同</h2>
    <table class="ref"><tr><th style="width:32%">题目</th><th>经过怎么排</th></tr>
    <tr><td class="t">沉默却负责的同学</td><td>一主两辅——两笔日常细节略写，一件核心事件详写（人物刻画型）</td></tr>
    <tr><td class="t">制定计划的重要性</td><td>前后对照＋因果推进——无计划失控 → 制定计划 → 执行应变 → 完成（认识转变型）</td></tr>
    <tr><td class="t">接受别人的意见</td><td>分歧 → 后果 → 验证 → 转变——让事情本身证明哪些意见值得听（认识转变型）</td></tr>
    </table>
    <p style="font-size:13.5px;color:var(--ink-soft);margin:10px 0 0;line-height:1.75">审题时先判断题目需要什么证据，再决定经过怎么排。人物题要用事件立人，认识题要让因果推动转变；结构服务题意，不要机械套同一种模板。</p></div>
  </section>`;
}

let html='',tabsHtml='';
ESSAYS.forEach((e,i)=>{
  tabsHtml+=`<button role="tab" aria-selected="${i===0}" data-p="panel-${e.id}">${e.tab}</button>`;
  html+=essayHTML(e,i);
});
tabsHtml+=`<button role="tab" aria-selected="false" data-p="panel-ref">技巧速查</button>`;
html+=refHTML();
tabsEl.innerHTML=tabsHtml;
panelsEl.innerHTML=html;

/* ================= 交互 ================= */
tabsEl.addEventListener('click',ev=>{
  const b=ev.target.closest('button[data-p]'); if(!b) return;
  tabsEl.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected','false'));
  b.setAttribute('aria-selected','true');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(b.dataset.p).classList.add('active');
  stopSpeaking();
  window.scrollTo({top:0,behavior:'smooth'});
});

panelsEl.addEventListener('click',ev=>{
  const tag=ev.target.closest('.tag');
  if(tag){
    const note=document.getElementById(tag.dataset.note);
    const open=note.classList.toggle('show');
    tag.setAttribute('aria-expanded',open?'true':'false');
    return;
  }
  const enb=ev.target.closest('[data-en]');
  if(enb){
    const box=document.getElementById(enb.dataset.en);
    if(box){enb.classList.toggle('on',box.classList.toggle('show'));}
    return;
  }
  const sp=ev.target.closest('.speak');
  if(sp){ readPara(sp); }
});

const toggleBtn=document.getElementById('toggleAll');
let allOpen=false;
toggleBtn.addEventListener('click',()=>{
  const panel=document.querySelector('.panel.active');
  if(!panel) return;
  allOpen=!allOpen;
  panel.querySelectorAll('.note').forEach(n=>n.classList.toggle('show',allOpen));
  panel.querySelectorAll('.tag').forEach(t=>t.setAttribute('aria-expanded',allOpen?'true':'false'));
  toggleBtn.textContent=allOpen?'收起全部红批':'展开全部红批';
  toggleBtn.classList.toggle('on',allOpen);
});

const inlineBtn=document.getElementById('toggleInline');
inlineBtn.addEventListener('click',()=>{
  const hidden=document.body.classList.toggle('hide-it');
  inlineBtn.textContent=hidden?'显示句子标注':'隐藏句子标注';
  inlineBtn.classList.toggle('on',hidden);
  inlineBtn.classList.toggle('blue',hidden);
});

let curBtn=null;
function stopSpeaking(){
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  if(curBtn){curBtn.classList.remove('on');curBtn=null;}
}
document.getElementById('stopSpeak').addEventListener('click',stopSpeaking);

function readPara(btn){
  if(!('speechSynthesis' in window)){alert('这个浏览器不支持朗读功能。');return;}
  const wasCur=(curBtn===btn);
  stopSpeaking();
  if(wasCur) return;
  const el=document.getElementById(btn.dataset.read);
  const clone=el.cloneNode(true);
  clone.querySelectorAll('.it').forEach(x=>x.remove());
  const txt=(clone.innerText||clone.textContent||'').replace(/\s+/g,' ').trim();
  if(!txt) return;
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='zh-CN'; u.rate=0.9;
  u.onend=()=>{btn.classList.remove('on'); if(curBtn===btn) curBtn=null;};
  u.onerror=()=>{btn.classList.remove('on'); if(curBtn===btn) curBtn=null;};
  curBtn=btn; btn.classList.add('on');
  window.speechSynthesis.speak(u);
}
window.addEventListener('beforeunload',stopSpeaking);
</script>
</body>
