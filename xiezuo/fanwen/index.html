<!DOCTYPE html>
<html lang="zh-Hans-SG">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>情境记叙文范文·红笔批注版</title>
<style>
:root{
  --paper:#FFFFFF;
  --paper-tint:#F4F6F3;
  --grid:#C9DACE;
  --ink:#1B1B1B;
  --ink-soft:#5A5F5C;
  --red:#C0272D;
  --red-soft:#FBEDED;
  --blue:#2C5F8A;
  --blue-soft:#EAF1F7;
  --mark:#FCE96A;
  --line:#DDE3DE;
  --green:#2F6B4F;
  --green-soft:#E8F2EC;
  --font-body:"Songti SC","Noto Serif CJK SC","SimSun",serif;
  --font-ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  min-height:100vh;
  overflow-y:auto;
  background:var(--paper-tint);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink);
  font-family:var(--font-ui);
  padding-bottom:100px;
}
.wrap{max-width:840px;margin:0 auto;padding:0 14px;}

header.top{background:var(--paper);border-bottom:3px solid var(--ink);padding:18px 0 0;}
.title-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
h1{font-family:var(--font-body);font-size:26px;margin:0;letter-spacing:1px;}
.sub{font-size:13px;color:var(--ink-soft);}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0 14px;font-size:12.5px;color:var(--ink-soft);}
.legend b{color:var(--red);font-weight:600;}
.legend i{color:var(--blue);font-style:normal;font-weight:600;}

nav.tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
nav.tabs button{
  flex:0 0 auto;border:1px solid var(--line);border-bottom:none;background:var(--paper-tint);
  color:var(--ink-soft);font-family:var(--font-ui);font-size:14px;padding:10px 14px;
  border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;
}
nav.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);font-weight:700;border-color:var(--ink);box-shadow:inset 0 3px 0 var(--red);}

.toolbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:8px 0;margin-bottom:16px;}
.toolbar .wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:13.5px;padding:8px 12px;border-radius:20px;cursor:pointer;}
.btn:active{transform:scale(.97);}
.btn.on{background:var(--red);border-color:var(--red);color:#fff;}
.btn.on.blue{background:var(--blue);border-color:var(--blue);}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
.card h2{font-family:var(--font-body);font-size:19px;margin:0 0 10px;padding-bottom:8px;border-bottom:2px solid var(--ink);}
.card h3{font-size:14px;margin:18px 0 6px;color:var(--blue);letter-spacing:.5px;}
.card h3:first-of-type{margin-top:14px;}

.prompt{background:var(--blue-soft);border-left:5px solid var(--blue);border-radius:0 8px 8px 0;padding:12px 14px;font-family:var(--font-body);font-size:16.5px;line-height:1.8;}
.type-chip{display:inline-block;background:var(--ink);color:#fff;font-size:12px;padding:3px 9px;border-radius:4px;margin-bottom:8px;}
.must{background:var(--red-soft);border:1.5px solid var(--red);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.75;color:#4A1F21;margin-top:8px;}
.must b{color:var(--red);}

table.kw{width:100%;border-collapse:collapse;font-size:14px;}
table.kw th,table.kw td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;line-height:1.65;}
table.kw th{background:var(--paper-tint);font-weight:700;white-space:nowrap;}
table.kw td.k{font-weight:700;white-space:nowrap;}
table.kw tr.star td.k{color:var(--red);}
table.kw tr.star td.k::after{content:" ★最重要";font-size:11px;font-weight:400;}

.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{background:var(--paper-tint);border:1px dashed var(--ink-soft);border-radius:14px;padding:5px 10px;font-size:13px;}

.center-box{background:var(--mark);border-radius:8px;padding:12px 14px;font-family:var(--font-body);font-size:16px;line-height:1.8;}

.mat{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mat>div{border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.75;}
.mat .good{background:var(--green-soft);border-left:4px solid var(--green);}
.mat .bad{background:var(--red-soft);border-left:4px solid var(--red);}
.mat h4{margin:0 0 6px;font-size:13.5px;}
.mat .good h4{color:var(--green);}
.mat .bad h4{color:var(--red);}
.mat ul{margin:0;padding-left:18px;}
.mat li{margin-bottom:3px;}
.mat .note-why{margin:8px 0 0;font-size:13px;color:var(--ink-soft);}
@media(max-width:560px){.mat{grid-template-columns:1fr;}}

.ratio{display:flex;width:100%;height:34px;border:1px solid var(--ink);border-radius:6px;overflow:hidden;margin-top:6px;}
.ratio div{display:flex;align-items:center;justify-content:center;font-size:11.5px;color:#fff;border-right:1px solid rgba(255,255,255,.5);overflow:hidden;}
.ratio div:last-child{border-right:none;}
.ratio-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:12.5px;color:var(--ink-soft);}
.ratio-legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--sw);}

.essay{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 0 4px;}
.para{border-bottom:1px dashed var(--line);padding:14px 16px;}
.para:last-child{border-bottom:none;}
.para-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.part{font-size:12px;color:var(--blue);background:var(--blue-soft);border-radius:4px;padding:3px 8px;font-weight:700;letter-spacing:.5px;}
.speak{border:1px solid var(--line);background:var(--paper);border-radius:50%;width:30px;height:30px;font-size:14px;line-height:1;cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;margin-left:auto;flex:0 0 auto;}
.speak.on{background:var(--blue);border-color:var(--blue);color:#fff;}
.text{font-family:var(--font-body);font-size:18px;line-height:2.05;text-indent:2em;margin:0;}
.text mark{background:var(--mark);padding:0 2px;border-radius:2px;}
.text .dlg{display:block;text-indent:2em;}
.it{
  font-family:var(--font-ui);font-size:11.5px;color:var(--blue);background:var(--blue-soft);
  border-radius:3px;padding:1px 5px;margin:0 3px;white-space:nowrap;text-indent:0;
}
body.hide-it .it{display:none;}

.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.tag{border:1.5px solid var(--red);color:var(--red);background:var(--paper);font-size:13px;padding:5px 11px;border-radius:16px;cursor:pointer;font-family:var(--font-ui);}
.tag::before{content:"✎ ";}
.tag[aria-expanded="true"]{background:var(--red);color:#fff;}
.tag:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
.note{display:none;margin-top:8px;background:var(--red-soft);border-left:4px solid var(--red);border-radius:0 8px 8px 0;padding:10px 12px;font-size:14.5px;line-height:1.8;color:#4A1F21;}
.note.show{display:block;}
.note .en{display:block;margin-top:5px;font-size:12.5px;color:#7A4A4C;font-style:italic;}

.why{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:16px;margin-bottom:16px;}
.why h2{border-bottom:none;margin-bottom:6px;font-family:var(--font-body);font-size:19px;}
.why ol{margin:0;padding-left:20px;font-size:15px;line-height:1.9;}
.why li{margin-bottom:4px;}

table.ref{width:100%;border-collapse:collapse;font-size:14.5px;}
table.ref th,table.ref td{border:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top;line-height:1.7;}
table.ref th{background:var(--ink);color:#fff;}
table.ref td.t{font-weight:700;color:var(--red);white-space:nowrap;}

.panel{display:none;}
.panel.active{display:block;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
@media (max-width:480px){
  h1{font-size:22px;}
  .text{font-size:17px;line-height:1.95;}
  table.kw{font-size:13px;}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="title-row">
      <h1>情境记叙文 · 三篇范文</h1>
      <span class="sub">中二高级华文｜红笔批注版</span>
    </div>
    <div class="legend">
      <span><i>蓝标</i> = 这一段／这一句在做什么</span>
      <span><b>✎ 红批</b> = 用了什么技巧，点开看</span>
      <span>🔊 = 朗读这一段</span>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <button class="btn" id="toggleAll">展开全部红批</button>
    <button class="btn" id="toggleInline">隐藏句子标注</button>
    <button class="btn" id="stopSpeak">停止朗读</button>
  </div>
</div>

<main class="wrap" id="panels"></main>

<script>
/* ================= 技巧速查 ================= */
const REF = [
 ["开门见山两步走","第一句就点出「我原本是怎样的人」，第二句引出这件事。不绕圈子。","Say who you were, then jump into the event."],
 ["砍废话三刀法","砍重复、砍无效信息（天气／早餐／妈妈怎么劝我）、只留会改变故事走向的词。","Cut repetition, cut filler, keep only what moves the story."],
 ["关键词贯穿全文","题目圈出的关键词要在经过一、二、三里反复出现，不是开头写一次就算。","Keep hitting the key words all the way through."],
 ["一波三折","经过不能一帆风顺，要有三次困难、三次尝试，一次比一次接近成功。","Three setbacks, not one smooth road."],
 ["经过怎么铺排（三种）","①一波三折——用在「转变型」题目（做错事→补救）②层层加深——用在「能力／贡献型」题目（贡献一→四，一层比一层难）③场面并列——用在「群像／氛围型」题目（社区温情，三个不同场面）。先看题目属于哪一种，再决定怎么排。","Pick the shape that fits the question: setbacks / deepening / parallel scenes."],
 ["核心情节详写四诀","发现要细、分歧要响、心理要真、行动要慢——用在全文最重要的那一段。","Detail, dialogue, real inner struggle, slow-motion action."],
 ["行动要慢","把动作拆开：停顿、身体感觉（手心冒汗、声音颤抖），一秒钟写成一段。","Break the action into small steps and body sensations."],
 ["心理要真","写具体的挣扎，不写「我很紧张」这种空话。","Show the struggle, don't just name the feeling."],
 ["分歧要响","用对话写冲突，一人一个立场，让人物自己说话。","Use dialogue to make the conflict audible."],
 ["描写升级三层法","①长什么样 ②在做什么 ③让人觉得它怎么样。","Looks → does → makes you feel."],
 ["以物写情","把感情放在一件具体的东西上（一袋笔记、一块月饼、一只茶杯），不直接喊「我很感动」。","Put the emotion into an object."],
 ["前后对比","「前」略写（两三个日常小细节），「后」详写。不能把「前」写成一件完整的事。","Sketch the 'before', spell out the 'after'."],
 ["首尾呼应","结尾回到开头那句话，把它翻过来。","End by turning your opening line around."],
 ["抒情议论三层结构","①回扣事件 ②内心变化 ③展望未来。三层缺一层就不完整。","Recall the event → what changed in me → what I'll do next."],
 ["因果检验","把结尾的道理删掉，故事本身还能推出这个道理吗？能，才算合格。","Delete the moral — can the story still prove it?"]
];

/* ================= 三篇 ================= */
const ESSAYS = [
{
 id:"e1", tab:"一、对不起朋友",
 prompt:"你曾经做过对不起朋友的一件事。后来，你积极地做了补救，终于挽回彼此的关系。试写出事情的经过以及你当时的感受。",
 type:"B 型：只给故事框架，中心要自己推断",
 shape:"经过用<b>一波三折</b>：补救三次，一次比一次实在。",
 kw:[
  {k:"补救",star:true,v:"全文详写的地方。补救＝一件一件的<b>行动</b>，不是一句「对不起」。要写三次，一次比一次有效。"},
  {k:"对不起朋友",v:"错必须是<b>我自己造成</b>的（口快、自私、失信），不能写成误会或别人的错——否则「对不起」三个字落空。"},
  {k:"终于挽回",v:"结局必须和好。「终于」说明中间不顺利，所以前面一定要有失败的尝试。"},
  {k:"我当时的感受",v:"结尾必须写出感受和道理，漏掉＝内容分封顶。"}
 ],
 limits:["只写一件事","第一人称「我」","最近发生","结局：关系挽回"],
 center:"一句无心的话可以伤人很深；真正的补救不是道歉，而是用行动把信任重新赚回来。",
 ratio:[{label:"背景",pct:15,color:"#2C5F8A"},{label:"起因",pct:10,color:"#5B8CB0"},{label:"经过（一波三折·详写）",pct:55,color:"#C0272D"},{label:"结果",pct:8,color:"#7A8C80"},{label:"抒情议论＋结尾",pct:12,color:"#3F5147"}],
 paras:[
  {part:"背景",text:"我一向<mark>管不住自己的嘴</mark>，什么话都藏不了三天。上个月，我就因为这张嘴，差点失去了最好的朋友俊杰。事情的经过是这样的。",
   tags:[{t:"开门见山两步走",n:"第一句直接说出我的毛病（管不住嘴），第二句就引出这件事。三行进入正文，没有写天气、没有写星期几。",en:"Name the flaw, then jump into the event."},
         {t:"砍废话三刀法",n:"背景段只留一样东西——会让故事出事的那个毛病。其他一律砍掉。",en:"Keep only the flaw that will cause the trouble."}]},
  {part:"起因",text:"俊杰是我从小学起的同班同学。那天放学，他把我拉到食堂角落，压低声音说：「我爸公司裁员，他被裁了。<mark>这件事你别跟任何人讲。</mark>」我用力点头，还拍了拍胸口说：「放心，我嘴巴很紧。」",
   tags:[{t:"埋伏笔",n:"「你别跟任何人讲」和「我嘴巴很紧」，是为下一段的闯祸先埋好线。读者读到后面才会觉得「果然」。",en:"Plant the promise now so breaking it hurts later."}]},
  {part:"经过·闯祸",text:"隔天早上，几个同学在讨论周末去环球影城，问俊杰去不去。他摇摇头说没兴趣。有人取笑他小气。我一急，脱口而出：「他家最近有困难，你们别乱讲！」话一出口，全班静了三秒。我看见俊杰的脸<mark>一点一点涨红</mark>，他站起来，椅子在地上刮出刺耳的声音，头也不回地走出教室。",
   tags:[{t:"行动要慢",n:"没有写「他很生气就走了」，而是拆成三个动作：脸涨红 → 椅子刮地的声音 → 头也不回。一秒钟的事，写成一段。",en:"Slow the moment down into three separate actions."},
         {t:"心理要真",n:"「我一急，脱口而出」——把犯错的真实原因写出来了：不是坏心，是想表现自己。这样读者才信。",en:"Show the real reason behind the mistake."}]},
  {part:"经过·第一折",text:"那天晚上，我在 WhatsApp 上打了一长段道歉的话，删了又写，写了又删，最后按下发送。信息旁边很快出现了「已读」两个字，可是<mark>一直没有回复</mark>。",
   tags:[{t:"一波三折·第一折",n:"第一次补救＝最省力的方式（打字道歉），所以它<b>必须失败</b>。如果一道歉就和好，「终于挽回」就没有着落了。",en:"The easiest attempt must fail first."}]},
  {part:"经过·第二折",text:"第二天在学校，我想跟他解释，他把书包一背就去了图书馆。我知道光道歉没有用，于是利用休息时间，<mark>一个一个</mark>找那天在场的同学，请他们别再把这件事传出去。有人不耐烦地说：「你自己讲的，现在才来紧张。」我脸上发烫，但还是把每一个人都说服了。可是那天放学，俊杰还是没有看我一眼。",
   tags:[{t:"一波三折·第二折",n:"补救升级了：从「说」变成「做」，而且我自己付出了代价（被同学讥讽）。但还是没成功——留给第三折。",en:"Second attempt costs more, still fails."},
         {t:"关键词贯穿全文",n:"「补救」这个关键词在第一折、第二折、第三折里各出现一次，形式一次比一次实在。这就叫关键词贯穿全文。",en:"The key word reappears in every setback."}]},
  {part:"经过·第三折（高潮）",text:"第三个星期，俊杰发烧请了三天假。我把每一堂课的笔记抄成一份，连老师随口补充的重点都记下来，放学后骑脚踏车到他家楼下，托管理处转交。第一天，没有回音。第二天，也没有。第三天傍晚，我正把袋子递出去，身后忽然传来一声：「放着吧。」",
   tags:[{t:"发现要细",n:"「连老师随口补充的重点都记下来」——一个细节就写出了我有多认真。比写十句「我很努力补救」有用。",en:"One concrete detail beats ten lines of 'I tried hard'."}]},
  {part:"经过·当面认错",text:"我转过身。俊杰站在电梯口，穿着拖鞋，脸色还有点白。我的<mark>手心一下子全是汗</mark>。我张了张嘴，把准备了三个星期的话说了出来：<span class=\"dlg\">「对不起。我不该替你说出那件事。我以为我在帮你，其实我只是想表现自己。」</span><span class=\"dlg\">他低头看着地上，好一会儿才说：「我不是气你讲出来。我是气……我最相信的人，也守不住。」</span>我的眼眶一下子热了。<span class=\"dlg\">「那你再给我一次机会。」我说，「这次我用做的，不用讲的。」</span>他沉默了几秒，伸手接过那袋笔记，轻轻说了一句：「字还是那么丑。」",
   tags:[{t:"分歧要响",n:"最重要的一段用对话来写，一人一个立场：我以为他气「说出去」，他真正气的是「信任断了」。冲突说清楚了，和好才有分量。",en:"Let both sides speak; the real hurt comes out."},
         {t:"心理要真",n:"「我以为我在帮你，其实我只是想表现自己」——认错认到自己的动机，不是笼统说「我错了」。",en:"Own the real motive, not just the act."},
         {t:"以物写情",n:"和好没有写成拥抱或大哭。他接过笔记、说「字还是那么丑」——一句玩笑话，就是原谅。",en:"Forgiveness shown through an object and a joke."}]},
  {part:"结果",text:"我笑了，眼泪却掉了下来。从那以后，我们又像从前一样一起吃午饭。只是我多了一个习惯：<mark>话到嘴边，先在心里绕一圈。</mark>",
   tags:[{t:"结果扣题",n:"题目要求「终于挽回彼此的关系」，这里必须明确写出和好了，不能含糊。",en:"The ending must match what the question asks for."}]},
  {part:"抒情议论＋结尾",text:"这件事让我明白，一句无心的话，可以在朋友心上划一道很深的口子。道歉不是把「对不起」三个字说完就算了，真正的补救，是用一件一件实在的行动，把对方的信任重新赚回来。以后我会记得：<mark>管好自己的嘴</mark>，是对朋友最基本的尊重。",
   tags:[{t:"抒情议论三层结构",n:"①回扣事件（一句无心的话）②内心变化＋点明中心（补救是行动，不是道歉）③展望未来（以后我会记得）。三层齐全。",en:"Recall → realise → resolve."},

 paras:[
  {part:"介绍人物",text:"我一直是个性格内向的学生，在班上属于那种默默无闻的人<span class=\"it\">总起句</span>。每当班上有活动时，我总是站在旁边，看着那些性格活泼、热情的同学在台上闪耀，自己却很少主动参与<span class=\"it\">举例说明</span>。对我来说，参加集体活动似乎并不适合我，我更喜欢独自待在一个安静的角落，沉浸在自己的世界里<span class=\"it\">我对自己的看法</span>。然而，最近学校图书馆发起的一项招募义工的活动，<mark>彻底改变了我对自己的看法</mark><span class=\"it\">引出要写的事情</span>。",
   tags:[{t:"前后对比",n:"「前」只用三句概括：默默无闻、站在旁边看别人、喜欢独处。<b>不写成一件完整的事</b>——写成完整的事就变成两件事，内容分会被封顶。",en:"Sketch the 'before' in a few habits, never as a full story."},
         {t:"开门见山两步走",n:"第一句说清我是谁，最后一句「彻底改变了我对自己的看法」引出这件事。中间不铺垫。",en:"Who I am, then straight to the event."}]},
  {part:"介绍活动（起）",text:"这项活动要求学生协助整理书籍、帮助其他同学借阅书籍<span class=\"it\">活动内容</span>。当时，我正好在图书馆借书，图书馆老师知道我经常来这里，于是主动向我推荐了这项活动<span class=\"it\">老师为什么让我参加</span>。虽然一开始我犹豫不决，但最终还是答应了，毕竟这项活动看起来<mark>不会有太多社交压力</mark>，而且在安静的图书馆工作也符合我的性格<span class=\"it\">我为什么决定参加</span>。",
   tags:[{t:"选材扣题",n:"三个问题一次答完：什么活动？内容是什么？我为什么参加？<b>「安静、符合我的性格」这一句最关键</b>——它让内向的人参加这项活动变得合乎生活逻辑。",en:"Answer what/why in one paragraph; make the fit believable."},
         {t:"关键词贯穿全文",n:"起因段就已经在扣「性格内向」了（犹豫不决、没有社交压力）。关键词从第一段一直咬到最后一段。",en:"The key word is already working in the opening."}]},
  {part:"经过·贡献力量一",text:"起初，我的工作非常简单，就是将书架上的书籍整理好并归类<span class=\"it\">贡献力量一</span>。面对那些熟悉的书架和书本，我觉得这样的任务并不难完成。在这些安静的时光里，我默默地整理着书架，<mark>没有过多与人交流，觉得这正好适合我</mark><span class=\"it\">性格内向</span>。但随着时间的推移，我发现，自己不仅可以完成这些基本的任务，还能够在活动中贡献更多的力量<span class=\"it\">我对自己的看法</span>。",
   tags:[{t:"层层加深·第一层",n:"最低一层的贡献：只做体力活，不需要开口。这一层必须写，因为它符合「内向」的起点——后面三层才有对比。",en:"Start at the lowest rung so the climb is visible."},
         {t:"每一层的写法（固定三步）",n:"这一段的写法后面三段全部照用：<b>①我做了什么（贡献）②这时候我的内向是怎样的 ③我对自己的看法变了一点</b>。学生只要记住这三步，四段都会写。",en:"Each stage: what I did → how my shyness showed → how my view shifted."}]},
  {part:"经过·贡献力量二",text:"在帮助整理图书的过程中，常常有同学会来询问某本书的位置，或者不知道该如何借阅特定的书籍。起初，我只是简单地指引他们，但后来我发现，<mark>这其实是一个帮助别人的机会</mark><span class=\"it\">性格内向</span>。我开始主动询问他们需要哪类书，并耐心地帮他们查找书籍<span class=\"it\">贡献力量二</span>。虽然每次对话都很短暂，但在这些互动中，我慢慢感觉到，原来自己也能为别人带来实际的帮助。这让我开始逐渐摆脱内向的束缚，尝试与更多的同学沟通交流<span class=\"it\">我对自己的看法</span>。",
   tags:[{t:"层层加深·第二层",n:"从「不用开口」升到「主动开口」，但只是短暂对话——升一小级，不是一步登天。这就是转变合乎逻辑的关键。",en:"One small step up, not a leap."},
         {t:"心理要真",n:"「虽然每次对话都很短暂」——诚实承认自己还是内向的。写成「我一下子变得很健谈」就不合生活逻辑了。",en:"Admit the change is still small — that's what makes it believable."}]},
  {part:"经过·贡献力量三",text:"不仅如此，在整理书籍的过程中，我注意到图书馆的分类系统有些不够完善，许多书籍难以找到。于是，我大胆地提出了一个改进建议：<mark>在书架上增加更清晰的分类标签，并将一些热门书籍放在更加显眼的地方</mark>。这一建议得到了老师的认可，并很快付诸实施<span class=\"it\">贡献力量三</span>。看着我的建议使图书馆的工作变得更加高效，我内心充满了成就感<span class=\"it\">我对自己的看法</span>。",
   tags:[{t:"层层加深·第三层",n:"这一层最能扣住「<b>自己的</b>力量」：内向的人常在旁边观察，所以看得见别人看不见的问题。他贡献的不是嗓门，是观察力和想法。",en:"The quiet one notices what others miss — that's his own strength."},
         {t:"发现要细",n:"建议写得很具体（加分类标签、热门书放显眼处），不是笼统写「我提了一些建议」。具体，读者才信。",en:"A concrete suggestion, not a vague one."}]},
  {part:"经过·贡献力量四",text:"活动进行到中期，老师决定举办一次书籍推荐会，邀请学生们分享自己喜欢的书籍。让我没想到的是，老师居然邀请我也上台发言。起初，我感到非常紧张，毕竟在众人面前发言对我这个内向的人来说并不容易<span class=\"it\">性格内向</span>。但想到自己对这段时间活动的参与和贡献，我决定试着迈出这一步。那天，我站在台上，<mark>虽然声音有些颤抖</mark>，但我还是顺利地向大家介绍了自己最喜欢的几本书，并分享了阅读的感受<span class=\"it\">贡献力量四</span>。看到同学们专注的眼神和他们的鼓励，我感到无比自豪<span class=\"it\">我对自己的看法</span>。",
   tags:[{t:"层层加深·第四层（高潮）",n:"最难的一步：上台。前面三层是铺垫，有了它们，「上台」才不突兀——他是<b>累积了三层信心</b>才敢上台的，不是被一句话说服的。",en:"The hardest step comes last, earned by the three before it."},
         {t:"心理要真",n:"「虽然声音有些颤抖」——这五个字保住了整篇文章的可信度。内向的人上台本来就会抖，写出来才真实。",en:"The shaky voice is what makes it true."}]},
  {part:"我的感受（合）",text:"通过这次活动，我不仅学会了如何整理书籍、帮助同学，还明白了自己在集体活动中并非无所作为<span class=\"it\">总结收获</span>。我的贡献让图书馆的工作变得更加顺畅，同时我也在帮助他人的过程中收获了极大的满足感<span class=\"it\">总结贡献</span>。更重要的是，我克服了性格内向的障碍，开始主动参与活动，用自己的方式为大家服务<span class=\"it\">活动对我的影响</span>。",
   tags:[{t:"结果扣题",n:"结果要同时答两件事：<b>我贡献了什么</b>（图书馆更顺畅）＋<b>我有什么感受</b>（满足感）。题目问了感受，这里就必须有。",en:"State both the contribution and the feeling."}]},
  {part:"感悟、反思",text:"这次经历让我明白，性格内向并不意味着无法参与集体活动或为他人做出贡献。<mark>关键在于找到适合自己的机会和方式</mark>，哪怕是在看似简单的活动中，我们也可以通过具体的行动为团体贡献力量<span class=\"it\">点明中心</span>。今后，我不再会逃避类似的活动，而是会更加积极地参与，用自己的力量为大家服务<span class=\"it\">展望未来</span>。",
   tags:[{t:"抒情议论三层结构",n:"①回扣事件（这次经历）②点明中心（内向也能贡献，关键是找到适合自己的方式）③展望未来（不再逃避）。三层齐全，一层都不能少。",en:"Recall → realise → resolve."}]},
  {part:"结尾",text:"这次图书馆义工活动让我看到了自己的潜力，<mark>虽然我依旧是那个安静、内向的我</mark>，但我明白，只要有心，我也能在集体中发光发热，贡献出属于我的那份力量<span class=\"it\">对自己看法的转变</span>。",
   tags:[{t:"首尾呼应",n:"开头说「参加集体活动似乎并不适合我」，结尾说「我也能在集体中发光发热」。同一件事，看法翻了过来。",en:"Flip the opening belief at the end."},
         {t:"最重要的一句",n:"「<b>虽然我依旧是那个安静、内向的我</b>」——这一句是全篇的分水岭。变的是<b>看法</b>，不是<b>性格</b>。学生最常犯的错就是写成「从此我变成了一个开朗的人」，那是不合生活逻辑的。",en:"The view changes, not the personality — this is the line that saves the essay."}]}

  {part:"介绍人物",text:"我向来是个安静内向的人，对于社区活动总是敬而远之。每当看到楼下的布告栏上贴出各种邻里活动的海报，我都会默默地走开，<mark>心想这些热闹与我无关</mark><span class=\"it\">介绍人物</span>。然而，一次偶然的经历，却让我深切感受到了社区的温情，彻底改变了我对邻里活动的看法<span class=\"it\">引出要写的事情</span>。",
   tags:[{t:"前后对比",n:"「不太热衷」只用两句带过，但一定要写出<b>原因</b>——「这些热闹与我无关」。结尾要正面推翻这一句，文章才合得上。",en:"Give the reason for the indifference; you'll overturn it later."}]},
  {part:"引出活动（起）",text:"那是一个中秋节前的一个傍晚，我像往常一样，准备去附近的公园散步。刚走出楼道，就被眼前的景象惊呆了：平日冷清的空地上竟搭起了五颜六色的帐篷，四周挂满了彩灯和装饰，欢快的音乐声伴随着阵阵笑语飘来。<mark>这温馨的氛围仿佛一股暖流</mark>，不知不觉中吸引了我靠近<span class=\"it\">略写为什么参加</span>。",
   tags:[{t:"砍废话三刀法",n:"「我怎么会去参加」只用了三句：散步 → 看见 → 被吸引。<b>不要写一大堆妈妈如何逼我参加</b>——那一段对中心没有用，写长了就是详略不当。",en:"Three lines to get there; no long argument with Mum."},
         {t:"描写升级三层法",n:"①长什么样：五颜六色的帐篷、彩灯 ②在做什么：音乐声、笑语飘来 ③让人觉得怎么样：仿佛一股暖流。第三层最重要——「暖」字一出来，温情就开始了。",en:"Looks → sounds → makes you feel warm."}]},
  {part:"场面一：义卖区",text:"犹豫片刻，我鬼使神差地走向了人群。首先映入眼帘的是一个热闹的义卖区。许多居民搭起摊位，售卖自制的美食、手工艺品和二手物品。我看到一位年轻妈妈带着孩子正在挑选绘本，旁边的摊主热情地为他们介绍着每本书的内容。更让我惊讶的是，有几个摊位前贴着“收益将用于社区老人关怀”的标语，顾客们似乎因此更加慷慨，有的甚至主动多付了钱<span class=\"it\">场面一：居民互助、慷慨解囊</span>。<mark>这种无私奉献的精神深深打动了我，让我第一次感受到了社区成员间的互助与关怀</mark><span class=\"it\">感受社区的温情</span>。",
   tags:[{t:"场面并列·第一个场面",n:"三个场面各写一种温情，<b>不能重复</b>。第一个写的是：居民之间的<b>互助与慷慨</b>。",en:"Scene one: neighbours' generosity."},
         {t:"两步走（这一题的必答动作）",n:"前半段写<b>居民做了什么</b>（摊主介绍绘本、顾客主动多付钱），后半段写<b>我感受到什么</b>（互助与关怀）。三个场面全部照这两步写。<b>只写热闹、不写感受＝失分。</b>",en:"What they did + what I felt. Every scene, both halves."},
         {t:"发现要细",n:"「有的甚至主动多付了钱」——一个具体动作，就把「慷慨」写实了。不要只写「大家都很热心」。",en:"One concrete action makes 'generous' real."}]},
  {part:"场面二：关怀老人",text:"继续往前走，一阵欢声笑语吸引了我。十几位老人围坐在一起，有的品尝着香甜的月饼，有的正在玩一种简单有趣的棋类游戏。义工们有的陪老人聊天，有的耐心地解释游戏规则，还有的细心地为老人们端茶倒水。我注意到<mark>一位老爷爷的手有些颤抖，一个年轻义工立刻上前，轻轻扶住他的手，帮他稳稳地拿起茶杯</mark><span class=\"it\">场面二：义工关怀孤寡老人</span>。那一刻，我仿佛看到了跨越年龄的温情互动<span class=\"it\">感受社区的温情</span>。",
   tags:[{t:"场面并列·第二个场面",n:"第二种温情：<b>跨越年龄的关爱</b>。和第一个场面（互助慷慨）不重复。",en:"Scene two: care across generations."},
         {t:"行动要慢",n:"全篇最好的一处：手颤抖 → 义工上前 → 轻轻扶住 → 帮他稳稳拿起茶杯。四个动作，把「温情」两个字写成了一个画面。<b>这就是详写。</b>",en:"Four small actions turn an abstract word into a picture."},
         {t:"以物写情",n:"温情落在一只<b>茶杯</b>上。不用写「我好感动」，读者自己就感动了。",en:"The teacup carries the feeling."}]},
  {part:"场面三：孩子做灯笼",text:"不远处，一群孩子的欢笑声引起了我的注意。原来是社区的青少年义工正在带领一些低龄儿童猜灯谜、制作灯笼。孩子们兴高采烈地举手猜谜，每猜对一个就会得到热烈的掌声和鼓励。在制作灯笼的环节中，<mark>年长一些的孩子耐心地指导年幼的孩子，有的帮忙剪纸，有的教导如何粘贴</mark><span class=\"it\">场面三：青少年义工陪孩童</span>。看到孩子们脸上洋溢的笑容，我不禁也跟着微笑起来<span class=\"it\">感受社区的温情</span>。",
   tags:[{t:"场面并列·第三个场面",n:"第三种温情：<b>社区对下一代的培养</b>。三个场面分别是「居民之间」「对老人」「对孩子」——这样才叫<b>群像</b>，才扣得住「社区」两个字。",en:"Scene three: the community raising its young."},
         {t:"三个场面怎么选（记这一条）",n:"往<b>三个不同的对象</b>去找：<b>对老人／对孩子／居民彼此之间</b>。三个场面写三种人，社区的样子就出来了。写三次「有人帮我」＝还是一个场面。",en:"Pick three different groups: elderly, children, neighbours."}]},
  {part:"总结感受（合）",text:"不知不觉中，我心里逐渐被一种前所未有的温暖充满。这次经历让我深刻体会到了社区的温情：<mark>在义卖活动中，我看到了居民们的慷慨和互助精神；在关怀老人的活动里，我感受到了不同年龄层居民之间的爱与尊重；在制作灯笼的活动中，我见证了社区对下一代的培养和关爱</mark>。最让我感动的是，这些活动都体现了对社区每一位成员的包容和关怀，不分年龄、不论身份<span class=\"it\">总结：感受社区的温情</span>。",
   tags:[{t:"三个场面收拢",n:"用三个分句把前面三个场面各点一次，再用一句话收成一个总的印象（包容和关怀，不分年龄、不论身份）。<b>这一段是「社区」两个字最后落地的地方。</b>",en:"Name all three scenes, then sum them into one impression."}]},
  {part:"升华",text:"那一刻，我才真正地认识到：<mark>社区不仅仅是一个地理概念，更是一个充满人情味的大家庭</mark>。只有积极参与其中，才能真正感受到这份温暖，也才能为这个大家庭贡献自己的一份力量<span class=\"it\">升华文章主题</span>。",
   tags:[{t:"抒情议论三层结构",n:"①回扣事件（那一刻）②点明中心（社区是有人情味的大家庭）③展望未来（只有积极参与，才能感受到温暖）。第三层同时回应了开头的「敬而远之」。",en:"Recall → realise → resolve."},
         {t:"首尾呼应",n:"开头「这些热闹与我无关」，结尾「只有积极参与其中，才能真正感受到这份温暖」。前面那句话被正面推翻了。",en:"Directly overturn the opening belief."}]}
 ],
 why:[
  "写足三个不同场面（义卖、老人、孩子），社区写成了群像，不是一两个人——这是本题最硬的要求。",
  "每个场面都走完两步：居民做了什么 ＋ 我感受到什么。少了第二步就只是在写热闹。",
  "三个场面各写一种温情，不重复：互助慷慨 / 跨年龄关爱 / 对下一代的培养。",
  "「我为什么会去」只用三句带过，没有写妈妈怎么劝我——详略正确。",
  "因果检验：删掉结尾的道理，光看三个场面，读者一样读得出社区的温情。"
 ]

/* ================= 渲染 ================= */
const tabsEl=document.getElementById('tabs');
const panelsEl=document.getElementById('panels');

function ratioHTML(list){
  const bar=list.map(r=>`<div style="width:${r.pct}%;background:${r.color}">${r.pct}%</div>`).join('');
  const leg=list.map(r=>`<span style="--sw:${r.color}">${r.label} ${r.pct}%</span>`).join('');
  return `<div class="ratio">${bar}</div><div class="ratio-legend">${leg}</div>
  <p style="font-size:13px;color:var(--ink-soft);margin:8px 0 0;line-height:1.7">开头铺垫不要超过全文的 <b>1/5</b>；经过一定是最长的一块。头重脚轻是最常见的失分原因。</p>`;
}

function materialHTML(m){
  const g=m.good.map(x=>`<li>${x}</li>`).join('');
  const b=m.bad.map(x=>`<li>${x}</li>`).join('');
  return `<div class="mat">
    <div class="good"><h4>✔ 可以写</h4><ul>${g}</ul></div>
    <div class="bad"><h4>✘ 不要写</h4><ul>${b}</ul></div>
  </div><p class="note-why">${m.why}</p>`;
}

function essayHTML(e,idx){
  const kwRows=e.kw.map(k=>`<tr class="${k.star?'star':''}"><td class="k">${k.k}</td><td>${k.v}</td></tr>`).join('');
  const limits=e.limits.map(l=>`<span class="chip">${l}</span>`).join('');
  const mustBlock=e.must?`<div class="must"><b>这一题的特别要求：</b>${e.must}</div>`:'';
  const matBlock=e.material?`<h3>三、选材（先判断，再动笔）</h3>${materialHTML(e.material)}`:'';
  const paras=e.paras.map((p,i)=>{
    const tags=p.tags.map((t,j)=>`<button class="tag" aria-expanded="false" data-note="${e.id}-n${i}-${j}">${t.t}</button>`).join('');
    const notes=p.tags.map((t,j)=>`<div class="note" id="${e.id}-n${i}-${j}"><b>${t.t}｜</b>${t.n}<span class="en">${t.en}</span></div>`).join('');
    return `<div class="para">
      <div class="para-head"><span class="part">${p.part}</span>
      <button class="speak" data-read="${e.id}-p${i}" title="朗读这一段">🔊</button></div>
      <p class="text" id="${e.id}-p${i}">${p.text}</p>
      <div class="tagrow">${tags}</div>${notes}
    </div>`;
  }).join('');
  const why=e.why.map(w=>`<li>${w}</li>`).join('');
  return `<section class="panel${idx===0?' active':''}" id="panel-${e.id}" role="tabpanel">
    <div class="card">
      <span class="type-chip">${e.type}</span>
      <div class="prompt">${e.prompt}</div>
      ${mustBlock}
      <h3>一、关键词拆解（先看这里，再看范文）</h3>
      <table class="kw"><tr><th>关键词</th><th>我一定要写到什么</th></tr>${kwRows}</table>
      <h3>二、限制条件（踩中一条就大扣分）</h3>
      <div class="chips">${limits}</div>
      ${matBlock}
      <h3>${e.material?'四':'三'}、中心（B 型题，自己推断出来的）</h3>
      <div class="center-box">${e.center}</div>
      <h3>${e.material?'五':'四'}、经过怎么排＋详略比例</h3>
      <p style="font-size:14px;line-height:1.75;margin:0 0 8px">${e.shape}</p>
      ${ratioHTML(e.ratio)}
    </div>
    <div class="card" style="padding-bottom:10px"><h2>范文</h2>
      <p style="font-size:13px;color:var(--ink-soft);margin:-4px 0 0;line-height:1.7">先读一遍，什么都不点；读完再点开红批，看每一段用了什么技巧。</p>
    </div>
    <div class="essay">${paras}</div>
    <div class="why" style="margin-top:16px"><h2>这一篇为什么能拿高分</h2><ol>${why}</ol></div>
  </section>`;
}

function refHTML(){
  const rows=REF.map(r=>`<tr><td class="t">${r[0]}</td><td>${r[1]}<span style="display:block;font-size:12.5px;color:var(--ink-soft);font-style:italic;margin-top:4px">${r[2]}</span></td></tr>`).join('');
  return `<section class="panel" id="panel-ref" role="tabpanel">
    <div class="card"><h2>技巧速查表</h2>
    <p style="font-size:13.5px;color:var(--ink-soft);margin:0 0 10px;line-height:1.7">这些就是三篇范文红批里出现的全部技巧，和课堂笔记用的是同一套名称。</p>
    <table class="ref"><tr><th style="width:32%">技巧</th><th>怎么做</th></tr>${rows}</table></div>
    <div class="card"><h2>写作五步（顺序不能乱）</h2>
    <p style="font-family:var(--font-body);font-size:17px;line-height:2.2;margin:0">圈关键词　→　找限制　→　定中心和故事逻辑　→　选材　→　按模板规划结构</p></div>
    <div class="card"><h2>三篇的经过，排法各不相同</h2>
    <table class="ref"><tr><th style="width:32%">题目</th><th>经过怎么排</th></tr>
    <tr><td class="t">对不起朋友</td><td>一波三折——补救三次，一次比一次实在（转变型）</td></tr>
    <tr><td class="t">内向也能贡献力量</td><td>层层加深——贡献一→四，一层比一层难（能力／贡献型）</td></tr>
    <tr><td class="t">社区的温情</td><td>场面并列——三个不同场面，写出群像（群像／氛围型）</td></tr>
    </table>
    <p style="font-size:13.5px;color:var(--ink-soft);margin:10px 0 0;line-height:1.75">审题时先判断题目属于哪一种，再决定经过怎么排。排错了，写得再好也扣不住关键词。</p></div>
  </section>`;
}

let html='',tabsHtml='';
ESSAYS.forEach((e,i)=>{
  tabsHtml+=`<button role="tab" aria-selected="${i===0}" data-p="panel-${e.id}">${e.tab}</button>`;
  html+=essayHTML(e,i);
});
tabsHtml+=`<button role="tab" aria-selected="false" data-p="panel-ref">技巧速查</button>`;
html+=refHTML();
tabsEl.innerHTML=tabsHtml;
panelsEl.innerHTML=html;

/* ================= 交互 ================= */
tabsEl.addEventListener('click',ev=>{
  const b=ev.target.closest('button[data-p]'); if(!b) return;
  tabsEl.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected','false'));
  b.setAttribute('aria-selected','true');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(b.dataset.p).classList.add('active');
  stopSpeaking();
  window.scrollTo({top:0,behavior:'smooth'});
});

panelsEl.addEventListener('click',ev=>{
  const tag=ev.target.closest('.tag');
  if(tag){
    const note=document.getElementById(tag.dataset.note);
    const open=note.classList.toggle('show');
    tag.setAttribute('aria-expanded',open?'true':'false');
    return;
  }
  const sp=ev.target.closest('.speak');
  if(sp){ readPara(sp); }
});

const toggleBtn=document.getElementById('toggleAll');
let allOpen=false;
toggleBtn.addEventListener('click',()=>{
  const panel=document.querySelector('.panel.active');
  if(!panel) return;
  allOpen=!allOpen;
  panel.querySelectorAll('.note').forEach(n=>n.classList.toggle('show',allOpen));
  panel.querySelectorAll('.tag').forEach(t=>t.setAttribute('aria-expanded',allOpen?'true':'false'));
  toggleBtn.textContent=allOpen?'收起全部红批':'展开全部红批';
  toggleBtn.classList.toggle('on',allOpen);
});

const inlineBtn=document.getElementById('toggleInline');
inlineBtn.addEventListener('click',()=>{
  const hidden=document.body.classList.toggle('hide-it');
  inlineBtn.textContent=hidden?'显示句子标注':'隐藏句子标注';
  inlineBtn.classList.toggle('on',hidden);
  inlineBtn.classList.toggle('blue',hidden);
});

let curBtn=null;
function stopSpeaking(){
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  if(curBtn){curBtn.classList.remove('on');curBtn=null;}
}
document.getElementById('stopSpeak').addEventListener('click',stopSpeaking);

function readPara(btn){
  if(!('speechSynthesis' in window)){alert('这个浏览器不支持朗读功能。');return;}
  const wasCur=(curBtn===btn);
  stopSpeaking();
  if(wasCur) return;
  const el=document.getElementById(btn.dataset.read);
  const clone=el.cloneNode(true);
  clone.querySelectorAll('.it').forEach(x=>x.remove());
  const txt=(clone.innerText||clone.textContent||'').replace(/\s+/g,' ').trim();
  if(!txt) return;
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='zh-CN'; u.rate=0.9;
  u.onend=()=>{btn.classList.remove('on'); if(curBtn===btn) curBtn=null;};
  u.onerror=()=>{btn.classList.remove('on'); if(curBtn===btn) curBtn=null;};
  curBtn=btn; btn.classList.add('on');
  window.speechSynthesis.speak(u);
}
window.addEventListener('beforeunload',stopSpeaking);
</script>
</body>
</html>
