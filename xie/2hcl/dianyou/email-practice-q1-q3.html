<!doctype html>
<html lang="zh-Hans-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="中二私人电邮：从来信找问题、抓关键词、找讯息、想要点、写成段，并分析范文。">
<title>私人电邮｜找问题 · 想要点 · 写清楚</title>
<link rel="stylesheet" href="email-practice-q1-q3-v3.css">
</head>
<body>
<div class="shell">
<div class="top"><div class="brand">华文通 · 中二私人电邮</div><div class="row"><span class="small" id="saveStatus">本机自动保存</span><button id="resetBtn">清空本题</button></div></div>
<h1>先找问题，再想要点</h1>
<p class="sub">直接从来信复制讯息。每次只处理一个问题：<b>看要求 → 找讯息 → 想要点 → 写成段</b>。</p>
<div aria-label="选择练习" class="ex-tabs">
<button class="selected" data-ex="e1">练习一 · VIA 社区服务</button>
<button data-ex="e3">练习三 · 新组屋区</button>
</div>
<div aria-label="学习步骤" class="steps">
<button aria-current="step" data-step="0">1 找两个问题</button>
<button data-step="1">2 问题一</button>
<button data-step="2">3 问题二</button>
<button data-step="3">4 自查</button>
<button data-step="4">5 范文</button>
</div>
<div class="layout">
<aside aria-label="原题与来信" class="source">
<div class="sourcebar">原题与来信</div>
<div class="sourcehelp">长按／拖动选中文字 → 复制 → 点右边答题框 → 粘贴。</div>
<div class="sourceinner" id="source"></div>
</aside>
<main class="panel" id="work"></main>
</div>
<div class="footer">作答只保存在本机浏览器。长段写作仍建议最后回到纸笔完成。</div>
</div>
<script src="email-practice-q1-q3-v3-data.js"></script>
<script src="email-practice-q1-q3-v3-app.js"></script>\n<script src="email-practice-q1-q3-v4-patch.js"></script>
</body>
</html>
